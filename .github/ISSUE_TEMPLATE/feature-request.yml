name: Feature request
description: Suggest a feature or improvement for Pixel Planner
title: "Feature: "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pixel Planner. Suggestions are reviewed automatically and suitable ones are built into the next version, usually within minutes. You'll get a comment here with the outcome.
  - type: textarea
    id: what
    attributes:
      label: Feature description
      description: What should it do, and why would it help? One idea per request, please.
      placeholder: For example, show the total cable length per gauge in the wiring guide so I know what to buy.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in by the app.
    validations:
      required: false
