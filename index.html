<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Planner</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    let saved = null; try { saved = localStorage.getItem("pixelplanner.theme"); } catch (e) {}
    const sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    const theme = param || (saved && saved !== "system" ? saved : sys);
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

/* Wiring colours are aliases of the theme palette. */
:root, html[data-theme="dark"] {
  --pp-pos: var(--cp-danger);
  --pp-gnd: var(--cp-text);
  --pp-data: var(--cp-success);
  --pp-radius: 0.625rem;
  --pp-card-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 13px; background: var(--cp-bg); color: var(--cp-text);
  display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden;
}
code, .mono { font-family: Consolas, "Courier New", Courier, monospace; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: var(--pp-radius);
  padding: 4px 10px; cursor: pointer; min-height: 28px; white-space: nowrap;
}
button:hover { border-color: var(--cp-border-strong); background: var(--cp-surface-soft); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 1px; }
button.primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
button.primary:hover { background: var(--cp-accent-hover); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { border-color: var(--cp-border); }
button.small { min-height: 22px; padding: 1px 7px; font-size: 12px; }
button.danger:hover { color: var(--cp-danger); border-color: var(--cp-danger); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 6px; padding: 3px 6px; min-height: 26px;
}
input[type=number] { width: 72px; }
input[type=checkbox] { min-height: auto; accent-color: var(--cp-accent); }
input[type=range] { accent-color: var(--cp-accent); padding: 0; border: 0; background: transparent; }
textarea { width: 100%; min-height: 50px; resize: vertical; }
.muted { color: var(--cp-text-muted); }
.soft { color: var(--cp-text-soft); }
.grow { flex: 1; }
.ok { color: var(--cp-success); }
.warn { color: var(--cp-warning); }
.err, .error { color: var(--cp-danger); }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--cp-bg-elevated);
  border-bottom: 1px solid var(--cp-border); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.logo { display: inline-flex; gap: 3px; }
.logo i { width: 7px; height: 7px; border-radius: 50%; background: var(--cp-accent); display: block; }
.logo i:nth-child(2) { background: var(--cp-warning); }
.logo i:nth-child(3) { background: var(--cp-success); }
.proj-name { font-weight: 600; width: 200px; background: transparent; border-color: transparent; }
.proj-name:hover, .proj-name:focus { border-color: var(--cp-border); background: var(--cp-surface); }
.tb-group { display: flex; gap: 4px; }
.seg { display: inline-flex; border: 1px solid var(--cp-border); border-radius: var(--pp-radius); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--cp-surface); }
.seg button + button { border-left: 1px solid var(--cp-border); }
.seg button.on { background: var(--cp-accent); color: var(--cp-accent-fg); }
.icon { width: 28px; padding: 0; font-weight: 700; font-family: Georgia, serif; font-style: italic; border-radius: 50%; }
.ver { font-size: 11px; color: var(--cp-text-muted); cursor: pointer; padding: 2px 6px; border: 1px solid var(--cp-border); border-radius: 999px; }
.ver:hover { color: var(--cp-accent); border-color: var(--cp-accent); }

/* Summary strip */
.summary { display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--cp-border); align-items: stretch; }
.card {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; box-shadow: var(--pp-card-shadow);
}
.stat { padding: 6px 12px; min-width: 118px; border-radius: 12px; }
.stat .k { font-size: 11px; color: var(--cp-text-muted); text-transform: uppercase; letter-spacing: .04em; }
.stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 11px; color: var(--cp-text-soft); }
.stat.bright { min-width: 210px; }
.stat.bright input { width: 100%; }
.stat.status .v.err { color: var(--cp-danger); }
.stat.status { cursor: pointer; }

/* Main layout */
main { display: grid; min-height: 0; }
main.mode-form { grid-template-columns: 1fr; }
main.mode-visual { grid-template-columns: 1fr; }
main.mode-split { grid-template-columns: minmax(420px, 44%) 1fr; }
main.mode-form #visualPane { display: none; }
main.mode-visual #formPane { display: none; }
.pane { min-height: 0; min-width: 0; position: relative; }
#formPane { overflow: auto; padding: 12px; border-right: 1px solid var(--cp-border); }
main.mode-form #formPane { padding: 12px max(12px, calc((100% - 1200px) / 2)); }

/* Form */
.sec { margin-bottom: 14px; }
.sec > summary, .sec-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; list-style: none; }
.sec > summary::-webkit-details-marker, details > summary::-webkit-details-marker { display: none; }
details > summary { list-style: none; }
.chev { display: inline-block; transition: transform .15s; color: var(--cp-text-muted); width: 12px; }
details[open] > summary .chev { transform: rotate(90deg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 14px; padding: 8px 0; }
.fld { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--cp-text-muted); }
.fld > input, .fld > select { color: var(--cp-text); }
.fld.inline { flex-direction: row; align-items: center; gap: 6px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.distro { padding: 10px 12px; margin: 10px 0; }
.distro.sel, .ctl.sel, .psurow.sel, .portrow.sel, .item.sel { box-shadow: 0 0 0 2px var(--cp-accent); }
.distro-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.distro-head .name { font-weight: 600; font-size: 14px; width: 170px; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); color: var(--cp-text-muted); white-space: nowrap; }
.pill.ok { color: var(--cp-success); } .pill.warn { color: var(--cp-warning); } .pill.err { color: var(--cp-danger); }
h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--cp-text-muted); display: flex; align-items: center; gap: 8px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { text-align: left; font-weight: 600; color: var(--cp-text-muted); padding: 3px 4px; border-bottom: 1px solid var(--cp-border); white-space: nowrap; }
table.t td { padding: 3px 4px; border-bottom: 1px solid var(--cp-border); vertical-align: middle; }
table.t input[type=text], table.t input:not([type]) { width: 100%; min-width: 80px; }
.bar { position: relative; height: 8px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 999px; overflow: hidden; min-width: 80px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--cp-success); border-radius: 999px; }
.bar.warn > i { background: var(--cp-warning); } .bar.err > i { background: var(--cp-danger); }
.bar .tgt { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--cp-border-strong); }
.ctl { margin: 10px 0 4px; padding: 8px 10px; border: 1px solid var(--cp-border); border-radius: 12px; background: var(--cp-bg-elevated); }
.ctl-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctl-head .name { font-weight: 600; width: 150px; }
.banks { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
.bank { display: flex; flex-direction: column; gap: 2px; font-size: 12px; padding: 4px 8px; border: 1px dashed var(--cp-border); border-radius: 8px; }
.portrow { border: 1px solid var(--cp-border); border-radius: 8px; margin: 4px 0; background: var(--cp-surface); }
.portrow > summary { display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.portrow > summary .pn { font-weight: 600; width: 50px; }
.portrow > summary .pl { flex: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.portrow > summary .m { color: var(--cp-text-muted); font-size: 12px; white-space: nowrap; }
.portbody { padding: 6px 8px 8px; border-top: 1px solid var(--cp-border); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-border-strong); display: inline-block; flex: none; }
.dot.ok { background: var(--cp-success); } .dot.warn { background: var(--cp-warning); } .dot.err { background: var(--cp-danger); } .dot.none { background: var(--cp-border); }
.chain { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.item { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 4px 6px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-bg-elevated); }
.item .kind { font-size: 11px; font-weight: 600; width: 64px; text-transform: uppercase; letter-spacing: .04em; }
.item.k-cable .kind { color: var(--cp-text-soft); }
.item.k-pixels .kind { color: var(--cp-success); }
.item.k-inject .kind { color: var(--cp-danger); }
.item .res { margin-left: auto; font-size: 12px; color: var(--cp-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item label { font-size: 12px; color: var(--cp-text-muted); display: inline-flex; align-items: center; gap: 3px; }
.item input[type=number] { width: 62px; }
.item input.lbl { width: 130px; }
.item select { max-width: 170px; }
.port-port { font-size: 11px; color: var(--cp-text-muted); padding: 2px 0; }
.addbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 4px; }
.url { font-family: Consolas, "Courier New", Courier, monospace; font-size: 11px; color: var(--cp-link); word-break: break-all; }
.nw { white-space: nowrap; }
.psw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; vertical-align: middle; }
.psw.c0 { background: var(--cp-accent); } .psw.c1 { background: var(--cp-link); } .psw.c2 { background: var(--cp-success); }
.psw.c3 { background: var(--cp-warning); } .psw.c4 { background: var(--cp-text-soft); } .psw.c5 { background: var(--cp-danger); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--cp-accent); } to { box-shadow: 0 0 0 0 transparent; } }
.empty { padding: 20px; text-align: center; color: var(--cp-text-muted); border: 1px dashed var(--cp-border); border-radius: 16px; }

/* Visual */
#visualPane { display: grid; grid-template-columns: 170px 1fr; grid-template-rows: auto 1fr; }
main.mode-visual #visualPane { grid-template-columns: 170px 1fr 420px; }
.vtools { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--cp-border); background: var(--cp-bg-elevated); flex-wrap: wrap; }
.legend { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--cp-text-muted); margin-left: 8px; }
.lg { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg.ok { background: var(--cp-success); } .lg.warn { background: var(--cp-warning); } .lg.err { background: var(--cp-danger); } .lg.off { background: var(--cp-border-strong); }
.palette { overflow: auto; padding: 8px; border-right: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
.palette h5 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--cp-text-muted); }
.pal { display: flex; align-items: center; gap: 6px; padding: 5px 8px; margin: 3px 0; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-surface); cursor: grab; font-size: 12px; user-select: none; }
.pal:hover { border-color: var(--cp-accent); }
.pal .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--cp-success); }
.pal .sw.flood { border-radius: 2px; background: var(--cp-warning); }
.pal .sw.cable { border-radius: 2px; height: 4px; background: var(--cp-text-soft); }
.pal .sw.inject { border-radius: 1px; transform: rotate(45deg); background: var(--cp-danger); width: 8px; height: 8px; }
.canvas-wrap { position: relative; overflow: hidden; background: var(--cp-bg); }
.canvas-wrap.dragover { box-shadow: inset 0 0 0 2px var(--cp-accent); }
#svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#svg.panning { cursor: grabbing; }
.inspector { display: none; overflow: auto; padding: 10px; border-left: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
main.mode-visual .inspector { display: block; }
.inspector .hint { color: var(--cp-text-muted); padding: 8px 0; }

/* SVG styles (colours via theme variables) */
.s-grid { stroke: var(--cp-border); stroke-width: .5; }
.s-distro { fill: var(--cp-surface); stroke: var(--cp-border-strong); stroke-width: 1.2; }
.s-distro-head { fill: var(--cp-surface-soft); stroke: none; cursor: move; }
.s-title { fill: var(--cp-text); font-size: 13px; font-weight: 600; }
.s-text { fill: var(--cp-text); font-size: 11px; }
.s-muted { fill: var(--cp-text-muted); font-size: 10px; }
.s-tiny { fill: var(--cp-text-soft); font-size: 9px; }
.s-psu { fill: var(--cp-bg-elevated); stroke: var(--cp-border-strong); }
.s-board { fill: var(--cp-surface-soft); stroke: var(--cp-border-strong); }
.s-pad { fill: var(--cp-surface); stroke: var(--cp-border-strong); }
.s-pad.used { fill: var(--cp-accent-soft); stroke: var(--cp-accent); }
.s-barbg { fill: var(--cp-surface-soft); stroke: var(--cp-border); }
.s-ok { fill: var(--cp-success); } .s-warn { fill: var(--cp-warning); } .s-err { fill: var(--cp-danger); } .s-off { fill: var(--cp-border-strong); }
.s-cable { stroke: var(--cp-text-soft); fill: none; stroke-linecap: round; }
.s-cable.hot { stroke: var(--cp-warning); } .s-cable.over { stroke: var(--cp-danger); }
.s-strwire { stroke: var(--cp-border-strong); stroke-width: 1; }
.s-feed { fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; opacity: .85; }
.s-bankwire { fill: none; stroke-width: 2.2; }
.s-sel { fill: none; stroke: var(--cp-accent); stroke-width: 2; }
.s-hit { fill: transparent; cursor: pointer; }
.s-hit:hover { fill: var(--cp-highlight); }
.s-plus { fill: var(--cp-surface); stroke: var(--cp-border-strong); cursor: pointer; }
.s-plus:hover { stroke: var(--cp-accent); }
.s-drop { fill: var(--cp-highlight); stroke: var(--cp-accent); stroke-dasharray: 3 2; }
.s-drop-hi > .s-hit, .s-drop-hi.s-distro, .s-drop-hi > .s-plus { fill: var(--cp-accent-soft); stroke: var(--cp-accent); }
.s-relay { fill: var(--cp-surface); stroke: var(--cp-border-strong); }
.s-relay.on { fill: var(--cp-accent-soft); stroke: var(--cp-accent); }
.s-btn { fill: var(--cp-accent); }
.s-btn.unset { fill: var(--cp-border-strong); }
.c0 { stroke: var(--cp-accent); fill: var(--cp-accent); } .c1 { stroke: var(--cp-link); fill: var(--cp-link); }
.c2 { stroke: var(--cp-success); fill: var(--cp-success); } .c3 { stroke: var(--cp-warning); fill: var(--cp-warning); }
.c4 { stroke: var(--cp-text-soft); fill: var(--cp-text-soft); } .c5 { stroke: var(--cp-danger); fill: var(--cp-danger); }
.s-feed.c0, .s-feed.c1, .s-feed.c2, .s-feed.c3, .s-feed.c4, .s-feed.c5, .s-bankwire.c0, .s-bankwire.c1, .s-bankwire.c2, .s-bankwire.c3, .s-bankwire.c4, .s-bankwire.c5 { fill: none; }

/* Status bar, drawer, dialogs, toast */
.statusbar { display: flex; gap: 12px; align-items: center; padding: 4px 12px; border-top: 1px solid var(--cp-border); background: var(--cp-bg-elevated); font-size: 12px; }
.warnbtn { min-height: 22px; font-size: 12px; }
.drawer { position: fixed; right: 12px; bottom: 36px; width: min(560px, calc(100vw - 24px)); max-height: 60vh; overflow: auto; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 16px; box-shadow: var(--cp-shadow); padding: 10px 12px; z-index: 20; }
.drawer-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.wi { display: flex; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--cp-border); cursor: pointer; align-items: flex-start; }
.wi:hover { background: var(--cp-highlight); }
.wi .lvl { font-size: 10px; font-weight: 700; text-transform: uppercase; width: 44px; flex: none; padding-top: 2px; }
.wi.error .lvl { color: var(--cp-danger); } .wi.warn .lvl { color: var(--cp-warning); } .wi.info .lvl { color: var(--cp-link); }
.dlg { border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); color: var(--cp-text); box-shadow: var(--cp-shadow); padding: 0; max-width: min(560px, 94vw); }
.dlg.wide { max-width: min(820px, 94vw); width: 820px; }
.dlg.full { max-width: 96vw; width: 1100px; height: 92vh; }
.dlg::backdrop { background: rgba(0,0,0,.35); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--cp-border); }
.dlg-head b { font-size: 15px; }
.dlg-body { padding: 12px 16px; overflow: auto; max-height: calc(88vh - 60px); line-height: 1.5; }
.dlg.full .dlg-body { height: calc(92vh - 52px); max-height: none; padding: 0; }
.dlg.full iframe { width: 100%; height: 100%; border: 0; background: var(--cp-surface); }
.dlg-body h3 { margin: 14px 0 4px; font-size: 14px; }
.dlg-body p, .dlg-body li { color: var(--cp-text); }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--cp-border); }
.toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); background: var(--cp-panel-strong); color: var(--cp-text); border: 1px solid var(--cp-border); padding: 8px 14px; border-radius: var(--pp-radius); box-shadow: var(--cp-shadow); z-index: 50; max-width: 80vw; }
.cl-ver { font-weight: 600; margin-top: 10px; }
.kbd { font-family: Consolas, "Courier New", Courier, monospace; font-size: 11px; border: 1px solid var(--cp-border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

@media (max-width: 900px) {
  main.mode-split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #visualPane, main.mode-visual #visualPane { grid-template-columns: 1fr; }
  .palette { display: none; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><b>Pixel Planner</b></div>
  <input id="projName" class="proj-name" data-id="project" data-f="name" title="Project name" aria-label="Project name">
  <div class="tb-group">
    <button data-act="new" title="New project">New</button>
    <button data-act="open" title="Open a .pixelplan.json file (Ctrl+O)">Open</button>
    <button data-act="save" title="Save (Ctrl+S)">Save</button>
    <button data-act="saveAs" title="Save as a new file">Save as</button>
    <button data-act="demo" title="Load the demo show">Demo</button>
  </div>
  <div class="tb-group">
    <button data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
  </div>
  <div class="seg" role="tablist" aria-label="View">
    <button data-view="form" role="tab">Form</button>
    <button data-view="split" role="tab">Split</button>
    <button data-view="visual" role="tab">Visual</button>
  </div>
  <span class="grow"></span>
  <button class="primary" data-act="guide" title="Wiring guide, bill of materials and channel map">Wiring guide</button>
  <select id="themeSel" title="Theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <button class="icon" data-act="help" title="How to use, how it calculates, and what's new" aria-label="Help">i</button>
  <span class="ver" id="verBadge" data-act="whatsnew" title="What's new"></span>
</header>

<section class="summary" id="summary"></section>

<main id="main" class="mode-split">
  <div id="formPane" class="pane"></div>
  <div id="visualPane" class="pane">
    <div class="vtools">
      <button data-act="fit" title="Fit everything in view">Fit</button>
      <button data-act="zoomIn" aria-label="Zoom in">+</button>
      <button data-act="zoomOut" aria-label="Zoom out">−</button>
      <button data-act="addDistro">+ Distro</button>
      <span class="legend"><i class="lg ok"></i>OK <i class="lg warn"></i>Low <i class="lg err"></i>Too low <i class="lg off"></i>No power</span>
    </div>
    <div class="palette" id="palette"></div>
    <div class="canvas-wrap" id="canvasWrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="inspector" id="inspector"></div>
  </div>
</main>

<footer class="statusbar">
  <button id="warnBtn" data-act="warnings" class="warnbtn"></button>
  <span id="fileInfo"></span>
  <span class="grow"></span>
  <span class="muted">Tip: drag presets from the palette onto a port in the Visual view.</span>
</footer>

<aside id="warnDrawer" class="drawer" hidden>
  <div class="drawer-head"><b>Checks</b><span class="grow"></span><button data-act="warnings" aria-label="Close">✕</button></div>
  <div id="warnList"></div>
</aside>

<dialog id="helpDlg" class="dlg wide"></dialog>
<dialog id="guideDlg" class="dlg full"></dialog>
<dialog id="askDlg" class="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileInput" accept=".json,.pixelplan.json,application/json" hidden>

<script>
// Bump APP_VERSION on every code change and add an entry to CHANGELOG (newest first).
// The version shows in the top-right corner and the "i" dialog shows the change log.
window.PP = window.PP || {};
PP.APP_NAME = 'Pixel Planner';
PP.APP_VERSION = '1.0.0';
PP.BUILT = '28 Sept 2026, 18:49';  // filled in by Build-Portable.ps1 ("Last updated" date and time)
PP.CHANGELOG = [
  {
    version: '1.0.0', date: '2026-09-28', items: [
      'First release: plan Baldrick controllers, distros, Mean Well PSUs, pixel runs and power injection.',
      'Form view and Fritzing-style visual view, kept in sync (or side by side in Split view).',
      'Voltage-drop solver for every pixel on every port, with power injection and +V isolation.',
      'Auto-inject and auto-balance PSUs, with warnings for PSU, fuse, wire, bank, mains and data limits.',
      'Baldrick8, Baldrick17, BaldrickInput8, BaldrickInput1, BaldrickSwitchy and BaldrickDMX boards, with Turniput inputs (FPP command URLs) and relays.',
      'Pixel library (bullets, seeds, 10/20/30 W floods, strip, RGBW, null pixel) and string presets you can edit.',
      'Printable wiring guide, bill of materials, channel map CSV and per-season running cost.',
      'Portable single HTML file; projects save as .pixelplan.json files.',
      'Also online at j-turansky.github.io/pixel-planner.'
    ]
  }
];

</script>

<script>
// Project model, factories, lookup and the store (undo/redo, autosave, change events).
(function () {
  const C = PP.catalog;
  const M = PP.model = {};
  const SCHEMA = 1;

  M.uid = (p = 'x') => p + Math.random().toString(36).slice(2, 9);
  const clone = o => JSON.parse(JSON.stringify(o));
  M.clone = clone;

  M.defaultSettings = () => ({
    brightness: 100,          // global brightness %, scales pixel current
    typicalPct: 35,           // average show load as % of full white (for energy/cost)
    warnDropPct: 10,          // pixel voltage warning below nominal - x%
    errDropPct: 20,           // pixel voltage error below nominal - x%
    psuTargetPct: 80,         // keep PSUs at or below this continuous load
    mainsV: 230,
    mainsCircuitA: 13,        // UK plug fuse
    psuEfficiency: 88,
    fppIp: '192.168.1.50',
    universeSize: 510,
    startUniverse: 1,
    dataWarnM: 5,             // data gap before a pixel that deserves a warning
    injectGauge: 'awg16',
    injectMode: 'run',        // 'run' = feed length follows run distance, 'fixed' = injectLength
    injectLength: 3,
    hoursPerNight: 5,
    nights: 40,
    tariff: 0.25,
    currency: '£'
  });

  M.newPsu = (model = 'LRS-350-12', n = 1) => {
    const s = C.psuById(model);
    return { id: M.uid('psu'), name: 'PSU ' + n, model, vout: s ? s.v : 12, customV: 12, customA: 10 };
  };

  M.newPort = (num) => ({ id: M.uid('port'), num, brightness: 100, portPower: true, label: '', chain: [] });

  M.newController = (board = 'baldrick8', name) => {
    const b = C.boards[board];
    const c = {
      id: M.uid('ctl'), board, name: name || b.name, ip: '',
      feed: { length: 0.5, gauge: 'awg10' }, banks: {}, ports: [], relays: [], inputs: [],
      dmxFixtures: []
    };
    for (let i = 1; i <= (b.ports || 0); i++) c.ports.push(M.newPort(i));
    for (let i = 1; i <= (b.relays || 0); i++) c.relays.push({ id: M.uid('rly'), num: i, name: '', amps: 0, volts: 230 });
    for (let i = 1; i <= (b.inputs || 0); i++) c.inputs.push({ id: M.uid('inp'), num: i, name: '', device: 'Push button', action: 'none', param: '' });
    b.banks.forEach(bk => { c.banks[bk.id] = null; });
    return c;
  };

  // Rebuild ports/relays/inputs/banks when a controller's board type changes, keeping what fits.
  M.changeBoard = (c, board) => {
    const n = M.newController(board, c.name);
    n.id = c.id; n.ip = c.ip; n.feed = c.feed;
    n.ports.forEach((p, i) => { if (c.ports[i]) n.ports[i] = Object.assign(c.ports[i], { num: p.num }); });
    n.inputs.forEach((p, i) => { if (c.inputs[i]) n.inputs[i] = Object.assign(c.inputs[i], { num: p.num }); });
    n.relays.forEach((p, i) => { if (c.relays[i]) n.relays[i] = Object.assign(c.relays[i], { num: p.num }); });
    const firstPsu = Object.values(c.banks).find(Boolean) || null;
    Object.keys(n.banks).forEach(k => { n.banks[k] = c.banks[k] !== undefined ? c.banks[k] : firstPsu; });
    Object.assign(c, n);
  };

  M.newDistro = (name, x = 40, y = 40, size = 'medium') => {
    const s = C.distroSizes.find(d => d.id === size);
    return { id: M.uid('dst'), name: name || 'Distro', size, psuSlots: s.psuSlots, boardSlots: s.boardSlots, x, y, notes: '', psus: [], controllers: [] };
  };

  M.newItem = {
    cable: (length = 5, gauge = 'awg18') => ({ id: M.uid('it'), kind: 'cable', length, gauge, label: '' }),
    pixels: (typeId, count, lib) => {
      const t = (lib || C.pixelTypes).find(x => x.id === typeId) || C.pixelTypes[0];
      return { id: M.uid('it'), kind: 'pixels', typeId: t.id, count: count || 50, spacing: t.spacing, gauge: t.gauge, label: '' };
    },
    inject: (psuId, length = 3, gauge = 'awg16') => ({ id: M.uid('it'), kind: 'inject', psuId, length, gauge, isolate: false, label: '' })
  };

  M.newProject = () => ({
    app: 'PixelPlanner', schema: SCHEMA, name: 'New show', notes: '',
    settings: M.defaultSettings(),
    library: { pixelTypes: clone(C.pixelTypes), presets: clone(C.presets) },
    distros: []
  });

  M.demoProject = () => {
    const p = M.newProject();
    p.name = 'Demo show';
    const d = M.newDistro('Front garden', 40, 40, 'medium');
    const a = M.newPsu('LRS-350-12', 1), b = M.newPsu('LRS-350-12', 2);
    d.psus.push(a, b);
    const c = M.newController('baldrick8', 'Front B8');
    c.ip = '192.168.1.101';
    c.banks.L = a.id; c.banks.R = b.id;
    const I = M.newItem;
    c.ports[0].label = 'Roofline'; c.ports[0].chain = [I.cable(5, 'awg18'), I.pixels('bullet12', 100), I.pixels('bullet12', 100)];
    c.ports[1].label = 'Mini trees'; c.ports[1].chain = [I.cable(8, 'awg18'), I.pixels('seed12', 100), I.pixels('seed12', 100), I.pixels('seed12', 100)];
    c.ports[2].label = 'Floods'; c.ports[2].chain = [I.cable(5, 'awg18'), I.pixels('flood10', 4), I.pixels('flood20', 2)];
    c.ports[4].label = 'Arches'; c.ports[4].chain = [I.cable(10, 'awg18'), I.pixels('bullet12', 50), I.pixels('bullet12', 50), I.pixels('bullet12', 50), I.pixels('bullet12', 50)];
    c.inputs[0].name = 'Show start button'; c.inputs[0].device = 'Big red button'; c.inputs[0].action = 'playlist'; c.inputs[0].param = 'Show Time';
    d.controllers.push(c);
    const d2 = M.newDistro('Porch', 40, 560, 'small');
    const e = M.newPsu('LRS-350-12', 1);
    d2.psus.push(e);
    const s = M.newController('baldrickswitchy', 'Porch Switchy');
    s.banks.IN = e.id; s.ip = '192.168.1.110';
    s.relays[0].name = 'Snow machine'; s.relays[0].amps = 4; s.relays[0].volts = 230;
    s.relays[1].name = 'Inflatable'; s.relays[1].amps = 1; s.relays[1].volts = 230;
    d2.controllers.push(s);
    p.distros.push(d, d2);
    return p;
  };

  // Accept files from older versions and fill in anything missing.
  M.migrate = (p) => {
    if (!p || typeof p !== 'object' || !Array.isArray(p.distros)) throw new Error('This is not a Pixel Planner project file.');
    p.settings = Object.assign(M.defaultSettings(), p.settings || {});
    p.library = p.library || {};
    p.library.pixelTypes = p.library.pixelTypes || clone(C.pixelTypes);
    p.library.presets = p.library.presets || clone(C.presets);
    p.distros.forEach(d => {
      d.psus = d.psus || []; d.controllers = d.controllers || [];
      d.controllers.forEach(c => {
        c.feed = c.feed || { length: 0.5, gauge: 'awg10' };
        c.relays = c.relays || []; c.inputs = c.inputs || []; c.dmxFixtures = c.dmxFixtures || [];
        c.ports.forEach(pt => { pt.chain = pt.chain || []; if (pt.brightness == null) pt.brightness = 100; if (pt.portPower == null) pt.portPower = true; });
      });
    });
    p.schema = SCHEMA;
    return p;
  };

  // --- lookup ---------------------------------------------------------------------------------
  // index(p) -> Map id -> {type, obj, distro, controller, port}
  M.index = (p) => {
    const m = new Map();
    p.distros.forEach(d => {
      m.set(d.id, { type: 'distro', obj: d, distro: d });
      d.psus.forEach(s => m.set(s.id, { type: 'psu', obj: s, distro: d }));
      d.controllers.forEach(c => {
        m.set(c.id, { type: 'controller', obj: c, distro: d, controller: c });
        c.ports.forEach(pt => {
          m.set(pt.id, { type: 'port', obj: pt, distro: d, controller: c, port: pt });
          pt.chain.forEach(it => m.set(it.id, { type: 'item', obj: it, distro: d, controller: c, port: pt }));
        });
        c.relays.forEach(r => m.set(r.id, { type: 'relay', obj: r, distro: d, controller: c }));
        c.inputs.forEach(r => m.set(r.id, { type: 'input', obj: r, distro: d, controller: c }));
      });
    });
    (p.library.pixelTypes || []).forEach(t => m.set(t.id, { type: 'pixelType', obj: t }));
    (p.library.presets || []).forEach(t => m.set('preset:' + t.id, { type: 'preset', obj: t }));
    return m;
  };
  M.find = (p, id) => M.index(p).get(id);
  M.allPsus = p => p.distros.flatMap(d => d.psus.map(s => ({ psu: s, distro: d })));
  M.psuSpec = (psu) => {
    if (!psu) return null;
    if (psu.model === 'custom') return { id: 'custom', v: +psu.customV || 12, a: +psu.customA || 10, adj: [0, 99], ip: 'Custom' };
    return C.psuById(psu.model) || { id: psu.model, v: 12, a: 10, adj: [0, 99], ip: '?' };
  };
  M.pixelType = (p, id) => p.library.pixelTypes.find(t => t.id === id);

  // --- store -----------------------------------------------------------------------------------
  const KEY = 'pixelplanner.autosave.v1';
  const S = PP.store = {
    project: null, selection: null, undo: [], redo: [], listeners: [], dirty: false, fileName: null, fileHandle: null
  };
  S.on = fn => S.listeners.push(fn);
  S.emit = (why) => { S.listeners.forEach(fn => { try { fn(why); } catch (e) { console.error(e); } }); };
  S.load = (p, fileName = null, handle = null) => {
    S.project = M.migrate(p); S.undo = []; S.redo = []; S.selection = null; S.fileName = fileName; S.fileHandle = handle; S.dirty = false;
    S.save(); S.emit('load');
  };
  S.commit = (label, fn) => {
    const before = JSON.stringify(S.project);
    fn(S.project);
    if (JSON.stringify(S.project) === before) return;
    S.undo.push(before); if (S.undo.length > 150) S.undo.shift();
    S.redo = []; S.dirty = true; S.save(); S.emit('change:' + label);
  };
  // For live drags: the project was mutated in place since `before` was taken.
  S.commitFrom = (before, label) => {
    if (JSON.stringify(S.project) === before) return;
    S.undo.push(before); if (S.undo.length > 150) S.undo.shift();
    S.redo = []; S.dirty = true; S.save(); S.emit('change:' + label);
  };
  S.doUndo = () => { if (!S.undo.length) return; S.redo.push(JSON.stringify(S.project)); S.project = JSON.parse(S.undo.pop()); S.dirty = true; S.save(); S.emit('undo'); };
  S.doRedo = () => { if (!S.redo.length) return; S.undo.push(JSON.stringify(S.project)); S.project = JSON.parse(S.redo.pop()); S.dirty = true; S.save(); S.emit('redo'); };
  S.select = (id) => { if (S.selection === id) return; S.selection = id; S.emit('select'); };
  let saveTimer = null;
  S.save = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify({ project: S.project, fileName: S.fileName, savedAt: Date.now() })); } catch (e) { /* storage full or blocked */ }
    }, 250);
  };
  S.restore = () => {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const j = JSON.parse(raw);
      S.project = M.migrate(j.project); S.fileName = j.fileName || null; S.dirty = false;
      return true;
    } catch (e) { return false; }
  };
})();

</script>
<script>
// Electrical engine. Each port's run is solved as a resistor ladder: every pixel is a constant-current
// load, every wire section is a loop resistance (+V and GND), and the controller port and every
// injection point are voltage sources behind their feed-cable resistance. A tridiagonal solve gives
// the voltage at every pixel and the current in every wire, port fuse and injection feed.
(function () {
  const C = PP.catalog, M = PP.model;
  const K = PP.calc = {};
  const R_CONTACT = 0.01;   // fuse + connector + PCB trace, ohms (loop)
  const R_TINY = 1e-5;      // a solid joint

  const wire = id => C.wireById(id);
  const loopR = (gauge, len) => 2 * wire(gauge).ohmPerM * Math.max(0, +len || 0);
  K.recommendFuse = (amps) => C.bladeFuses.find(f => f >= amps * 1.25) || C.bladeFuses[C.bladeFuses.length - 1];

  function portContext(p, idx, port) {
    const e = idx.get(port.id);
    const c = e.controller, board = C.boards[c.board];
    const bank = board.banks.find(b => b.ports.includes(port.num));
    const psuId = bank ? c.banks[bank.id] : null;
    const psuE = psuId ? idx.get(psuId) : null;
    return { c, board, bank, psu: psuE ? psuE.obj : null, distro: e.distro };
  }

  // Build the ladder for one port. Returns nodes/edges ready for solve().
  function buildLadder(p, idx, port, chainOverride) {
    const st = p.settings;
    const ctx = portContext(p, idx, port);
    const chain = chainOverride || port.chain;
    const bright = (st.brightness / 100) * ((port.brightness == null ? 100 : port.brightness) / 100);
    const nodes = [], edges = [];
    const add = (n) => { nodes.push(Object.assign({ gs: 0, vs: 0, load: 0, dist: 0 }, n)); return nodes.length - 1; };
    const link = (r, item) => edges.push({ g: r === Infinity ? 0 : 1 / Math.max(r, R_TINY), item, r });

    const n0 = add({ kind: 'port', item: null, dist: 0 });
    if (port.portPower && ctx.psu) {
      const spec = M.psuSpec(ctx.psu);
      nodes[n0].gs = 1 / (loopR(ctx.c.feed.gauge, ctx.c.feed.length) + R_CONTACT);
      nodes[n0].vs = +ctx.psu.vout || spec.v;
      nodes[n0].src = { type: 'port', psuId: ctx.psu.id };
    }
    let dist = 0, gap = 0;
    chain.forEach((it, ii) => {
      if (it.kind === 'cable') {
        dist += +it.length || 0; gap += +it.length || 0;
        link(loopR(it.gauge, it.length), it.id);
        add({ kind: 'junction', item: it.id, dist, ii });
      } else if (it.kind === 'pixels') {
        const t = M.pixelType(p, it.typeId) || C.pixelTypes[0];
        const n = Math.max(0, Math.round(+it.count || 0));
        const sp = +it.spacing || 0;
        const amps = (t.w / t.v) * bright;
        for (let i = 0; i < n; i++) {
          dist += sp; gap += sp;
          link(loopR(it.gauge, sp), it.id);
          add({ kind: 'pixel', item: it.id, ii, px: i, load: amps, nomV: t.v, dist, gapBefore: gap });
          gap = 0;
        }
      } else if (it.kind === 'inject') {
        link(it.isolate ? Infinity : R_TINY, it.id);
        const k = add({ kind: 'inject', item: it.id, ii, dist });
        const e = it.psuId ? idx.get(it.psuId) : null;
        if (e) {
          const spec = M.psuSpec(e.obj);
          nodes[k].gs = 1 / (loopR(it.gauge, it.length) + R_CONTACT);
          nodes[k].vs = +e.obj.vout || spec.v;
          nodes[k].src = { type: 'inject', psuId: e.obj.id, itemId: it.id };
        }
      }
    });
    return { nodes, edges, ctx, bright };
  }

  function solve(L) {
    const { nodes, edges } = L, n = nodes.length;
    // Connected components (split by open edges); a component with no source is unpowered.
    const comp = new Array(n).fill(0);
    let cid = 0;
    for (let k = 1; k < n; k++) { if (edges[k - 1].g === 0) cid++; comp[k] = cid; }
    const powered = new Array(cid + 1).fill(false);
    nodes.forEach((nd, k) => { if (nd.gs > 0) powered[comp[k]] = true; });
    const a = new Float64Array(n), b = new Float64Array(n), c = new Float64Array(n), d = new Float64Array(n);
    for (let k = 0; k < n; k++) {
      if (!powered[comp[k]]) { b[k] = 1; d[k] = 0; continue; }
      const gl = k > 0 ? edges[k - 1].g : 0, gr = k < n - 1 ? edges[k].g : 0;
      a[k] = -gl; c[k] = -gr; b[k] = gl + gr + nodes[k].gs; d[k] = nodes[k].gs * nodes[k].vs - nodes[k].load;
    }
    const cp = new Float64Array(n), dp = new Float64Array(n), V = new Float64Array(n);
    cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0];
    for (let k = 1; k < n; k++) {
      const m = b[k] - a[k] * cp[k - 1];
      cp[k] = c[k] / m; dp[k] = (d[k] - a[k] * dp[k - 1]) / m;
    }
    V[n - 1] = dp[n - 1];
    for (let k = n - 2; k >= 0; k--) V[k] = dp[k] - cp[k] * V[k + 1];
    const Ie = edges.map((e, k) => e.g * (V[k] - V[k + 1]));
    const Is = nodes.map((nd, k) => nd.gs ? nd.gs * (nd.vs - V[k]) : 0);
    return { V, Ie, Is, comp, powered };
  }

  // Solve one port and summarise per item.
  K.solvePort = (p, idx, port, chainOverride) => {
    const st = p.settings;
    const L = buildLadder(p, idx, port, chainOverride);
    const S = solve(L);
    const { nodes, edges, ctx } = L;
    const items = new Map();
    const chain = chainOverride || port.chain;
    chain.forEach(it => items.set(it.id, { minV: Infinity, minPct: Infinity, maxA: 0, pixels: 0, watts: 0, sourceA: 0, startDist: null, endDist: 0, unpowered: false }));
    let minPct = Infinity, minV = Infinity, firstFail = -1, firstErr = -1, pixels = 0, channels = 0, loadA = 0;
    const pxV = [];
    nodes.forEach((nd, k) => {
      const r = nd.item ? items.get(nd.item) : null;
      if (r) {
        if (r.startDist == null) { r.startDist = nd.dist; r.vIn = Math.max(0, k > 0 ? S.V[k - 1] : S.V[k]); }
        r.endDist = nd.dist; r.vOut = Math.max(0, S.V[k]);
      }
      if (nd.kind === 'pixel') {
        // Constant-current loads can solve below 0 V when hopelessly overloaded; real pixels just go dark.
        const v = Math.max(0, S.V[k]), pct = S.powered[S.comp[k]] ? v / nd.nomV * 100 : 0;
        pxV.push({ k, v, pct, item: nd.item });
        pixels++; loadA += nd.load;
        r.pixels++; r.watts += nd.load * nd.nomV;
        if (!S.powered[S.comp[k]]) r.unpowered = true;
        if (v < r.minV) r.minV = v;
        if (pct < r.minPct) r.minPct = pct;
        if (pct < minPct) { minPct = pct; minV = v; }
        if (firstFail < 0 && pct < 100 - st.warnDropPct) firstFail = k;
        if (firstErr < 0 && pct < 100 - st.errDropPct) firstErr = k;
      }
      if (nd.src && nd.src.type === 'inject') items.get(nd.src.itemId).sourceA = S.Is[k];
    });
    edges.forEach((e, k) => { const r = items.get(e.item); if (r) r.maxA = Math.max(r.maxA, Math.abs(S.Ie[k])); });
    chain.forEach(it => { if (it.kind === 'pixels') { const t = M.pixelType(p, it.typeId); if (t) channels += (+it.count || 0) * t.ch; } });
    return {
      L, S, items, pxV, pixels, channels, loadA, firstFail, firstErr,
      minV: pixels ? minV : null, minPct: pixels ? minPct : null,
      portA: S.Is[0] || 0, psuId: ctx.psu ? ctx.psu.id : null, ctx
    };
  };

  // Full project analysis.
  K.run = (p) => {
    const st = p.settings, idx = M.index(p);
    const R = { ports: new Map(), psus: new Map(), banks: new Map(), distros: new Map(), controllers: new Map(), warnings: [], idx };
    const warn = (level, msg, ref) => R.warnings.push({ level, msg, ref });
    const psuLoad = (psuId, amps, label, ref) => {
      const r = R.psus.get(psuId); if (!r) return;
      r.amps += amps; r.loads.push({ label, amps, ref });
    };
    M.allPsus(p).forEach(({ psu, distro }) => {
      const spec = M.psuSpec(psu);
      R.psus.set(psu.id, { spec, amps: 0, loads: [], distroId: distro.id, psu });
      if (psu.vout < spec.adj[0] || psu.vout > spec.adj[1]) warn('error', `${psu.name} (${psu.model}) is set to ${psu.vout} V, outside its ${spec.adj[0]}-${spec.adj[1]} V trim range.`, psu.id);
    });

    let chCursor = 1;
    p.distros.forEach(d => {
      const D = { dcW: 0, acW: 0, relayW: 0, mainsA: 0, pixels: 0 };
      R.distros.set(d.id, D);
      if (d.psus.length > d.psuSlots) warn('warn', `${d.name}: ${d.psus.length} PSUs but the enclosure holds ${d.psuSlots}.`, d.id);
      if (d.controllers.length > d.boardSlots) warn('warn', `${d.name}: ${d.controllers.length} boards but the enclosure holds ${d.boardSlots}.`, d.id);
      if (!d.psus.length && d.controllers.length) warn('error', `${d.name} has controllers but no PSU.`, d.id);

      d.controllers.forEach(c => {
        const board = C.boards[c.board];
        const CR = { pixels: 0, channels: 0, universes: 0, startCh: chCursor, watts: 0 };
        R.controllers.set(c.id, CR);
        const bankA = {};
        board.banks.forEach(bk => {
          bankA[bk.id] = 0;
          const psuId = c.banks[bk.id];
          const needed = bk.ports.some(n => { const pt = c.ports.find(x => x.num === n); return pt && pt.chain.length && pt.portPower; }) || bk === board.banks[0];
          if (!psuId && needed) warn('error', `${c.name}: ${bk.label} has no PSU connected.`, c.id);
          if (psuId) {
            const ps = R.psus.get(psuId);
            if (ps && (ps.spec.v < board.vmin || ps.spec.v > board.vmax)) warn('error', `${c.name}: ${bk.label} fed ${ps.spec.v} V, board accepts ${board.vmin}-${board.vmax} V.`, c.id);
          }
        });
        // Board logic draws from the first connected bank.
        const firstBank = board.banks.find(bk => c.banks[bk.id]);
        if (firstBank) { const ps = R.psus.get(c.banks[firstBank.id]); if (ps) psuLoad(ps.psu.id, board.logicW / (ps.psu.vout || ps.spec.v), `${c.name} board`, c.id); }
        if (!c.ip) warn('info', `${c.name} has no IP address yet.`, c.id);

        c.ports.forEach(pt => {
          const r = K.solvePort(p, idx, pt);
          r.startCh = chCursor;
          r.universes = Math.ceil(r.channels / st.universeSize);
          chCursor += r.channels;
          R.ports.set(pt.id, r);
          const pname = `${c.name} port ${pt.num}${pt.label ? ' (' + pt.label + ')' : ''}`;
          CR.pixels += r.pixels; CR.channels += r.channels; CR.universes += r.universes;
          D.pixels += r.pixels;
          if (!pt.chain.length) return;
          // Port / bank current.
          const bk = r.ctx.bank;
          if (bk) bankA[bk.id] += r.portA;
          if (r.psuId && r.portA > 0) psuLoad(r.psuId, r.portA, `${pname} via ${bk ? bk.label : 'bank'}`, pt.id);
          if (board.fuseA) {
            if (r.portA > board.fuseA) warn('error', `${pname} draws ${r.portA.toFixed(2)} A through its ${board.fuseA} A fuse. Inject power or split the run.`, pt.id);
            else if (r.portA > board.fuseA * 0.8) warn('warn', `${pname} draws ${r.portA.toFixed(2)} A, over 80% of its ${board.fuseA} A fuse.`, pt.id);
          }
          if (board.maxCh && r.channels > board.maxCh) warn('error', `${pname} has ${r.channels} channels; ${board.name} ports take ${board.maxCh} (${board.maxPx} RGB pixels at 40 fps).`, pt.id);
          if (!pt.portPower && !pt.chain.some(i => i.kind === 'inject')) warn('error', `${pname} has port power off and no injection, so nothing powers it.`, pt.id);
          // Voltage.
          if (r.minPct != null) {
            const it = r.firstFail >= 0 ? r.L.nodes[r.firstFail] : null;
            const where = it ? ` from pixel ${countBefore(r, r.firstFail) + 1}` : '';
            if (r.firstErr >= 0) warn('error', `${pname}: pixels drop to ${r.minV.toFixed(2)} V (${r.minPct.toFixed(0)}% of nominal)${where}. Colours will shift or pixels fail. Inject power (try Auto-inject).`, pt.id);
            else if (r.firstFail >= 0) warn('warn', `${pname}: pixels drop to ${r.minV.toFixed(2)} V (${r.minPct.toFixed(0)}%)${where}. Whites will look warm; consider injecting.`, pt.id);
          }
          // Items.
          const comps = componentInfo(p, idx, r);
          pt.chain.forEach((it, i) => {
            const ir = r.items.get(it.id);
            const w = wire(it.gauge);
            if (it.kind === 'cable' || it.kind === 'pixels') {
              if (ir.maxA > w.maxA) warn(ir.maxA > w.maxA * 1.3 ? 'error' : 'warn', `${pname}: ${describe(p, it)} carries ${ir.maxA.toFixed(2)} A; ${w.label} is good for about ${w.maxA} A. Use thicker wire or inject nearer.`, it.id);
              if (ir.unpowered) warn('error', `${pname}: ${describe(p, it)} has no power (isolated with no injection).`, it.id);
            }
            if (it.kind === 'pixels') {
              const t = M.pixelType(p, it.typeId);
              if (!t) warn('error', `${pname}: unknown pixel type.`, it.id);
              else if (t.spacing > st.dataWarnM || +it.spacing > st.dataWarnM) warn('warn', `${pname}: ${describe(p, it)} has ${it.spacing} m between pixels; data over ${st.dataWarnM} m can glitch.`, it.id);
            }
            if (it.kind === 'inject') {
              const e = it.psuId ? idx.get(it.psuId) : null;
              if (!e) warn('error', `${pname}: injection point ${i + 1} has no PSU selected.`, it.id);
              else {
                psuLoad(it.psuId, Math.max(0, ir.sourceA), `${pname} injection (${it.length} m ${w.label})`, it.id);
                if (e.distro.id !== d.id) warn('info', `${pname}: injection from ${e.obj.name} in ${e.distro.name} (another distro). Tie the grounds together.`, it.id);
              }
              if (ir.sourceA > w.maxA) warn('error', `${pname}: injection feed carries ${ir.sourceA.toFixed(2)} A; ${w.label} is good for about ${w.maxA} A.`, it.id);
              if (ir.sourceA < -0.05) warn('warn', `${pname}: injection point ${i + 1} is pushing current back into its PSU; check its PSU voltage.`, it.id);
            }
          });
          // Data gaps (first pixel or between pixels).
          let reported = 0;
          r.L.nodes.forEach((nd, k) => {
            if (nd.kind === 'pixel' && Math.round(nd.gapBefore * 2) / 2 > st.dataWarnM && reported < 2) {
              reported++;
              warn('warn', `${pname}: ${nd.gapBefore.toFixed(1)} m of data cable before pixel ${countBefore(r, k) + 1}. Over ${st.dataWarnM} m the data can glitch; add a null pixel or shorten the lead.`, nd.item);
            }
          });
          comps.forEach(ci => {
            if (ci.mismatch) warn('error', `${pname}: ${ci.mismatch}`, pt.id);
            if (ci.mixed) warn('info', `${pname}: ${ci.mixed}`, pt.id);
          });
        });
        // Banks.
        board.banks.forEach(bk => {
          const max = bk.maxA || (board.fuseA ? board.fuseA * bk.ports.length : null);
          R.banks.set(c.id + ':' + bk.id, { amps: bankA[bk.id], max, psuId: c.banks[bk.id] });
          if (max && bankA[bk.id] > max) warn('error', `${c.name}: ${bk.label} carries ${bankA[bk.id].toFixed(1)} A (max ${max} A).`, c.id);
          const fw = wire(c.feed.gauge);
          if (bankA[bk.id] > fw.maxA) warn('warn', `${c.name}: ${bk.label} feed (${fw.label}) carries ${bankA[bk.id].toFixed(1)} A; good for about ${fw.maxA} A.`, c.id);
        });
        // Relays.
        c.relays.forEach(rl => {
          if (!rl.name && !rl.amps) return;
          if (board.relayMaxA && rl.amps > board.relayMaxA) warn('error', `${c.name} relay ${rl.num} (${rl.name || 'unnamed'}) switches ${rl.amps} A; max ${board.relayMaxA} A.`, rl.id);
          if (board.relayMaxV && rl.volts > board.relayMaxV) warn('error', `${c.name} relay ${rl.num} switches ${rl.volts} V; max ${board.relayMaxV} V.`, rl.id);
          if (rl.volts >= 100) D.relayW += rl.amps * rl.volts;
        });
        CR.watts = 0;
      });
    });

    // PSU totals.
    R.psus.forEach((r, id) => {
      r.watts = r.amps * (r.psu.vout || r.spec.v);
      r.pct = r.amps / r.spec.a * 100;
      const D = R.distros.get(r.distroId); D.dcW += r.watts;
      if (r.pct > 100) warn('error', `${r.psu.name} (${r.psu.model}) is overloaded: ${r.amps.toFixed(1)} A of ${r.spec.a} A (${r.pct.toFixed(0)}%).`, id);
      else if (r.pct > st.psuTargetPct) warn('warn', `${r.psu.name} (${r.psu.model}) is at ${r.pct.toFixed(0)}%, above your ${st.psuTargetPct}% target.`, id);
      else if (r.amps === 0) warn('info', `${r.psu.name} (${r.psu.model}) is not used.`, id);
    });
    // Controllers: watts per controller from its ports.
    p.distros.forEach(d => d.controllers.forEach(c => {
      const CR = R.controllers.get(c.id);
      c.ports.forEach(pt => { const r = R.ports.get(pt.id); CR.watts += r.loadA * (r.L.nodes[0].vs || 12); });
    }));
    // Distros and totals.
    const T = { pixels: 0, dcW: 0, acW: 0, relayW: 0, mainsA: 0, channels: chCursor - 1, universes: 0, psuA: 0, psuCapA: 0 };
    p.distros.forEach(d => {
      const D = R.distros.get(d.id);
      D.acW = D.dcW / (st.psuEfficiency / 100) + D.relayW;
      D.mainsA = D.acW / st.mainsV;
      if (D.mainsA > st.mainsCircuitA) warn('error', `${d.name} draws ${D.mainsA.toFixed(1)} A from the mains at full white; the circuit is ${st.mainsCircuitA} A.`, d.id);
      else if (D.mainsA > st.mainsCircuitA * 0.8) warn('warn', `${d.name} draws ${D.mainsA.toFixed(1)} A from the mains at full white (over 80% of ${st.mainsCircuitA} A).`, d.id);
      T.pixels += D.pixels; T.dcW += D.dcW; T.acW += D.acW; T.relayW += D.relayW;
    });
    R.controllers.forEach(cr => { T.universes += cr.universes; });
    R.psus.forEach(r => { T.psuA += r.amps; T.psuCapA += r.spec.a; });
    T.mainsA = T.acW / st.mainsV;
    T.typicalW = (T.acW - T.relayW) * st.typicalPct / 100;
    T.kWh = T.typicalW * st.hoursPerNight * st.nights / 1000;
    T.cost = T.kWh * st.tariff;
    R.totals = T;
    const order = { error: 0, warn: 1, info: 2 };
    R.warnings.sort((a, b) => order[a.level] - order[b.level]);
    R.counts = { error: 0, warn: 0, info: 0 };
    R.warnings.forEach(w => R.counts[w.level]++);
    return R;
  };

  function countBefore(r, k) { let n = 0; for (let i = 0; i < k; i++) if (r.L.nodes[i].kind === 'pixel') n++; return n; }

  // Per connected section: PSU voltage vs pixel voltage, and PSUs paralleled through a run.
  function componentInfo(p, idx, r) {
    const out = [];
    const groups = new Map();
    r.L.nodes.forEach((nd, k) => {
      const c = r.S.comp[k];
      if (!groups.has(c)) groups.set(c, { psus: new Set(), volts: new Set() });
      const g = groups.get(c);
      if (nd.src) g.psus.add(nd.src.psuId);
      if (nd.kind === 'pixel') g.volts.add(nd.nomV);
    });
    groups.forEach(g => {
      const psus = [...g.psus].map(id => idx.get(id)).filter(Boolean).map(e => e.obj);
      const info = {};
      psus.forEach(s => {
        const v = M.psuSpec(s).v;
        g.volts.forEach(pv => { if (Math.abs(pv - v) > 0.5) info.mismatch = `${pv} V pixels are fed from ${s.name} (${v} V). This will destroy them.`; });
      });
      if (psus.length > 1) info.mixed = `${psus.map(s => s.name).join(' and ')} are joined through this run (+V not isolated). Fine if grounds are common and both are set to the same voltage; otherwise tick Isolate on the injection.`;
      out.push(info);
    });
    return out;
  }

  K.describe = describe;
  function describe(p, it) {
    if (it.kind === 'cable') return `${it.length} m ${wire(it.gauge).label} cable`;
    if (it.kind === 'inject') return `injection (${it.length} m ${wire(it.gauge).label})`;
    const t = M.pixelType(p, it.typeId);
    return `${it.count} × ${t ? t.name : '?'}`;
  }

  // ---- Auto-inject -------------------------------------------------------------------------------
  // Greedy cover: find the first pixel under the warning threshold, then place one injection as far
  // down the run as possible while every pixel up to that point still passes. String joins are
  // preferred over tapping into a string. Repeat until the whole run passes.
  K.autoInject = (p, portId) => {
    const idx = M.index(p), e = idx.get(portId), port = e.obj, st = p.settings;
    const ctx = portContext(p, idx, port);
    let added = 0; const notes = [];
    for (let iter = 0; iter < 40; iter++) {
      const r = K.solvePort(p, idx, port);
      if (r.firstFail < 0) break;
      const psu = pickPsu(p, idx, ctx, r);
      if (!psu) { notes.push('No PSU with a matching voltage in this distro.'); break; }
      const lastSrc = lastSourceBefore(r, r.firstFail);
      const cands = candidates(port, r, lastSrc);
      let pick = null;
      for (const g of gaugesFrom(st.injectGauge)) {
        let bestJoin = null, bestSplit = null, bestProgress = null;
        cands.forEach(cd => {
          const chain = trialChain(p, port, cd, psu, st, g);
          let injNode = -1, cut = Infinity;
          // Pixels well past this point will get their own injection later, so leave their load
          // out of the trial: this spot serves about as far downstream as upstream.
          const tr = K.solvePort(p, idx, port, chain, L => {
            injNode = L.nodes.findIndex(n => n.kind === 'inject' && n.item === chain[cd.insertAt].id);
            let prev = 0;
            for (let i = injNode - 1; i >= 0; i--) if (L.nodes[i].gs > 0) { prev = i; break; }
            cut = injNode + Math.max(1, Math.round((injNode - prev) / 2));
            for (let i = cut + 1; i < L.nodes.length; i++) L.nodes[i].load = 0;
          });
          const ok = tr.firstFail < 0 || tr.firstFail > Math.min(cut, tr.L.nodes.length - 1);
          const res = { chain, cd, node: cd.node, ff: tr.firstFail < 0 ? 1e9 : tr.firstFail };
          if (ok) {
            if (cd.split) { if (!bestSplit || cd.node > bestSplit.node) bestSplit = res; }
            else if (!bestJoin || cd.node > bestJoin.node) bestJoin = res;
          }
          if (!bestProgress || res.ff > bestProgress.ff) bestProgress = res;
        });
        const span = x => x.node - lastSrc;
        if (bestJoin && (!bestSplit || span(bestJoin) >= 0.6 * span(bestSplit))) pick = bestJoin;
        else if (bestSplit) pick = bestSplit;
        if (pick) break;
        if (g === C.feedGaugeLadder[C.feedGaugeLadder.length - 1] && bestProgress && bestProgress.ff > r.firstFail) pick = bestProgress;
      }
      if (!pick) { notes.push('Voltage is still low near the start of the run: use a thicker lead cable or a PSU closer to the pixels.'); break; }
      port.chain = pick.chain; added++;
    }
    sizeFeeds(p, port);
    return { added, notes };
  };

  function gaugesFrom(g) { const l = C.feedGaugeLadder, i = l.indexOf(g); return i < 0 ? [g].concat(l) : l.slice(i); }
  function lastSourceBefore(r, k) { for (let i = k; i >= 0; i--) if (r.L.nodes[i].gs > 0) return i; return 0; }

  // Positions after the last source and up to (a little past) the failing pixel: every join
  // between items, and every few pixels inside strings.
  function candidates(port, r, lastSrc) {
    const out = [], nodes = r.L.nodes;
    const limit = nodes.length;
    const seenJoin = new Set();
    for (let k = lastSrc + 1; k < nodes.length && k <= limit; k++) {
      const nd = nodes[k];
      if (nd.kind !== 'pixel') continue;
      const it = port.chain[nd.ii];
      if (nd.px === 0) {
        // Join just before this string (skip if an injection already sits there).
        const prev = port.chain[nd.ii - 1];
        if (!(prev && prev.kind === 'inject') && !seenJoin.has(nd.ii)) { seenJoin.add(nd.ii); out.push({ pos: nd.ii, node: k - 0.5 }); }
      } else {
        const step = Math.max(1, Math.round(it.count / 20));
        if (nd.px % step === 0) out.push({ pos: nd.ii, split: nd.px, node: k - 0.5 });
      }
      // Join after the last pixel of a string.
      if (nd.px === it.count - 1 && !seenJoin.has(nd.ii + 1)) {
        const next = port.chain[nd.ii + 1];
        if (!(next && next.kind === 'inject')) { seenJoin.add(nd.ii + 1); out.push({ pos: nd.ii + 1, node: k + 0.5 }); }
      }
    }
    return out;
  }
  function pickPsu(p, idx, ctx, r) {
    const v = ctx.psu ? M.psuSpec(ctx.psu).v : (r.L.nodes.find(n => n.nomV) || {}).nomV || 12;
    const loads = K.run(p).psus;
    const pool = ctx.distro.psus.filter(s => M.psuSpec(s).v === v);
    if (!pool.length) return null;
    const pct = s => (loads.get(s.id) || { pct: 0 }).pct;
    if (ctx.psu && pool.includes(ctx.psu) && pct(ctx.psu) < p.settings.psuTargetPct) return ctx.psu;
    return pool.slice().sort((a, b) => pct(a) - pct(b))[0];
  }

  // A string split for a mid-string tap keeps tapOffset (pixels before it in the physical string),
  // so the guide can say "tap at pixel 61 of this string".
  function trialChain(p, port, cd, psu, st, gauge) {
    const chain = port.chain.map(x => Object.assign({}, x));
    let pos = cd.pos, tapAt = null;
    if (cd.split) {
      const it = chain[pos];
      const off = it.tapOffset || 0;
      const a = Object.assign({}, it, { count: cd.split });
      const b = Object.assign({}, it, { id: M.uid('it'), count: it.count - cd.split, tapOffset: off + cd.split, continued: true });
      tapAt = off + cd.split + 1;
      chain.splice(pos, 1, a, b);
      pos = pos + 1;
    }
    cd.insertAt = pos;
    // Distance along the run to this point.
    let dist = 0;
    for (let i = 0; i < pos; i++) { const x = chain[i]; if (x.kind === 'cable') dist += +x.length || 0; if (x.kind === 'pixels') dist += (+x.count || 0) * (+x.spacing || 0); }
    const len = st.injectMode === 'fixed' ? st.injectLength : Math.max(1, Math.ceil(dist * 2) / 2);
    const inj = M.newItem.inject(psu.id, len, gauge || st.injectGauge);
    inj.label = tapAt ? `tap into string at pixel ${tapAt}` : 'at string join';
    inj.auto = true;
    chain.splice(pos, 0, inj);
    return chain;
  }

  // Give each auto feed the thinnest gauge (from the default up) that is rated for its current and
  // keeps the run passing; thicken if nothing passes.
  function sizeFeeds(p, port) {
    const idx = M.index(p), st = p.settings;
    const ladder = gaugesFrom(st.injectGauge);
    const passes = () => { const r = K.solvePort(p, idx, port); return { ok: r.firstFail < 0, r }; };
    port.chain.filter(it => it.kind === 'inject' && it.auto).forEach(it => {
      const keep = it.gauge;
      const base = passes().ok;
      for (const g of ladder) {
        it.gauge = g;
        const t = passes();
        if (t.r.items.get(it.id).sourceA <= wire(g).maxA && (t.ok || !base)) return;
      }
      it.gauge = base ? keep : ladder[ladder.length - 1];
    });
  }
  // ---- Balance PSUs ------------------------------------------------------------------------------
  // Reassign controller banks and injection feeds to PSUs in the same distro (same voltage) so the
  // most-loaded PSU is as light as possible. Returns a list of changes.
  K.balance = (p, distroIds) => {
    const R = K.run(p);
    const changes = [];
    p.distros.filter(d => !distroIds || distroIds.includes(d.id)).forEach(d => {
      if (d.psus.length < 2) return;
      const loads = [];
      d.controllers.forEach(c => {
        const board = C.boards[c.board];
        board.banks.forEach(bk => {
          const b = R.banks.get(c.id + ':' + bk.id);
          if (!c.banks[bk.id]) return;
          const logic = board.banks.find(x => c.banks[x.id]) === bk ? board.logicW / 12 : 0;
          loads.push({ amps: (b ? b.amps : 0) + logic, v: M.psuSpec(M.find(p, c.banks[bk.id]).obj).v, set: id => { c.banks[bk.id] = id; }, cur: c.banks[bk.id], label: `${c.name} ${bk.label}` });
        });
        c.ports.forEach(pt => {
          const r = R.ports.get(pt.id);
          pt.chain.forEach(it => {
            if (it.kind !== 'inject' || !it.psuId) return;
            const e = M.find(p, it.psuId);
            if (!e || e.distro.id !== d.id) return;
            loads.push({ amps: Math.max(0, r.items.get(it.id).sourceA), v: M.psuSpec(e.obj).v, set: id => { it.psuId = id; }, cur: it.psuId, label: `${c.name} port ${pt.num} injection` });
          });
        });
      });
      const used = new Map(d.psus.map(s => [s.id, 0]));
      loads.sort((a, b) => b.amps - a.amps).forEach(l => {
        const pool = d.psus.filter(s => M.psuSpec(s).v === l.v);
        let best = null, bestPct = Infinity;
        pool.forEach(s => { const pct = (used.get(s.id) + l.amps) / M.psuSpec(s).a; if (pct < bestPct - 1e-9) { bestPct = pct; best = s; } });
        if (!best) return;
        used.set(best.id, used.get(best.id) + l.amps);
        if (best.id !== l.cur) { l.set(best.id); changes.push(`${l.label} → ${best.name}`); }
      });
    });
    return changes;
  };

  K.fmtA = a => (a == null ? '-' : (Math.abs(a) < 10 ? a.toFixed(2) : a.toFixed(1)) + ' A');
  K.fmtW = w => (w == null ? '-' : w >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W');
  K.fmtV = v => (v == null || !isFinite(v) ? '-' : v.toFixed(2) + ' V');
  K.status = pct => pct == null ? 'none' : pct < 100 - PP.store.project.settings.errDropPct ? 'error' : pct < 100 - PP.store.project.settings.warnDropPct ? 'warn' : 'ok';
})();

</script>
<script>
// Small UI helpers shared by the views.
(function () {
  const U = PP.ui = {
    open: new Set(),          // ids of expanded <details> in the form
    view: 'split',
    cam: { x: 20, y: 20, k: 1 },
    lastR: null
  };
  U.$ = (s, el = document) => el.querySelector(s);
  U.$$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.num = (v, d = 2) => (v == null || !isFinite(v)) ? '-' : (+v).toFixed(d).replace(/\.?0+$/, m => m.startsWith('.') ? '' : m);

  U.toast = (msg, ms = 3200) => {
    const t = U.$('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(U._tt); U._tt = setTimeout(() => { t.hidden = true; }, ms);
  };

  // Promise-based confirm / prompt in a themed dialog.
  U.ask = ({ title, body = '', input = null, ok = 'OK', cancel = 'Cancel', danger = false }) => new Promise(res => {
    const d = U.$('#askDlg');
    d.innerHTML = `<form method="dialog"><div class="dlg-head"><b>${U.esc(title)}</b></div>
      <div class="dlg-body">${body}${input != null ? `<input id="askIn" style="width:100%;margin-top:6px" value="${U.esc(input)}">` : ''}</div>
      <div class="dlg-foot">${cancel ? `<button value="cancel">${U.esc(cancel)}</button>` : ''}<button value="ok" class="${danger ? 'primary' : 'primary'}">${U.esc(ok)}</button></div></form>`;
    d.onclose = () => {
      if (d.returnValue !== 'ok') return res(null);
      res(input != null ? U.$('#askIn', d).value : true);
    };
    d.returnValue = '';
    d.showModal();
    const i = U.$('#askIn', d); if (i) { i.focus(); i.select(); }
  });

  U.wireOptions = (sel, filter) => PP.catalog.wires.filter(w => !filter || filter(w)).map(w => `<option value="${w.id}"${w.id === sel ? ' selected' : ''}>${w.label}</option>`).join('');
  U.opt = (v, label, sel) => `<option value="${U.esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${U.esc(label)}</option>`;

  U.psuOptions = (p, sel, blank = '— none —') => {
    let h = `<option value="">${blank}</option>`;
    p.distros.forEach(d => {
      if (!d.psus.length) return;
      h += `<optgroup label="${U.esc(d.name)}">` + d.psus.map(s => U.opt(s.id, `${s.name} · ${s.model === 'custom' ? 'custom ' + s.customV + ' V' : s.model}`, sel)).join('') + '</optgroup>';
    });
    return h;
  };
  U.psuModelOptions = (sel) => {
    const byV = {};
    PP.catalog.psus.forEach(s => { (byV[s.v] = byV[s.v] || []).push(s); });
    let h = '';
    Object.keys(byV).sort((a, b) => (a == 12 ? -1 : b == 12 ? 1 : a - b)).forEach(v => {
      h += `<optgroup label="${v} V">` + byV[v].map(s => U.opt(s.id, `${s.id} (${s.a} A)`, sel)).join('') + '</optgroup>';
    });
    return h + `<optgroup label="Other">${U.opt('custom', 'Custom PSU…', sel)}</optgroup>`;
  };
  U.pixelTypeOptions = (p, sel) => {
    const cats = { bullet: 'Bullets', seed: 'Seeds', flood: 'Floods', strip: 'Strip', null: 'Null pixels', other: 'Other' };
    const g = {};
    p.library.pixelTypes.forEach(t => { const c = cats[t.cat] ? t.cat : 'other'; (g[c] = g[c] || []).push(t); });
    return Object.keys(cats).filter(c => g[c]).map(c => `<optgroup label="${cats[c]}">` + g[c].map(t => U.opt(t.id, t.name, sel)).join('') + '</optgroup>').join('');
  };

  U.pctClass = (pct, target = 80) => pct > 100 ? 'err' : pct > target ? 'warn' : 'ok';
  U.bar = (pct, target) => {
    const c = U.pctClass(pct, target);
    return `<div class="bar ${c}" title="${U.num(pct, 0)}%"><i style="width:${Math.min(100, Math.max(0, pct))}%"></i>${target ? `<span class="tgt" style="left:${target}%"></span>` : ''}</div>`;
  };
  U.vClass = (pct) => { const s = PP.calc.status(pct); return s === 'error' ? 'err' : s; };

  U.download = (name, text, type = 'application/json') => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  U.slug = s => (String(s || 'show').trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-') || 'show');
})();

</script>
<script>
// Form view: every part of the project as editable fields. The same editors feed the Visual view's
// inspector, so both views always edit the same data.
// Inputs carry data-id (entity id), data-f (field path) and data-t (num|str|bool); main.js commits
// them on change. Buttons carry data-act and data-id.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc;
  const esc = U.esc;
  const F = PP.form = {};

  const inp = (id, f, v, t = 'str', attrs = '') =>
    t === 'bool'
      ? `<input type="checkbox" data-id="${id}" data-f="${f}" data-t="bool"${v ? ' checked' : ''} ${attrs}>`
      : `<input ${t === 'num' ? 'type="number"' : 'type="text"'} data-id="${id}" data-f="${f}" data-t="${t}" value="${esc(v)}" ${attrs}>`;
  const sel = (id, f, opts, attrs = '', t = 'str') => `<select data-id="${id}" data-f="${f}" data-t="${t}" ${attrs}>${opts}</select>`;
  const btn = (act, label, id = '', cls = '', title = '', extra = '') => `<button class="${cls}" data-act="${act}" data-id="${id}" ${title ? `title="${esc(title)}"` : ''} ${extra}>${label}</button>`;
  const det = (key, cls, summary, body, defOpen = false) => {
    const open = U.open.has(key) || (defOpen && !U.open.has('!' + key));
    return `<details class="${cls}" data-open-id="${key}"${open ? ' open' : ''}><summary>${summary}</summary>${body}</details>`;
  };
  const chev = '<span class="chev">▶</span>';

  // ---------- whole form ----------
  F.render = (p, R) => {
    const pane = U.$('#formPane');
    const scroll = pane.scrollTop;
    const act = document.activeElement;
    const focusKey = act && pane.contains(act) && act.dataset && act.dataset.id ? act.dataset.id + '|' + act.dataset.f : null;
    let h = '';
    h += det('sec-settings', 'sec', `${chev}Project settings <span class="pill">${p.settings.brightness}% brightness</span><span class="pill">warn below ${100 - p.settings.warnDropPct}% V</span>`, settings(p));
    h += `<div class="sec"><div class="sec-head">Distros <span class="pill">${p.distros.length}</span><span class="grow"></span>
      ${btn('balanceAll', 'Balance all PSUs', '', 'small', 'Spread banks and injection feeds across the PSUs in each distro')}
      ${btn('autoInjectAll', 'Auto-inject all', '', 'small', 'Add injection points to every run that drops too low')}
      ${btn('addDistro', '+ Distro', '', 'small primary')}</div>`;
    if (!p.distros.length) h += `<div class="empty">No distros yet. A distro is an enclosure holding a controller and its PSUs.<br><br>${btn('addDistro', '+ Add a distro', '', 'primary')} ${btn('demo', 'Load the demo show')}</div>`;
    p.distros.forEach(d => { h += F.distro(p, R, d); });
    h += '</div>';
    h += det('sec-library', 'sec', `${chev}Library: pixel types and string presets <span class="pill">${p.library.pixelTypes.length} types</span><span class="pill">${p.library.presets.length} presets</span>`, library(p));
    h += det('sec-channels', 'sec', `${chev}Channel map <span class="pill">${R.totals.channels} channels</span><span class="pill">${R.totals.universes} universes</span>`, channels(p, R));
    h += `<div class="sec"><textarea data-id="project" data-f="notes" data-t="str" placeholder="Project notes (appear in the wiring guide)">${esc(p.notes)}</textarea></div>`;
    pane.innerHTML = h;
    pane.scrollTop = scroll;
    if (focusKey) {
      const [id, f] = focusKey.split('|');
      const el = U.$$('[data-id]', pane).find(e => e.dataset.id === id && e.dataset.f === f);
      if (el) el.focus({ preventScroll: true });
    }
    F.markSelection();
  };

  function settings(p) {
    const s = p.settings, id = 'settings';
    const f = (label, html, title = '') => `<label class="fld" ${title ? `title="${esc(title)}"` : ''}>${label}${html}</label>`;
    return `<div class="card" style="padding:4px 12px"><div class="grid">
      ${f('Global brightness %', inp(id, 'brightness', s.brightness, 'num', 'min="1" max="100"'), 'Scales every pixel\'s current. Set the same cap in xLights/FPP or the Baldrick port.')}
      ${f('Typical show load % of full white', inp(id, 'typicalPct', s.typicalPct, 'num', 'min="1" max="100"'), 'Used only for running cost. Sequences average far below full white.')}
      ${f('Warn when pixels drop by %', inp(id, 'warnDropPct', s.warnDropPct, 'num', 'min="1" max="50"'))}
      ${f('Error when pixels drop by %', inp(id, 'errDropPct', s.errDropPct, 'num', 'min="1" max="60"'))}
      ${f('PSU load target %', inp(id, 'psuTargetPct', s.psuTargetPct, 'num', 'min="50" max="100"'), 'Warn above this continuous load (80% is the usual rule).')}
      ${f('PSU efficiency %', inp(id, 'psuEfficiency', s.psuEfficiency, 'num', 'min="50" max="99"'))}
      ${f('Mains voltage', inp(id, 'mainsV', s.mainsV, 'num'))}
      ${f('Mains circuit / plug fuse (A)', inp(id, 'mainsCircuitA', s.mainsCircuitA, 'num'), 'UK plug: 13 A. Warn above 80% of this per distro.')}
      ${f('FPP (Pi) IP address', inp(id, 'fppIp', s.fppIp), 'Used to build the Turniput FPP command URLs.')}
      ${f('Channels per universe', inp(id, 'universeSize', s.universeSize, 'num'))}
      ${f('Data warning distance (m)', inp(id, 'dataWarnM', s.dataWarnM, 'num', 'step="0.5"'), 'Warn when data travels further than this to the next pixel.')}
      ${f('Auto-inject feed wire', sel(id, 'injectGauge', U.wireOptions(s.injectGauge)))}
      ${f('Auto-inject feed length', sel(id, 'injectMode', U.opt('run', 'Follow the run (feed from distro)', s.injectMode) + U.opt('fixed', 'Fixed length', s.injectMode)), 'Follow the run: each feed is as long as the run up to that point (worst case, PSU in the distro). Fixed: PSU near the pixels.')}
      ${f('Fixed feed length (m)', inp(id, 'injectLength', s.injectLength, 'num', 'step="0.5"'))}
      ${f('Show hours per night', inp(id, 'hoursPerNight', s.hoursPerNight, 'num', 'step="0.5"'))}
      ${f('Show nights per season', inp(id, 'nights', s.nights, 'num'))}
      ${f(`Electricity price (${esc(s.currency)}/kWh)`, inp(id, 'tariff', s.tariff, 'num', 'step="0.01"'))}
      ${f('Currency symbol', inp(id, 'currency', s.currency))}
    </div></div>`;
  }

  // ---------- distro ----------
  F.distro = (p, R, d, opts = {}) => {
    const D = R.distros.get(d.id);
    const size = C.distroSizes.find(s => s.id === d.size) || C.distroSizes[0];
    const st = p.settings;
    const mainsPct = D.mainsA / st.mainsCircuitA * 100;
    let h = `<div class="card distro" id="f-${d.id}" data-sel="${d.id}">
      <div class="distro-head">
        <input class="name" data-id="${d.id}" data-f="name" data-t="str" value="${esc(d.name)}" aria-label="Distro name">
        ${sel(d.id, 'size', C.distroSizes.map(s => U.opt(s.id, s.name, d.size)).join(''), 'title="Enclosure size"')}
        ${d.size === 'custom' ? `<label class="fld inline">PSUs ${inp(d.id, 'psuSlots', d.psuSlots, 'num', 'min="1" style="width:52px"')}</label><label class="fld inline">Boards ${inp(d.id, 'boardSlots', d.boardSlots, 'num', 'min="1" style="width:52px"')}</label>` : ''}
        <span class="pill ${d.psus.length > d.psuSlots ? 'warn' : ''}">${d.psus.length}/${d.psuSlots} PSU</span>
        <span class="pill ${d.controllers.length > d.boardSlots ? 'warn' : ''}">${d.controllers.length}/${d.boardSlots} board</span>
        <span class="pill">${K.fmtW(D.dcW)} DC</span>
        <span class="pill ${U.pctClass(mainsPct)}" title="Mains current at full white, including PSU losses and relay loads">${U.num(D.mainsA, 1)} A mains</span>
        <span class="grow"></span>
        ${btn('balance', 'Balance PSUs', d.id, 'small', 'Spread banks and injection feeds across this distro\'s PSUs')}
        ${btn('delDistro', '✕', d.id, 'small ghost danger', 'Delete distro')}
      </div>`;
    h += `<h4>Power supplies ${btn('addPsu', '+ PSU', d.id, 'small')}</h4>`;
    if (d.psus.length) {
      h += `<table class="t"><tr><th>Name</th><th>Model</th><th title="Output voltage set on the trim pot">Set V</th><th style="width:28%">Load</th><th>Amps</th><th>Watts</th><th></th></tr>`;
      d.psus.forEach((s, i) => { h += F.psuRow(p, R, s, i); });
      h += '</table>';
    } else h += '<div class="muted">No PSUs. Add one, then connect it to the controller\'s power inputs below.</div>';
    h += `<h4>Controllers <select id="addBoard-${d.id}" aria-label="Board to add">${Object.entries(C.boards).map(([k, b]) => U.opt(k, b.name, 'baldrick8')).join('')}</select>${btn('addController', '+ Add', d.id, 'small')}</h4>`;
    d.controllers.forEach(c => { h += F.controller(p, R, d, c, opts); });
    h += `<details data-open-id="dn-${d.id}"${U.open.has('dn-' + d.id) ? ' open' : ''}><summary class="muted" style="font-size:12px;cursor:pointer">${chev} Notes</summary><textarea data-id="${d.id}" data-f="notes" data-t="str" placeholder="Location, mains feed, IP rating…">${esc(d.notes)}</textarea></details>`;
    return h + '</div>';
  };

  F.psuRow = (p, R, s, i) => {
    const r = R.psus.get(s.id), spec = r.spec, st = p.settings;
    return `<tr class="psurow" id="f-${s.id}" data-sel="${s.id}">
      <td class="nw"><span class="psw c${i % 6}" aria-hidden="true"></span> <input data-id="${s.id}" data-f="name" data-t="str" value="${esc(s.name)}" style="width:80px"></td>
      <td>${sel(s.id, 'model', U.psuModelOptions(s.model))}
        ${s.model === 'custom' ? `<div class="row" style="margin-top:3px"><label class="fld inline">V ${inp(s.id, 'customV', s.customV, 'num', 'style="width:52px"')}</label><label class="fld inline">A ${inp(s.id, 'customA', s.customA, 'num', 'style="width:52px"')}</label></div>` : `<div class="soft" style="font-size:11px">${esc(spec.ip)}</div>`}</td>
      <td>${inp(s.id, 'vout', s.vout, 'num', `step="0.1" min="${spec.adj[0]}" max="${spec.adj[1]}" style="width:60px" title="Trim range ${spec.adj[0]}-${spec.adj[1]} V"`)}</td>
      <td>${U.bar(r.pct, st.psuTargetPct)}<div class="soft" style="font-size:11px">${U.num(r.pct, 0)}% of ${spec.a} A</div></td>
      <td class="nw">${K.fmtA(r.amps)}</td><td class="nw">${K.fmtW(r.watts)}</td>
      <td class="nw">${btn('delPsu', '✕', s.id, 'small ghost danger', 'Delete PSU')}</td></tr>`;
  };

  // ---------- controller ----------
  F.controller = (p, R, d, c, opts = {}) => {
    const b = C.boards[c.board], CR = R.controllers.get(c.id);
    let h = `<div class="ctl" id="f-${c.id}" data-sel="${c.id}">
      <div class="ctl-head">
        <input class="name" data-id="${c.id}" data-f="name" data-t="str" value="${esc(c.name)}" aria-label="Controller name">
        ${sel(c.id, 'board', Object.entries(C.boards).map(([k, x]) => U.opt(k, x.name, c.board)).join(''), 'title="Board"')}
        <label class="fld inline">IP ${inp(c.id, 'ip', c.ip, 'str', 'placeholder="192.168.1.x" style="width:120px"')}</label>
        ${b.ports ? `<span class="pill">${CR.pixels} px</span><span class="pill">${CR.channels} ch</span>` : ''}
        <span class="grow"></span>
        ${btn('delController', '✕', c.id, 'small ghost danger', 'Delete controller')}
      </div>
      <div class="soft" style="font-size:11px;margin-top:3px">${esc(b.note)}</div>
      <div class="banks">`;
    b.banks.forEach(bk => {
      const br = R.banks.get(c.id + ':' + bk.id);
