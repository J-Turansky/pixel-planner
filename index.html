      if (drag) {
        const dx = (ev.clientX - drag.sx) / U.cam.k, dy = (ev.clientY - drag.sy) / U.cam.k;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        drag.d.x = Math.round((drag.ox + dx) / 10) * 10; drag.d.y = Math.round((drag.oy + dy) / 10) * 10;
        drag.g.setAttribute('transform', `translate(${drag.d.x},${drag.d.y})`);
        U.$('#feeds').style.display = 'none';
      } else if (pan) {
        U.cam.x = pan.ox + ev.clientX - pan.sx; U.cam.y = pan.oy + ev.clientY - pan.sy;
        if (Math.abs(ev.clientX - pan.sx) + Math.abs(ev.clientY - pan.sy) > 3) pan.moved = true;
        applyCam();
      }
    });
    const end = ev => {
      if (drag) {
        const dr = drag; drag = null;
        if (dr.moved) S.commitFrom(dr.before, 'moveDistro'); else S.select(dr.d.id);
        const f = U.$('#feeds'); if (f) f.style.display = '';
      }
      if (pan) { if (!pan.moved) S.select(null); pan = null; svg.classList.remove('panning'); }
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('click', ev => {
      const plus = ev.target.closest('[data-plus]');
      if (plus) { S.select(plus.dataset.plus); return; }
      const el = ev.target.closest('[data-id]'); if (!el || el.closest('[data-drag-distro]')) return;
      S.select(el.dataset.id);
    });
  };
})();

</script>
<script>
// Wiring guide: printable step-by-step build sheet, bill of materials and channel map.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc, S = PP.store;
  const esc = U.esc;
  const G = PP.guide = {};

  const THEME_VARS = ['--cp-bg', '--cp-bg-elevated', '--cp-surface', '--cp-surface-soft', '--cp-border', '--cp-border-strong', '--cp-text', '--cp-text-muted', '--cp-text-soft', '--cp-accent', '--cp-accent-soft', '--cp-success', '--cp-warning', '--cp-danger', '--cp-link', '--cp-highlight'];
  // Printed guides always use the light palette.
  const LIGHT = '--cp-bg:#f7f4ef;--cp-bg-elevated:#fcfbf8;--cp-surface:#ffffff;--cp-surface-soft:#f5f5f5;--cp-border:#dedede;--cp-border-strong:#919191;--cp-text:#242424;--cp-text-muted:#5c5c5c;--cp-text-soft:#6f6f6f;--cp-accent:#b11f4b;--cp-success:#16a34a;--cp-danger:#dc2626;--cp-warning:#b45309;--cp-link:#0078d4;';
  const themeCss = () => {
    const cs = getComputedStyle(document.documentElement);
    return ':root{' + THEME_VARS.map(v => `${v}:${cs.getPropertyValue(v).trim()};`).join('') + '}';
  };

  // ---------- bill of materials ----------
  G.bom = (p, R, scope) => {
    const ds = PP.hw ? PP.hw.scopeDistros(p, scope) : null;
    const rows = [];
    const add = (group, item, qty, unit = '', note = '') => {
      const r = rows.find(x => x.group === group && x.item === item && x.note === note);
      if (r) r.qty += qty; else rows.push({ group, item, qty, unit, note });
    };
    p.distros.filter(d => !ds || ds.has(d.id)).forEach(d => {
      add('Enclosures', (C.distroSizes.find(s => s.id === d.size) || {}).name || d.size, 1, 'pcs', d.name);
      d.psus.forEach(s => add('Power supplies', s.model === 'custom' ? `Custom ${s.customV} V ${s.customA} A PSU` : `Mean Well ${s.model}`, 1, 'pcs'));
      d.controllers.forEach(c => {
        const b = C.boards[c.board];
        add('Controllers', b.name, 1, 'pcs');
        add('Cable', `${C.wireById(c.feed.gauge).label} power (PSU → board)`, c.feed.length * b.banks.filter(bk => c.banks[bk.id]).length * 2, 'm', 'red + black');
        c.ports.forEach(pt => {
          const r = R.ports.get(pt.id);
          if (!pt.chain.length) return;
          if (b.fuseA) add('Fuses', `${K.recommendFuse(Math.max(r.portA, 0.1))} A mini blade (port)`, 1, 'pcs', `board ships with ${b.fuseA} A`);
          pt.chain.forEach(it => {
            if (it.kind === 'cable') { add('Cable', `${C.wireById(it.gauge).label} 3-core pixel extension`, +it.length || 0, 'm'); add('Connectors', '3-pin pixel pigtail pair', 1, 'pairs'); }
            else if (it.kind === 'pixels') {
              const t = M.pixelType(p, it.typeId);
              add('Pixels', t ? t.name : it.typeId, +it.count || 0, t && t.cat === 'flood' ? 'pcs' : 'px');
              add('Connectors', '3-pin pixel pigtail pair', 1, 'pairs');
            } else if (it.kind === 'inject') {
              const ir = r.items.get(it.id) || {};
              add('Cable', `${C.wireById(it.gauge).label} 2-core power (injection)`, +it.length || 0, 'm');
              add('Fuses', `${K.recommendFuse(Math.max(ir.sourceA || 0, 0.1))} A inline blade (injection)`, 1, 'pcs');
              add('Connectors', 'Injection T / 3-pin splice', 1, 'pcs');
            }
          });
        });
      });
    });
    if (PP.hw && R.hw) PP.hw.bomRows(p, R, scope, add);
    rows.forEach(r => { if (r.unit === 'm') r.qty = Math.ceil(r.qty * 10) / 10; });
    const order = ['Controller boxes', 'Enclosures', 'Controllers', 'Power supplies', 'Computers', 'Network', 'Audio', 'Pixels', 'Cable', 'Cables (room)', 'Fuses', 'Connectors', 'Sensors and buttons', 'Outputs and actuators', 'Effects and fixtures', 'Other hardware'];
    return rows.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group) || a.item.localeCompare(b.item));
  };

  const csv = rows => rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  G.csvBom = (p, R, scope) => csv([['Group', 'Item', 'Qty', 'Unit', 'Note'], ...G.bom(p, R, scope).map(r => [r.group, r.item, U.num(r.qty, 1), r.unit, r.note])]);
  G.csvChannels = (p, R) => {
    const rows = [['Controller', 'IP', 'Port', 'Label', 'Pixels', 'Channels', 'Start channel', 'End channel', 'Universes', 'Brightness %']];
    p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      const r = R.ports.get(pt.id); if (!r.channels) return;
      rows.push([c.name, c.ip, pt.num, pt.label, r.pixels, r.channels, r.startCh, r.startCh + r.channels - 1, r.universes, Math.round(p.settings.brightness * pt.brightness / 100)]);
    })));
    return csv(rows);
  };

  // ---------- per-port steps ----------
  function portSteps(p, R, d, c, pt) {
    const r = R.ports.get(pt.id), b = C.boards[c.board];
    const steps = [];
    let pxCount = 0, dist = 0;
    const bright = Math.round(p.settings.brightness * pt.brightness / 100);
    steps.push(`Set port ${pt.num} to <b>${r.pixels} pixels</b>${bright < 100 ? `, brightness <b>${bright}%</b>` : ''} in the Baldrick web UI (or let xLights/FPP upload it).`);
    if (b.fuseA) steps.push(pt.portPower ? `Port fuse: draws <b>${K.fmtA(r.portA)}</b> → fit a <b>${K.recommendFuse(Math.max(r.portA, 0.1))} A</b> blade (max ${b.fuseA} A on this board).` : `Port power is <b>off</b>: remove the port ${pt.num} fuse so only data and ground leave the board.`);
    pt.chain.forEach(it => {
      const ir = r.items.get(it.id) || {};
      if (it.kind === 'cable') {
        dist += +it.length || 0;
        steps.push(`Run <b>${it.length} m of ${C.wireById(it.gauge).label}</b> 3-core extension${it.label ? ' (' + esc(it.label) + ')' : ''}. Arrives at <b>${K.fmtV(ir.vOut)}</b>, carrying ${K.fmtA(ir.maxA)}.`);
      } else if (it.kind === 'pixels') {
        const t = M.pixelType(p, it.typeId);
        const n = +it.count || 0;
        steps.push(`Connect <b>${n} × ${esc(t ? t.name : it.typeId)}</b>${it.label ? ' (' + esc(it.label) + ')' : ''}${it.continued ? ' — rest of the same string' : ''}: pixels ${pxCount + 1}–${pxCount + n} on this port, ${it.spacing} m apart. ${ir.unpowered ? '<span class="err">No power reaches these pixels.</span>' : `Lowest voltage <b class="${U.vClass(ir.minPct)}">${K.fmtV(ir.minV)}</b> (${U.num(ir.minPct, 0)}%).`}`);
        pxCount += n; dist += n * (+it.spacing || 0);
      } else if (it.kind === 'inject') {
        const ps = it.psuId ? (R.psus.get(it.psuId) || {}).psu : null;
        const a = ir.sourceA || 0;
        const where = it.label || (pxCount ? `after pixel ${pxCount}` : 'here');
        steps.push(`<b>Inject power</b> ${esc(where)} (about ${U.num(dist, 1)} m along the run): run <b>${it.length} m of ${C.wireById(it.gauge).label}</b> red/black from <b>${ps ? esc(ps.name) : '<span class="err">no PSU</span>'}</b>, <b>${K.recommendFuse(Math.max(a, 0.1))} A</b> inline fuse at the PSU end. Carries ${K.fmtA(a)}. Join +V and GND only${it.isolate ? '; <b>cut the +V wire</b> coming from the previous section so the supplies are not joined' : ''}. Data passes straight through.`);
      }
    });
    return steps;
  }

  // ---------- full document ----------
  G.build = (p, R, scope) => {
    const st = p.settings, T = R.totals;
    const ds = PP.hw ? PP.hw.scopeDistros(p, scope) : new Set(p.distros.map(d => d.id));
    const inScope = d => ds.has(d.id);
    const scopeName = !scope ? '' : scope.room ? (p.rooms.find(r => r.id === scope.room) || {}).name : (p.distros.find(d => d.id === scope.distro) || {}).name;
    const date = new Date().toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    let h = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(p.name)} — wiring guide</title><style>${themeCss()}
      body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--cp-surface);color:var(--cp-text);margin:24px;font-size:13px;line-height:1.45}
      h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--cp-border)}h3{font-size:14px;margin:16px 0 4px}
      .muted{color:var(--cp-text-muted)}.soft{color:var(--cp-text-soft)}.ok{color:var(--cp-success)}.warn{color:var(--cp-warning)}.err,.error{color:var(--cp-danger)}
      table{border-collapse:collapse;width:100%;margin:6px 0}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--cp-border);vertical-align:top}th{color:var(--cp-text-muted);font-weight:600;font-size:12px}
      ol{margin:4px 0 8px 18px;padding:0}li{margin:3px 0}.card{border:1px solid var(--cp-border);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--cp-bg-elevated);break-inside:avoid}
      .kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{border:1px solid var(--cp-border);border-radius:10px;padding:6px 12px;min-width:110px}.kpi b{display:block;font-size:17px}.kpi span{font-size:11px;color:var(--cp-text-muted)}
      .mono{font-family:Consolas,"Courier New",monospace;font-size:12px;word-break:break-all;color:var(--cp-link)}.tick{display:inline-block;width:12px;height:12px;border:1.5px solid var(--cp-border-strong);border-radius:3px;margin-right:6px;vertical-align:-2px}
      a{color:var(--cp-link)}.assume{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:6px 0}.assume dt{font-weight:600}.assume dd{margin:0}
      @media print{:root{${LIGHT}}body{margin:10mm;background:#fff}h2{break-after:avoid}.card{break-inside:avoid}a{text-decoration:none}}
    </style></head><body>`;
    h += `<h1>${esc(p.name)} — wiring guide${scopeName ? ' · ' + esc(scopeName) : ''}</h1><div class="muted">${esc(PP.APP_NAME)} ${esc(PP.APP_VERSION)} · ${esc(date)} · global brightness ${st.brightness}%</div>`;
    if (p.notes) h += `<p>${esc(p.notes).replace(/\n/g, '<br>')}</p>`;
    h += `<div class="kpis" style="margin-top:12px">
      <div class="kpi"><b>${T.pixels}</b><span>pixels</span></div><div class="kpi"><b>${T.channels}</b><span>channels · ${T.universes} universes</span></div>
      <div class="kpi"><b>${K.fmtW(T.dcW)}</b><span>DC at full white</span></div><div class="kpi"><b>${U.num(T.mainsA, 1)} A</b><span>mains at ${st.mainsV} V</span></div>
      <div class="kpi"><b>${K.fmtA(T.psuA)} / ${U.num(T.psuCapA, 0)} A</b><span>PSU load</span></div><div class="kpi"><b>${esc(st.currency)}${U.num(T.cost, 2)}</b><span>season cost (${st.typicalPct}% typical)</span></div></div>`;
    const errs = R.warnings.filter(w => w.level !== 'info');
    if (errs.length) h += `<h2>Check before you build (${errs.length})</h2><ul>${errs.map(w => `<li class="${w.level}">${esc(w.msg)}</li>`).join('')}</ul>`;
    if (R.assumptions && R.assumptions.length) h += `<h2>Assumptions</h2><dl class="assume">${R.assumptions.map(a => `<dt>${esc(a.k)}</dt><dd>${esc(a.v)}</dd>`).join('')}</dl>`;

    // Network
    h += `<h2>Network</h2><table><tr><th>Controller</th><th>Board</th><th>Distro</th><th>IP</th><th>Pixels</th><th>Channels</th></tr>`;
    p.distros.filter(inScope).forEach(d => d.controllers.forEach(c => { const CR = R.controllers.get(c.id); h += `<tr><td>${esc(c.name)}</td><td>${esc(C.boards[c.board].name)}</td><td>${esc(d.name)}</td><td class="mono">${esc(c.ip || '—')}</td><td>${CR.pixels}</td><td>${CR.channels}</td></tr>`; }));
    h += `</table><p class="muted">FPP on the Pi (${esc(st.fppIp)}) sends E1.31/DDP over ethernet to each Baldrick. Give every board a fixed IP, set the same IPs in xLights controller setup (vendor ILightThat), and upload the output config from xLights. GS8208 pixels need FPP “Always Transmit Channel Data”.</p>`;

    // Per distro
    p.distros.filter(inScope).forEach(d => {
      const D = R.distros.get(d.id);
      h += `<h2>${esc(d.name)}</h2><div class="muted">${esc((C.distroSizes.find(s => s.id === d.size) || {}).name || '')} · ${K.fmtW(D.dcW)} DC · ${U.num(D.mainsA, 2)} A mains${D.relayW ? ` (incl. ${K.fmtW(D.relayW)} switched by relays)` : ''}</div>`;
      if (d.notes) h += `<p>${esc(d.notes).replace(/\n/g, '<br>')}</p>`;
      const HX = R.hw && R.hw.caps.get(d.id), box = d.boxTpl && PP.hw.box(p, d.boxTpl);
      if (box) h += `<p><b>Controller box:</b> ${esc(box.name)} (${box.w}×${box.h}×${box.d} cm). Contents: ${box.items.map(i => { const c = PP.hw.comp(p, i.comp); return c ? esc((i.label ? i.label + ' · ' : '') + c.name) : ''; }).filter(Boolean).join(', ')}.</p>`;
      if (HX) { const rows = PP.hw.capRows(HX.caps); if (rows.length) h += `<h3>Capacity</h3><table><tr><th>Resource</th><th>Used</th><th>Available</th></tr>${rows.map(c => `<tr><td>${esc(c.name)}</td><td class="${c.state}">${Math.round(c.used).toLocaleString()}</td><td>${c.cap.toLocaleString()}${c.unit ? ' ' + esc(c.unit) : ''}${c.cap < c.max ? ' <span class="soft">(your limit; hardware ' + c.max.toLocaleString() + ')</span>' : ''}</td></tr>`).join('')}</table>`; }
      h += `<h3>Power supplies</h3><table><tr><th>PSU</th><th>Model</th><th>Set output to</th><th>Load</th><th>Feeds</th></tr>`;
      d.psus.forEach(s => {
        const r = R.psus.get(s.id);
        h += `<tr><td><span class="tick"></span>${esc(s.name)}</td><td>${esc(s.model === 'custom' ? `Custom ${s.customV} V ${s.customA} A` : s.model)}<div class="soft">${esc(r.spec.ip)}</div></td><td><b>${s.vout} V</b> (trim pot)</td>
          <td class="${U.pctClass(r.pct, st.psuTargetPct)}">${K.fmtA(r.amps)} of ${r.spec.a} A (${U.num(r.pct, 0)}%)</td><td>${r.loads.map(l => esc(l.label) + ': ' + K.fmtA(l.amps)).join('<br>')}</td></tr>`;
      });
      h += `</table><p class="muted">Mains in: L, N and earth to every PSU; earth the enclosure and PSU cases. Set each PSU's voltage with a meter before connecting any pixels.</p>`;
      d.controllers.forEach(c => {
        const b = C.boards[c.board];
        h += `<div class="card"><h3 style="margin-top:0">${esc(c.name)} — ${esc(b.name)}${c.ip ? ` <span class="mono">${esc(c.ip)}</span>` : ''}</h3><div class="soft">${esc(b.note)}</div>`;
        h += `<h3>Power in</h3><ol>`;
        b.banks.forEach(bk => {
          const ps = c.banks[bk.id] ? (R.psus.get(c.banks[bk.id]) || {}).psu : null;
          const br = R.banks.get(c.id + ':' + bk.id);
          h += `<li><span class="tick"></span>${esc(bk.label)}${bk.ports.length ? ` (ports ${bk.ports.join(', ')})` : ''}: ${ps ? `<b>${esc(ps.name)}</b> V+ and V− with ${c.feed.length} m of <b>${C.wireById(c.feed.gauge).label}</b>` : '<span class="err">no PSU</span>'}${br && br.amps ? ` — ${K.fmtA(br.amps)}` : ''}</li>`;
        });
        h += `</ol>`;
        c.ports.filter(pt => pt.chain.length).forEach(pt => {
          const r = R.ports.get(pt.id);
          h += `<h3>Port ${pt.num}${pt.label ? ' — ' + esc(pt.label) : ''} <span class="soft" style="font-weight:400">${r.pixels} px · ch ${r.startCh}–${r.startCh + r.channels - 1} · min ${K.fmtV(r.minV)}</span></h3><ol>${portSteps(p, R, d, c, pt).map(s => `<li><span class="tick"></span>${s}</li>`).join('')}</ol>`;
        });
        if (c.relays.some(r => r.name || r.amps)) {
          h += `<h3>Relays</h3><table><tr><th>Relay</th><th>Switches</th><th>Load</th></tr>${c.relays.filter(r => r.name || r.amps).map(r => `<tr><td>${r.num}</td><td>${esc(r.name)}</td><td class="${r.amps > b.relayMaxA ? 'err' : ''}">${r.amps} A at ${r.volts} V</td></tr>`).join('')}</table><p class="muted">Relay contacts are rated ${b.relayMaxA} A / ${b.relayMaxV} V. Mains wiring must be done by a competent person, in a suitable enclosure, on an RCD-protected circuit.</p>`;
        }
        const ins = c.inputs.filter(r => r.action && r.action !== 'none');
        if (ins.length) {
          h += `<h3>Inputs (Turniputs)</h3><table><tr><th>Input</th><th>Device</th><th>Does</th><th>URL / setting</th></tr>${ins.map(r => `<tr><td>${r.num} ${esc(r.name)}</td><td>${esc(r.device)}</td><td>${esc((C.inputActions.find(a => a.id === r.action) || {}).name || '')}${r.param ? ': ' + esc(r.param) : ''}</td><td class="mono">${esc(PP.form.inputUrl(p, r))}</td></tr>`).join('')}</table>`;
        }
        h += `</div>`;
      });
    });

    // BOM
    h += `<h2>Bill of materials</h2><table><tr><th>Group</th><th>Item</th><th>Qty</th><th>Note</th></tr>`;
    G.bom(p, R, scope).forEach(r => { h += `<tr><td>${esc(r.group)}</td><td>${esc(r.item)}</td><td>${U.num(r.qty, 1)} ${esc(r.unit)}</td><td class="soft">${esc(r.note)}</td></tr>`; });
    h += `</table><p class="muted">Add 10–15% to cable lengths for routing and drip loops. Pixel string wire is included in the strings.</p>`;

    // Cable schedule (room layouts)
    const sched = PP.hw && R.hw ? PP.hw.cableSchedule(p, R, scope) : [];
    if (sched.length) {
      h += `<h2>Cable schedule</h2><table><tr><th></th>${p.rooms.length > 1 ? '<th>Room</th>' : ''}<th>From</th><th>To</th><th>Type</th><th>Route</th><th>Needs</th><th>Cable</th><th>Spare</th></tr>`;
      sched.forEach(r => { h += `<tr><td><span class="tick"></span>${r.colour ? `<span style="display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--cp-border-strong);background:${esc(r.colour)}"></span>` : ''}</td>${p.rooms.length > 1 ? `<td>${esc(r.room)}</td>` : ''}<td>${esc(r.from)}</td><td>${esc(r.to)}${r.label ? `<div class="soft">${esc(r.label)}</div>` : ''}</td><td>${esc(r.type)}</td><td>${esc(PP.hw.fmtM(r.route))}${r.pivots ? `<div class="soft">${r.pivots} bend${r.pivots > 1 ? 's' : ''}</div>` : ''}</td><td>${esc(PP.hw.fmtM(r.req))}</td><td>${esc(r.cable)}</td><td class="${r.short ? 'err' : ''}">${r.spare == null ? '-' : r.short ? esc(PP.hw.fmtM(-r.spare)) + ' short' : esc(PP.hw.fmtM(r.spare))}</td></tr>`; });
      h += `</table><p class="muted">Lengths are measured edge to edge along the routed path in the room layout, plus slack. Colours are your cable standards.</p>`;
    }

    // Sources: manuals and datasheets for the hardware in scope.
    const boards = new Set(), series = new Map();
    p.distros.filter(inScope).forEach(d => { d.controllers.forEach(c => boards.add(c.board)); d.psus.forEach(s => { if (s.model !== 'custom' && C.psuById(s.model)) series.set(C.psuSeries(s.model), s.model); }); });
    if (boards.size || series.size) {
      h += '<h2>Sources and datasheets</h2><table><tr><th>Hardware</th><th>Document</th></tr>';
      boards.forEach(k => { const u = C.boardUrl(k); h += `<tr><td>${esc(C.boards[k].name)}</td><td><a href="${esc(u)}" target="_blank" rel="noopener">Baldrick manual</a> <span class="mono">${esc(u)}</span></td></tr>`; });
      series.forEach((id, s) => { const u = C.psuUrl(id); h += `<tr><td>Mean Well ${esc(s)} series</td><td><a href="${esc(u)}" target="_blank" rel="noopener">Datasheet (PDF)</a> <span class="mono">${esc(u)}</span></td></tr>`; });
      h += '</table><p class="muted">Check ratings against the current documents before you build; manufacturers revise them.</p>';
    }

    // Channel map
    h += `<h2>Channel map</h2><table><tr><th>Controller</th><th>Port</th><th>Label</th><th>Pixels</th><th>Start</th><th>End</th><th>Universes</th></tr>`;
    p.distros.filter(inScope).forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      const r = R.ports.get(pt.id); if (!r.channels) return;
      h += `<tr><td>${esc(c.name)}</td><td>${pt.num}</td><td>${esc(pt.label)}</td><td>${r.pixels}</td><td>${r.startCh}</td><td>${r.startCh + r.channels - 1}</td><td>${r.universes}</td></tr>`;
    })));
    h += `</table><p class="soft">Voltages are estimates from wire resistance and pixel full-white draw at ${st.brightness}% brightness. Always check with a meter at full white before the show.</p></body></html>`;
    return h;
  };

  let scopeKey = '';
  const parseScope = (p, k) => {
    if (!k) return null;
    const [t, id] = k.split(':');
    if (t === 'room' && p.rooms.some(r => r.id === id)) return { room: id };
    if (t === 'distro' && p.distros.some(d => d.id === id)) return { distro: id };
    return null;
  };
  G.open = (o = {}) => {
    const p = S.project, R = U.lastR || K.run(p);
    let scope = parseScope(p, scopeKey); if (!scope) scopeKey = '';
    let html = G.build(p, R, scope);
    const d = U.$('#guideDlg');
    const opts = U.opt('', 'Whole project', scopeKey) +
      (p.rooms.some(r => r.nodes.length) ? `<optgroup label="Room">${p.rooms.map(r => U.opt('room:' + r.id, r.name, scopeKey)).join('')}</optgroup>` : '') +
      `<optgroup label="Distro / box">${p.distros.map(x => U.opt('distro:' + x.id, x.name, scopeKey)).join('')}</optgroup>`;
    d.innerHTML = `<div class="dlg-head"><b>Wiring guide</b><select id="guideScope" aria-label="What to include" title="Build the guide and bill of materials for the whole project, one room or one box">${opts}</select><span class="grow"></span>
      <button data-g="print" class="primary">Print / PDF</button><button data-g="html">Download HTML</button><button data-g="bom">BOM CSV</button><button data-g="ch">Channel map CSV</button><button class="ib" data-g="close" aria-label="Close">${U.ic('x')}</button></div>
      <div class="dlg-body"><iframe id="guideFrame" title="Wiring guide"></iframe></div>`;
    const f = U.$('#guideFrame', d);
    f.srcdoc = html;
    if (o.print) f.addEventListener('load', () => f.contentWindow.print(), { once: true });
    U.$('#guideScope', d).onchange = ev => { scopeKey = ev.target.value; scope = parseScope(p, scopeKey); html = G.build(p, R, scope); f.srcdoc = html; };
    d.onclick = ev => {
      const b = ev.target.closest('[data-g]'); if (!b) return;
      const base = U.slug(p.name) + (scopeKey ? '-' + U.slug(U.$('#guideScope', d).selectedOptions[0].textContent) : '');
      if (b.dataset.g === 'print') f.contentWindow.print();
      else if (b.dataset.g === 'html') U.download(base + '-wiring-guide.html', html, 'text/html');
      else if (b.dataset.g === 'bom') U.download(base + '-bom.csv', G.csvBom(p, R, scope), 'text/csv');
      else if (b.dataset.g === 'ch') U.download(base + '-channels.csv', G.csvChannels(p, R), 'text/csv');
      else if (b.dataset.g === 'close') d.close();
    };
    d.showModal();
  };
})();

</script>
<script>
// Help dialog: How to use, How it calculates, What's new, About.
(function () {
  const U = PP.ui, esc = U.esc;
  const H = PP.help = {};
  const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : s; };

  const pages = {
    use: () => `
      <h3>The idea</h3>
      <p>Build your show as <b>distros</b> (weatherproof boxes). Each distro holds Mean Well <b>PSUs</b> and Baldrick <b>boards</b>. Each board port drives a <b>run</b>: a chain of cables, pixel strings or floods and power injection points, in the order they are wired, for example <i>port → 5 m 18 AWG → 100 seeds → 100 seeds → injection → 4 × 10 W floods</i>.</p>
      <p>Every change is recalculated straight away. Pixel colours show the voltage each pixel gets at your brightness: <span class="ok">green</span> fine, <span class="warn">amber</span> low (colour shift), <span class="err">red</span> too low, grey no power.</p>
      <h3>Getting around</h3>
      <p>The sidebar has the main tasks: <b>Wiring workspace</b> (build runs), <b>Hardware &amp; power</b> (every PSU and distro with datasheets, plus project settings), <b>Pixel presets</b>, the <b>Wiring guide</b> and <b>Plan checks</b>. On a phone the same sections are tabs along the bottom; Help is in the File menu. The sun or moon button switches light and dark.</p>
      <h3>Views in the workspace</h3>
      <ul>
        <li><b>Form</b>: every distro, PSU, board and port as fields. Ports fold open to show their run.</li>
        <li><b>Visual</b>: a wiring diagram. Drag presets, cables and injections from the left onto a port (the pad on the right of a board), onto a string to insert after it, or onto the <b>+</b> at the end of a run. Drop PSUs and boards onto a distro. Drag a distro by its title bar. Scroll to zoom, drag the background to pan. The panel on the right edits whatever you click. On a phone, drag with one finger to pan and use + and − to zoom.</li>
        <li><b>Split</b>: both at once. Clicking in one highlights the same thing in the other.</li>
        <li><b>Room</b>: a real-scale layout of where things go. See below.</li>
      </ul>
      <h3>Room layouts and cables</h3>
      <ul>
        <li>Set the room's width, depth and grid in the panel on the right (click the empty floor). Everything is in metres. Add more rooms or areas with <b>+ Room</b>.</li>
        <li>Drag <b>controller boxes</b>, distros, <b>pixel runs</b> (linked to a port, so their pixels count), and sensors, buttons, actuators or effects in from the left.</li>
        <li>To connect two things, hover one and drag from the small circle on its right edge onto the other. The cable type is picked from the connectors both ends have; change it in the panel.</li>
        <li>Select a cable to route it: drag a <b>+</b> to add a pivot, drag pivots to go around paths and doors, double-click a pivot to remove it. Drag a square end onto another item to move that end. Hold <span class="kbd">Alt</span> to place off the grid; pivots line up with their neighbours so runs stay square.</li>
        <li>Select an item and press <span class="kbd">R</span> to rotate it 90° (<span class="kbd">Shift+R</span> the other way), or use the arrow keys to nudge it one grid step (<span class="kbd">Shift</span> for 1 m). The panel also sets any angle and a colour of your own.</li>
        <li>Pick a <b>cable standard</b> for each cable (or type a custom length). A standard that is too short turns the cable red with the shortfall shown. <b>Fit cables</b> gives every cable the shortest standard that fits.</li>
        <li><b>Flow</b> animates cable direction, <b>Lengths</b> shows every length (selected and short cables always do), and <b>Cables</b> hides types you are not working on.</li>
      </ul>
      <h3>Controller boxes and the library</h3>
      <ul>
        <li><b>Box builder</b> lays out a box at real size in centimetres. Drag parts in, drag to move (0.5 cm snap), set a label and your own <b>operating limits</b> (for example 3,200 pixels on a Baldrick8 rated 6,000). Overlaps and parts sticking out are highlighted.</li>
        <li><b>Save to library</b> keeps the box for every project. <b>Place in room</b> creates a distro with the box's PSUs and boards, ready to wire in the Form. Double-click a placed box to see inside it.</li>
        <li>The <b>Library</b> holds cable standards (name, type, length, colour, tag, connector), components and boxes. Edit a built-in component to change its size, connectors or capacity, or add your own. Export it to move it to another computer.</li>
      </ul>
      <h3>Typical workflow</h3>
      <ol>
        <li>Set brightness next to the views, and your limits under <b>Hardware &amp; power → Project settings</b>.</li>
        <li>Add a distro, pick its size, add PSUs, add a board, and pick which PSU feeds each power input (bank).</li>
        <li>Build each port's run with presets. Use <b>Pixel presets</b> to match your pixels' real wattage, spacing and string wire, or to add presets like “100 seed string”; <b>Add to chain</b> puts one on the selected port.</li>
        <li>Press <b>Auto-inject</b> on a port (or <b>Auto-inject all</b>) to add injection points until every pixel is in the green, then <b>Balance PSUs</b> to spread the load.</li>
        <li>Open <b>Plan checks</b> and clear the errors, starting with the one it says to fix first (click one to jump to it). Check the assumptions listed there match your hardware.</li>
        <li>Open the <b>Wiring guide</b> to print a build sheet with PSU trim voltages, fuses, injection feeds, Turniput URLs, bill of materials, datasheet links and channel map.</li>
      </ol>
      <h3>Suggest a feature</h3>
      <p>Use <b>Suggest a feature</b> in the sidebar (File menu on a phone) to send an idea. It opens a short form on GitHub, where a free account is needed; your project is never sent. Suggestions are reviewed automatically and suitable ones are built into the next version, usually within a day, with a reply on your request saying what happened. See all requests at <a href="https://github.com/J-Turansky/pixel-planner/issues" target="_blank" rel="noopener">github.com/J-Turansky/pixel-planner/issues</a>.</p>
      <h3>Files</h3>
      <p>Your work autosaves in this browser. Use <b>Save</b> to keep a <span class="kbd">.pixelplan.json</span> file you can back up or send to someone with this app. The file includes the room layouts and a copy of the boxes, parts and cable standards it uses. Shortcuts: <span class="kbd">Ctrl+S</span> save, <span class="kbd">Ctrl+O</span> open, <span class="kbd">Ctrl+Z</span> undo, <span class="kbd">Ctrl+Y</span> redo, <span class="kbd">Ctrl+P</span> print the wiring guide, <span class="kbd">Delete</span> removes the selected run item, or the selected item or cable in a room.</p>`,
    calc: () => `
      <h3>Voltage drop</h3>
      <p>Each port is modelled as a ladder of wire resistances. Every pixel is a load that draws its full-white watts × brightness ÷ voltage. The +V and GND wires both count (round-trip resistance). The solver finds the voltage at every single pixel, including current shared between the port and any injection points, and the current in every wire.</p>
      <p>Wire resistance uses copper at 20 °C: 22 AWG 52.9, 20 AWG 33.3, 18 AWG 21, 16 AWG 13.2, 14 AWG 8.3, 12 AWG 5.2, 10 AWG 3.3 mΩ per metre per conductor. Wire current limits are deliberately conservative for bundled outdoor cable.</p>
      <h3>Power injection</h3>
      <p>An injection point is a feed from a PSU with its own length and gauge. If <b>isolate +V</b> is ticked the +V between the previous section and this one is cut (needed when the feed comes from a different PSU); ground is always shared. <b>Auto-inject</b> places the fewest points it can, furthest along the run first, choosing a gauge from your default upwards, and sizes each feed to the thinnest wire that is rated for its current.</p>
      <h3>Checks</h3>
      <p>PSU load against your target (default 80% continuous), PSU trim range, Baldrick fuse per port (7.5 A), power bank limits, board input voltage, wire ampacity, channel limit per port (2,250 ch = 750 RGB pixels at 40 fps), data gaps over ${esc(PP.store.project ? PP.store.project.settings.dataWarnM : 5)} m, relay ratings, enclosure slots and mains current per distro against your circuit.</p>
      <h3>Assumptions</h3>
      <p>Plan checks and the wiring guide list every assumption behind the numbers: pixel draw per type at your brightness, wire gauge and resistance, PSU target and efficiency, mains voltage and circuit, data length limit, room cable slack and running cost inputs. If one is wrong for your hardware, change it in Pixel presets or Hardware &amp; power.</p>
      <h3>Mains and cost</h3>
      <p>Mains amps = DC watts ÷ PSU efficiency ÷ mains voltage, plus relay loads. Running cost uses the “typical show load” percentage, hours per night and nights per season.</p>
      <h3>Room cable lengths</h3>
      <p>Room positions are in metres. A cable runs from the edge of one item, through its pivots in order, to the edge of the other; its <b>required length</b> is that path plus slack (the cable's own slack, or the room default). The <b>physical length</b> is the chosen standard, else the custom length, else the run's lead cable from the Form for a pixel run on the same distro. Spare = physical − required; below zero is an error, because a cable can't stretch.</p>
      <h3>Box capacity</h3>
      <p>A box's capacity for each resource (pixel outputs, pixels, inputs, relays, DMX channels, Ethernet ports, USB ports, audio and amp channels, video, mains outlets, PSU watts) is the sum of what its parts provide, using your operating limit where you set one. <b>Used</b> = what parts in the box use themselves (for example each board uses a switch port) + ports with pixels and their pixel count from the Form + PSU load in watts + devices cabled to the box in rooms. For inputs and relays, a Turniput named in the Form and a button cabled in a room are the same connection, so the larger of the two counts. A pixel prop linked to a port on that box is not counted twice. Over 100% is an error and 85% or more is a warning.</p>
      <h3>Compatibility</h3>
      <p>Every part lists its connectors. A cable's type must exist at both ends; if not it is drawn dashed and flagged. A cable that uses a resource (for example a button uses one input) needs something at one end that provides it.</p>
      <p class="soft">These are planning estimates. Pixel wattage varies a lot between suppliers; measure a string at full white and put the real figure in the Library. Always check voltages with a meter before the show.</p>`,
    news: () => PP.CHANGELOG.map(c => `<div class="cl-ver">${esc(c.version)} <span class="soft" style="font-weight:400">${esc(dmy(c.date))}</span></div><ul>${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join(''),
    about: () => `
      <p><b>${esc(PP.APP_NAME)}</b> version ${esc(PP.APP_VERSION)}${PP.BUILT ? ` <span class="soft">· last updated ${esc(PP.BUILT)}</span>` : ''}</p>
      <p>A planner for pixel shows on <a href="https://www.baldrickboard.com/" target="_blank" rel="noopener">Baldrick</a> controllers driven by FPP, with Mean Well power supplies.</p>
      <p>It is one self-contained HTML file: it runs offline in any modern browser, needs no install and sends nothing anywhere. Give someone the file (or the zip) and they can open it straight away. The latest version is also online at <a href="https://j-turansky.github.io/pixel-planner/" target="_blank" rel="noopener">j-turansky.github.io/pixel-planner</a>; projects are stored only in your browser and in files you save.</p>
      <p class="soft">Board figures come from baldrickboard.com; check the latest board documentation before building. Not affiliated with Baldrick or Mean Well.</p>`
  };
  const tabs = [['use', 'How to use'], ['calc', 'How it calculates'], ['news', "What's new"], ['about', 'About']];

  H.open = (tab = 'use') => {
    const d = U.$('#helpDlg');
    d.innerHTML = `<div class="dlg-head"><b>${esc(PP.APP_NAME)} <span class="soft" style="font-weight:400">v${esc(PP.APP_VERSION)}</span></b><span class="grow"></span>
      <div class="seg" role="tablist">${tabs.map(([k, l]) => `<button data-tab="${k}" role="tab" class="${k === tab ? 'on' : ''}" aria-selected="${k === tab}">${l}</button>`).join('')}</div>
      <button class="ib" data-close aria-label="Close">${U.ic('x')}</button></div><div class="dlg-body" id="helpBody">${pages[tab]()}</div>`;
    d.onclick = ev => {
      const t = ev.target.closest('[data-tab]');
      if (t) { H.open(t.dataset.tab); return; }
      if (ev.target.closest('[data-close]')) d.close();
    };
    if (!d.open) d.showModal();
  };
  // Feature requests become GitHub issues on the public site repo; an automation reviews and builds them.
  H.REPO = 'https://github.com/J-Turansky/pixel-planner';
  H.suggestUrl = f => {
    const cut = (s, n) => String(s || '').trim().slice(0, n);
    const q = new URLSearchParams({ template: 'feature-request.yml', labels: 'feature-request', title: 'Feature: ' + cut(f.title || f.what.split('\n')[0], 80), what: cut(f.what, 2500), why: cut(f.why, 1500), example: cut(f.example, 1500), version: PP.APP_VERSION });
    return H.REPO + '/issues/new?' + q.toString();
  };
  H.suggest = () => {
    const d = U.$('#suggestDlg');
    d.innerHTML = `<div class="dlg-head"><b>Suggest a feature</b><span class="grow"></span><button class="ib" data-close aria-label="Close">${U.ic('x')}</button></div>
      <form class="dlg-body sug" id="sugForm">
        <p class="soft">Ideas are reviewed automatically and suitable ones are built into the next version, usually within a day. It opens GitHub to send (a free account is needed); your project is not sent.</p>
        <label class="fl wide">Short title<input name="title" maxlength="80" placeholder="For example: cable totals per gauge"></label>
        <label class="fl wide">What would you like it to do? (required)<textarea name="what" rows="4" required placeholder="Describe the feature or change. One idea per request."></textarea></label>
        <label class="fl wide">Why would it help?<textarea name="why" rows="2" placeholder="What are you trying to do, and what gets in the way today?"></textarea></label>
        <label class="fl wide">Example<textarea name="example" rows="2" placeholder="Numbers, hardware or steps that show what you mean (optional)"></textarea></label>
      </form>
      <div class="dlg-foot"><a href="${H.REPO}/issues?q=label%3Afeature-request" target="_blank" rel="noopener">See existing requests</a><span class="grow"></span><button data-copy>Copy text</button><button class="primary" data-send>Continue on GitHub</button></div>`;
    const read = () => Object.fromEntries(new FormData(U.$('#sugForm', d)));
    d.onclick = ev => {
      if (ev.target.closest('[data-close]')) { d.close(); return; }
      if (ev.target.closest('[data-copy]')) { const f = read(); navigator.clipboard && navigator.clipboard.writeText(`${f.title}\n\nWhat: ${f.what}\nWhy: ${f.why}\nExample: ${f.example}\nVersion: ${PP.APP_VERSION}`).then(() => U.toast('Copied'), () => {}); return; }
      if (ev.target.closest('[data-send]')) {
        const form = U.$('#sugForm', d); if (!form.reportValidity()) return;
        window.open(H.suggestUrl(read()), '_blank', 'noopener'); d.close(); U.toast('Opened GitHub. Press Submit new issue there to send it.');
      }
    };
    if (!d.open) d.showModal();
    setTimeout(() => { const i = U.$('#sugForm [name=title]', d); if (i) i.focus(); }, 30);
  };
  H.badge = () => {
    const b = U.$('#verBadge');
    b.textContent = 'v' + PP.APP_VERSION;
    b.title = "What's new" + (PP.BUILT ? ' · last updated ' + PP.BUILT : '');
  };
})();

</script>
<script>
// Room view: real-scale room layouts. Controller boxes / distros, devices and pixel props placed in
// metres, joined by physical cables routed through draggable pivot points.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, S = PP.store, H = PP.hw;
  const esc = U.esc;
  const RM = PP.room = {};
  const PX = H.PX;
  U.rcam = { x: 40, y: 40, k: 1 };
  U.roomId = null;
  let drag = null, pan = null, lastTap = { key: '', t: 0 }, fitted = false;

  RM.current = (p) => {
    if (!p.rooms.length) p.rooms.push(M.newRoom('Room 1'));
    let r = p.rooms.find(x => x.id === U.roomId);
    if (!r) { r = p.rooms[0]; U.roomId = r.id; }
    return r;
  };
  const colourOf = (i) => (i.std && i.std.color) || i.type.color;
  const shapeFor = (cat, x, y, w, h) => {
    const cx = x + w / 2, cy = y + h / 2;
    switch (C.hwCat(cat).shape) {
      case 'circle': return `<ellipse cx="${cx}" cy="${cy}" rx="${w / 2}" ry="${h / 2}"/>`;
      case 'diamond': return `<polygon points="${cx},${y} ${x + w},${cy} ${cx},${y + h} ${x},${cy}"/>`;
      case 'hex': { const i = Math.min(w, h) * 0.28; return `<polygon points="${x + i},${y} ${x + w - i},${y} ${x + w},${cy} ${x + w - i},${y + h} ${x + i},${y + h} ${x},${cy}"/>`; }
      case 'round': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) * 0.35}"/>`;
      default: return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`;
    }
  };
  RM.shapeFor = shapeFor;

  // Capacity bars (shared by the room inspector, box builder and form).
  RM.capHtml = (caps, opts = {}) => {
    const rows = H.capRows(caps);
    if (!rows.length) return `<div class="muted small">${opts.empty || 'No capacity to track.'}</div>`;
    return `<div class="caps">${rows.map(c => {
      const pct = c.cap ? c.used / c.cap * 100 : (c.used ? 999 : 0);
      const lim = c.cap < c.max ? ` title="Your operating limit. The hardware allows ${c.max.toLocaleString()}${c.unit ? ' ' + c.unit : ''}."` : '';
      return `<div class="cap ${c.state}"><span class="cap-k">${esc(c.name)}</span><span class="cap-v"${lim}>${Math.round(c.used).toLocaleString()} / ${c.cap.toLocaleString()}${c.unit ? ' ' + c.unit : ''}${c.cap < c.max ? ' <span class="soft">limit</span>' : ''}</span><div class="bar ${c.state}"><i style="width:${Math.min(100, pct)}%"></i></div></div>`;
    }).join('')}</div>`;
  };

  // ---------- palette ----------
  RM.renderPalette = (p) => {
    const pal = (data, color, label, tip = 'Drag into the room') => `<div class="pal" draggable="true" data-rdrag='${esc(JSON.stringify(data))}' title="${esc(tip)}"><span class="sw hw" style="--c:${esc(color || '')}"></span>${esc(label)}</div>`;
    const placed = new Set(), linked = new Set();
    p.rooms.forEach(r => r.nodes.forEach(n => { if (n.kind === 'distro') placed.add(n.ref); if (n.portId) linked.add(n.portId); }));
    const sec = (key, title, body, openDef) => {
      const open = U.open.has('rp-' + key) || (openDef && !U.open.has('!rp-' + key));
      return body ? `<details class="rpal" data-open-id="rp-${key}"${open ? ' open' : ''}><summary>${esc(title)}</summary>${body}</details>` : '';
    };
    let h = '';
    h += sec('boxes', 'Controller boxes', H.boxes(p).map(b => pal({ t: 'box', id: b.id }, C.hwCat('controller').color, b.name, 'Drag in to add this box: it creates a distro with its PSUs and boards')).join(''), true);
    h += sec('distros', 'Distros not placed', p.distros.filter(d => !placed.has(d.id)).map(d => pal({ t: 'distro', id: d.id }, C.hwCat('controller').color, d.name, 'Place this distro in the room')).join(''), true);
    let runs = '';
    p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      if (linked.has(pt.id) || !pt.chain.some(it => it.kind === 'pixels')) return;
      runs += pal({ t: 'prop', portId: pt.id }, C.portType('pixel').color, `${c.name} P${pt.num}${pt.label ? ' ' + pt.label : ''}`, 'Place this pixel run in the room');
    })));
    runs += pal({ t: 'prop' }, C.portType('pixel').color, 'Pixel prop (not linked)', 'A pixel element with its own pixel count');
    h += sec('runs', 'Pixel runs', runs, true);
    const comps = H.comps(p);
    C.hwCats.forEach(cat => {
      const list = comps.filter(c => c.cat === cat.id);
      h += sec('c-' + cat.id, cat.name, list.map(c => pal({ t: 'comp', id: c.id }, cat.color, c.name, c.notes || 'Drag into the room')).join(''), cat.id === 'input' || cat.id === 'output');
    });
    U.$('#rpalette').innerHTML = h;
  };

  // ---------- toolbar ----------
  RM.renderTools = (p) => {
    const room = RM.current(p), st = p.settings;
    const tg = (k, label, tip) => `<button class="tg${st[k] ? ' on' : ''}" data-act="rToggle" data-id="${k}" title="${esc(tip)}" aria-pressed="${!!st[k]}">${label}</button>`;
    const hidden = new Set(st.roomHidden || []);
    const used = new Set(p.rooms.flatMap(r => r.cables.map(c => c.type)));
    U.$('#rtools').innerHTML =
      `<select id="roomSel" title="Room" aria-label="Room">${p.rooms.map(r => U.opt(r.id, r.name, room.id)).join('')}</select>
      <button data-act="rAddRoom" title="Add a room">+ Room</button>
      <button data-act="rFit" title="Fit the room in view">Fit</button>
      <button data-act="rZoomIn" aria-label="Zoom in">+</button><button data-act="rZoomOut" aria-label="Zoom out">−</button>
      ${tg('roomSnap', 'Snap', 'Snap to the room grid (hold Alt while dragging to place freely)')}
      ${tg('roomFlow', 'Flow', 'Animate the direction of each cable')}
      ${tg('roomLabels', 'Lengths', 'Show every cable length (selected and short cables always show)')}
      <details class="dd"><summary title="Show or hide cable types">Cables${hidden.size ? ` <span class="soft">(${hidden.size} hidden)</span>` : ''}</summary><div class="dd-menu">${C.portTypes.map(t => `<label class="${used.has(t.id) ? '' : 'soft'}"><input type="checkbox" data-rhide="${t.id}"${hidden.has(t.id) ? '' : ' checked'}><span class="sw hw" style="--c:${t.color}"></span>${esc(t.name)}</label>`).join('')}</div></details>
      <button data-act="rAutoStdAll" title="Give every cable without a standard the shortest standard that fits">Fit cables</button>
      <span class="grow"></span>
      <button data-act="boxOpen" title="Build reusable controller boxes">Box builder</button>
      <button data-act="libOpen" title="Reusable cable standards, hardware and boxes">Library</button>`;
  };

  // ---------- render ----------
  RM.render = (p, R) => {
    const room = RM.current(p), st = p.settings, X = R.hw, sel = S.selection;
    const W = room.w * PX, HH = room.h * PX, g = Math.max(0.05, +room.grid || 0.5) * PX;
    const hidden = new Set(st.roomHidden || []);
    const byId = new Map(room.nodes.map(n => [n.id, n]));
    const P = q => `${(q.x * PX).toFixed(1)},${(q.y * PX).toFixed(1)}`;
    const live = drag && drag.live ? drag.live : null;
    let cables = '', flows = '', labels = '', handles = '', nodes = '';

    room.cables.forEach(c => {
      const i = live && live.has(c.id) ? liveInfo(p, R, room, c, byId) : X.cables.get(c.id);
      if (!i || !i.pts) return;
      const isSel = sel === c.id;
      if (hidden.has(c.type) && !isSel) return;
      const d = 'M' + i.pts.map(P).join(' L');
      const col = colourOf(i);
      const tip = `${H.nodeName(p, i.na, R)} → ${H.nodeName(p, i.nb, R)}\n${i.type.name}${i.std ? ' · ' + H.stdName(i.std) : ''}\nRoute ${H.fmtM(i.route)}${i.slack ? ' + ' + H.fmtM(i.slack) + ' slack' : ''}${i.phys != null ? ` · cable ${H.fmtM(i.phys)} · ${i.short ? 'SHORT by ' + H.fmtM(-i.spare) : 'spare ' + H.fmtM(i.spare)}` : ' · no cable chosen'}`;
      cables += `<g class="r-cable${isSel ? ' sel' : ''}${i.short ? ' short' : ''}${i.compatible ? '' : ' bad'}" data-rc="${c.id}">
        <path class="r-hit" d="${d}"/>${isSel ? `<path class="r-halo" d="${d}"/>` : ''}
        <path class="r-line" d="${d}" style="stroke:${esc(col)}"/>${i.short ? `<path class="r-shortdash" d="${d}"/>` : ''}<title>${esc(tip)}</title></g>`;
      if (st.roomFlow) flows += `<path class="r-flow" d="${d}"/>`;
      if (isSel || i.short || st.roomLabels || (live && live.has(c.id))) {
        let best = 0, bi = 1;
        for (let k = 1; k < i.pts.length; k++) { const l = Math.hypot(i.pts[k].x - i.pts[k - 1].x, i.pts[k].y - i.pts[k - 1].y); if (l > best) { best = l; bi = k; } }
        const a = i.pts[bi - 1], b = i.pts[bi], mx = (a.x + b.x) / 2 * PX, my = (a.y + b.y) / 2 * PX;
        const txt = `${H.fmtM(i.req)}${i.phys != null ? ' / ' + H.fmtM(i.phys) : ''}${i.short ? ' · ' + H.fmtM(-i.spare) + ' short' : ''}`;
        labels += `<g class="r-lab${i.short ? ' err' : i.phys == null ? ' none' : ''}" transform="translate(${mx.toFixed(1)},${(my - 6).toFixed(1)})" data-rc="${c.id}"><rect x="${-txt.length * 2.9 - 5}" y="-9" width="${txt.length * 5.8 + 10}" height="14" rx="4"/><text text-anchor="middle" y="1.5">${esc(txt)}</text></g>`;
      }
      if (isSel) {
        const pts = i.pts;
        for (let k = 1; k < pts.length; k++) {
          const mx = (pts[k - 1].x + pts[k].x) / 2, my = (pts[k - 1].y + pts[k].y) / 2;
          handles += `<g class="r-mid" data-mid="${k - 1}" data-cable="${c.id}" transform="translate(${(mx * PX).toFixed(1)},${(my * PX).toFixed(1)})"><circle r="6"/><path d="M-3 0H3M0 -3V3"/><title>Drag to add a pivot here</title></g>`;
        }
        c.pts.forEach((q, k) => { handles += `<circle class="r-piv" data-piv="${k}" data-cable="${c.id}" cx="${(q.x * PX).toFixed(1)}" cy="${(q.y * PX).toFixed(1)}" r="6"><title>Pivot ${k + 1}: drag to move, double-click to remove</title></circle>`; });
        [['a', pts[0]], ['b', pts[pts.length - 1]]].forEach(([e, q]) => { handles += `<rect class="r-end" data-end="${e}" data-cable="${c.id}" x="${(q.x * PX - 5).toFixed(1)}" y="${(q.y * PX - 5).toFixed(1)}" width="10" height="10" rx="2"><title>Drag onto another item to move this end</title></rect>`; });
      }
    });

    room.nodes.forEach(n => { nodes += drawNode(p, R, room, n, sel); });

    let rubber = '';
    if (drag && (drag.mode === 'conn' || drag.mode === 'end') && drag.cur) {
      const from = drag.mode === 'conn' ? byId.get(drag.from) : null;
      const a = from ? { x: from.x * PX, y: from.y * PX } : drag.anchor;
      rubber = `<line class="r-rubber" x1="${a.x}" y1="${a.y}" x2="${drag.cur.x}" y2="${drag.cur.y}"/>`;
    }

    const U1 = PX;
    U.$('#rsvg').innerHTML = `<defs>
        <pattern id="rgrid" width="${g}" height="${g}" patternUnits="userSpaceOnUse"><path d="M ${g} 0 L 0 0 0 ${g}" class="r-grid"/></pattern>
      </defs>
      <g id="rcam" transform="translate(${U.rcam.x},${U.rcam.y}) scale(${U.rcam.k})">
        <rect class="r-outside" x="-5000" y="-5000" width="10000" height="10000" data-rbg="1"/>
        <rect class="r-floor" x="0" y="0" width="${W}" height="${HH}" data-rbg="1"/>
        <rect x="0" y="0" width="${W}" height="${HH}" fill="url(#rgrid)" pointer-events="none"/>
        <rect class="r-wall" x="0" y="0" width="${W}" height="${HH}" pointer-events="none"/>
        <text class="r-dim" x="${W / 2}" y="-10" text-anchor="middle">${esc(H.fmtM(room.w))}</text>
        <text class="r-dim" x="-10" y="${HH / 2}" text-anchor="middle" transform="rotate(-90 -10 ${HH / 2})">${esc(H.fmtM(room.h))}</text>
        <g class="r-scale" transform="translate(0,${HH + 18})"><path d="M0 -4V4M0 0H${U1}M${U1} -4V4"/><text x="${U1 + 6}" y="4">1 m · grid ${esc(H.fmtM(room.grid))}</text></g>
        <text class="r-name" x="0" y="-26">${esc(room.name)}</text>
        ${cables}<g class="r-flows">${flows}</g>${nodes}${labels}${handles}${rubber}
      </g>
      ${room.nodes.length ? '' : `<text x="50%" y="45%" text-anchor="middle" class="s-muted" style="font-size:14px">Drag controller boxes, pixel runs and devices in from the left</text>`}`;
  };

  // Live geometry while dragging (the rest of the calculation catches up on release).
  function liveInfo(p, R, room, c, byId) {
    const i = Object.assign({}, R.hw.cables.get(c.id) || {});
    const na = byId.get(c.a), nb = byId.get(c.b);
    if (!na || !nb) return null;
    i.na = na; i.nb = nb; i.type = C.portType(c.type); i.std = H.std(p, c.std);
    i.pts = H.route(p, room, c, byId); i.route = H.polyLen(i.pts);
    i.slack = i.slack || 0; i.req = i.route + i.slack;
    if (i.phys != null) { i.spare = i.phys - i.req; i.short = i.spare < -0.005; }
    return i;
  }

  function drawNode(p, R, room, n, sel) {
    const r = H.rect(p, n);
    const x = (r.cx - r.w / 2) * PX, y = (r.cy - r.h / 2) * PX, w = r.w * PX, h = r.h * PX;
    const rad = r.rot * Math.PI / 180, bh = Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad));
    const top = r.cy * PX - bh / 2, bot = r.cy * PX + bh / 2;
    const tint = n.color ? ` style="--nc:${esc(n.color)}"` : '';
    const isSel = sel === n.id || (n.kind === 'distro' && sel === n.ref);
    let body = '', tip = H.nodeName(p, n, R), label = '', cls = n.kind, capState = 'ok';
    const capsFor = R.hw.caps.get(n.kind === 'distro' ? n.ref : n.id);
    if (capsFor) { const rows = H.capRows(capsFor.caps); capState = rows.some(c => c.state === 'err') ? 'err' : rows.some(c => c.state === 'warn') ? 'warn' : 'ok'; }
    if (n.kind === 'distro') {
      const d = H.distroOf(p, n), t = d && d.boxTpl && H.box(p, d.boxTpl);
      body = `<rect class="r-box${n.color ? ' tinted' : ''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"${tint}/>`;
      if (n.open && t) {
        const k = w / Math.max(1, t.w), k2 = h / Math.max(1, t.h);
        t.items.forEach(it => {
          const def = H.comp(p, it.comp); if (!def) return;
          const cat = C.hwCat(def.cat);
          body += `<g class="r-sub" style="--c:${cat.color}">${shapeFor(def.cat, x + it.x * k, y + it.y * k2, def.w * k, def.h * k2)}<text x="${x + (it.x + def.w / 2) * k}" y="${y + (it.y + def.h / 2) * k2 + 3}" text-anchor="middle">${esc(def.sym)}</text></g>`;
        });
      } else {
        const comps = d ? H.boxComps(p, d) : [];
        const syms = comps.map(x => x.def.sym).slice(0, 6).join(' ');
        body += `<text class="r-sym" x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle">${esc(t ? 'BOX' : 'DST')}</text>`;
        tip += `\n${t ? 'Controller box: ' + t.name : 'Distro'}\n${comps.map(x => x.def.name).join(', ')}`;
        if (syms) tip += `\n(${syms})`;
      }
      label = `<text class="r-label" x="${x + w / 2}" y="${top - 5}" text-anchor="middle">${esc(H.nodeName(p, n, R))}</text>`;
      body += `<circle class="r-dot ${capState}" cx="${x + w - 5}" cy="${y + 5}" r="3.5"><title>${capState === 'err' ? 'Over capacity' : capState === 'warn' ? 'Nearly full' : 'Capacity OK'}</title></circle>`;
    } else if (n.kind === 'prop') {
      const px = H.propPixels(p, R, n), dots = Math.max(2, Math.min(40, Math.round(Math.max(w, h) / 8)));
      body = `<rect class="r-prop${n.color ? ' tinted' : ''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"${tint}/>`;
      const horiz = w >= h;
      for (let k = 0; k < dots; k++) {
        const f = (k + 0.5) / dots;
        body += `<circle class="r-px" cx="${horiz ? x + w * f : x + w / 2}" cy="${horiz ? y + h / 2 : y + h * f}" r="${Math.min(2.2, Math.min(w, h) / 3)}"/>`;
      }
      tip += `\n${px.toLocaleString()} pixels${n.portId ? '' : ' (not linked to a port)'}`;
      label = `<text class="r-label" x="${x + w / 2}" y="${top - 4}" text-anchor="middle">${esc(H.nodeName(p, n, R))}</text>`;
    } else {
      const def = H.comp(p, n.ref);
      const cat = C.hwCat(def ? def.cat : 'custom');
      body = `<g class="r-dev" style="--c:${esc(n.color || cat.color)}">${shapeFor(cat.id, x, y, w, h)}</g><text class="r-sym" x="${x + w / 2}" y="${y + h / 2 + 3.5}" text-anchor="middle" style="font-size:${Math.max(6, Math.min(11, Math.min(w, h) / 2.4))}px">${esc(def ? def.sym : '?')}</text>`;
      tip += def ? `\n${def.name} · ${cat.name}\nPorts: ${Object.keys(def.ports || {}).filter(k => def.ports[k] > 0).map(k => C.portType(k).name).join(', ') || 'none'}` : '';
      if (n.label || isSel || p.settings.roomLabels) label = `<text class="r-label" x="${x + w / 2}" y="${bot + 11}" text-anchor="middle">${esc(H.nodeName(p, n, R))}</text>`;
      if (capsFor && H.capRows(capsFor.caps).length) body += `<circle class="r-dot ${capState}" cx="${x + w}" cy="${y}" r="3"/>`;
    }
    const tf = r.rot ? ` transform="rotate(${r.rot} ${r.cx * PX} ${r.cy * PX})"` : '';
    return `<g class="r-node ${cls}${isSel ? ' sel' : ''}" data-rn="${n.id}"><g${tf}>${body}
      <circle class="r-conn" data-conn="${n.id}" cx="${x + w + 8}" cy="${y + h / 2}" r="5"><title>Drag to another item to connect a cable</title></circle></g>${label}<title>${esc(tip)}</title></g>`;
  }

  // ---------- inspector ----------
  const fld = (id, f, label, val, extra = '', t = 'num') => `<label class="fl"><span>${label}</span><input data-id="${id}" data-f="${f}" data-t="${t}" value="${esc(val == null ? '' : val)}" ${extra}></label>`;
  RM.inspector = (p, R) => {
    const el = U.$('#rinspector');
    const act = document.activeElement;
    const key = act && el.contains(act) && act.dataset && act.dataset.id ? act.dataset.id + '|' + act.dataset.f : null;
    const sc = el.scrollTop;
    const e = S.selection ? R.idx.get(S.selection) : null;
    const room = RM.current(p);
    let h;
    if (e && e.type === 'rnode' && e.room === room) h = nodeInsp(p, R, room, e.obj);
    else if (e && e.type === 'rcable' && e.room === room) h = cableInsp(p, R, room, e.obj);
    else if (e && e.type === 'distro') { const n = room.nodes.find(x => x.kind === 'distro' && x.ref === e.obj.id); h = n ? nodeInsp(p, R, room, n) : roomInsp(p, R, room); }
    else h = roomInsp(p, R, room);
    el.innerHTML = h;
    el.scrollTop = sc;
    if (key) { const [id, f] = key.split('|'); const x = U.$$('[data-id]', el).find(q => q.dataset.id === id && q.dataset.f === f); if (x) x.focus({ preventScroll: true }); }
  };

  function roomInsp(p, R, room) {
    const X = R.hw, st = p.settings;
    const list = room.cables.map(c => X.cables.get(c.id)).filter(Boolean);
    const shortL = list.filter(i => i.short), none = list.filter(i => !i.broken && i.phys == null);
    const byType = {};
    list.forEach(i => { if (i.broken) return; const k = i.type.name; byType[k] = (byType[k] || 0) + i.req; });
    return `<div class="ins-head"><b>Room</b><span class="soft">${room.nodes.length} items · ${room.cables.length} cables</span></div>
      <div class="ins-grid">
        <label class="fl wide"><span>Name</span><input data-id="${room.id}" data-f="name" value="${esc(room.name)}"></label>
        ${fld(room.id, 'w', 'Width (m)', room.w, 'min="1" step="0.5"')}
        ${fld(room.id, 'h', 'Depth (m)', room.h, 'min="1" step="0.5"')}
        ${fld(room.id, 'grid', 'Grid (m)', room.grid, 'min="0.05" step="0.05"')}
        ${fld('settings', 'cableSlackM', 'Slack per cable (m)', st.cableSlackM, 'min="0" step="0.1" title="Service loop / spare allowance added to every routed length (each cable can override it)"')}
      </div>
      <p class="muted small">1 grid square = ${esc(H.fmtM(room.grid))}. Positions and cable lengths are real distances in metres.</p>
      ${shortL.length ? `<h4 class="err">Cables too short (${shortL.length})</h4>${shortL.map(i => `<div class="ins-link err" data-act="jump" data-id="${i.cable.id}">${esc(H.nodeName(p, i.na, R))} → ${esc(H.nodeName(p, i.nb, R))}: ${esc(H.fmtM(-i.spare))} short</div>`).join('')}` : ''}
      ${none.length ? `<h4>No cable chosen (${none.length})</h4>${none.map(i => `<div class="ins-link" data-act="jump" data-id="${i.cable.id}">${esc(H.nodeName(p, i.na, R))} → ${esc(H.nodeName(p, i.nb, R))}: needs ${esc(H.fmtM(i.req))}</div>`).join('')}` : ''}
      ${Object.keys(byType).length ? `<h4>Routed cable</h4><table class="mini">${Object.entries(byType).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${esc(H.fmtM(v))}</td></tr>`).join('')}</table>` : ''}
      <div class="ins-actions"><button data-act="rRenameRoom" data-id="${room.id}">Rename</button><button data-act="rDelRoom" data-id="${room.id}"${p.rooms.length < 2 ? ' disabled' : ''}>Delete room</button></div>
      <details class="hint"><summary>How to use the room</summary><ul>
        <li>Drag boxes, pixel runs and devices in from the left. Drag an item to move it.</li>
        <li>To connect, drag from the small circle on an item's right edge onto another item.</li>
        <li>Select a cable, then drag a <b>+</b> on it to add a pivot. Drag pivots to route around things; double-click a pivot to remove it. Drag a square end onto another item to move that end.</li>
        <li>Hold Alt while dragging to place things off the grid. Arrow keys nudge the selected item by one grid step (Shift: 1 m). R rotates it 90°. Delete removes the selected item or cable.</li>
      </ul></details>`;
  }

  function nodeInsp(p, R, room, n) {
    const X = R.hw;
    const [dw, dh] = H.nodeSize(p, Object.assign({}, n, { w: null, h: null }));
    let h = `<div class="ins-head"><b>${esc(H.nodeName(p, n, R))}</b><span class="soft">${n.kind === 'distro' ? 'box / distro' : n.kind === 'prop' ? 'pixel prop' : 'device'}</span></div>`;
    h += `<div class="ins-grid">
      <label class="fl wide"><span>Label in room</span><input data-id="${n.id}" data-f="label" value="${esc(n.label)}" placeholder="${esc(H.nodeName(p, Object.assign({}, n, { label: '' }), R))}"></label>
      ${fld(n.id, 'x', 'X (m)', +(+n.x).toFixed(2), 'step="0.1"')}${fld(n.id, 'y', 'Y (m)', +(+n.y).toFixed(2), 'step="0.1"')}
      ${fld(n.id, 'w', 'Width (m)', n.w, `step="0.05" min="0" placeholder="${+dw.toFixed(2)}"`)}${fld(n.id, 'h', 'Depth (m)', n.h, `step="0.05" min="0" placeholder="${+dh.toFixed(2)}"`)}
      ${fld(n.id, 'rot', 'Rotation (°)', +n.rot || 0, 'step="15"')}
      <label class="fl"><span>Colour</span><span class="colrow"><input type="color" data-id="${n.id}" data-f="color" value="${esc(n.color || '#808080')}" aria-label="Item colour">${n.color ? `<button class="ghost small" data-act="rColor" data-id="${n.id}" title="Use the default colour">Reset</button>` : '<span class="soft small">Default</span>'}</span></label>
    </div>
    <div class="ins-actions"><button data-act="rRot" data-id="${n.id}" data-d="-90" title="Rotate 90° anticlockwise">Rotate left</button><button data-act="rRot" data-id="${n.id}" data-d="90" title="Rotate 90° clockwise">Rotate right</button></div>`;
    if (n.kind === 'distro') {
      const d = H.distroOf(p, n);
      if (!d) h += '<p class="err">This distro has been deleted from the project.</p>';
      else {
        const t = d.boxTpl && H.box(p, d.boxTpl), cx = X.caps.get(d.id);
        h += `<label class="fl wide"><span>Distro name</span><input data-id="${d.id}" data-f="name" value="${esc(d.name)}"></label>`;
        h += `<p class="muted small">${t ? `Controller box <b>${esc(t.name)}</b> (${t.w}×${t.h}×${t.d} cm).` : 'Plain distro: capacity comes from its boards and PSUs.'}</p>`;
        h += `<h4>Capacity</h4>${RM.capHtml(cx ? cx.caps : {})}`;
        h += `<details class="hint"><summary>Contents</summary><ul>${H.boxComps(p, d).map(x => `<li>${esc(x.item.label ? x.item.label + ' · ' : '')}${esc(x.def.name)}</li>`).join('')}</ul></details>`;
        h += `<div class="ins-actions">${t ? `<label class="chk"><input type="checkbox" data-id="${n.id}" data-f="open" data-t="bool"${n.open ? ' checked' : ''}> Show inside</label><button data-act="boxEdit" data-id="${t.id}">Edit box</button>` : ''}<button data-act="rShowDistro" data-id="${d.id}">Open in form</button></div>`;
      }
    } else if (n.kind === 'prop') {
      let opts = U.opt('', 'Not linked (set pixels below)', n.portId || '');
      p.distros.forEach(d => { opts += `<optgroup label="${esc(d.name)}">` + d.controllers.flatMap(c => c.ports.map(pt => U.opt(pt.id, `${c.name} port ${pt.num}${pt.label ? ' · ' + pt.label : ''}`, n.portId || ''))).join('') + '</optgroup>'; });
      h += `<label class="fl wide"><span>Pixel run</span><select data-id="${n.id}" data-f="portId">${opts}</select></label>`;
      if (!n.portId) h += `<div class="ins-grid">${fld(n.id, 'pixels', 'Pixels', n.pixels || 0, 'min="0" step="1"')}</div>`;
      else { const r = R.ports.get(n.portId); if (r) h += `<p class="muted small">${r.pixels.toLocaleString()} pixels · ${r.channels.toLocaleString()} channels · ${U.num(r.portA, 2)} A</p>`; }
    } else {
      const def = H.comp(p, n.ref);
      if (def) {
        const cat = C.hwCat(def.cat);
        h += `<p class="muted small">${esc(def.name)} · ${esc(cat.name)}${def.notes ? '<br>' + esc(def.notes) : ''}</p>`;
        h += `<div class="chips">${Object.keys(def.ports || {}).filter(k => def.ports[k] > 0).map(k => `<span class="chip" style="--c:${C.portType(k).color}">${esc(C.portType(k).name)}${def.ports[k] > 1 ? ' ×' + def.ports[k] : ''}</span>`).join('')}</div>`;
        const cx = X.caps.get(n.id);
        if (cx && H.capRows(cx.caps).length) h += `<h4>Capacity</h4>${RM.capHtml(cx.caps)}`;
        h += `<div class="ins-actions"><button data-act="libEditComp" data-id="${esc(def.id)}">Edit definition</button></div>`;
      }
    }
    const cs = (X.nodeCables.get(n.id) || []).map(id => X.cables.get(id)).filter(Boolean);
    h += `<h4>Cables (${cs.length})</h4>`;
    h += cs.length ? cs.map(i => { const other = i.na === n ? i.nb : i.na; return `<div class="ins-link${i.short ? ' err' : ''}" data-act="jump" data-id="${i.cable.id}"><span class="sw hw" style="--c:${esc(colourOf(i))}"></span>${esc(i.type.name)} ${i.na === n ? '→' : '←'} ${esc(H.nodeName(p, other, R))} · ${esc(H.fmtM(i.req))}${i.short ? ' · short' : ''}</div>`; }).join('') : '<p class="muted small">Drag from the circle on its right edge to another item to add a cable.</p>';
    h += `<div class="ins-actions"><button data-act="rDup" data-id="${n.id}">Duplicate</button><button data-act="rDel" data-id="${n.id}">Remove from room</button></div>`;
    return h;
  }

  function cableInsp(p, R, room, c) {
    const i = R.hw.cables.get(c.id);
    const nodeOpts = sel => room.nodes.map(n => U.opt(n.id, H.nodeName(p, n, R), sel)).join('');
    let h = `<div class="ins-head"><b>Cable</b><span class="soft">${esc(i.type.name)}</span></div>`;
    h += `<label class="fl wide"><span>From</span><select data-id="${c.id}" data-f="a">${nodeOpts(c.a)}</select></label>`;
    h += `<label class="fl wide"><span>To</span><select data-id="${c.id}" data-f="b">${nodeOpts(c.b)}</select></label>`;
    if (i.broken) return h + '<p class="err">One end of this cable is missing.</p>' + `<div class="ins-actions"><button data-act="rDel" data-id="${c.id}">Delete cable</button></div>`;
    const A = H.accepts(p, i.na), B = H.accepts(p, i.nb);
    h += `<label class="fl wide"><span>Type</span><select data-id="${c.id}" data-f="type">${C.portTypes.map(t => U.opt(t.id, `${t.name}${A.has(t.id) && B.has(t.id) ? ' ✓' : ''}`, c.type)).join('')}</select></label>`;
    if (!i.compatible) h += `<p class="warn small">${esc(H.nodeName(p, i.badEnd, R))} has no ${esc(i.type.name.toLowerCase())} connection. ✓ marks types both ends have.</p>`;
    const stds = H.stds(p), mine = stds.filter(s => s.type === c.type), other = stds.filter(s => s.type !== c.type);
    let so = U.opt('', i.lead && !c.len ? `Run lead (${H.fmtM(i.lead.len)})` : 'Custom length…', c.std || '');
    if (mine.length) so += `<optgroup label="${esc(i.type.name)}">${mine.map(s => U.opt(s.id, H.stdName(s) + ((+s.length >= i.req - 0.005) ? '' : ' · too short'), c.std)).join('')}</optgroup>`;
    if (other.length) so += `<optgroup label="Other types">${other.map(s => U.opt(s.id, `${H.stdName(s)} · ${C.portType(s.type).name}`, c.std)).join('')}</optgroup>`;
    h += `<h4>Length</h4><table class="mini">
      <tr><td>Routed path</td><td class="num">${esc(H.fmtM(i.route))}</td></tr>
      <tr><td>Slack / service loop</td><td class="num"><input class="tiny" data-id="${c.id}" data-f="slack" data-t="num" value="${c.slack == null ? '' : esc(c.slack)}" placeholder="${esc(p.settings.cableSlackM)}" step="0.1" min="0" title="Blank uses the room default"> m</td></tr>
      <tr><td><b>Required</b></td><td class="num"><b>${esc(H.fmtM(i.req))}</b></td></tr></table>`;
    h += `<label class="fl wide"><span>Physical cable</span><select data-id="${c.id}" data-f="std">${so}</select></label>`;
    if (!c.std) h += `<div class="ins-grid">${fld(c.id, 'len', 'Custom length (m)', c.len || '', `min="0" step="0.5" placeholder="${i.lead ? i.lead.len : 'not set'}"`)}</div>`;
    const status = i.phys == null ? `<p class="muted">No cable chosen yet.</p>` : i.short ? `<p class="stat-line err">${esc(H.fmtM(i.phys))} cable is <b>${esc(H.fmtM(-i.spare))} too short</b>. A cable can't stretch: choose a longer one or re-route.</p>` : `<p class="stat-line ok">${esc(H.fmtM(i.phys))} cable fits with ${esc(H.fmtM(i.spare))} spare.</p>`;
    h += status;
    if (i.std) h += `<p class="muted small"><span class="sw hw" style="--c:${esc(i.std.color)}"></span>${esc(i.std.tag || '')} ${esc(i.std.connector || '')}${i.std.notes ? ' · ' + esc(i.std.notes) : ''}</p>`;
    const fit = H.fitStd(p, i);
    h += `<div class="ins-actions">${fit && fit.id !== c.std ? `<button data-act="rAutoStd" data-id="${c.id}" title="${esc(H.stdName(fit))}">Use ${esc(H.fmtM(fit.length))} ${esc(fit.tag || fit.name)}</button>` : ''}${i.lead ? `<button data-act="rLeadSync" data-id="${c.id}" title="Set the run's lead cable in the Form to this cable's length, so the voltage drop uses it">Set run lead to ${esc(H.fmtM(i.phys != null && i.physSrc !== 'lead' ? i.phys : i.req))}</button>` : ''}</div>`;
    if (i.lead) h += `<p class="muted small">The run's lead cable in the Form is ${esc(H.fmtM(i.lead.len))}.</p>`;
    if (i.provider) h += `<p class="muted small">${i.linked ? 'Counted from the port run on' : `Uses ${i.amount} ${esc(C.resources[i.res].name.toLowerCase())} on`} ${esc(H.nodeName(p, i.provider, R))}.</p>`;
    h += `<h4>Route (${c.pts.length} pivot${c.pts.length === 1 ? '' : 's'})</h4>`;
    h += c.pts.length ? `<table class="mini">${c.pts.map((q, k) => `<tr><td>Pivot ${k + 1}</td><td class="num">${esc(U.num(q.x, 2))}, ${esc(U.num(q.y, 2))} m</td><td><button class="icon sm" data-act="rPivDel" data-id="${c.id}" data-i="${k}" aria-label="Remove pivot ${k + 1}">${U.ic('x')}</button></td></tr>`).join('')}</table>` : '<p class="muted small">Straight. Drag the + on the cable to add a pivot.</p>';
    h += `<label class="fl wide"><span>Label</span><input data-id="${c.id}" data-f="label" value="${esc(c.label)}" placeholder="e.g. under the path"></label>`;
    h += `<div class="ins-actions"><button data-act="rPivClear" data-id="${c.id}"${c.pts.length ? '' : ' disabled'}>Straighten</button><button data-act="rReverse" data-id="${c.id}" title="Swap the ends (flow direction)">Reverse</button><button data-act="rDel" data-id="${c.id}">Delete cable</button></div>`;
    return h;
  }

  // ---------- camera ----------
  const applyCam = () => { const g = U.$('#rcam'); if (g) g.setAttribute('transform', `translate(${U.rcam.x},${U.rcam.y}) scale(${U.rcam.k})`); };
  RM.zoom = (f, cx, cy) => {
    const wrap = U.$('#rcanvas').getBoundingClientRect();
    if (cx == null) { cx = wrap.width / 2; cy = wrap.height / 2; }
    const k = Math.min(8, Math.max(0.1, U.rcam.k * f));
    U.rcam.x = cx - (cx - U.rcam.x) * k / U.rcam.k; U.rcam.y = cy - (cy - U.rcam.y) * k / U.rcam.k; U.rcam.k = k; applyCam();
  };
  RM.fit = () => {
    const p = S.project, room = RM.current(p), wrap = U.$('#rcanvas').getBoundingClientRect();
    if (!wrap.width) return;
    let x0 = 0, y0 = 0, x1 = room.w, y1 = room.h;
    room.nodes.forEach(n => { const r = H.rect(p, n); x0 = Math.min(x0, r.cx - r.w); y0 = Math.min(y0, r.cy - r.h); x1 = Math.max(x1, r.cx + r.w); y1 = Math.max(y1, r.cy + r.h); });
    const pad = 70, w = (x1 - x0) * PX, h = (y1 - y0) * PX;
    const k = Math.min(8, Math.max(0.1, Math.min((wrap.width - pad) / w, (wrap.height - pad) / h)));
    U.rcam = { k, x: (wrap.width - w * k) / 2 - x0 * PX * k, y: (wrap.height - h * k) / 2 - y0 * PX * k + 8 };
    applyCam(); fitted = true;
  };
  RM.fitOnce = () => { if (!fitted) requestAnimationFrame(RM.fit); };
  RM.refit = () => { fitted = false; };
  const toWorld = (ev) => { const r = U.$('#rsvg').getBoundingClientRect(); return { x: (ev.clientX - r.left - U.rcam.x) / U.rcam.k, y: (ev.clientY - r.top - U.rcam.y) / U.rcam.k }; };

  // ---------- snapping ----------
  const snapOn = ev => S.project.settings.roomSnap && !(ev && ev.altKey);
  const snapV = (v, g) => Math.round(v / g) * g;
  const r2 = v => Math.round(v * 1000) / 1000;
  function snapPivot(p, room, c, i, q, ev) {
    if (!snapOn(ev)) return { x: r2(q.x), y: r2(q.y) };
    const g = +room.grid || 0.5;
    let x = snapV(q.x, g), y = snapV(q.y, g);
    // Line up with the neighbouring point so runs stay square.
    const nb = [];
    const na = room.nodes.find(n => n.id === c.a), nbb = room.nodes.find(n => n.id === c.b);
    nb.push(i > 0 ? c.pts[i - 1] : na, i < c.pts.length - 1 ? c.pts[i + 1] : nbb);
    const tol = Math.max(0.15, g * 0.4);
    nb.forEach(o => { if (!o) return; if (Math.abs(q.x - o.x) < tol) x = +o.x; if (Math.abs(q.y - o.y) < tol) y = +o.y; });
    return { x: r2(x), y: r2(y) };
  }

  // ---------- drop, connect, delete ----------
  function drop(data, w, ev) {
    const g = +RM.current(S.project).grid || 0.5;
    const x = r2(snapOn(ev) ? snapV(w.x / PX, g) : w.x / PX), y = r2(snapOn(ev) ? snapV(w.y / PX, g) : w.y / PX);
    S.commit('roomAdd', p => {
      const room = RM.current(p);
      if (data.t === 'box') { const r = H.placeBox(p, data.id, room, x, y); if (r) S.selection = r.node.id; }
      else if (data.t === 'distro') { const n = M.newNode('distro', data.id, x, y); room.nodes.push(n); S.selection = n.id; }
      else if (data.t === 'prop') { const n = M.newNode('prop', null, x, y, { portId: data.portId || null, pixels: data.portId ? 0 : 50, w: 1.5, h: 0.3 }); room.nodes.push(n); S.selection = n.id; }
      else if (data.t === 'comp') { const n = M.newNode('device', data.id, x, y); room.nodes.push(n); S.selection = n.id; }
    });
  }
  function connect(fromId, toId) {
    if (fromId === toId) return;
    S.commit('connect', p => {
      const room = RM.current(p);
      const a = room.nodes.find(n => n.id === fromId), b = room.nodes.find(n => n.id === toId);
      if (!a || !b) return;
      const c = M.newRoomCable(a.id, b.id, H.guessType(p, U.lastR, a, b));
      room.cables.push(c); S.selection = c.id;
    });
  }

  const cableOf = (p, id) => { const e = M.find(p, id); return e && e.type === 'rcable' ? e.obj : null; };
  RM.actions = {
    rToggle: (k) => S.commit('roomSetting', p => { p.settings[k] = !p.settings[k]; }),
    rFit: () => RM.fit(),
    rZoomIn: () => RM.zoom(1.2),
    rZoomOut: () => RM.zoom(1 / 1.2),
    rAddRoom: async () => {
      const name = await U.ask({ title: 'New room', input: 'Room ' + (S.project.rooms.length + 1), ok: 'Add' });
      if (!name) return;
      S.commit('addRoom', p => { const r = M.newRoom(name); p.rooms.push(r); U.roomId = r.id; S.selection = null; });
      RM.refit(); RM.fitOnce();
    },
    rRenameRoom: async (id) => {
      const r = S.project.rooms.find(x => x.id === id);
      const name = await U.ask({ title: 'Rename room', input: r.name, ok: 'Rename' });
      if (name) S.commit('renameRoom', p => { p.rooms.find(x => x.id === id).name = name; });
    },
    rDelRoom: async (id) => {
      const r = S.project.rooms.find(x => x.id === id);
      if (S.project.rooms.length < 2) return;
      if (!(await U.ask({ title: `Delete ${r.name}?`, body: 'Its layout and cables are removed. Distros and runs stay in the project. You can undo this.', ok: 'Delete', danger: true }))) return;
      S.commit('delRoom', p => { p.rooms = p.rooms.filter(x => x.id !== id); U.roomId = p.rooms[0].id; S.selection = null; });
      RM.refit(); RM.fitOnce();
    },
    rDel: (id) => RM.del(id),
    rRot: (id, el) => S.commit('rotate', p => { const e = M.find(p, id); if (e && e.type === 'rnode') e.obj.rot = ((((+e.obj.rot || 0) + +el.dataset.d) % 360) + 360) % 360; }),
    rColor: (id) => S.commit('color', p => { const e = M.find(p, id); if (e && e.type === 'rnode') delete e.obj.color; }),
    rDup: (id) => S.commit('roomDup', p => {
      const e = M.find(p, id); if (!e || e.type !== 'rnode') return;
      const n = M.clone(e.obj); n.id = M.uid('rn'); n.x = r2(+n.x + 0.5); n.y = r2(+n.y + 0.5);
      if (n.kind === 'distro') {
        const d = H.distroOf(p, e.obj);
        if (d && d.boxTpl) { const r = H.placeBox(p, d.boxTpl, null, 0, 0); n.ref = r.d.id; }
        else { n.kind = 'device'; return; }
      }
      if (n.kind === 'prop') n.portId = null;
      e.room.nodes.push(n); S.selection = n.id;
    }),
    rShowDistro: (id) => { PP.setView('split'); S.select(id); },
    rPivDel: (id, el) => S.commit('delPivot', p => { const c = cableOf(p, id); if (c) c.pts.splice(+el.dataset.i, 1); }),
    rPivClear: (id) => S.commit('straighten', p => { const c = cableOf(p, id); if (c) c.pts = []; }),
    rReverse: (id) => S.commit('reverse', p => { const c = cableOf(p, id); if (!c) return; [c.a, c.b] = [c.b, c.a]; c.pts.reverse(); }),
    rAutoStd: (id) => {
      const i = U.lastR.hw.cables.get(id), s = i && H.fitStd(S.project, i);
      if (!s) return U.toast('No standard of this type is long enough. Add one in the Library.');
      S.commit('autoStd', p => { const c = cableOf(p, id); c.std = s.id; H.syncLead(p, U.lastR, c, +s.length); });
      U.toast(`Using ${H.stdName(s)}.`);
    },
    rAutoStdAll: () => {
      const p0 = S.project, X = U.lastR.hw; let n = 0, miss = 0;
      const pick = [];
      RM.current(p0).cables.forEach(c => { const i = X.cables.get(c.id); if (!i || i.broken || c.std) return; const s = H.fitStd(p0, i); if (s) pick.push([c.id, s]); else miss++; });
      S.commit('autoStdAll', p => pick.forEach(([id, s]) => { const c = cableOf(p, id); c.std = s.id; H.syncLead(p, U.lastR, c, +s.length); n++; }));
      U.toast(`${n} cable${n === 1 ? '' : 's'} given a standard.${miss ? ` ${miss} need a longer standard than you have.` : ''}${!n && !miss ? ' Every cable already has one.' : ''}`);
    },
    rLeadSync: (id) => {
      const i = U.lastR.hw.cables.get(id);
      const len = i.phys != null && i.physSrc !== 'lead' ? i.phys : Math.ceil(i.req * 2) / 2;
      let ok = false;
      S.commit('leadSync', p => { ok = H.syncLead(p, U.lastR, cableOf(p, id), len); });
      U.toast(ok ? `Run lead set to ${H.fmtM(len)}.` : 'The run has more than one lead cable; edit it in the Form.');
    }
  };
  RM.del = (id) => S.commit('roomDel', p => {
    const e = M.find(p, id); if (!e) return;
    if (e.type === 'rcable') e.room.cables = e.room.cables.filter(c => c.id !== id);
    else if (e.type === 'rnode') { e.room.nodes = e.room.nodes.filter(n => n.id !== id); e.room.cables = e.room.cables.filter(c => c.a !== id && c.b !== id); }
    S.selection = null;
  });

  // Room-specific change events (room picker, cable-type filter). Returns true when handled.
  RM.onChange = (el) => {
    if (el.id === 'roomSel') { U.roomId = el.value; S.selection = null; RM.refit(); PP.render(); RM.fitOnce(); return true; }
    if (el.dataset && el.dataset.rhide) {
      const t = el.dataset.rhide;
      S.commit('roomHidden', p => { const s = new Set(p.settings.roomHidden || []); if (el.checked) s.delete(t); else s.add(t); p.settings.roomHidden = Array.from(s); });
      return true;
    }
    return false;
  };
  // After a field edit: keep the Form's run lead in step with a newly chosen pixel cable standard.
  RM.afterField = (p, o, f) => {
    if (f === 'std' && o && o.type === 'pixel' && o.std) { const s = H.std(p, o.std); if (s) H.syncLead(p, U.lastR, o, +s.length); }
    if ((f === 'a' || f === 'b') && o && o.a === o.b) { const room = p.rooms.find(r => r.cables.includes(o)); if (room) room.cables = room.cables.filter(c => c !== o); }
  };

  // ---------- events (bound once) ----------
  RM.init = () => {
    const svg = U.$('#rsvg'), wrap = U.$('#rcanvas');
    U.$('#rpalette').addEventListener('dragstart', ev => {
      const el = ev.target.closest('[data-rdrag]'); if (!el) return;
      ev.dataTransfer.setData('text/plain', el.dataset.rdrag); ev.dataTransfer.effectAllowed = 'copy';
    });
    wrap.addEventListener('dragover', ev => { ev.preventDefault(); wrap.classList.add('dragover'); });
    wrap.addEventListener('dragleave', ev => { if (!wrap.contains(ev.relatedTarget)) wrap.classList.remove('dragover'); });
    wrap.addEventListener('drop', ev => {
      ev.preventDefault(); wrap.classList.remove('dragover');
      let data; try { data = JSON.parse(ev.dataTransfer.getData('text/plain')); } catch (e) { return; }
      if (data && data.t) drop(data, toWorld(ev), ev);
    });
