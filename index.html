    svg.addEventListener('wheel', ev => {
      ev.preventDefault();
      const r = svg.getBoundingClientRect();
      RM.zoom(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });

    const redraw = () => RM.render(S.project, U.lastR);
    const tap = (key) => { const now = Date.now(), dbl = lastTap.key === key && now - lastTap.t < 400; lastTap = dbl ? { key: '', t: 0 } : { key, t: now }; return dbl; };
    svg.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const p = S.project, room = RM.current(p), t = ev.target, w = toWorld(ev);
      const before = JSON.stringify(p);
      const hd = t.closest('[data-piv],[data-mid],[data-end],[data-conn]');
      if (hd) {
        const c = hd.dataset.cable ? room.cables.find(x => x.id === hd.dataset.cable) : null;
        if (hd.dataset.piv != null) {
          const i = +hd.dataset.piv;
          if (tap(c.id + ':' + i)) { S.commit('delPivot', q => { const cc = cableOf(q, c.id); cc.pts.splice(i, 1); }); return; }
          drag = { mode: 'piv', c, i, before, live: new Set([c.id]) };
        } else if (hd.dataset.mid != null) {
          const i = +hd.dataset.mid;
          c.pts.splice(i, 0, snapPivot(p, room, c, i, { x: w.x / PX, y: w.y / PX }, ev));
          drag = { mode: 'piv', c, i, before, moved: true, live: new Set([c.id]) };
        } else if (hd.dataset.end) {
          const i = U.lastR.hw.cables.get(c.id);
          const q = hd.dataset.end === 'a' ? i.pts[0] : i.pts[i.pts.length - 1];
          drag = { mode: 'end', c, end: hd.dataset.end, before, anchor: { x: (hd.dataset.end === 'a' ? (i.pts[1] || q) : (i.pts[i.pts.length - 2] || q)).x * PX, y: (hd.dataset.end === 'a' ? (i.pts[1] || q) : (i.pts[i.pts.length - 2] || q)).y * PX }, cur: w };
        } else if (hd.dataset.conn) drag = { mode: 'conn', from: hd.dataset.conn, cur: w };
        svg.setPointerCapture(ev.pointerId); ev.preventDefault();
        return;
      }
      const ne = t.closest('[data-rn]');
      if (ne) {
        const n = room.nodes.find(x => x.id === ne.dataset.rn);
        const dbl = tap('n:' + n.id);
        if (dbl && n.kind === 'distro') { S.commit('toggleOpen', q => { const e = M.find(q, n.id); e.obj.open = !e.obj.open; }); return; }
        drag = { mode: 'node', n, before, sx: ev.clientX, sy: ev.clientY, ox: +n.x, oy: +n.y, moved: false, live: new Set(U.lastR.hw.nodeCables.get(n.id) || []) };
        svg.setPointerCapture(ev.pointerId);
        return;
      }
      const ce = t.closest('[data-rc]');
      if (ce) { S.select(ce.dataset.rc); return; }
      pan = { sx: ev.clientX, sy: ev.clientY, ox: U.rcam.x, oy: U.rcam.y, moved: false };
      svg.setPointerCapture(ev.pointerId); svg.classList.add('panning');
    });
    svg.addEventListener('pointermove', ev => {
      if (drag) {
        const p = S.project, room = RM.current(p), w = toWorld(ev);
        if (drag.mode === 'node') {
          const dx = (ev.clientX - drag.sx) / U.rcam.k / PX, dy = (ev.clientY - drag.sy) / U.rcam.k / PX;
          if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3 / U.rcam.k / PX) return;
          drag.moved = true;
          const g = +room.grid || 0.5;
          drag.n.x = r2(snapOn(ev) ? snapV(drag.ox + dx, g) : drag.ox + dx);
          drag.n.y = r2(snapOn(ev) ? snapV(drag.oy + dy, g) : drag.oy + dy);
          redraw();
        } else if (drag.mode === 'piv') {
          drag.c.pts[drag.i] = snapPivot(p, room, drag.c, drag.i, { x: w.x / PX, y: w.y / PX }, ev);
          drag.moved = true; redraw();
        } else { drag.cur = w; redraw(); }
      } else if (pan) {
        U.rcam.x = pan.ox + ev.clientX - pan.sx; U.rcam.y = pan.oy + ev.clientY - pan.sy;
        if (Math.abs(ev.clientX - pan.sx) + Math.abs(ev.clientY - pan.sy) > 3) pan.moved = true;
        applyCam();
      }
    });
    const end = ev => {
      if (drag) {
        const dr = drag; drag = null;
        if (dr.mode === 'node') { if (dr.moved) S.commitFrom(dr.before, 'moveNode'); else S.select(dr.n.id); }
        else if (dr.mode === 'piv') { if (dr.moved) { S.selection = dr.c.id; S.commitFrom(dr.before, 'movePivot'); } else S.select(dr.c.id); }
        else {
          const hit = ev.type === 'pointerup' && document.elementFromPoint(ev.clientX, ev.clientY);
          const ne = hit && hit.closest && hit.closest('#rsvg [data-rn]');
          if (dr.mode === 'conn') {
            if (ne && ne.dataset.rn !== dr.from) connect(dr.from, ne.dataset.rn);
            else { if (!ne) U.toast('Drop the cable end on another item to connect it.'); redraw(); }
          } else {
            const other = dr.end === 'a' ? dr.c.b : dr.c.a;
            if (ne && ne.dataset.rn !== other) { dr.c[dr.end] = ne.dataset.rn; S.commitFrom(dr.before, 'moveEnd'); }
            else redraw();
          }
        }
      }
      if (pan) { if (!pan.moved) S.select(null); pan = null; svg.classList.remove('panning'); }
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
  };
})();

</script>
<script>
// Controller box builder, component editor and the reusable hardware library dialog.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, S = PP.store, H = PP.hw;
  const esc = U.esc;
  const BX = PP.boxes = {};
  const SC = 5;                       // box builder: SVG units per centimetre
  const clone = o => JSON.parse(JSON.stringify(o));
  const r1 = v => Math.round(v * 2) / 2;   // 0.5 cm snap
  const numOr = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
  let B = null;                       // box builder state {t, sel, dirty, drag}
  let CE = null;                      // component editor state {c, isNew, done}
  let LT = 'cables';                  // library tab

  // ================= box builder =================
  const itemDefs = t => t.items.map(i => ({ item: i, def: H.comp(S.project, i.comp) })).filter(x => x.def);
  function problems(t) {
    const out = [], L = itemDefs(t);
    const box = x => ({ x0: +x.item.x, y0: +x.item.y, x1: +x.item.x + x.def.w, y1: +x.item.y + x.def.h });
    const bad = new Set();
    L.forEach(a => {
      const r = box(a);
      if (r.x0 < -0.01 || r.y0 < -0.01 || r.x1 > t.w + 0.01 || r.y1 > t.h + 0.01) { bad.add(a.item.id); out.push(`${a.item.label || a.def.name} sticks out of the box.`); }
    });
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const a = box(L[i]), b = box(L[j]);
      if (a.x0 < b.x1 - 0.01 && b.x0 < a.x1 - 0.01 && a.y0 < b.y1 - 0.01 && b.y0 < a.y1 - 0.01) { bad.add(L[i].item.id); bad.add(L[j].item.id); out.push(`${L[i].item.label || L[i].def.name} overlaps ${L[j].item.label || L[j].def.name}.`); }
    }
    const caps = H.capsFrom(L);
    L.forEach(x => Object.keys(x.def.internal || {}).forEach(r => { if (!caps[r] && +x.def.internal[r] > 0) out.push(`${x.def.name} needs ${C.resources[r] ? C.resources[r].name.toLowerCase() : r}, but nothing in the box provides it.`); }));
    const area = L.reduce((s, x) => s + x.def.w * x.def.h, 0);
    if (area > t.w * t.h * 0.8) out.push(`Components fill ${Math.round(area / (t.w * t.h) * 100)}% of the base: leave room for wiring and airflow.`);
    return { list: Array.from(new Set(out)), bad };
  }
  function freeSpot(t, def) {
    for (let y = 1; y + def.h <= t.h; y += 1) for (let x = 1; x + def.w <= t.w; x += 1) {
      const clash = itemDefs(t).some(o => x < +o.item.x + o.def.w && +o.item.x < x + def.w && y < +o.item.y + o.def.h && +o.item.y < y + def.h);
      if (!clash) return { x, y };
    }
    return { x: 1, y: 1 };
  }

  BX.boxOpen = (id) => {
    const src = id ? H.box(S.project, id) : null;
    B = { t: src ? clone(src) : { id: M.uid('box'), name: 'New box', w: 60, h: 40, d: 20, notes: '', items: [] }, sel: null, dirty: !src, isNew: !src };
    renderBox();
    const d = U.$('#boxDlg'); if (!d.open) d.showModal();
  };

  function renderBox(keepFocus = true) {
    const d = U.$('#boxDlg'), t = B.t, p = S.project;
    const act = document.activeElement, key = keepFocus && act && d.contains(act) && act.dataset && act.dataset.bk ? act.dataset.bk + '|' + (act.dataset.res || '') : null;
    const side = U.$('.bx-side', d), sc = side ? side.scrollTop : 0;
    const pr = problems(t), L = itemDefs(t);
    const pal = C.hwCats.map(cat => {
      const list = H.comps(p).filter(c => c.cat === cat.id);
      if (!list.length) return '';
      const open = cat.id === 'controller' || cat.id === 'power' || B['o-' + cat.id];
      return `<details class="rpal" data-bxcat="${cat.id}"${open ? ' open' : ''}><summary>${esc(cat.name)}</summary>${list.map(c => `<div class="pal" draggable="true" data-bxdrag="${esc(c.id)}" title="${esc(c.name)} · ${c.w}×${c.h} cm. Drag into the box, or double-click to add."><span class="sw hw" style="--c:${cat.color}"></span>${esc(c.name)}</div>`).join('')}</details>`;
    }).join('');
    let items = '';
    L.forEach(({ item, def }) => {
      const cat = C.hwCat(def.cat), x = item.x * SC, y = item.y * SC, w = def.w * SC, h = def.h * SC;
      const lbl = item.label || def.name;
      items += `<g class="bx-item${B.sel === item.id ? ' sel' : ''}${pr.bad.has(item.id) ? ' bad' : ''}" data-bxi="${item.id}" style="--c:${cat.color}">${PP.room.shapeFor(def.cat, x, y, w, h)}
        <text class="bx-sym" x="${x + w / 2}" y="${y + h / 2 + (h > 40 ? -2 : 4)}" text-anchor="middle"${w < 45 || h < 25 ? ` style="font-size:${Math.max(6, Math.min(w / 4, h / 2)).toFixed(1)}px"` : ''}>${esc(def.sym)}</text>
        ${h > 40 && w > 60 ? `<text class="bx-lbl" x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle">${esc(lbl.length > w / 6 ? lbl.slice(0, Math.max(3, Math.floor(w / 6) - 1)) + '…' : lbl)}</text>` : ''}
        <title>${esc(lbl)} · ${def.w}×${def.h} cm at ${item.x}, ${item.y} cm</title></g>`;
    });
    let grid = '';
    for (let x = 10; x < t.w; x += 10) grid += `<line x1="${x * SC}" y1="0" x2="${x * SC}" y2="${t.h * SC}"/>`;
    for (let y = 10; y < t.h; y += 10) grid += `<line x1="0" y1="${y * SC}" x2="${t.w * SC}" y2="${y * SC}"/>`;
    const svg = `<svg id="bxsvg" viewBox="-30 -30 ${t.w * SC + 60} ${t.h * SC + 60}" preserveAspectRatio="xMidYMid meet">
      <rect class="bx-base" x="0" y="0" width="${t.w * SC}" height="${t.h * SC}" rx="6" data-bxbg="1"/><g class="bx-grid">${grid}</g>
      <text class="r-dim" x="${t.w * SC / 2}" y="-10" text-anchor="middle">${t.w} cm</text>
      <text class="r-dim" x="-10" y="${t.h * SC / 2}" text-anchor="middle" transform="rotate(-90 -10 ${t.h * SC / 2})">${t.h} cm</text>
      ${items}</svg>`;

    const sel = B.sel && L.find(x => x.item.id === B.sel);
    let selH = '';
    if (sel) {
      const { item, def } = sel, cat = C.hwCat(def.cat);
      const res = Object.keys(def.provides || {}).filter(r => +def.provides[r] > 0);
      selH = `<h4>${esc(def.name)}</h4><p class="muted small">${esc(cat.name)} · ${def.w}×${def.h} cm${def.notes ? '<br>' + esc(def.notes) : ''}</p>
        <div class="ins-grid"><label class="fl wide"><span>Label</span><input data-bk="label" value="${esc(item.label)}" placeholder="${esc(def.name)}"></label>
        <label class="fl"><span>X (cm)</span><input data-bk="x" type="number" step="0.5" value="${item.x}"></label><label class="fl"><span>Y (cm)</span><input data-bk="y" type="number" step="0.5" value="${item.y}"></label></div>
        ${res.length ? `<h4>Operating limits</h4><p class="muted small">Leave blank to use the manufacturer figure. Set lower to plan with headroom.</p><div class="ins-grid">${res.map(r => `<label class="fl"><span>${esc(C.resources[r] ? C.resources[r].name : r)}</span><input data-bk="limit" data-res="${r}" type="number" min="0" value="${item.limits && item.limits[r] != null ? esc(item.limits[r]) : ''}" placeholder="${esc(H.capOf({}, def, r))}"></label>`).join('')}</div>` : ''}
        <div class="ins-actions"><button data-bx="dup">Duplicate</button><button data-bx="del">Remove</button><button data-bx="editComp" data-id="${esc(def.id)}">Edit definition</button></div>`;
    }
    const caps = H.capsFrom(L);
    const users = p.distros.filter(x => x.boxTpl === t.id);
    d.innerHTML = `<div class="dlg-head"><b>Box builder</b><input class="bx-name" data-bk="name" value="${esc(t.name)}" aria-label="Box name"><span class="soft">${B.dirty ? 'unsaved' : H.lib.boxes[t.id] ? 'saved in your library' : 'from this project'}</span><span class="grow"></span>
        <button data-bx="new" title="Start a new empty box">New</button><button data-bx="copy" title="Save a copy with a new name">Save as copy</button>
        <button data-bx="save" class="primary" title="Save to your reusable library${users.length ? ' and update the boxes in this project' : ''}">Save to library</button>
        <button data-bx="place" title="Save, then add one to the current room">Place in room</button><button data-bx="close" class="ib" aria-label="Close">${U.ic('x')}</button></div>
      <div class="bx-body">
        <div class="bx-pal"><div class="muted small" style="padding:4px 6px">Drag parts into the box</div>${pal}<button data-bx="newComp" class="sm" style="margin:6px">+ Custom component</button></div>
        <div class="bx-canvas" id="bxcanvas">${svg}</div>
        <div class="bx-side">
          <div class="ins-grid">
            <label class="fl"><span>Width (cm)</span><input data-bk="w" type="number" min="5" step="1" value="${t.w}"></label>
            <label class="fl"><span>Height (cm)</span><input data-bk="h" type="number" min="5" step="1" value="${t.h}"></label>
            <label class="fl"><span>Depth (cm)</span><input data-bk="d" type="number" min="1" step="1" value="${t.d}"></label>
            <label class="fl wide"><span>Notes</span><input data-bk="notes" value="${esc(t.notes)}" placeholder="Enclosure model, IP rating, gland plate…"></label>
          </div>
          ${selH || '<p class="muted small">Click a part to set its label and operating limits. Drag to move (0.5 cm snap). Delete removes it.</p>'}
          <h4>Box capacity</h4>${PP.room.capHtml(caps, { empty: 'Add boards, a Pi or a switch to see what this box can drive.' })}
          <p class="muted small">Used here = what the box uses itself (for example the board's own Ethernet port). Connections in rooms add to it.</p>
          ${pr.list.length ? `<h4 class="warn">Check</h4><ul class="small">${pr.list.map(x => `<li class="warn">${esc(x)}</li>`).join('')}</ul>` : ''}
          <h4>Contents (${L.length})</h4><div>${L.map(x => `<div class="ins-link${B.sel === x.item.id ? ' on' : ''}" data-bx="sel" data-id="${x.item.id}"><span class="sw hw" style="--c:${C.hwCat(x.def.cat).color}"></span>${esc(x.item.label ? x.item.label + ' · ' : '')}${esc(x.def.name)}</div>`).join('') || '<p class="muted small">Empty.</p>'}</div>
          ${users.length ? `<p class="muted small">${users.length} box${users.length > 1 ? 'es' : ''} in this project use${users.length > 1 ? '' : 's'} this layout: ${users.map(x => esc(x.name)).join(', ')}. Saving adds any new PSUs and boards to ${users.length > 1 ? 'them' : 'it'}.</p>` : ''}
        </div>
      </div>`;
    const side2 = U.$('.bx-side', d); if (side2) side2.scrollTop = sc;
    if (key) { const [k, r] = key.split('|'); const x = U.$$('[data-bk]', d).find(q => q.dataset.bk === k && (q.dataset.res || '') === r); if (x) x.focus({ preventScroll: true }); }
  }

  function saveBox(asCopy) {
    const t = clone(B.t);
    if (asCopy) { t.id = M.uid('box'); t.name = t.name.replace(/( copy)?$/, ' copy'); }
    H.put('boxes', t);
    const users = S.project.distros.filter(x => x.boxTpl === t.id);
    let log = [];
    if (users.length) S.commit('syncBox', p => { p.hw.boxes[t.id] = clone(t); p.distros.filter(x => x.boxTpl === t.id).forEach(dd => { log = log.concat(H.syncBox(p, dd).map(s => dd.name + ': ' + s)); }); });
    B.t = t; B.dirty = false; B.isNew = false;
    renderBox(false);
    U.toast(`Saved ${t.name} to your library.${log.length ? ' ' + log.join('; ') + '.' : ''}`, log.length ? 6000 : 3200);
  }
  const addItem = (compId, pos) => {
    const def = H.comp(S.project, compId); if (!def) return;
    const at = pos || freeSpot(B.t, def);
    const it = { id: M.uid('bi'), comp: compId, x: r1(Math.max(0, Math.min(B.t.w - def.w, at.x))), y: r1(Math.max(0, Math.min(B.t.h - def.h, at.y))), label: '', limits: {} };
    B.t.items.push(it); B.sel = it.id; B.dirty = true; renderBox();
  };
  const toBox = (ev) => { const svg = U.$('#bxsvg'); const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return { x: q.x / SC, y: q.y / SC }; };
  const confirmDiscard = async () => !B || !B.dirty || !B.t.items.length || await U.ask({ title: 'Discard changes to this box?', body: 'It has not been saved to your library.', ok: 'Discard', danger: true });

  async function boxClick(ev) {
    const b = ev.target.closest('[data-bx]'); if (!b) return;
    const a = b.dataset.bx, t = B.t;
    if (a === 'close') { if (await confirmDiscard()) { U.$('#boxDlg').close(); B = null; } }
    else if (a === 'new') { if (await confirmDiscard()) BX.boxOpen(null); }
    else if (a === 'save') saveBox(false);
    else if (a === 'copy') saveBox(true);
    else if (a === 'place') {
      if (!t.items.length) return U.toast('Add some parts to the box first.');
      saveBox(false);
      U.$('#boxDlg').close();
      PP.setView('room');
      S.commit('placeBox', p => { const room = PP.room.current(p); const r = H.placeBox(p, t.id, room, Math.round(room.w / 2), Math.round(room.h / 2)); if (r) S.selection = r.node.id; });
      U.toast(`Placed ${t.name} in the room. Drag it into position.`);
    }
    else if (a === 'sel') { B.sel = b.dataset.id; renderBox(); }
    else if (a === 'dup') { const it = t.items.find(x => x.id === B.sel); if (!it) return; const def = H.comp(S.project, it.comp); const c = clone(it); c.id = M.uid('bi'); const at = freeSpot(t, def); c.x = at.x; c.y = at.y; t.items.push(c); B.sel = c.id; B.dirty = true; renderBox(); }
    else if (a === 'del') { t.items = t.items.filter(x => x.id !== B.sel); B.sel = null; B.dirty = true; renderBox(); }
    else if (a === 'editComp') BX.compOpen(b.dataset.id, () => renderBox());
    else if (a === 'newComp') BX.compOpen(null, (c) => { addItem(c.id); });
  }
  function boxChange(ev) {
    const el = ev.target, k = el.dataset.bk; if (!k) return;
    const t = B.t, it = t.items.find(x => x.id === B.sel);
    if (k === 'name') t.name = el.value.trim() || 'Box';
    else if (k === 'notes') t.notes = el.value;
    else if (k === 'w' || k === 'h' || k === 'd') t[k] = Math.max(k === 'd' ? 1 : 5, numOr(el.value, t[k]));
    else if (!it) return;
    else if (k === 'label') it.label = el.value;
    else if (k === 'x' || k === 'y') it[k] = r1(Math.max(0, numOr(el.value, it[k])));
    else if (k === 'limit') { it.limits = it.limits || {}; const v = el.value.trim(); if (v === '') delete it.limits[el.dataset.res]; else it.limits[el.dataset.res] = Math.max(0, numOr(v, 0)); }
    B.dirty = true; renderBox();
  }

  // ================= component editor =================
  const blankComp = () => ({ id: M.uid('my'), name: 'My device', cat: 'custom', sym: 'DEV', w: 8, h: 6, ports: {}, provides: {}, limits: {}, consumes: {}, internal: {}, notes: '', builtin: false });
  BX.compOpen = (id, done) => {
    const src = id ? H.comp(S.project, id) : null;
    CE = { c: src ? clone(src) : blankComp(), isNew: !src, done };
    renderComp();
    const d = U.$('#compDlg'); d.returnValue = ''; if (!d.open) d.showModal();
  };
  function renderComp() {
    const c = CE.c, d = U.$('#compDlg');
    const isBuiltin = !!H.builtin[c.id], edited = isBuiltin && H.lib.components[c.id];
    const res = Object.keys(C.resources);
    const cell = (grp, r) => `<td><input type="number" min="0" data-cg="${grp}" data-res="${r}" value="${c[grp] && c[grp][r] != null ? esc(c[grp][r]) : ''}"></td>`;
    d.innerHTML = `<form method="dialog" data-ce="1"><div class="dlg-head"><b>${CE.isNew ? 'New component' : 'Edit component'}</b><span class="soft">${isBuiltin ? (edited ? 'built-in, edited in your library' : 'built-in') : 'your component'}</span></div>
      <div class="dlg-body">
        <div class="ins-grid">
          <label class="fl wide"><span>Name</span><input data-ck="name" value="${esc(c.name)}" required></label>
          <label class="fl"><span>Category</span><select data-ck="cat">${C.hwCats.map(x => U.opt(x.id, x.name, c.cat)).join('')}</select></label>
          <label class="fl"><span>Symbol</span><input data-ck="sym" value="${esc(c.sym)}" maxlength="5" title="Up to 5 characters shown on the drawing"></label>
          <label class="fl"><span>Width (cm)</span><input data-ck="w" type="number" min="1" step="0.5" value="${c.w}"></label>
          <label class="fl"><span>Depth (cm)</span><input data-ck="h" type="number" min="1" step="0.5" value="${c.h}"></label>
          <label class="fl wide"><span>Notes</span><input data-ck="notes" value="${esc(c.notes)}"></label>
        </div>
        <h4>Connections</h4><p class="muted small">How many of each connector it has. Cables in rooms can only use types both ends have.</p>
        <div class="ce-ports">${C.portTypes.filter(t => t.id !== 'custom').map(t => `<label class="fl"><span><span class="sw hw" style="--c:${t.color}"></span>${esc(t.name)}</span><input type="number" min="0" data-cg="ports" data-res="${t.id}" value="${c.ports && c.ports[t.id] ? c.ports[t.id] : ''}"></label>`).join('')}</div>
        <h4>Capacity</h4><p class="muted small"><b>Provides</b>: what it offers (manufacturer figure). <b>Limit</b>: your operating limit, if lower. <b>Uses when connected</b>: what it takes from the item it's cabled to (blank = 1). <b>Uses inside a box</b>: what it takes from other parts in the same box.</p>
        <table class="mini ce-res"><tr><th></th><th>Provides</th><th>Limit</th><th>Uses when connected</th><th>Uses inside a box</th></tr>
          ${res.map(r => `<tr><td>${esc(C.resources[r].name)}${C.resources[r].unit ? ' (' + esc(C.resources[r].unit) + ')' : ''}</td>${cell('provides', r)}${cell('limits', r)}${cell('consumes', r)}${cell('internal', r)}</tr>`).join('')}</table>
      </div>
      <div class="dlg-foot">${edited ? '<button type="button" data-ce-act="reset">Reset to built-in</button>' : ''}<span class="grow"></span><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Save to library</button></div></form>`;
  }
  function compRead() {
    const d = U.$('#compDlg'), c = CE.c;
    U.$$('[data-ck]', d).forEach(el => { const k = el.dataset.ck; c[k] = (k === 'w' || k === 'h') ? Math.max(1, numOr(el.value, c[k])) : el.value; });
    c.name = String(c.name).trim() || 'Device'; c.sym = String(c.sym).trim().slice(0, 5) || '?';
    ['ports', 'provides', 'limits', 'consumes', 'internal'].forEach(g => { c[g] = {}; });
    U.$$('[data-cg]', d).forEach(el => { const v = el.value.trim(); if (v === '') return; const n = Math.max(0, numOr(v, 0)); if (el.dataset.cg === 'ports' && !n) return; c[el.dataset.cg][el.dataset.res] = n; });
    c.builtin = false;
    return c;
  }

  // ================= library dialog =================
  BX.libOpen = (tab) => { if (tab) LT = tab; renderLib(); const d = U.$('#libDlg'); if (!d.open) d.showModal(); };
  const source = (kind, id) => {
    const inLib = !!H.lib[kind][id], inProj = !!S.project.hw[kind][id];
    if (kind === 'components' && H.builtin[id]) return inLib ? 'built-in, edited' : 'built-in';
    return inLib ? (inProj ? 'library · used here' : 'library') : 'this project only';
  };
  function renderLib() {
    const d = U.$('#libDlg'), p = S.project;
    const tabs = [['cables', 'Cable standards'], ['components', 'Components'], ['boxes', 'Controller boxes'], ['share', 'Share']];
    let body = '';
    if (LT === 'cables') {
      const used = new Map(); p.rooms.forEach(r => r.cables.forEach(c => { if (c.std) used.set(c.std, (used.get(c.std) || 0) + 1); }));
      body = `<p class="muted small">Standard cable lengths you stock. Pick one on a room cable and the app checks it is long enough. Colours draw the cable in the room and label it in the guide. Changes save straight to your library.</p>
        <table class="mini lib-t"><tr><th>Colour</th><th>Name</th><th>Type</th><th>Length (m)</th><th>Tag</th><th>Connector</th><th>Notes</th><th>Used</th><th></th></tr>
        ${H.stds(p).map(s => `<tr data-lid="${esc(s.id)}"><td><input type="color" data-lk="color" value="${esc(/^#[0-9a-f]{6}$/i.test(s.color) ? s.color : '#999999')}" aria-label="Colour"></td>
          <td><input data-lk="name" value="${esc(s.name)}"></td><td><select data-lk="type">${C.portTypes.map(t => U.opt(t.id, t.name, s.type)).join('')}</select></td>
          <td><input data-lk="length" type="number" min="0.1" step="0.5" value="${esc(s.length)}" class="tiny"></td><td><input data-lk="tag" value="${esc(s.tag)}" class="tiny" placeholder="Blue"></td>
          <td><input data-lk="connector" value="${esc(s.connector)}"></td><td><input data-lk="notes" value="${esc(s.notes)}"></td>
          <td class="num">${used.get(s.id) || ''}<div class="soft small">${esc(source('cables', s.id))}</div></td><td><button class="icon sm" data-l="delStd" data-id="${esc(s.id)}" aria-label="Delete ${esc(H.stdName(s))}">${U.ic('x')}</button></td></tr>`).join('')}</table>
        <div class="ins-actions"><button data-l="addStd">+ Cable standard</button></div>`;
    } else if (LT === 'components') {
      body = `<p class="muted small">Every part you can drop into a room or a box. Edit a built-in to change its size, ports or limits (you can reset it later), or add your own sensors, actuators and effects.</p><div class="ins-actions"><button data-l="newComp" class="primary">+ New component</button></div>`;
      C.hwCats.forEach(cat => {
        const list = H.comps(p).filter(c => c.cat === cat.id); if (!list.length) return;
        body += `<h4><span class="sw hw" style="--c:${cat.color}"></span>${esc(cat.name)}</h4><table class="mini lib-t">${list.map(c => `<tr><td><b>${esc(c.name)}</b> <span class="soft">${esc(c.sym)}</span><div class="soft small">${esc(Object.keys(c.ports || {}).filter(k => c.ports[k] > 0).map(k => C.portType(k).name + (c.ports[k] > 1 ? ' ×' + c.ports[k] : '')).join(', '))}</div></td>
          <td class="soft small">${c.w}×${c.h} cm</td><td class="soft small">${esc(source('components', c.id))}</td>
          <td class="num"><button class="sm" data-l="editComp" data-id="${esc(c.id)}">Edit</button>${!H.builtin[c.id] && H.lib.components[c.id] ? ` <button class="icon sm" data-l="delComp" data-id="${esc(c.id)}" aria-label="Delete ${esc(c.name)}">${U.ic('x')}</button>` : ''}</td></tr>`).join('')}</table>`;
      });
    } else if (LT === 'boxes') {
      const bx = H.boxes(p);
      body = `<p class="muted small">Reusable controller box layouts. Placing one in a room creates a distro with its PSUs and boards, ready to wire in the Form.</p><div class="ins-actions"><button data-l="newBox" class="primary">+ New box</button></div>
        <table class="mini lib-t">${bx.map(b => { const caps = H.capRows(H.capsFrom(itemDefs(b))); return `<tr><td><b>${esc(b.name)}</b><div class="soft small">${b.w}×${b.h}×${b.d} cm · ${b.items.length} parts${b.notes ? ' · ' + esc(b.notes) : ''}</div><div class="soft small">${caps.slice(0, 5).map(c => esc(c.name) + ' ' + c.cap.toLocaleString() + (c.unit ? ' ' + c.unit : '')).join(' · ')}</div></td>
          <td class="soft small">${esc(source('boxes', b.id))}</td>
          <td class="num"><button class="sm" data-l="editBox" data-id="${esc(b.id)}">Edit</button> <button class="sm" data-l="placeBox" data-id="${esc(b.id)}">Place in room</button>${H.lib.boxes[b.id] ? ` <button class="icon sm" data-l="delBox" data-id="${esc(b.id)}" aria-label="Delete ${esc(b.name)}">${U.ic('x')}</button>` : ''}</td></tr>`; }).join('') || '<tr><td class="muted">No boxes yet.</td></tr>'}</table>`;
    } else {
      const n = k => Object.keys(H.lib[k]).length, np = k => Object.keys(p.hw[k]).length;
      body = `<p>Your library lives in this browser and is shared by every project you open here. Projects also keep their own copy of the hardware they use, so a saved project opens the same anywhere.</p>
        <table class="mini"><tr><th></th><th>Your library</th><th>This project</th></tr><tr><td>Cable standards</td><td class="num">${n('cables')}</td><td class="num">${np('cables')}</td></tr><tr><td>Components (custom or edited)</td><td class="num">${n('components')}</td><td class="num">${np('components')}</td></tr><tr><td>Controller boxes</td><td class="num">${n('boxes')}</td><td class="num">${np('boxes')}</td></tr></table>
        <h4>Move it to another computer</h4><div class="ins-actions"><button data-l="export" class="primary">Export library…</button><button data-l="import">Import library…</button><input type="file" id="libFile" accept=".json,application/json" hidden></div>
        <h4>This project</h4><div class="ins-actions"><button data-l="push" title="Copy the cables, parts and boxes this project uses into your library">Add this project's hardware to my library</button><button data-l="pull" title="Replace this project's copies with the versions in your library">Update this project from my library</button></div>
        <p class="muted small">Import adds to your library and replaces items with the same id.</p>`;
    }
    d.innerHTML = `<div class="dlg-head"><b>Hardware library</b><div class="seg sm">${tabs.map(([k, l]) => `<button data-l="tab" data-id="${k}" class="${LT === k ? 'on' : ''}">${l}</button>`).join('')}</div><span class="grow"></span><button data-l="close" class="ib" aria-label="Close">${U.ic('x')}</button></div><div class="dlg-body">${body}</div>`;
  }
  const stdSave = (id, f, v) => { const s = clone(H.std(S.project, id)); s[f] = f === 'length' ? Math.max(0.1, numOr(v, s.length)) : v; H.put('cables', s); };
  async function libClick(ev) {
    const b = ev.target.closest('[data-l]'); if (!b) return;
    const a = b.dataset.l, id = b.dataset.id, p = S.project;
    if (a === 'close') U.$('#libDlg').close();
    else if (a === 'tab') { LT = id; renderLib(); }
    else if (a === 'addStd') { H.put('cables', { id: M.uid('std'), name: 'New cable', type: 'pixel', length: 5, color: '#a855f7', tag: 'Purple', connector: '', notes: '' }); renderLib(); }
    else if (a === 'delStd') {
      const s = H.std(p, id), inUse = p.rooms.some(r => r.cables.some(c => c.std === id));
      if (!(await U.ask({ title: `Delete ${H.stdName(s)}?`, body: inUse ? 'Cables in this project that use it keep their own copy.' : 'It is removed from your library.', ok: 'Delete', danger: true }))) return;
      H.remove('cables', id);
      if (!inUse && p.hw.cables[id]) S.commit('dropStd', q => { delete q.hw.cables[id]; });
      renderLib();
    }
    else if (a === 'newComp') BX.compOpen(null, () => renderLib());
    else if (a === 'editComp') BX.compOpen(id, () => renderLib());
    else if (a === 'delComp') { if (await U.ask({ title: 'Delete this component?', body: 'Projects that use it keep their own copy.', ok: 'Delete', danger: true })) { H.remove('components', id); renderLib(); } }
    else if (a === 'newBox') { U.$('#libDlg').close(); BX.boxOpen(null); }
    else if (a === 'editBox') { U.$('#libDlg').close(); BX.boxOpen(id); }
    else if (a === 'placeBox') {
      U.$('#libDlg').close(); PP.setView('room');
      S.commit('placeBox', q => { const room = PP.room.current(q); const r = H.placeBox(q, id, room, Math.round(room.w / 2), Math.round(room.h / 2)); if (r) S.selection = r.node.id; });
    }
    else if (a === 'delBox') { if (await U.ask({ title: 'Delete this box from your library?', body: 'Boxes already placed in projects keep their layout.', ok: 'Delete', danger: true })) { H.remove('boxes', id); renderLib(); } }
    else if (a === 'export') U.download('pixel-planner-library.json', H.exportLib());
    else if (a === 'import') U.$('#libFile').click();
    else if (a === 'push') { const n = H.pushToLibrary(p); U.toast(`${n} item${n === 1 ? '' : 's'} added to your library.`); renderLib(); }
    else if (a === 'pull') { let n = 0; S.commit('pullLib', q => { n = H.pullFromLibrary(q); }); U.toast(`${n} item${n === 1 ? '' : 's'} updated from your library.`); renderLib(); }
  }
  function libChange(ev) {
    const el = ev.target;
    if (el.id === 'libFile') {
      const f = el.files[0]; el.value = ''; if (!f) return;
      f.text().then(t => { try { const n = H.importLib(t); U.toast(`Imported ${n} item${n === 1 ? '' : 's'}.`); renderLib(); if (PP.render) PP.render(); } catch (e) { U.toast('Could not import: ' + e.message, 5000); } });
      return;
    }
    const tr = el.closest('[data-lid]'); if (!tr || !el.dataset.lk) return;
    stdSave(tr.dataset.lid, el.dataset.lk, el.value);
  }

  // Actions reachable from the main UI (data-act).
  BX.actions = {
    boxOpen: () => BX.boxOpen(null),
    boxEdit: (id) => BX.boxOpen(id),
    libOpen: () => BX.libOpen(),
    libEditComp: (id) => BX.compOpen(id)
  };

  BX.init = () => {
    const bd = U.$('#boxDlg'), cd = U.$('#compDlg'), ld = U.$('#libDlg');
    bd.addEventListener('click', boxClick);
    bd.addEventListener('change', ev => { if (B) boxChange(ev); });
    bd.addEventListener('cancel', async ev => { ev.preventDefault(); if (await confirmDiscard()) { bd.close(); B = null; } });
    bd.addEventListener('toggle', ev => { const x = ev.target; if (B && x.dataset && x.dataset.bxcat) B['o-' + x.dataset.bxcat] = x.open; }, true);
    bd.addEventListener('keydown', ev => {
      if ((ev.key === 'Delete' || ev.key === 'Backspace') && B && B.sel && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
        ev.preventDefault(); ev.stopPropagation(); B.t.items = B.t.items.filter(x => x.id !== B.sel); B.sel = null; B.dirty = true; renderBox();
      }
    });
    bd.addEventListener('dragstart', ev => { const el = ev.target.closest('[data-bxdrag]'); if (el) { ev.dataTransfer.setData('text/plain', 'bx:' + el.dataset.bxdrag); ev.dataTransfer.effectAllowed = 'copy'; } });
    bd.addEventListener('dblclick', ev => { const el = ev.target.closest('[data-bxdrag]'); if (el && B) addItem(el.dataset.bxdrag); });
    bd.addEventListener('dragover', ev => { if (ev.target.closest('#bxcanvas')) ev.preventDefault(); });
    bd.addEventListener('drop', ev => {
      if (!ev.target.closest('#bxcanvas') || !B) return;
      ev.preventDefault();
      const v = ev.dataTransfer.getData('text/plain'); if (!v.startsWith('bx:')) return;
      const id = v.slice(3), def = H.comp(S.project, id); if (!def) return;
      const q = toBox(ev); addItem(id, { x: q.x - def.w / 2, y: q.y - def.h / 2 });
    });
    bd.addEventListener('pointerdown', ev => {
      if (!B || ev.button !== 0) return;
      const g = ev.target.closest('[data-bxi]');
      if (!g) { if (ev.target.closest('[data-bxbg]')) { B.sel = null; renderBox(); } return; }
      const it = B.t.items.find(x => x.id === g.dataset.bxi), def = H.comp(S.project, it.comp);
      const q = toBox(ev);
      B.drag = { it, def, dx: q.x - it.x, dy: q.y - it.y, moved: false, svg: U.$('#bxsvg') };
      B.drag.svg.setPointerCapture(ev.pointerId);
      if (B.sel !== it.id) { B.sel = it.id; renderBox(); B.drag.svg = U.$('#bxsvg'); B.drag.svg.setPointerCapture(ev.pointerId); }
    });
    bd.addEventListener('pointermove', ev => {
      if (!B || !B.drag) return;
      const dr = B.drag, q = toBox(ev);
      const x = r1(Math.max(0, Math.min(B.t.w - dr.def.w, q.x - dr.dx))), y = r1(Math.max(0, Math.min(B.t.h - dr.def.h, q.y - dr.dy)));
      if (x === dr.it.x && y === dr.it.y) return;
      dr.it.x = x; dr.it.y = y; dr.moved = true; B.dirty = true;
      renderBox(false); dr.svg = U.$('#bxsvg'); try { dr.svg.setPointerCapture(ev.pointerId); } catch (e) { }
    });
    const up = () => { if (B && B.drag) B.drag = null; };
    bd.addEventListener('pointerup', up); bd.addEventListener('pointercancel', up);

    cd.addEventListener('click', ev => {
      const b = ev.target.closest('[data-ce-act="reset"]'); if (!b) return;
      const id = CE.c.id;
      H.remove('components', id);
      if (S.project.hw.components[id]) S.commit('resetComp', q => { q.hw.components[id] = clone(H.builtin[id]); });
      const done = CE.done; cd.close(); CE = null; if (done) done(H.builtin[id]);
      U.toast('Back to the built-in definition.');
    });
    cd.addEventListener('close', () => {
      if (!CE) return;
      const st = CE; CE = null;
      if (cd.returnValue !== 'ok') return;
      CE = st; const c = compRead(); CE = null;
      H.put('components', c);
      if (st.done) st.done(c);
      U.toast(`Saved ${c.name}.`);
    });

    ld.addEventListener('click', libClick);
    ld.addEventListener('change', libChange);
  };
})();

</script>
<script>
// Bootstrap, rendering loop, actions, files and shortcuts.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc, S = PP.store, F = PP.form, V = PP.visual;
  const esc = U.esc;
  let drawerOpen = false, fitted = false;

  // ---------- render ----------
  function render() {
    const p = S.project;
    const t0 = performance.now();
    const R = K.run(p);
    U.lastR = R;
    U.$('#projName').value = p.name;
    document.title = `${p.name} — ${PP.APP_NAME}`;
    summary(p, R);
    if (U.section === 'power') paint(U.$('#powerPage'), F.powerPage(p, R));
    else if (U.section === 'presets') paint(U.$('#presetsPage'), F.presetsPage(p, R));
    else {
      if (U.view !== 'visual' && U.view !== 'room') F.render(p, R);
      if (U.view === 'split' || U.view === 'visual') { V.renderPalette(p); V.render(p, R); }
      if (U.view === 'visual') inspector(p, R);
      if (U.view === 'room') { PP.room.renderTools(p); PP.room.renderPalette(p); PP.room.render(p, R); PP.room.inspector(p, R); }
    }
    status(p, R);
    U._renderMs = performance.now() - t0;
  }

  function onSelect() {
    const p = S.project, R = U.lastR;
    if (U.section !== 'workspace') return;
    if (U.view === 'room') { PP.room.render(p, R); PP.room.inspector(p, R); return; }
    if (U.view !== 'visual') F.markSelection(true);
    if (U.view !== 'form') V.render(p, R);
    if (U.view === 'visual') inspector(p, R);
  }

  function inspector(p, R) {
    const el = U.$('#inspector');
    const act = document.activeElement;
    const key = act && el.contains(act) && act.dataset && act.dataset.id ? act.dataset.id + '|' + act.dataset.f : null;
    const sc = el.scrollTop;
    el.innerHTML = F.inspector(p, R, S.selection);
    el.scrollTop = sc;
    if (key) { const [id, f] = key.split('|'); const x = U.$$('[data-id]', el).find(e => e.dataset.id === id && e.dataset.f === f); if (x) x.focus({ preventScroll: true }); }
    const s = S.selection && document.getElementById('f-' + S.selection);
    if (s && el.contains(s)) s.classList.add('sel');
  }

  // Four headline cards; Plan checks names the one thing to fix first.
  function summary(p, R) {
    const T = R.totals, st = p.settings;
    const psuPct = T.psuCapA ? T.psuA / T.psuCapA * 100 : 0;
    const busiest = Array.from(R.distros.entries()).sort((a, b) => b[1].mainsA - a[1].mainsA)[0];
    const portsUsed = Array.from(R.ports.values()).filter(r => r.pixels).length;
    const card = (k, v, s = '', cls = '', extra = '') => `<div class="card stat ${cls}" ${extra}><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
    const c = R.counts, first = R.warnings.find(w => w.level === 'error') || R.warnings.find(w => w.level === 'warn');
    const pc = U.pctClass(psuPct, st.psuTargetPct);
    let head, sub;
    if (c.error) { head = `<span class="err">${c.error} to fix</span>`; sub = c.warn ? `and ${c.warn} warning${c.warn > 1 ? 's' : ''}` : 'before you build'; }
    else if (c.warn) { head = `<span class="warn">${c.warn} to review</span>`; sub = 'no blockers'; }
    else { head = '<span class="ok">Ready to build</span>'; sub = 'no errors or warnings'; }
    U.$('#summary').innerHTML =
      card('Pixels and channels', T.pixels.toLocaleString(), `${T.channels.toLocaleString()} ch · ${T.universes} universe${T.universes === 1 ? '' : 's'} · ${portsUsed} port${portsUsed === 1 ? '' : 's'}`) +
      card('Estimated load', K.fmtW(T.dcW), `${U.num(T.mainsA, 1)} A mains${busiest ? ` · busiest ${esc(p.distros.find(d => d.id === busiest[0]).name)} ${U.num(busiest[1].mainsA, 1)} of ${st.mainsCircuitA} A` : ''}`, '', `title="Full white at ${st.brightness}% brightness, ${st.mainsV} V, ${st.psuEfficiency}% PSU efficiency"`) +
      card('PSU design budget', `<span class="${pc}">${U.num(psuPct, 0)}%</span><span class="bar ${pc}" aria-hidden="true"><i style="width:${Math.min(100, psuPct)}%"></i><span class="tgt" style="left:${st.psuTargetPct}%"></span></span>`, `${K.fmtA(T.psuA)} of ${U.num(T.psuCapA, 0)} A · target ${st.psuTargetPct}%`, 'budget', 'data-nav="power" title="Open Hardware and power"') +
      card('Plan checks', head, `${first ? '<b>Fix first:</b> ' + esc(first.msg) : sub}`, 'checks' + (c.error ? ' has-err' : c.warn ? ' has-warn' : ''), `data-act="warnings" role="button" tabindex="0" title="Show every check and the assumptions behind them"`);
  }

  function status(p, R) {
    const c = R.counts;
    const badge = U.$('#checkBadge');
    badge.textContent = c.error || c.warn || '';
    badge.className = 'badge' + (c.error ? ' err' : c.warn ? ' warn' : '');
    U.$('#fileInfo').innerHTML = `${esc(S.fileName || 'Not saved to a file yet')}${S.dirty && S.fileName ? ' <span class="warn">· unsaved changes</span>' : ''} <span class="soft">· autosaved in this browser</span>`;
    U.$('[data-act="undo"]').disabled = !S.undo.length;
    U.$('[data-act="redo"]').disabled = !S.redo.length;
    const b = U.$('#brightRange'); if (document.activeElement !== b) b.value = p.settings.brightness;
    U.$('#brightVal').textContent = p.settings.brightness + '%';
    const item = w => `<div class="wi ${w.level}" data-act="jump" data-id="${esc(w.ref || '')}"><span class="lvl">${w.level === 'error' ? 'Fix' : w.level === 'warn' ? 'Review' : 'Note'}</span><span>${esc(w.msg)}</span></div>`;
    const grp = (title, list, open) => list.length ? `<details class="wgrp"${open ? ' open' : ''}><summary>${title} <span class="soft">${list.length}</span></summary>${list.map(item).join('')}</details>` : '';
    const E = R.warnings.filter(w => w.level === 'error'), W = R.warnings.filter(w => w.level === 'warn'), I = R.warnings.filter(w => w.level === 'info');
    const first = E[0] || W[0];
    U.$('#warnList').innerHTML =
      (first ? `<div class="fixfirst ${first.level}" data-act="jump" data-id="${esc(first.ref || '')}"><b>Fix first</b><span>${esc(first.msg)}</span></div>` : '<div class="fixfirst ok"><b>Ready to build</b><span>No errors or warnings. Check the assumptions below still match your hardware.</span></div>') +
      grp('Errors: fix before you build', E, true) + grp('Warnings: worth reviewing', W, !E.length) + grp('Notes', I, false) +
      `<details class="wgrp"><summary>Assumptions <span class="soft">${R.assumptions.length}</span></summary><dl class="assume">${R.assumptions.map(a => `<dt>${esc(a.k)}</dt><dd>${esc(a.v)}</dd>`).join('')}</dl></details>`;
    U.$('#warnDrawer').hidden = !drawerOpen;
  }

  // ---------- sections (sidebar / mobile tabs) ----------
  function paint(el, html) {
    const act = document.activeElement;
    const key = act && el.contains(act) && act.dataset && act.dataset.id ? act.dataset.id + '|' + act.dataset.f : null;
    const sc = el.scrollTop;
    el.innerHTML = html; el.scrollTop = sc;
    if (key) { const [id, f] = key.split('|'); const x = U.$$('[data-id]', el).find(q => q.dataset.id === id && q.dataset.f === f); if (x) x.focus({ preventScroll: true }); }
  }
  function setSection(s) {
    U.section = s;
    document.body.className = 'sec-' + s;
    U.$$('.side [data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === s));
    try { localStorage.setItem('pixelplanner.section', s); } catch (e) { }
    marks();
    render();
    if (s === 'workspace') { if (U.view === 'room') PP.room.fitOnce(); else if (U.view !== 'form' && !fitted) requestAnimationFrame(() => { V.fit(); fitted = true; }); }
  }
  function marks() {
    const tab = U.section === 'workspace' ? (U.view === 'split' ? 'form' : U.view) : U.section;
    U.$$('.tabbar [data-tab]').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  }
  PP.setSection = setSection;

  // ---------- view ----------
  function setView(v) {
    U.view = v;
    if (U.section !== 'workspace') { U.section = 'workspace'; document.body.className = 'sec-workspace'; U.$$('.side [data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === 'workspace')); try { localStorage.setItem('pixelplanner.section', 'workspace'); } catch (e) { } }
    U.$('#main').className = 'mode-' + v;
    U.$$('.seg [data-view]').forEach(b => { b.classList.toggle('on', b.dataset.view === v); b.setAttribute('aria-selected', b.dataset.view === v); });
    try { localStorage.setItem('pixelplanner.view', v); } catch (e) { }
    marks();
    render();
    if (v === 'room') PP.room.fitOnce();
    else if (v !== 'form' && !fitted) requestAnimationFrame(() => { V.fit(); fitted = true; });
  }
  PP.setView = setView;

  // ---------- field binding ----------
  function entity(p, id) {
    if (id === 'project') return p;
    if (id === 'settings') return p.settings;
    if (id.startsWith('preset:')) return p.library.presets.find(x => 'preset:' + x.id === id);
    const e = M.find(p, id); return e ? e.obj : null;
  }
  function setPath(o, path, v) { const k = path.split('.'); while (k.length > 1) { const x = k.shift(); o[x] = o[x] || {}; o = o[x]; } o[k[0]] = v; }
  function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }

  function onField(el) {
    const id = el.dataset.id, f = el.dataset.f, t = el.dataset.t || 'str';
    let v = t === 'bool' ? el.checked : el.value;
    S.commit('field:' + f, p => {
      const o = entity(p, id); if (!o) return;
      if (t === 'num') {
        const n = parseFloat(v);
        if (String(v).trim() === '' && ['w', 'h', 'slack', 'len'].includes(f) && (o.kind || o.a)) { o[f] = null; return; }
        if (String(v).trim() === '' && f === 'spacing' && id.startsWith('preset:')) { o.spacing = null; return; }
        if (!isFinite(n)) return;
        v = n;
        if (f === 'brightness') v = Math.min(100, Math.max(1, v));
        if (['count', 'length', 'spacing', 'amps', 'psuSlots', 'boardSlots', 'customA', 'customV', 'w', 'h', 'len', 'slack', 'pixels', 'cableSlackM'].includes(f) || f.endsWith('.length')) v = Math.max(0, v);
        if (f === 'count') v = Math.max(1, Math.round(v));
        if (f === 'grid') v = Math.max(0.05, v);
        if (f === 'pixels') v = Math.round(v);
        if (f === 'rot') v = ((Math.round(v) % 360) + 360) % 360;
        if ((f === 'w' || f === 'h') && o.nodes) v = Math.max(1, v);
      }
      if (f.startsWith('banks.')) v = v || null;
      if (f === 'psuId') v = v || null;
      if (f === 'portId') v = v || null;
      if (f === 'board') { M.changeBoard(o, v); return; }
      setPath(o, f, v);
      if (PP.room) PP.room.afterField(p, o, f);
      if (f === 'size') { const s = C.distroSizes.find(x => x.id === v); if (s && v !== 'custom') { o.psuSlots = s.psuSlots; o.boardSlots = s.boardSlots; } }
      if (f === 'model') { const sp = M.psuSpec(o); o.vout = sp.v; }
      if (f === 'customV' && o.model === 'custom') o.vout = v;
      if (f === 'typeId' && o.kind === 'pixels') { const ty = M.pixelType(p, v); if (ty) { o.spacing = ty.spacing; o.gauge = ty.gauge; } }
    });
  }

  // ---------- helpers for actions ----------
  const portCtx = (p, id) => M.find(p, id);
  const bankPsu = (e) => {
    const b = C.boards[e.controller.board];
    const bk = b.banks.find(x => x.ports.includes(e.port.num));
    return (bk && e.controller.banks[bk.id]) || (e.distro.psus[0] || {}).id || null;
  };
  function mergeSplits(chain) {
    const out = [];
    chain.forEach(it => {
      const prev = out[out.length - 1];
      if (it.kind === 'pixels' && it.continued && prev && prev.kind === 'pixels' && prev.typeId === it.typeId) { prev.count += it.count; return; }
      out.push(it);
    });
    out.forEach(it => { if (it.kind === 'pixels') { delete it.continued; delete it.tapOffset; } });
    return out;
  }
  const uniq = a => Array.from(new Set(a));

  // ---------- actions ----------
  const A = {
    async new() {
      if (S.dirty && !(await U.ask({ title: 'Start a new project?', body: 'Changes not saved to a file will be lost (the current project stays in this browser only until you start the new one).', ok: 'Start new' }))) return;
      S.load(M.newProject()); fitted = false; U.cam = { x: 20, y: 20, k: 1 };
    },
    async demo() {
      if (S.dirty && !(await U.ask({ title: 'Load the demo show?', body: 'This replaces the current project. Save it first if you want to keep it.', ok: 'Load demo' }))) return;
      S.load(M.demoProject()); fitted = false; if (U.view !== 'form') requestAnimationFrame(() => { V.fit(); fitted = true; });
    },
    open: () => openFile(),
    save: () => saveFile(false),
    saveAs: () => saveFile(true),
    undo: () => S.doUndo(),
    redo: () => S.doRedo(),
    guide: () => PP.guide.open(),
    printGuide: () => PP.guide.open({ print: true }),
    help: () => PP.help.open('use'),
    suggest: () => PP.help.suggest(),
    whatsnew: () => PP.help.open('news'),
    theme: () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'),
    themeSystem: () => { setTheme('system'); U.toast('Following your system theme.'); },
    warnings: () => { drawerOpen = !drawerOpen; U.$('#warnDrawer').hidden = !drawerOpen; },
    jump: (id) => {
      if (!id) return;
      const e = M.find(S.project, id);
      if (e && (e.type === 'rnode' || e.type === 'rcable' || e.type === 'room')) {
        const changed = U.roomId !== e.room.id; U.roomId = e.room.id;
        S.selection = e.type === 'room' ? null : id;
        if (U.view !== 'room') setView('room'); else if (changed) { PP.room.refit(); render(); PP.room.fitOnce(); } else onSelect();
        return;
      }
      if (e && U.view === 'room') { S.selection = id; setView(e.type === 'distro' ? 'room' : 'split'); return; }
      if (U.section !== 'workspace') { S.selection = id; if (e && e.type === 'item') U.open.add('pt-' + e.port.id); setView(U.view); return; }
      if (S.selection === id) onSelect(); else S.select(id);
    },
    select: (id) => S.select(id),
    fit: () => V.fit(),
    zoomIn: () => V.zoom(1.2),
    zoomOut: () => V.zoom(1 / 1.2),
    addDistro: () => S.commit('addDistro', p => {
      const maxY = p.distros.reduce((m, d) => Math.max(m, d.y + 400), 40);
      const d = M.newDistro('Distro ' + (p.distros.length + 1), 40, p.distros.length ? maxY : 40, 'medium');
      const s = M.newPsu('LRS-350-12', 1); d.psus.push(s);
      const c = M.newController('baldrick8'); Object.keys(c.banks).forEach(k => { c.banks[k] = s.id; }); d.controllers.push(c);
      p.distros.push(d); S.selection = d.id;
    }),
    async delDistro(id) {
      const d = S.project.distros.find(x => x.id === id);
      if (!(await U.ask({ title: `Delete ${d.name}?`, body: 'Its PSUs, boards and all their runs are removed. You can undo this.', ok: 'Delete', danger: true }))) return;
      S.commit('delDistro', p => {
        const dd = p.distros.find(x => x.id === id);
        const gone = new Set(dd.psus.map(s => s.id));
        p.distros = p.distros.filter(x => x.id !== id);
        p.distros.forEach(x => x.controllers.forEach(c => c.ports.forEach(pt => pt.chain.forEach(it => { if (it.kind === 'inject' && gone.has(it.psuId)) it.psuId = null; }))));
        (p.rooms || []).forEach(r => {
          const nodes = new Set(r.nodes.filter(n => n.kind === 'distro' && n.ref === id).map(n => n.id));
          const ports = new Set(dd.controllers.flatMap(c => c.ports.map(pt => pt.id)));
          r.nodes.forEach(n => { if (n.kind === 'prop' && ports.has(n.portId)) n.portId = null; });
          r.nodes = r.nodes.filter(n => !nodes.has(n.id));
          r.cables = r.cables.filter(c => !nodes.has(c.a) && !nodes.has(c.b));
        });
        S.selection = null;
      });
    },
    balance: (id) => balance([id]),
    balanceAll: () => balance(null),
    autoInjectAll: () => {
      let added = 0, ports = 0;
      S.commit('autoInjectAll', p => {
        p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
          if (!pt.chain.some(it => it.kind === 'pixels')) return;
          const r = K.autoInject(p, pt.id); if (r.added) { added += r.added; ports++; }
        })));
      });
      U.toast(added ? `Added ${added} injection point${added > 1 ? 's' : ''} on ${ports} port${ports > 1 ? 's' : ''}.` : 'Every run is already within limits.');
    },
    addPsu: (id) => S.commit('addPsu', p => {
      const d = p.distros.find(x => x.id === id);
      const last = d.psus[d.psus.length - 1];
      const s = M.newPsu(last ? last.model : 'LRS-350-12', d.psus.length + 1);
      if (last && last.model === 'custom') { s.customV = last.customV; s.customA = last.customA; s.vout = last.vout; }
      d.psus.push(s); S.selection = s.id;
      d.controllers.forEach(c => Object.keys(c.banks).forEach(k => { if (!c.banks[k]) c.banks[k] = s.id; }));
    }),
    selectPsu: (id) => { S.select(id); if (U.view === 'form') U.toast('Switch to Visual or Split to see what this PSU feeds, or hover its load bar.'); },
    async delPsu(id) {
      const e = M.find(S.project, id);
      if (!(await U.ask({ title: `Delete ${e.obj.name}?`, body: 'Anything it powers will show as having no PSU.', ok: 'Delete', danger: true }))) return;
      S.commit('delPsu', p => {
        const x = M.find(p, id);
        x.distro.psus = x.distro.psus.filter(s => s.id !== id);
        p.distros.forEach(d => d.controllers.forEach(c => {
          Object.keys(c.banks).forEach(k => { if (c.banks[k] === id) c.banks[k] = null; });
          c.ports.forEach(pt => pt.chain.forEach(it => { if (it.kind === 'inject' && it.psuId === id) it.psuId = null; }));
        }));
      });
    },
    addController: (id) => {
      const board = (U.$('#addBoard-' + id) || {}).value || 'baldrick8';
      S.commit('addController', p => {
        const d = p.distros.find(x => x.id === id);
        const c = M.newController(board);
        const n = d.controllers.filter(x => x.board === board).length;
        if (n) c.name += ' ' + (n + 1);
        if (d.psus[0]) Object.keys(c.banks).forEach(k => { c.banks[k] = d.psus[0].id; });
        d.controllers.push(c); S.selection = c.id;
      });
    },
    async delController(id) {
      const e = M.find(S.project, id);
      if (!(await U.ask({ title: `Delete ${e.obj.name}?`, body: 'All of its port runs are removed too. You can undo this.', ok: 'Delete', danger: true }))) return;
      S.commit('delController', p => { const x = M.find(p, id); x.distro.controllers = x.distro.controllers.filter(c => c.id !== id); S.selection = null; });
    },
    copy: (id, el) => {
      const txt = el.dataset.text;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => U.toast('Copied.'), () => U.ask({ title: 'Copy this URL', input: txt, cancel: null }));
    },
    addPreset: (id) => {
      const pid = U.$('#preset-' + id).value, qty = Math.max(1, Math.min(50, parseInt(U.$('#qty-' + id).value, 10) || 1));
      S.commit('addPreset', p => {
        const e = portCtx(p, id), pr = p.library.presets.find(x => x.id === pid); if (!pr) return;
        if (!e.port.chain.length) e.port.chain.push(M.newItem.cable(5, 'awg18'));
        for (let i = 0; i < qty; i++) e.port.chain.push(M.newItem.preset(pr, p.library.pixelTypes));
        if (!e.port.label) e.port.label = pr.name;
      });
    },
    // Library "Add to chain": append the preset to the selected port, or after the selected string.
    presetToChain: (id) => {
      const p0 = S.project, e0 = S.selection ? M.find(p0, S.selection) : null;
      let portId = null, after = null;
      if (e0 && e0.type === 'port') portId = e0.obj.id;
      else if (e0 && e0.type === 'item') { portId = e0.port.id; after = e0.obj.id; }
      else if (e0 && e0.type === 'rnode' && e0.obj.portId) portId = e0.obj.portId;
      if (!portId) return U.toast('Select a port or a string first (in the Form, Visual or Room view), then press Add to chain.', 4500);
      let name = '', where = '';
      S.commit('presetToChain', p => {
        const e = M.find(p, portId), pr = p.library.presets.find(x => x.id === id); if (!e || !pr) return;
        const ch = e.port.chain, add = [];
        if (!ch.length) add.push(M.newItem.cable(5, 'awg18'));
        add.push(M.newItem.preset(pr, p.library.pixelTypes));
        const at = after ? ch.findIndex(x => x.id === after) + 1 : ch.length;
        ch.splice(at, 0, ...add);
        if (!e.port.label) e.port.label = pr.name;
        S.selection = add[add.length - 1].id;
        name = pr.name; where = e.controller.name + ' port ' + e.port.num;
      });
      if (name) U.toast('Added ' + name + ' to ' + where + '.');
    },
    addCable: (id) => S.commit('addCable', p => { portCtx(p, id).port.chain.push(M.newItem.cable(5, 'awg18')); }),
    addPixels: (id) => S.commit('addPixels', p => {
      const ch = portCtx(p, id).port.chain;
      const last = ch.slice().reverse().find(x => x.kind === 'pixels');
      ch.push(M.newItem.pixels(last ? last.typeId : 'bullet12', last ? last.count : 50, p.library.pixelTypes));
    }),
    addInject: (id) => S.commit('addInject', p => { const e = portCtx(p, id); e.port.chain.push(M.newItem.inject(bankPsu(e), p.settings.injectLength, p.settings.injectGauge)); }),
    autoInject: (id) => {
      let r = { added: 0 };
      S.commit('autoInject', p => { r = K.autoInject(p, id); });
      const pr = U.lastR.ports.get(id);
      U.toast(r.added ? `Added ${r.added} injection point${r.added > 1 ? 's' : ''}.${pr && pr.firstFail >= 0 ? ' Some pixels are still low: try a thicker feed or fewer pixels per port.' : ''}` : (pr && pr.firstFail >= 0 ? 'Could not fix this run with injection. Check the PSU and wire.' : 'This run is already within limits.'));
    },
    clearInject: (id) => S.commit('clearInject', p => { const pt = portCtx(p, id).port; pt.chain = mergeSplits(pt.chain.filter(x => x.kind !== 'inject')); }),
    async clearPort(id) {
      if (!(await U.ask({ title: 'Clear this run?', body: 'Removes every cable, string and injection on this port. You can undo this.', ok: 'Clear', danger: true }))) return;
      S.commit('clearPort', p => { const pt = portCtx(p, id).port; pt.chain = []; pt.label = ''; });
    },
    movePort: (id) => {
      const to = U.$('#moveTo-' + id).value; if (!to) return U.toast('Pick a port to move this run to.');
      S.commit('movePort', p => {
        const a = portCtx(p, id).port, b = portCtx(p, to).port;
        ['chain', 'label', 'brightness', 'portPower'].forEach(k => { const t = a[k]; a[k] = b[k]; b[k] = t; });
        S.selection = b.id; U.open.add('pt-' + b.id);
      });
      U.toast('Runs swapped.');
    },
    itemUp: (id) => moveItem(id, -1),
    itemDown: (id) => moveItem(id, 1),
    itemDup: (id) => S.commit('itemDup', p => { const e = M.find(p, id), ch = e.port.chain, i = ch.indexOf(e.obj); const c = M.clone(e.obj); c.id = M.uid('it'); delete c.auto; delete c.continued; delete c.tapOffset; ch.splice(i + 1, 0, c); S.selection = c.id; }),
    itemDel: (id) => S.commit('itemDel', p => { const e = M.find(p, id); if (!e) return; e.port.chain = e.port.chain.filter(x => x.id !== id); if (S.selection === id) S.selection = e.port.id; }),
    addType: () => S.commit('addType', p => { p.library.pixelTypes.push({ id: M.uid('pt'), name: 'My pixel', cat: 'bullet', v: 12, w: 0.6, ch: 3, spacing: 0.1, gauge: 'awg20' }); U.open.add('sec-library'); }),
    delType: (id) => {
      const used = S.project.distros.some(d => d.controllers.some(c => c.ports.some(pt => pt.chain.some(it => it.typeId === id)))) || S.project.library.presets.some(x => x.typeId === id);
      if (used) return U.toast('That pixel type is used in a run or preset.');
      S.commit('delType', p => { p.library.pixelTypes = p.library.pixelTypes.filter(t => t.id !== id); });
    },
    addPresetDef: () => S.commit('addPresetDef', p => { p.library.presets.push({ id: M.uid('pr'), name: '100 seed string', typeId: (p.library.pixelTypes.find(t => t.cat === 'seed') || p.library.pixelTypes[0]).id, count: 100 }); U.open.add('sec-library'); }),
    delPresetDef: (id) => S.commit('delPresetDef', p => { p.library.presets = p.library.presets.filter(x => x.id !== id); }),
    async resetLibrary() {
      if (!(await U.ask({ title: 'Reset the library?', body: 'Pixel types and presets go back to the built-in defaults. Types used in your runs are kept.', ok: 'Reset' }))) return;
      S.commit('resetLibrary', p => {
        const used = new Set(); p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => pt.chain.forEach(it => { if (it.typeId) used.add(it.typeId); }))));
        const keep = p.library.pixelTypes.filter(t => used.has(t.id) && !C.pixelTypes.some(x => x.id === t.id));
        p.library.pixelTypes = M.clone(C.pixelTypes).concat(keep);
        p.library.presets = M.clone(C.presets);
      });
    },
    csvChannels: () => U.download(U.slug(S.project.name) + '-channels.csv', PP.guide.csvChannels(S.project, U.lastR), 'text/csv')
  };
  Object.assign(A, PP.room.actions, PP.boxes.actions);

  function moveItem(id, dir) {
    S.commit('moveItem', p => {
      const e = M.find(p, id), ch = e.port.chain, i = ch.indexOf(e.obj), j = i + dir;
      if (j < 0 || j >= ch.length) return;
      [ch[i], ch[j]] = [ch[j], ch[i]];
    });
  }

  function balance(ids) {
    let ch = [];
    S.commit('balance', p => { ch = uniq(K.balance(p, ids)); });
    if (!ch.length) U.toast('Already balanced (needs two or more PSUs of the same voltage in a distro).');
    else U.ask({ title: 'PSUs balanced', body: `<ul>${ch.map(c => `<li>${esc(c)}</li>`).join('')}</ul><p class="muted">Undo (Ctrl+Z) to put them back.</p>`, cancel: null });
  }

  // ---------- files ----------
  const hasFS = 'showSaveFilePicker' in window;
  const fileOpts = { types: [{ description: 'Pixel Planner project', accept: { 'application/json': ['.json'] } }] };
  async function saveFile(as) {
    const text = JSON.stringify(Object.assign({}, S.project, { app: 'PixelPlanner', savedWith: PP.APP_VERSION }), null, 1);
    const name = S.fileName || U.slug(S.project.name) + '.pixelplan.json';
    try {
      if (hasFS) {
        let h = !as && S.fileHandle;
        if (!h) h = await window.showSaveFilePicker(Object.assign({ suggestedName: name }, fileOpts));
        const w = await h.createWritable(); await w.write(text); await w.close();
        S.fileHandle = h; S.fileName = h.name;
      } else {
        U.download(name, text); S.fileName = name;
      }
      S.dirty = false; S.save(); status(S.project, U.lastR); U.toast('Saved ' + S.fileName);
    } catch (e) { if (e.name !== 'AbortError') U.toast('Could not save: ' + e.message); }
  }
  async function openFile() {
    if (S.dirty && !(await U.ask({ title: 'Open another project?', body: 'Changes not saved to a file will be replaced.', ok: 'Open…' }))) return;
    if ('showOpenFilePicker' in window) {
      try {
        const [h] = await window.showOpenFilePicker(fileOpts);
        const f = await h.getFile();
        loadText(await f.text(), f.name, h);
      } catch (e) { if (e.name !== 'AbortError') U.toast('Could not open: ' + e.message); }
    } else U.$('#fileInput').click();
  }
  function loadText(text, name, handle) {
    try { S.load(JSON.parse(text), name, handle); fitted = false; if (U.view !== 'form') requestAnimationFrame(() => { V.fit(); fitted = true; }); U.toast('Opened ' + name); }
    catch (e) { U.toast('Could not open ' + name + ': ' + e.message, 5000); }
  }

  // ---------- events ----------
  function bind() {
    document.addEventListener('change', ev => {
      const el = ev.target;
      if (el.id === 'fileInput') { const f = el.files[0]; if (f) f.text().then(t => loadText(t, f.name, null)); el.value = ''; return; }
      if (el.closest && el.closest('#boxDlg, #libDlg, #compDlg')) return;
      if (PP.room.onChange(el)) return;
      if (el.dataset && el.dataset.id && el.dataset.f) onField(el);
    });
    document.addEventListener('input', ev => {
      if (ev.target.type === 'range' && ev.target.dataset.f === 'brightness') { const v = U.$('#brightVal'); if (v) v.textContent = ev.target.value + '%'; }
    });
    document.addEventListener('click', ev => {
      const fm = U.$('#fileMenu'); if (fm.open && (!fm.contains(ev.target) || ev.target.closest('.dd-menu button'))) fm.open = false;
      if (ev.target.closest('a[href]')) return;
      const nv = ev.target.closest('[data-nav]');
      if (nv && !ev.target.closest('dialog')) { setSection(nv.dataset.nav); return; }
      const tb = ev.target.closest('.tabbar [data-tab]');
      if (tb) { const k = tb.dataset.tab; if (k === 'power' || k === 'presets') setSection(k); else setView(k); return; }
      const v = ev.target.closest('[data-view]');
      if (v && !ev.target.closest('#svg') && !ev.target.closest('dialog')) { setView(v.dataset.view); return; }
      const a = ev.target.closest('[data-act]');
      if (a && !a.closest('#guideDlg, #boxDlg, #libDlg, #compDlg') && A[a.dataset.act]) { ev.preventDefault(); A[a.dataset.act](a.dataset.id, a); return; }
      const s = ev.target.closest('#formPane [data-sel], #inspector [data-sel]');
      if (s && !ev.target.closest('summary') && S.selection !== s.dataset.sel) {
        S.selection = s.dataset.sel; U.$$('.sel', s.closest('.pane, .inspector')).forEach(x => x.classList.remove('sel')); s.classList.add('sel');
        if (U.view === 'split') V.render(S.project, U.lastR);
      } else if (s && ev.target.closest('summary')) {
        S.selection = s.dataset.sel;
        if (U.view === 'split') V.render(S.project, U.lastR);
      }
    });
    // Remember which <details> are open; build port bodies lazily.
    document.addEventListener('toggle', ev => {
      const d = ev.target; if (!d.dataset || !d.dataset.openId) return;
      const k = d.dataset.openId;
      if (d.open) { U.open.add(k); U.open.delete('!' + k); } else { U.open.delete(k); U.open.add('!' + k); }
      if (d.open && d.classList.contains('portrow') && !U.$('.portbody', d)) {
        const e = M.find(S.project, d.dataset.sel);
        if (e) d.insertAdjacentHTML('beforeend', F.portBody(S.project, U.lastR, e.controller, e.port));
      }
    }, true);
    document.addEventListener('keydown', ev => {
      const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      const inDlg = !!document.querySelector('dialog[open]');
      const k = ev.key.toLowerCase();
      if ((ev.ctrlKey || ev.metaKey) && k === 's') { ev.preventDefault(); saveFile(ev.shiftKey); }
      else if ((ev.ctrlKey || ev.metaKey) && k === 'o') { ev.preventDefault(); openFile(); }
      else if ((ev.ctrlKey || ev.metaKey) && k === 'z' && !inField && !inDlg) { ev.preventDefault(); ev.shiftKey ? S.doRedo() : S.doUndo(); }
      else if ((ev.ctrlKey || ev.metaKey) && k === 'y' && !inField && !inDlg) { ev.preventDefault(); S.doRedo(); }
      else if ((k === 'delete' || k === 'backspace') && !inField && !inDlg && S.selection) {
        const e = M.find(S.project, S.selection);
        if (e && e.type === 'item') { ev.preventDefault(); A.itemDel(S.selection); }
        else if (e && (e.type === 'rnode' || e.type === 'rcable') && U.view === 'room') { ev.preventDefault(); PP.room.del(S.selection); }
      } else if ((ev.ctrlKey || ev.metaKey) && k === 'p' && !inDlg) { ev.preventDefault(); A.printGuide(); }
      else if (U.view === 'room' && !inField && !inDlg && !ev.ctrlKey && !ev.metaKey && !ev.altKey && S.selection && (/^arrow/.test(k) || k === 'r')) {
        const e = M.find(S.project, S.selection);
        const nid = e && (e.type === 'rnode' ? e.obj.id : e.type === 'distro' ? ((PP.room.current(S.project).nodes.find(n => n.kind === 'distro' && n.ref === e.obj.id)) || {}).id : null);
        if (!nid) return;
        ev.preventDefault();
        S.commit(k === 'r' ? 'rotate' : 'nudge', p => {
          const x = M.find(p, nid); if (!x) return; const n = x.obj;
          if (k === 'r') { n.rot = ((((+n.rot || 0) + (ev.shiftKey ? -90 : 90)) % 360) + 360) % 360; return; }
          const st = ev.shiftKey ? 1 : (+x.room.grid || 0.5), r2 = v => Math.round(v * 100) / 100;
          if (k === 'arrowleft') n.x = r2(+n.x - st); if (k === 'arrowright') n.x = r2(+n.x + st);
          if (k === 'arrowup') n.y = r2(+n.y - st); if (k === 'arrowdown') n.y = r2(+n.y + st);
        });
      } else if (k === 'escape' && drawerOpen) { drawerOpen = false; U.$('#warnDrawer').hidden = true; }
      else if (k === 'escape' && U.$('#fileMenu').open) U.$('#fileMenu').open = false;
      else if ((k === 'enter' || k === ' ') && document.activeElement && document.activeElement.matches('.stat[data-act]')) { ev.preventDefault(); A[document.activeElement.dataset.act](); }
    });
    window.addEventListener('resize', () => { if (U.view !== 'form' && !fitted) V.fit(); });
  }

  function setTheme(v) {
    try { localStorage.setItem('pixelplanner.theme', v); } catch (e) { }
    U.themePref = v;
    const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const eff = v === 'system' ? sys : v;
    document.documentElement.setAttribute('data-theme', eff);
    const b = U.$('#themeBtn');
    U.$('use', b).setAttribute('href', eff === 'dark' ? '#i-sun' : '#i-moon');
    b.title = eff === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    b.setAttribute('aria-label', b.title);
    U.$('#themeSystem').classList.toggle('on', v === 'system');
    if (U.view === 'room' && PP.room && U.lastR) PP.room.render(S.project, U.lastR);
  }

  // ---------- boot ----------
  function boot() {
    PP.help.badge();
    let th = 'system'; try { th = localStorage.getItem('pixelplanner.theme') || 'system'; } catch (e) { }
    U.section = 'workspace';
    setTheme(th);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (U.themePref === 'system') setTheme('system'); });
    if (!S.restore()) S.project = M.demoProject();
    S.on(why => { if (why === 'select') onSelect(); else { if (why === 'load') { PP.room.refit(); U.roomId = null; } render(); if (why === 'load' && U.view === 'room') PP.room.fitOnce(); } });
    bind();
    V.init();
    PP.room.init();
    PP.boxes.init();
    let v = 'split'; try { v = localStorage.getItem('pixelplanner.view') || (window.innerWidth < 900 ? 'form' : 'split'); } catch (e) { }
    let sec = 'workspace'; try { sec = localStorage.getItem('pixelplanner.section') || 'workspace'; } catch (e) { }
    setView(v);
    if (sec !== 'workspace') setSection(sec);
    PP.render = render;
  }
  boot();
})();

</script>
</body>
