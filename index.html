    d.controllers.forEach(c => { const def = H.comp(p, c.board); if (def) out.push({ item: { id: c.id, comp: def.id, label: c.name, limits: {} }, def }); });
    return out;
  };
  H.accepts = (p, n) => {
    if (n.kind === 'prop') return new Set(['pixel', 'dc', 'custom']);
    const set = new Set(['custom']);
    const addPorts = def => Object.keys(def.ports || {}).forEach(k => { if (+def.ports[k] > 0) set.add(k); });
    if (n.kind === 'device') { const def = H.comp(p, n.ref); if (def) addPorts(def); }
    else { const d = distroOf(p, n); if (d) H.boxComps(p, d).forEach(x => addPorts(x.def)); }
    return set;
  };

  // ---------- capacity ----------
  const num = v => (v === '' || v == null || !isFinite(+v)) ? null : +v;
  // Operating limit: per-item override, then the definition's limit, then the manufacturer figure.
  H.capOf = (item, def, res) => {
    const a = num(item && item.limits && item.limits[res]); if (a != null) return a;
    const b = num(def.limits && def.limits[res]); if (b != null) return b;
    return num(def.provides && def.provides[res]) || 0;
  };
  H.capsFrom = (list) => {
    const caps = {};
    const get = r => (caps[r] = caps[r] || { cap: 0, max: 0, used: 0, internal: 0 });
    list.forEach(({ item, def }) => Object.keys(def.provides || {}).forEach(r => {
      if (num(def.provides[r]) == null) return;
      const c = get(r); c.max += +def.provides[r]; c.cap += H.capOf(item, def, r);
    }));
    list.forEach(({ def }) => Object.keys(def.internal || {}).forEach(r => { if (caps[r]) caps[r].internal += num(def.internal[r]) || 0; }));
    Object.values(caps).forEach(c => { c.used = c.internal; });
    return caps;
  };
  H.capState = c => {
    if (c.used > c.cap + 1e-9) return 'err';
    if (c.cap > 0 && c.used / c.cap >= 0.85) return 'warn';
    return 'ok';
  };
  H.capRows = (caps) => Object.keys(C.resources).concat(Object.keys(caps).filter(r => !C.resources[r]))
    .filter(r => caps[r] && (caps[r].cap > 0 || caps[r].used > 0))
    .map(r => Object.assign({ res: r, name: (C.resources[r] || { name: r }).name, unit: (C.resources[r] || {}).unit || '', state: H.capState(caps[r]) }, caps[r]));

  const portDistroId = (R, portId) => { const e = R.idx.get(portId); return e && e.type === 'port' ? e.distro.id : null; };
  H.leadFor = (p, R, na, nb, c) => {
    if (c.type !== 'pixel') return null;
    const prop = na.kind === 'prop' ? na : nb.kind === 'prop' ? nb : null;
    const other = prop === na ? nb : na;
    if (!prop || !prop.portId || !other || other.kind !== 'distro') return null;
    const e = R.idx.get(prop.portId);
    if (!e || e.type !== 'port' || e.distro.id !== other.ref) return null;
    let len = 0; const cables = [];
    for (const it of e.port.chain) { if (it.kind === 'pixels') break; if (it.kind === 'cable') { len += +it.length || 0; cables.push(it); } }
    return cables.length ? { len, portId: prop.portId, cables } : null;
  };

  // Pick a sensible cable type for two nodes: the consumer's port order, preferring a type whose
  // resource the other end provides.
  H.guessType = (p, R, na, nb) => {
    if (na.kind === 'prop' || nb.kind === 'prop') return 'pixel';
    const A = H.accepts(p, na), B = H.accepts(p, nb);
    const order = n => n.kind === 'device' ? Object.keys((H.comp(p, n.ref) || {}).ports || {}) : [];
    const pref = order(nb).concat(order(na), ['eth', 'pixel', 'input', 'relay', 'dmx', 'audio', 'speaker', 'usb', 'video', 'mains', 'dc', 'analog']);
    const both = pref.filter((t, i) => pref.indexOf(t) === i && A.has(t) && B.has(t));
    const caps = n => { const x = R && R.hw && R.hw.caps.get(n.kind === 'distro' ? n.ref : n.id); return x ? x.caps : {}; };
    const withRes = both.find(t => { const r = C.portType(t).res; return r && ((caps(na)[r] || {}).cap > 0 || (caps(nb)[r] || {}).cap > 0); });
    return withRes || both[0] || pref.find(t => B.has(t) && t !== 'custom') || 'custom';
  };

  // ---------- the calculation: capacities, cable lengths, usage ----------
  H.compute = (p, R) => {
    const out = { caps: new Map(), cables: new Map(), nodeCables: new Map() };
    const blank = () => ({ cap: 0, max: 0, used: 0, internal: 0 });
    p.distros.forEach(d => {
      const caps = H.capsFrom(H.boxComps(p, d));
      const model = { pixelOutputs: 0, pixels: 0, inputs: 0, relays: 0 };
      d.controllers.forEach(c => {
        c.ports.forEach(pt => { const r = R.ports.get(pt.id); if (r && r.pixels) { model.pixelOutputs++; model.pixels += r.pixels; } });
        c.inputs.forEach(i => { if (i.name || (i.action && i.action !== 'none')) model.inputs++; });
        c.relays.forEach(x => { if (x.name) model.relays++; });
      });
      const D = R.distros.get(d.id);
      const add = (r, v) => { if (!v) return; (caps[r] = caps[r] || blank()).used += v; };
      add('pixelOutputs', model.pixelOutputs); add('pixels', model.pixels); add('psuW', D ? Math.round(D.dcW) : 0);
      out.caps.set(d.id, { caps, model, conn: {}, name: d.name, ref: d.id, box: d.boxTpl ? H.box(p, d.boxTpl) : null });
    });
    (p.rooms || []).forEach(room => room.nodes.forEach(n => {
      if (n.kind !== 'device') return;
      const def = H.comp(p, n.ref);
      out.caps.set(n.id, { caps: def ? H.capsFrom([{ item: { limits: n.limits || {} }, def }]) : {}, conn: {}, name: H.nodeName(p, n, R), ref: n.id });
    }));
    const key = n => n.kind === 'distro' ? n.ref : n.id;

    (p.rooms || []).forEach(room => {
      const byId = new Map(room.nodes.map(n => [n.id, n]));
      room.cables.forEach(c => {
        const na = byId.get(c.a), nb = byId.get(c.b);
        const info = { room, cable: c, na, nb, pts: null, route: 0, req: 0, phys: null, physSrc: '', std: H.std(p, c.std), type: C.portType(c.type) };
        out.cables.set(c.id, info);
        [c.a, c.b].forEach(id => { if (!out.nodeCables.has(id)) out.nodeCables.set(id, []); out.nodeCables.get(id).push(c.id); });
        if (!na || !nb || (na.kind === 'distro' && !distroOf(p, na)) || (nb.kind === 'distro' && !distroOf(p, nb))) { info.broken = true; return; }
        info.pts = H.route(p, room, c, byId);
        info.route = H.polyLen(info.pts);
        info.slack = num(c.slack) != null ? Math.max(0, +c.slack) : Math.max(0, +p.settings.cableSlackM || 0);
        info.req = info.route + info.slack;
        info.lead = H.leadFor(p, R, na, nb, c);
        if (info.std) { info.phys = +info.std.length || 0; info.physSrc = 'std'; }
        else if (+c.len > 0) { info.phys = +c.len; info.physSrc = 'custom'; }
        else if (info.lead) { info.phys = info.lead.len; info.physSrc = 'lead'; }
        if (info.phys != null) { info.spare = info.phys - info.req; info.short = info.spare < -0.005; }
        const A = H.accepts(p, na), B = H.accepts(p, nb);
        info.compatible = A.has(c.type) && B.has(c.type);
        info.badEnd = !A.has(c.type) ? na : !B.has(c.type) ? nb : null;
        const res = info.type.res;
        if (!res) return;
        const ca = out.caps.get(key(na)), cb = out.caps.get(key(nb));
        const has = x => x && x.caps[res] && x.caps[res].cap > 0;
        let prov = null, cons = null;
        if (has(ca) && !has(cb)) { prov = na; cons = nb; }
        else if (has(cb) && !has(ca)) { prov = nb; cons = na; }
        else if (has(ca) && has(cb)) { if (nb.kind === 'distro' && na.kind !== 'distro') { prov = nb; cons = na; } else { prov = na; cons = nb; } }
        info.res = res; info.provider = prov; info.consumer = cons;
        if (!prov) return;
        let amt = 1;
        if (cons.kind === 'device') { const def = H.comp(p, cons.ref); if (def && def.consumes && num(def.consumes[res]) != null) amt = +def.consumes[res]; }
        const portD = cons.kind === 'prop' && cons.portId ? portDistroId(R, cons.portId) : null;
        info.linked = !!(portD && prov.kind === 'distro' && portD === prov.ref);   // already counted from the port run
        if (portD && prov.kind === 'distro' && portD !== prov.ref) info.wrongDistro = portD;
        info.amount = amt;
        if (info.linked) return;
        const pc = out.caps.get(key(prov));
        pc.conn[res] = (pc.conn[res] || 0) + amt;
        if (c.type === 'pixel' && cons.kind === 'prop') pc.conn.pixels = (pc.conn.pixels || 0) + H.propPixels(p, R, cons);
      });
    });
    // Inputs and relays named on a board and devices cabled to it describe the same physical
    // connections, so count whichever is larger; everything else adds up.
    out.caps.forEach(x => {
      Object.keys(x.conn).forEach(r => {
        const c = x.caps[r] = x.caps[r] || blank();
        if (x.model && (r === 'inputs' || r === 'relays')) c.used = c.internal + Math.max(x.model[r], x.conn[r]);
        else c.used += x.conn[r];
      });
      if (x.model) ['inputs', 'relays'].forEach(r => { if (!x.conn[r] && x.model[r]) { const c = x.caps[r] = x.caps[r] || blank(); c.used = c.internal + x.model[r]; } });
    });
    return out;
  };

  // Warnings for the Checks drawer (called from calc.run).
  H.check = (p, R, warn) => {
    const X = R.hw = H.compute(p, R);
    X.caps.forEach(x => {
      H.capRows(x.caps).forEach(c => {
        if (c.state !== 'err') return;
        const lim = c.cap < c.max ? ` (your limit; the hardware allows ${c.max.toLocaleString()})` : '';
        warn('error', `${x.name}: ${c.name} ${Math.round(c.used).toLocaleString()} / ${c.cap.toLocaleString()}${c.unit ? ' ' + c.unit : ''}${lim}. Over capacity.`, x.ref);
      });
    });
    X.cables.forEach(i => {
      const c = i.cable, where = p.rooms.length > 1 ? i.room.name + ': ' : '';
      const nm = `${where}${H.nodeName(p, i.na, R)} → ${H.nodeName(p, i.nb, R)}`;
      if (i.broken) { warn('warn', `${where}a ${i.type.name.toLowerCase()} cable has lost one of its ends.`, c.id); return; }
      if (!i.compatible) warn('warn', `${nm}: ${H.nodeName(p, i.badEnd, R)} has no ${i.type.name.toLowerCase()} connection.`, c.id);
      else if (i.res && !i.provider) warn('warn', `${nm}: neither end provides ${C.resources[i.res].name.toLowerCase()}.`, c.id);
      if (i.wrongDistro) warn('warn', `${nm}: this run is on ${(p.distros.find(d => d.id === i.wrongDistro) || {}).name}, not ${H.nodeName(p, i.provider, R)}.`, c.id);
      if (i.short) warn('error', `${nm}: route needs ${H.fmtM(i.req)} but the ${i.physSrc === 'std' ? H.stdName(i.std) : i.physSrc === 'lead' ? 'run lead of ' + H.fmtM(i.phys) : H.fmtM(i.phys) + ' cable'} is ${H.fmtM(-i.spare)} short.`, c.id);
      else if (i.phys == null) warn('info', `${nm}: no cable chosen for the ${H.fmtM(i.req)} route.`, c.id);
      if (i.lead && i.physSrc === 'std' && Math.abs(i.lead.len - i.phys) > 0.05) warn('info', `${nm}: the run's lead cable is ${H.fmtM(i.lead.len)} but the room uses a ${H.fmtM(i.phys)} cable, so the voltage drop is worked out on ${H.fmtM(i.lead.len)}.`, c.id);
    });
    (p.rooms || []).forEach(r => r.nodes.forEach(n => {
      if (n.kind === 'prop' && n.portId && !R.idx.get(n.portId)) warn('warn', `${r.name}: a pixel prop is linked to a port that no longer exists.`, n.id);
      if (n.kind === 'distro' && !distroOf(p, n)) warn('warn', `${r.name}: a controller box in the room has been deleted from the project.`, n.id);
    }));
  };

  // ---------- controller boxes in a project ----------
  // Placing a box template creates a distro with the template's PSUs and boards (so the power and
  // pixel calculations work as usual) and a room node for it.
  H.placeBox = (p, tplId, room, x, y) => {
    const t = H.box(p, tplId); if (!t) return null;
    const n = p.distros.filter(d => d.boxTpl === tplId).length + 1;
    const maxY = p.distros.reduce((m, d) => Math.max(m, d.y + 400), 40);
    const d = M.newDistro(`${t.name} ${n}`, 40, p.distros.length ? maxY : 40, 'custom');
    d.boxTpl = tplId;
    const items = t.items.map(i => ({ i, def: H.comp(p, i.comp) })).filter(x => x.def);
    items.filter(x => x.def.psuModel && C.psuById(x.def.psuModel)).forEach((x, k) => { const s = M.newPsu(x.def.psuModel, k + 1); if (x.i.label) s.name = x.i.label; d.psus.push(s); });
    items.filter(x => x.def.board && C.boards[x.def.board]).forEach(x => {
      const c = M.newController(x.def.board, x.i.label || undefined);
      Object.keys(c.banks).forEach((k, j) => { c.banks[k] = d.psus.length ? d.psus[j % d.psus.length].id : null; });
      d.controllers.push(c);
    });
    d.psuSlots = Math.max(1, d.psus.length); d.boardSlots = Math.max(1, d.controllers.length);
    p.distros.push(d);
    let node = null;
    if (room) { node = M.newNode('distro', d.id, x, y); room.nodes.push(node); }
    return { d, node };
  };
  // Bring a box's distro in line with an edited template: add missing PSUs and boards, and remove
  // surplus ones only when nothing uses them (runs, bank feeds and injections are never lost).
  H.syncBox = (p, d) => {
    const t = H.box(p, d.boxTpl); if (!t) return [];
    const log = [], defs = t.items.map(i => ({ i, def: H.comp(p, i.comp) })).filter(x => x.def);
    const want = (key, pick) => { const m = {}; defs.forEach(x => { const k = pick(x.def); if (k) m[k] = (m[k] || 0) + 1; }); return m; };
    const psuWant = want('psu', df => df.psuModel && C.psuById(df.psuModel) ? df.psuModel : null);
    const boardWant = want('board', df => df.board && C.boards[df.board] ? df.board : null);
    const psuUsed = id => d.controllers.some(c => Object.values(c.banks).includes(id)) || p.distros.some(x => x.controllers.some(c => c.ports.some(pt => pt.chain.some(it => it.kind === 'inject' && it.psuId === id))));
    Object.keys(psuWant).forEach(m => { let have = d.psus.filter(s => s.model === m).length; while (have < psuWant[m]) { d.psus.push(M.newPsu(m, d.psus.length + 1)); have++; log.push(`Added a ${m}`); } });
    d.psus.slice().forEach(s => {
      if (s.model === 'custom') return;
      const extra = d.psus.filter(x => x.model === s.model).length - (psuWant[s.model] || 0);
      if (extra > 0) { if (!psuUsed(s.id)) { d.psus = d.psus.filter(x => x !== s); log.push(`Removed unused ${s.name}`); } else log.push(`Kept ${s.name}: it still powers something`); }
    });
    Object.keys(boardWant).forEach(b => {
      let have = d.controllers.filter(c => c.board === b).length;
      while (have < boardWant[b]) {
        const c = M.newController(b); if (have) c.name += ' ' + (have + 1);
        Object.keys(c.banks).forEach((k, j) => { c.banks[k] = d.psus.length ? d.psus[j % d.psus.length].id : null; });
        d.controllers.push(c); have++; log.push(`Added a ${C.boards[b].name}`);
      }
    });
    d.controllers.slice().forEach(c => {
      const extra = d.controllers.filter(x => x.board === c.board).length - (boardWant[c.board] || 0);
      if (extra > 0) { if (!c.ports.some(pt => pt.chain.length)) { d.controllers = d.controllers.filter(x => x !== c); log.push(`Removed unused ${c.name}`); } else log.push(`Kept ${c.name}: it has runs`); }
    });
    d.psuSlots = Math.max(d.psuSlots || 1, d.psus.length); d.boardSlots = Math.max(d.boardSlots || 1, d.controllers.length);
    return log;
  };
  // After choosing a cable standard for a pixel cable, make the run's lead cable the same length.
  H.syncLead = (p, R, c, len) => {
    const room = p.rooms.find(r => r.cables.includes(c)); if (!room) return false;
    const byId = new Map(room.nodes.map(n => [n.id, n]));
    const L = H.leadFor(p, R, byId.get(c.a), byId.get(c.b), c);
    if (!L || L.cables.length !== 1) return false;
    const e = M.find(p, L.cables[0].id); if (!e) return false;
    e.obj.length = Math.round(len * 10) / 10;
    return true;
  };
  H.fitStd = (p, info) => H.stds(p).filter(s => s.type === info.cable.type && +s.length >= info.req - 0.005).sort((a, b) => a.length - b.length)[0] || null;

  // ---------- bill of materials: hardware and cable rows ----------
  const CAT_GROUP = { controller: 'Controllers', compute: 'Computers', network: 'Network', power: 'Power supplies', audio: 'Audio', input: 'Sensors and buttons', output: 'Outputs and actuators', effect: 'Effects and fixtures', custom: 'Other hardware' };
  H.catGroup = cat => CAT_GROUP[cat] || 'Other hardware';
  // scope: null (whole project) | {room: id} | {distro: id}
  H.scopeDistros = (p, scope) => {
    if (!scope) return new Set(p.distros.map(d => d.id));
    if (scope.distro) return new Set([scope.distro]);
    const r = p.rooms.find(x => x.id === scope.room);
    return new Set(r ? r.nodes.filter(n => n.kind === 'distro').map(n => n.ref) : []);
  };
  H.bomRows = (p, R, scope, add) => {
    const X = R.hw, ds = H.scopeDistros(p, scope);
    p.distros.filter(d => ds.has(d.id) && d.boxTpl).forEach(d => {
      const t = H.box(p, d.boxTpl); if (!t) return;
      add('Controller boxes', t.name, 1, 'pcs');
      // Boards and PSUs come from the distro itself; the rest of the box contents are listed here.
      t.items.forEach(i => { const def = H.comp(p, i.comp); if (def && !def.board && !def.psuModel) add(H.catGroup(def.cat), def.name, 1, 'pcs'); });
    });
    const rooms = scope && scope.room ? p.rooms.filter(r => r.id === scope.room) : p.rooms;
    rooms.forEach(room => {
      const inScopeNode = n => !scope || !scope.distro || (n.kind === 'distro' && n.ref === scope.distro) ||
        room.cables.some(c => (c.a === n.id || c.b === n.id) && [c.a, c.b].some(id => { const m = room.nodes.find(x => x.id === id); return m && m.kind === 'distro' && m.ref === scope.distro; }));
      room.nodes.filter(inScopeNode).forEach(n => {
        if (n.kind === 'device') { const def = H.comp(p, n.ref); if (def) add(H.catGroup(def.cat), def.name, 1, 'pcs'); }
        else if (n.kind === 'prop' && !n.portId && +n.pixels > 0) add('Pixels', 'Pixels on room props (type not set)', +n.pixels, 'px');
      });
      room.cables.forEach(c => {
        const i = X.cables.get(c.id); if (!i || i.broken) return;
        if (scope && scope.distro && ![i.na, i.nb].some(n => n.kind === 'distro' && n.ref === scope.distro)) return;
        if (i.std) add('Cables (room)', H.stdName(i.std), 1, 'pcs', i.std.connector || '');
        else if (i.physSrc === 'custom') add('Cables (room)', `${i.type.name} cable ${H.fmtM(i.phys)}`, 1, 'pcs', 'custom length');
        else if (i.physSrc !== 'lead') add('Cables (room)', `${i.type.name} cable, at least ${H.fmtM(Math.ceil(i.req * 2) / 2)}`, 1, 'pcs', 'not chosen yet');
      });
    });
  };
  // A readable cable schedule for the wiring guide.
  H.cableSchedule = (p, R, scope) => {
    const X = R.hw, rows = [];
    const rooms = scope && scope.room ? p.rooms.filter(r => r.id === scope.room) : p.rooms;
    rooms.forEach(room => room.cables.forEach(c => {
      const i = X.cables.get(c.id); if (!i || i.broken) return;
      if (scope && scope.distro && ![i.na, i.nb].some(n => n.kind === 'distro' && n.ref === scope.distro)) return;
      rows.push({ room: room.name, from: H.nodeName(p, i.na, R), to: H.nodeName(p, i.nb, R), type: i.type.name, route: i.route, req: i.req, pivots: c.pts.length, cable: i.std ? H.stdName(i.std) : i.physSrc === 'custom' ? H.fmtM(i.phys) + ' (custom)' : i.physSrc === 'lead' ? H.fmtM(i.phys) + ' (run lead)' : 'Not chosen', colour: i.std ? i.std.color : '', spare: i.spare, short: i.short, label: c.label || '' });
    }));
    return rows;
  };
})();

</script>
<script>
// Small UI helpers shared by the views.
(function () {
  const U = PP.ui = {
    open: new Set(),          // ids of expanded <details> in the form
    view: 'split',
    cam: { x: 20, y: 20, k: 1 },
    lastR: null
  };
  U.$ = (s, el = document) => el.querySelector(s);
  U.$$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  U.ic = n => `<svg class="ic" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`;
  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.num = (v, d = 2) => (v == null || !isFinite(v)) ? '-' : (+v).toFixed(d).replace(/\.?0+$/, m => m.startsWith('.') ? '' : m);

  U.toast = (msg, ms = 3200) => {
    const t = U.$('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(U._tt); U._tt = setTimeout(() => { t.hidden = true; }, ms);
  };

  // Promise-based confirm / prompt in a themed dialog.
  U.ask = ({ title, body = '', input = null, ok = 'OK', cancel = 'Cancel', danger = false }) => new Promise(res => {
    const d = U.$('#askDlg');
    d.innerHTML = `<form method="dialog"><div class="dlg-head"><b>${U.esc(title)}</b></div>
      <div class="dlg-body">${body}${input != null ? `<input id="askIn" style="width:100%;margin-top:6px" value="${U.esc(input)}">` : ''}</div>
      <div class="dlg-foot">${cancel ? `<button value="cancel">${U.esc(cancel)}</button>` : ''}<button value="ok" class="${danger ? 'primary' : 'primary'}">${U.esc(ok)}</button></div></form>`;
    d.onclose = () => {
      if (d.returnValue !== 'ok') return res(null);
      res(input != null ? U.$('#askIn', d).value : true);
    };
    d.returnValue = '';
    d.showModal();
    const i = U.$('#askIn', d); if (i) { i.focus(); i.select(); }
  });

  U.wireOptions = (sel, filter) => PP.catalog.wires.filter(w => !filter || filter(w)).map(w => `<option value="${w.id}"${w.id === sel ? ' selected' : ''}>${w.label}</option>`).join('');
  U.opt = (v, label, sel) => `<option value="${U.esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${U.esc(label)}</option>`;

  U.psuOptions = (p, sel, blank = '— none —') => {
    let h = `<option value="">${blank}</option>`;
    p.distros.forEach(d => {
      if (!d.psus.length) return;
      h += `<optgroup label="${U.esc(d.name)}">` + d.psus.map(s => U.opt(s.id, `${s.name} · ${s.model === 'custom' ? 'custom ' + s.customV + ' V' : s.model}`, sel)).join('') + '</optgroup>';
    });
    return h;
  };
  U.psuModelOptions = (sel) => {
    const byV = {};
    PP.catalog.psus.forEach(s => { (byV[s.v] = byV[s.v] || []).push(s); });
    let h = '';
    Object.keys(byV).sort((a, b) => (a == 12 ? -1 : b == 12 ? 1 : a - b)).forEach(v => {
      h += `<optgroup label="${v} V">` + byV[v].map(s => U.opt(s.id, `${s.id} (${s.a} A)`, sel)).join('') + '</optgroup>';
    });
    return h + `<optgroup label="Other">${U.opt('custom', 'Custom PSU…', sel)}</optgroup>`;
  };
  U.pixelTypeOptions = (p, sel) => {
    const cats = { bullet: 'Bullets', seed: 'Seeds', flood: 'Floods', strip: 'Strip', null: 'Null pixels', other: 'Other' };
    const g = {};
    p.library.pixelTypes.forEach(t => { const c = cats[t.cat] ? t.cat : 'other'; (g[c] = g[c] || []).push(t); });
    return Object.keys(cats).filter(c => g[c]).map(c => `<optgroup label="${cats[c]}">` + g[c].map(t => U.opt(t.id, t.name, sel)).join('') + '</optgroup>').join('');
  };

  U.pctClass = (pct, target = 80) => pct > 100 ? 'err' : pct > target ? 'warn' : 'ok';
  U.bar = (pct, target) => {
    const c = U.pctClass(pct, target);
    return `<div class="bar ${c}" title="${U.num(pct, 0)}%"><i style="width:${Math.min(100, Math.max(0, pct))}%"></i>${target ? `<span class="tgt" style="left:${target}%"></span>` : ''}</div>`;
  };
  U.vClass = (pct) => { const s = PP.calc.status(pct); return s === 'error' ? 'err' : s; };

  U.download = (name, text, type = 'application/json') => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  U.slug = s => (String(s || 'show').trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-') || 'show');
})();

</script>
<script>
// Form view: every part of the project as editable fields. The same editors feed the Visual view's
// inspector, so both views always edit the same data.
// Inputs carry data-id (entity id), data-f (field path) and data-t (num|str|bool); main.js commits
// them on change. Buttons carry data-act and data-id.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc;
  const esc = U.esc;
  const F = PP.form = {};

  const inp = (id, f, v, t = 'str', attrs = '') =>
    t === 'bool'
      ? `<input type="checkbox" data-id="${id}" data-f="${f}" data-t="bool"${v ? ' checked' : ''} ${attrs}>`
      : `<input ${t === 'num' ? 'type="number"' : 'type="text"'} data-id="${id}" data-f="${f}" data-t="${t}" value="${esc(v)}" ${attrs}>`;
  const sel = (id, f, opts, attrs = '', t = 'str') => `<select data-id="${id}" data-f="${f}" data-t="${t}" ${attrs}>${opts}</select>`;
  const btn = (act, label, id = '', cls = '', title = '', extra = '') => `<button class="${cls}${label.startsWith('<svg') ? ' icb' : ''}" data-act="${act}" data-id="${id}" ${title ? `title="${esc(title)}"${label.startsWith('<svg') ? ` aria-label="${esc(title)}"` : ''}` : ''} ${extra}>${label}</button>`;
  const det = (key, cls, summary, body, defOpen = false) => {
    const open = U.open.has(key) || (defOpen && !U.open.has('!' + key));
    return `<details class="${cls}" data-open-id="${key}"${open ? ' open' : ''}><summary>${summary}</summary>${body}</details>`;
  };
  const chev = '<span class="chev" aria-hidden="true"></span>';

  // ---------- whole form ----------
  F.render = (p, R) => {
    const pane = U.$('#formPane');
    const scroll = pane.scrollTop;
    const act = document.activeElement;
    const focusKey = act && pane.contains(act) && act.dataset && act.dataset.id ? act.dataset.id + '|' + act.dataset.f : null;
    let h = '';
    h += `<div class="sec"><div class="sec-head">Distros <span class="pill">${p.distros.length}</span><span class="grow"></span>
      ${btn('balanceAll', 'Balance all PSUs', '', 'small', 'Spread banks and injection feeds across the PSUs in each distro')}
      ${btn('autoInjectAll', 'Auto-inject all', '', 'small', 'Add injection points to every run that drops too low')}
      ${btn('addDistro', '+ Distro', '', 'small primary')}</div>`;
    if (!p.distros.length) h += `<div class="empty">No distros yet. A distro is an enclosure holding a controller and its PSUs.<br><br>${btn('addDistro', '+ Add a distro', '', 'primary')} ${btn('demo', 'Load the demo show')}</div>`;
    p.distros.forEach(d => { h += F.distro(p, R, d); });
    h += '</div>';
    h += det('sec-channels', 'sec', `${chev}Channel map <span class="pill">${R.totals.channels} channels</span><span class="pill">${R.totals.universes} universes</span>`, channels(p, R));
    h += `<div class="sec"><textarea data-id="project" data-f="notes" data-t="str" placeholder="Project notes (appear in the wiring guide)">${esc(p.notes)}</textarea></div>`;
    pane.innerHTML = h;
    pane.scrollTop = scroll;
    if (focusKey) {
      const [id, f] = focusKey.split('|');
      const el = U.$$('[data-id]', pane).find(e => e.dataset.id === id && e.dataset.f === f);
      if (el) el.focus({ preventScroll: true });
    }
    F.markSelection();
  };

  function settings(p) {
    const s = p.settings, id = 'settings';
    const f = (label, html, title = '') => `<label class="fld" ${title ? `title="${esc(title)}"` : ''}>${label}${html}</label>`;
    return `<div class="card" style="padding:4px 12px"><div class="grid">
      ${f('Global brightness %', inp(id, 'brightness', s.brightness, 'num', 'min="1" max="100"'), 'Scales every pixel\'s current. Set the same cap in xLights/FPP or the Baldrick port.')}
      ${f('Typical show load % of full white', inp(id, 'typicalPct', s.typicalPct, 'num', 'min="1" max="100"'), 'Used only for running cost. Sequences average far below full white.')}
      ${f('Warn when pixels drop by %', inp(id, 'warnDropPct', s.warnDropPct, 'num', 'min="1" max="50"'))}
      ${f('Error when pixels drop by %', inp(id, 'errDropPct', s.errDropPct, 'num', 'min="1" max="60"'))}
      ${f('PSU load target %', inp(id, 'psuTargetPct', s.psuTargetPct, 'num', 'min="50" max="100"'), 'Warn above this continuous load (80% is the usual rule).')}
      ${f('PSU efficiency %', inp(id, 'psuEfficiency', s.psuEfficiency, 'num', 'min="50" max="99"'))}
      ${f('Mains voltage', inp(id, 'mainsV', s.mainsV, 'num'))}
      ${f('Mains circuit / plug fuse (A)', inp(id, 'mainsCircuitA', s.mainsCircuitA, 'num'), 'UK plug: 13 A. Warn above 80% of this per distro.')}
      ${f('FPP (Pi) IP address', inp(id, 'fppIp', s.fppIp), 'Used to build the Turniput FPP command URLs.')}
      ${f('Channels per universe', inp(id, 'universeSize', s.universeSize, 'num'))}
      ${f('Data warning distance (m)', inp(id, 'dataWarnM', s.dataWarnM, 'num', 'step="0.5"'), 'Warn when data travels further than this to the next pixel.')}
      ${f('Auto-inject feed wire', sel(id, 'injectGauge', U.wireOptions(s.injectGauge)))}
      ${f('Auto-inject feed length', sel(id, 'injectMode', U.opt('run', 'Follow the run (feed from distro)', s.injectMode) + U.opt('fixed', 'Fixed length', s.injectMode)), 'Follow the run: each feed is as long as the run up to that point (worst case, PSU in the distro). Fixed: PSU near the pixels.')}
      ${f('Fixed feed length (m)', inp(id, 'injectLength', s.injectLength, 'num', 'step="0.5"'))}
      ${f('Show hours per night', inp(id, 'hoursPerNight', s.hoursPerNight, 'num', 'step="0.5"'))}
      ${f('Show nights per season', inp(id, 'nights', s.nights, 'num'))}
      ${f(`Electricity price (${esc(s.currency)}/kWh)`, inp(id, 'tariff', s.tariff, 'num', 'step="0.01"'))}
      ${f('Currency symbol', inp(id, 'currency', s.currency))}
    </div></div>`;
  }

  // ---------- distro ----------
  F.distro = (p, R, d, opts = {}) => {
    const D = R.distros.get(d.id);
    const size = C.distroSizes.find(s => s.id === d.size) || C.distroSizes[0];
    const st = p.settings;
    const mainsPct = D.mainsA / st.mainsCircuitA * 100;
    let h = `<div class="card distro" id="f-${d.id}" data-sel="${d.id}">
      <div class="distro-head">
        <input class="name" data-id="${d.id}" data-f="name" data-t="str" value="${esc(d.name)}" aria-label="Distro name">
        ${sel(d.id, 'size', C.distroSizes.map(s => U.opt(s.id, s.name, d.size)).join(''), 'title="Enclosure size"')}
        ${d.size === 'custom' ? `<label class="fld inline">PSUs ${inp(d.id, 'psuSlots', d.psuSlots, 'num', 'min="1" style="width:52px"')}</label><label class="fld inline">Boards ${inp(d.id, 'boardSlots', d.boardSlots, 'num', 'min="1" style="width:52px"')}</label>` : ''}
        <span class="pill ${d.psus.length > d.psuSlots ? 'warn' : ''}">${d.psus.length}/${d.psuSlots} PSU</span>
        <span class="pill ${d.controllers.length > d.boardSlots ? 'warn' : ''}">${d.controllers.length}/${d.boardSlots} board</span>
        <span class="pill">${K.fmtW(D.dcW)} DC</span>
        <span class="pill ${U.pctClass(mainsPct)}" title="Mains current at full white, including PSU losses and relay loads">${U.num(D.mainsA, 1)} A mains</span>
        <span class="grow"></span>
        ${btn('balance', 'Balance PSUs', d.id, 'small', 'Spread banks and injection feeds across this distro\'s PSUs')}
        ${btn('delDistro', U.ic('x'), d.id, 'small ghost danger', 'Delete distro')}
      </div>`;
    const HX = R.hw && R.hw.caps.get(d.id);
    if (HX && PP.room) {
      const rows = PP.hw.capRows(HX.caps), worst = rows.some(c => c.state === 'err') ? 'err' : rows.some(c => c.state === 'warn') ? 'warn' : 'ok';
      const key = 'dc-' + d.id, box = d.boxTpl && PP.hw.box(p, d.boxTpl);
      h += `<details class="dist-caps" data-open-id="${key}"${U.open.has(key) || (worst === 'err' && !U.open.has('!' + key)) ? ' open' : ''}><summary class="muted" style="font-size:12px;cursor:pointer">${chev} Capacity${box ? ` · box <b>${esc(box.name)}</b>` : ''} <span class="dot ${worst}"></span> ${rows.filter(c => c.state !== 'ok').map(c => `<span class="${c.state}">${esc(c.name)} ${Math.round(c.used).toLocaleString()}/${c.cap.toLocaleString()}</span>`).join(' · ')}</summary>${PP.room.capHtml(HX.caps)}</details>`;
    }
    h += `<h4>Power supplies ${btn('addPsu', '+ PSU', d.id, 'small')}</h4>`;
    if (d.psus.length) {
      h += `<table class="t"><tr><th>Name</th><th>Model</th><th title="Output voltage set on the trim pot">Set V</th><th style="width:28%">Load</th><th>Amps</th><th>Watts</th><th></th></tr>`;
      d.psus.forEach((s, i) => { h += F.psuRow(p, R, s, i); });
      h += '</table>';
    } else h += '<div class="muted">No PSUs. Add one, then connect it to the controller\'s power inputs below.</div>';
    h += `<h4>Controllers <select id="addBoard-${d.id}" aria-label="Board to add">${Object.entries(C.boards).map(([k, b]) => U.opt(k, b.name, 'baldrick8')).join('')}</select>${btn('addController', '+ Add', d.id, 'small')}</h4>`;
    d.controllers.forEach(c => { h += F.controller(p, R, d, c, opts); });
    h += `<details data-open-id="dn-${d.id}"${U.open.has('dn-' + d.id) ? ' open' : ''}><summary class="muted" style="font-size:12px;cursor:pointer">${chev} Notes</summary><textarea data-id="${d.id}" data-f="notes" data-t="str" placeholder="Location, mains feed, IP rating…">${esc(d.notes)}</textarea></details>`;
    return h + '</div>';
  };

  F.psuRow = (p, R, s, i) => {
    const r = R.psus.get(s.id), spec = r.spec, st = p.settings;
    return `<tr class="psurow" id="f-${s.id}" data-sel="${s.id}">
      <td class="nw"><span class="psw c${i % 6}" aria-hidden="true"></span> <input data-id="${s.id}" data-f="name" data-t="str" value="${esc(s.name)}" style="width:80px"></td>
      <td>${sel(s.id, 'model', U.psuModelOptions(s.model))}
        ${s.model === 'custom' ? `<div class="row" style="margin-top:3px"><label class="fld inline">V ${inp(s.id, 'customV', s.customV, 'num', 'style="width:52px"')}</label><label class="fld inline">A ${inp(s.id, 'customA', s.customA, 'num', 'style="width:52px"')}</label></div>` : `<div class="soft" style="font-size:11px">${esc(spec.ip)}</div>`}</td>
      <td>${inp(s.id, 'vout', s.vout, 'num', `step="0.1" min="${spec.adj[0]}" max="${spec.adj[1]}" style="width:60px" title="Trim range ${spec.adj[0]}-${spec.adj[1]} V"`)}</td>
      <td>${U.bar(r.pct, st.psuTargetPct)}<div class="soft" style="font-size:11px">${U.num(r.pct, 0)}% of ${spec.a} A</div></td>
      <td class="nw">${K.fmtA(r.amps)}</td><td class="nw">${K.fmtW(r.watts)}</td>
      <td class="nw">${btn('delPsu', U.ic('x'), s.id, 'small ghost danger', 'Delete PSU')}</td></tr>`;
  };

  // ---------- controller ----------
  F.controller = (p, R, d, c, opts = {}) => {
    const b = C.boards[c.board], CR = R.controllers.get(c.id);
    let h = `<div class="ctl" id="f-${c.id}" data-sel="${c.id}">
      <div class="ctl-head">
        <input class="name" data-id="${c.id}" data-f="name" data-t="str" value="${esc(c.name)}" aria-label="Controller name">
        ${sel(c.id, 'board', Object.entries(C.boards).map(([k, x]) => U.opt(k, x.name, c.board)).join(''), 'title="Board"')}
        <label class="fld inline">IP ${inp(c.id, 'ip', c.ip, 'str', 'placeholder="192.168.1.x" style="width:120px"')}</label>
        ${b.ports ? `<span class="pill">${CR.pixels} px</span><span class="pill">${CR.channels} ch</span>` : ''}
        <span class="grow"></span>
        ${btn('delController', U.ic('x'), c.id, 'small ghost danger', 'Delete controller')}
      </div>
      <div class="soft" style="font-size:11px;margin-top:3px">${esc(b.note)}</div>
      <div class="banks">`;
    b.banks.forEach(bk => {
      const br = R.banks.get(c.id + ':' + bk.id);
      h += `<div class="bank"><b>${esc(bk.label)}</b>${bk.ports.length ? `<span class="soft">ports ${bk.ports[0]}${bk.ports.length > 1 ? '-' + bk.ports[bk.ports.length - 1] : ''}</span>` : '<span class="soft">board power</span>'}
        ${sel(c.id, 'banks.' + bk.id, U.psuOptions(p, c.banks[bk.id], '— no PSU —'))}
        ${br && br.max ? `<span class="${br.amps > br.max ? 'err' : 'soft'}">${K.fmtA(br.amps)} of ${br.max} A</span>` : ''}</div>`;
    });
    h += `<div class="bank"><b>Power jack feed</b><span class="soft">PSU → board</span><div class="row">${inp(c.id, 'feed.length', c.feed.length, 'num', 'step="0.1" style="width:56px"')} m ${sel(c.id, 'feed.gauge', U.wireOptions(c.feed.gauge))}</div></div>`;
    h += '</div>';
    if (b.ports) {
      h += `<div>`;
      c.ports.forEach(pt => { h += F.port(p, R, c, pt, opts.openPort === pt.id); });
      h += `</div>`;
    }
    if (b.relays) h += relays(p, R, c, b);
    if (b.inputs) h += inputs(p, R, c, b);
    if (b.dmx) h += `<h4>DMX</h4><div class="muted">One universe out on RJ45, 3-pin and 5-pin XLR. Add fixtures in xLights as a DMX model on this controller.</div>`;
    return h + '</div>';
  };

  function relays(p, R, c, b) {
    let h = `<h4>Relays (max ${b.relayMaxA} A, ${b.relayMaxV} V)</h4><table class="t"><tr><th>#</th><th>Switches</th><th>Amps</th><th>Volts</th><th>Load</th></tr>`;
    c.relays.forEach(r => {
      const over = r.amps > b.relayMaxA || r.volts > b.relayMaxV;
      h += `<tr id="f-${r.id}" data-sel="${r.id}"><td>${r.num}</td><td>${inp(r.id, 'name', r.name, 'str', 'placeholder="e.g. Snow machine"')}</td>
        <td>${inp(r.id, 'amps', r.amps, 'num', 'step="0.1" min="0" style="width:60px"')}</td><td>${inp(r.id, 'volts', r.volts, 'num', 'style="width:60px"')}</td>
        <td class="${over ? 'err' : 'soft'}">${r.amps ? K.fmtW(r.amps * r.volts) : '-'}${over ? ' over rating' : ''}</td></tr>`;
    });
    return h + '</table>';
  }

  F.inputUrl = (p, r) => {
    const base = `http://${p.settings.fppIp}/api/command/`;
    const v = r.param || '';
    switch (r.action) {
      case 'playlist': return base + `Start Playlist/${v}/false/true`;
      case 'playlistNow': return base + `Start Playlist/${v}/false/false`;
      case 'stop': return base + 'Stop Now';
      case 'volume': return base + `Volume Set/${v}`;
      case 'effect': return base + `Effect Start/${v}`;
      case 'custom': return base + v;
      case 'switchy': return 'Baldrick web UI: Turniputs > BaldrickSwitchy (Turnip Network) — relay/seconds ' + v;
      case 'test': return 'Baldrick web UI: Turniputs > Test mode at ' + (v || '50') + '%';
      default: return '';
    }
  };

  function inputs(p, R, c, b) {
    let h = `<h4>Turniputs (inputs)</h4><table class="t"><tr><th>#</th><th>Name</th><th>Device</th><th>Action</th><th>Value</th></tr>`;
    c.inputs.forEach(r => {
      const a = C.inputActions.find(x => x.id === r.action) || C.inputActions[0];
      const url = F.inputUrl(p, r);
      h += `<tr id="f-${r.id}" data-sel="${r.id}"><td>${r.num}</td><td>${inp(r.id, 'name', r.name, 'str', 'placeholder="e.g. Start button"')}</td>
        <td>${sel(r.id, 'device', C.inputDevices.map(x => U.opt(x, x, r.device)).join(''))}</td>
        <td>${sel(r.id, 'action', C.inputActions.map(x => U.opt(x.id, x.name, r.action)).join(''))}</td>
        <td>${a.param ? inp(r.id, 'param', r.param, 'str', `placeholder="${esc(a.param)}"`) : ''}</td></tr>`;
      if (url) h += `<tr><td></td><td colspan="4"><span class="url">${esc(url)}</span> ${url.startsWith('http') ? btn('copy', 'Copy', '', 'small ghost', 'Copy URL', `data-text="${esc(url)}"`) : ''}</td></tr>`;
    });
    return h + '</table>';
  }

  // ---------- port ----------
  F.port = (p, R, c, pt, forceOpen) => {
    const r = R.ports.get(pt.id), b = C.boards[c.board];
    const status = !pt.chain.length ? 'none' : r.minPct == null ? 'none' : (r.firstErr >= 0 || (b.fuseA && r.portA > b.fuseA)) ? 'err' : (r.firstFail >= 0 || (b.fuseA && r.portA > b.fuseA * 0.8)) ? 'warn' : 'ok';
    const summ = `${chev}<span class="dot ${status}" aria-hidden="true"></span><span class="pn">Port ${pt.num}</span><span class="pl">${esc(pt.label) || '<span class="soft">unused</span>'}</span>
      ${pt.chain.length ? `<span class="m">${r.pixels} px · ${r.channels} ch</span><span class="m ${b.fuseA && r.portA > b.fuseA ? 'err' : ''}">${K.fmtA(r.portA)}</span><span class="m ${status === 'err' ? 'err' : status === 'warn' ? 'warn' : ''}">${r.minV != null ? 'min ' + K.fmtV(r.minV) : ''}</span>` : ''}`;
    const key = 'pt-' + pt.id;
    const open = forceOpen || U.open.has(key);
    return `<details class="portrow" id="f-${pt.id}" data-sel="${pt.id}" data-open-id="${key}"${open ? ' open' : ''}><summary>${summ}</summary>${open ? F.portBody(p, R, c, pt) : ''}</details>`;
  };

  F.portBody = (p, R, c, pt) => {
    const r = R.ports.get(pt.id), b = C.boards[c.board];
    const others = [];
    PP.store.project.distros.forEach(d => d.controllers.forEach(cc => cc.ports.forEach(x => { if (x.id !== pt.id) others.push(U.opt(x.id, `${cc.name} port ${x.num}${x.label ? ' · ' + x.label : ''}${x.chain.length ? ' (in use)' : ''}`, '')); })));
    let h = `<div class="portbody">
      <div class="row">
        <label class="fld inline">Label ${inp(pt.id, 'label', pt.label, 'str', 'placeholder="e.g. Roofline" style="width:150px"')}</label>
        <label class="fld inline" title="Baldrick port brightness (on top of global ${p.settings.brightness}%)">Port brightness ${inp(pt.id, 'brightness', pt.brightness, 'num', 'min="1" max="100" style="width:56px"')}%</label>
        <label class="fld inline" title="Untick if this port only carries data and the run is powered by injection">${inp(pt.id, 'portPower', pt.portPower, 'bool')} Power from port${b.fuseA ? ` (${b.fuseA} A fuse)` : ''}</label>
      </div>
      <div class="chain">
        <div class="port-port">▸ ${esc(c.name)} port ${pt.num} · ${r.ctx.psu ? `${esc(r.ctx.psu.name)} via ${esc(r.ctx.bank.label)}` : '<span class="err">no PSU on this bank</span>'}${pt.chain.length ? ` · ${K.fmtA(r.portA)}${b.fuseA ? `, fit ${b.fuseA} A fuse` : ''}` : ''}</div>`;
    pt.chain.forEach((it, i) => { h += F.item(p, R, pt, it, i); });
    if (!pt.chain.length) h += '<div class="muted" style="padding:4px 0">Empty. Add a lead cable, then strings or floods.</div>';
    const presetOpts = p.library.presets.map(x => U.opt(x.id, x.name, '')).join('');
    h += `</div><div class="addbar">
        <select id="preset-${pt.id}" aria-label="Preset">${presetOpts}</select>× <input type="number" id="qty-${pt.id}" value="1" min="1" max="50" style="width:50px" aria-label="How many">
        ${btn('addPreset', 'Add', pt.id, 'small primary')}
        ${btn('addCable', '+ Cable', pt.id, 'small')}${btn('addPixels', '+ Pixels', pt.id, 'small')}${btn('addInject', '+ Injection', pt.id, 'small')}
      </div>
      <div class="addbar">
        ${btn('autoInject', 'Auto-inject', pt.id, 'small', 'Add injection points until every pixel is above the warning voltage')}
        ${btn('clearInject', 'Remove injections', pt.id, 'small')}
        ${btn('clearPort', 'Clear run', pt.id, 'small danger')}
        <span class="grow"></span>
        <select id="moveTo-${pt.id}" aria-label="Move or swap run to port"><option value="">Move / swap run to…</option>${others.join('')}</select>${btn('movePort', 'Go', pt.id, 'small')}
      </div></div>`;
    return h;
  };

  // ---------- chain item ----------
  F.item = (p, R, pt, it, i) => {
    const r = R.ports.get(pt.id), ir = r.items.get(it.id) || {};
    const id = it.id;
    let body = '', res = '';
    if (it.kind === 'cable') {
      const w = C.wireById(it.gauge);
      body = `<span class="kind">Cable</span><label>${inp(id, 'length', it.length, 'num', 'step="0.5" min="0"')} m</label>${sel(id, 'gauge', U.wireOptions(it.gauge))}`;
      const drop = ir.vIn != null ? ir.vIn - ir.vOut : 0;
      res = `<span class="${ir.maxA > w.maxA ? 'err' : ''}">${K.fmtA(ir.maxA)}</span> · drop ${U.num(drop, 2)} V`;
    } else if (it.kind === 'pixels') {
      const t = M.pixelType(p, it.typeId);
      const cls = ir.unpowered ? 'err' : U.vClass(ir.minPct);
      const w = C.wireById(it.gauge);
      body = `<span class="kind">${t ? esc(t.cat === 'flood' ? 'Flood' : t.cat === 'seed' ? 'Seeds' : t.cat === 'bullet' ? 'Bullets' : 'Pixels') : 'Pixels'}</span>
        ${sel(id, 'typeId', U.pixelTypeOptions(p, it.typeId))}
        <label>× ${inp(id, 'count', it.count, 'num', 'min="1" max="2000"')}</label>
        <label title="Distance between pixels (lead length for floods)">every ${inp(id, 'spacing', it.spacing, 'num', 'step="0.01" min="0"')} m</label>
        <label title="Wire inside the string">wire ${sel(id, 'gauge', U.wireOptions(it.gauge))}</label>`;
      res = `<span class="dot ${cls}" aria-hidden="true"></span> ${ir.unpowered ? '<span class="err">no power</span>' : `min ${K.fmtV(ir.minV)} (${U.num(ir.minPct, 0)}%)`} · <span class="${ir.maxA > w.maxA ? 'err' : ''}">${K.fmtA(ir.maxA)}</span> · ${K.fmtW(ir.watts)}${t ? ` · ${it.count * t.ch} ch` : ''}${it.continued ? ` · <span class="soft">rest of string from pixel ${it.tapOffset + 1}</span>` : ''}`;
    } else if (it.kind === 'inject') {
      const w = C.wireById(it.gauge);
      const a = ir.sourceA || 0;
      body = `<span class="kind">Inject</span>${sel(id, 'psuId', U.psuOptions(p, it.psuId, '— pick PSU —'))}
        <label>feed ${inp(id, 'length', it.length, 'num', 'step="0.5" min="0"')} m</label>${sel(id, 'gauge', U.wireOptions(it.gauge))}
        <label title="Cut +V between the run before and after this point, so two PSUs are not joined">${inp(id, 'isolate', it.isolate, 'bool')} isolate +V</label>`;
      res = `<span class="${a > w.maxA ? 'err' : ''}">${K.fmtA(a)}</span> · fuse ${K.recommendFuse(Math.max(a, 0.1))} A`;
    }
    return `<div class="item k-${it.kind}" id="f-${id}" data-sel="${id}">${body}
      <input class="lbl" data-id="${id}" data-f="label" data-t="str" value="${esc(it.label)}" placeholder="note" aria-label="Note">
      <span class="res">${res}</span>
      <span class="row" style="gap:2px">${btn('itemUp', U.ic('up'), id, 'small ghost', 'Move up')}${btn('itemDown', U.ic('down'), id, 'small ghost', 'Move down')}${btn('itemDup', U.ic('copy'), id, 'small ghost', 'Duplicate')}${btn('itemDel', U.ic('x'), id, 'small ghost danger', 'Remove')}</span></div>`;
  };

  // ---------- library ----------
  function library(p) {
    let h = `<div class="card" style="padding:8px 12px"><h4>Pixel types <span class="soft" style="text-transform:none;letter-spacing:0">full-white watts per pixel at its voltage; check your supplier's figures</span>${btn('addType', '+ Type', '', 'small')}</h4>
      <table class="t"><tr><th>Name</th><th>Kind</th><th>Volts</th><th>Watts</th><th>Channels</th><th>Spacing m</th><th>String wire</th><th></th></tr>`;
    p.library.pixelTypes.forEach(t => {
      h += `<tr><td>${inp(t.id, 'name', t.name)}</td>
        <td>${sel(t.id, 'cat', ['bullet', 'seed', 'flood', 'strip', 'null', 'other'].map(x => U.opt(x, x, t.cat)).join(''))}</td>
        <td>${inp(t.id, 'v', t.v, 'num', 'style="width:56px"')}</td><td>${inp(t.id, 'w', t.w, 'num', 'step="0.01" style="width:64px"')}</td>
        <td>${sel(t.id, 'ch', U.opt(3, '3 RGB', t.ch) + U.opt(4, '4 RGBW', t.ch) + U.opt(1, '1', t.ch), '', 'num')}</td>
        <td>${inp(t.id, 'spacing', t.spacing, 'num', 'step="0.01" style="width:64px"')}</td><td>${sel(t.id, 'gauge', U.wireOptions(t.gauge))}</td>
        <td>${btn('delType', U.ic('x'), t.id, 'small ghost danger', 'Delete pixel type')}</td></tr>`;
    });
    h += `</table><h4>String presets ${btn('addPresetDef', '+ Preset', '', 'small')}</h4><table class="t"><tr><th>Name</th><th>Pixel type</th><th>Pixels</th><th>Spacing m</th><th>String wire</th><th>Full white</th><th></th></tr>`;
    p.library.presets.forEach(x => {
      const id = 'preset:' + x.id, t = M.pixelType(p, x.typeId);
      const wOpts = U.opt('', t ? 'Type default (' + C.wireById(t.gauge).label + ')' : 'Type default', x.gauge || '') + U.wireOptions(x.gauge || '__');
      const watts = t ? t.w * (+x.count || 0) : 0;
      h += `<tr><td>${inp(id, 'name', x.name)}</td><td>${sel(id, 'typeId', U.pixelTypeOptions(p, x.typeId))}</td><td>${inp(id, 'count', x.count, 'num', 'min="1" style="width:64px"')}</td>
        <td>${inp(id, 'spacing', x.spacing == null ? '' : x.spacing, 'num', `step="0.01" min="0" style="width:72px" placeholder="${t ? t.spacing : ''}" title="Leave blank to use the pixel type's spacing"`)}</td><td>${sel(id, 'gauge', wOpts)}</td>
        <td class="num">${U.num(watts, watts < 10 ? 1 : 0)} W<div class="soft small">${t ? U.num(watts / t.v, 2) + ' A at ' + t.v + ' V' : ''}</div></td>
        <td class="nowrap">${btn('presetToChain', 'Add to chain', x.id, 'small', 'Add to the selected port, or after the selected string')}${btn('delPresetDef', U.ic('x'), x.id, 'small ghost danger', 'Delete preset')}</td></tr>`;
    });
    return h + `</table><div class="row" style="margin-top:8px">${btn('resetLibrary', 'Reset library to defaults', '', 'small')}<span class="soft">Library travels with the project file.</span></div></div>`;
  }

  // ---------- Hardware & power page ----------
  F.powerPage = (p, R) => {
    const st = p.settings, T = R.totals;
    const pct = T.psuCapA ? T.psuA / T.psuCapA * 100 : 0;
    let h = `<div class="page-in"><div class="page-head"><h2>Hardware and power</h2><span class="grow"></span>
      ${btn('balanceAll', 'Balance all PSUs', '', '', 'Spread banks and injection feeds across the PSUs in each distro')}
      ${btn('libOpen', 'Hardware library', '', '', 'Reusable cable standards, hardware and boxes')}${btn('boxOpen', 'Box builder', '', '', 'Build reusable controller boxes')}</div>
      <p class="lede">Every PSU against your ${st.psuTargetPct}% design target, mains draw per distro and the settings the numbers depend on.</p>`;
    h += `<div class="kpis">
      <div class="card kpi"><span>PSU budget</span><b class="${U.pctClass(pct, st.psuTargetPct)}">${U.num(pct, 0)}%</b><small>${K.fmtA(T.psuA)} of ${U.num(T.psuCapA, 0)} A</small></div>
      <div class="card kpi"><span>DC at full white</span><b>${K.fmtW(T.dcW)}</b><small>at ${st.brightness}% brightness</small></div>
      <div class="card kpi"><span>Mains</span><b>${U.num(T.mainsA, 1)} A</b><small>${U.num(T.acW, 0)} W at ${st.mainsV} V</small></div>
      <div class="card kpi"><span>Season cost</span><b>${esc(st.currency)}${U.num(T.cost, 2)}</b><small>${U.num(T.kWh, 0)} kWh at ${st.typicalPct}% typical</small></div></div>`;
    h += `<h3>Power supplies</h3><div class="card tcard"><table class="t budget"><tr><th>PSU</th><th>Distro</th><th>Model</th><th>Load</th><th class="num">Amps</th><th>Datasheet</th></tr>`;
    if (!R.psus.size) h += `<tr><td colspan="6" class="muted">No PSUs yet. Add a distro in the Wiring workspace.</td></tr>`;
    R.psus.forEach((r, id) => {
      const d = p.distros.find(x => x.id === r.distroId), cls = U.pctClass(r.pct, st.psuTargetPct), u = C.psuUrl(r.psu.model);
      h += `<tr class="rowlink" data-act="jump" data-id="${id}"><td><b>${esc(r.psu.name)}</b></td><td>${esc(d ? d.name : '')}</td><td>${esc(r.psu.model === 'custom' ? 'Custom' : r.psu.model)}<div class="soft small">${esc(r.spec.ip)}</div></td>
        <td style="min-width:140px"><div class="bar ${cls}"><i style="width:${Math.min(100, r.pct)}%"></i><span class="tgt" style="left:${st.psuTargetPct}%"></span></div><span class="${cls} small">${U.num(r.pct, 0)}%</span></td>
        <td class="num">${K.fmtA(r.amps)} / ${r.spec.a} A</td><td>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(C.psuSeries(r.psu.model))} PDF</a>` : '<span class="soft">-</span>'}</td></tr>`;
    });
    h += '</table></div>';
    h += `<h3>Distros and mains</h3><div class="card tcard"><table class="t"><tr><th>Distro</th><th class="num">Pixels</th><th class="num">DC</th><th>Mains</th><th>Boards</th></tr>`;
    p.distros.forEach(d => {
      const D = R.distros.get(d.id), mp = D.mainsA / st.mainsCircuitA * 100, cls = mp > 100 ? 'err' : mp > 80 ? 'warn' : 'ok';
      h += `<tr class="rowlink" data-act="jump" data-id="${d.id}"><td><b>${esc(d.name)}</b></td><td class="num">${D.pixels.toLocaleString()}</td><td class="num">${K.fmtW(D.dcW)}</td>
        <td style="min-width:140px"><div class="bar ${cls}"><i style="width:${Math.min(100, mp)}%"></i><span class="tgt" style="left:80%"></span></div><span class="small ${cls}">${U.num(D.mainsA, 1)} of ${st.mainsCircuitA} A</span></td>
        <td>${d.controllers.map(c => `<a href="${esc(C.boardUrl(c.board))}" target="_blank" rel="noopener" title="Baldrick manual">${esc(c.name)}</a>`).join(', ') || '<span class="soft">none</span>'}</td></tr>`;
    });
    h += '</table></div>';
    h += `<h3>Settings</h3>${settings(p)}</div>`;
    return h;
  };

  // ---------- Pixel presets page ----------
  F.presetsPage = (p) => `<div class="page-in"><div class="page-head"><h2>Pixel presets</h2></div>
    <p class="lede">Pixel types hold the full-white watts, spacing and string wire; presets are the strings you buy. A preset can override spacing and wire. Select a port or a string in the workspace, then press <b>Add to chain</b>.</p>${library(p)}</div>`;

  // ---------- channels ----------
  function channels(p, R) {
    let h = `<div class="card" style="padding:8px 12px"><table class="t"><tr><th>Controller</th><th>IP</th><th>Port</th><th>Label</th><th>Pixels</th><th>Channels</th><th>Start ch</th><th>Universes (${p.settings.universeSize} ch)</th></tr>`;
    let any = false;
    p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      const r = R.ports.get(pt.id); if (!r.channels) return; any = true;
      h += `<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.ip)}</td><td>${pt.num}</td><td>${esc(pt.label)}</td><td>${r.pixels}</td><td>${r.channels}</td><td>${r.startCh}</td><td>${r.universes}</td></tr>`;
    })));
    if (!any) h += '<tr><td colspan="8" class="muted">No pixels yet.</td></tr>';
    return h + `</table><div class="row" style="margin-top:8px">${btn('csvChannels', 'Export CSV', '', 'small')}<span class="soft">Start channels run on in controller order, like xLights absolute addressing. With DDP you only need the per-port pixel counts.</span></div></div>`;
  }

  // ---------- inspector (Visual view) ----------
  F.inspector = (p, R, selId) => {
    const e = selId ? R.idx.get(selId) : null;
    if (!e) {
      return `<div class="hint"><b>Nothing selected.</b><br>Click a distro, PSU, board, port, string or injection to edit it here. Drag presets from the left onto a port's output (or onto a string to insert after it). Drag a distro by its title bar. Scroll to zoom, drag the background to pan.</div>
        ${p.distros.length ? '' : btn('addDistro', '+ Add a distro', '', 'primary')}`;
    }
    const crumbs = [];
    if (e.distro) crumbs.push(esc(e.distro.name));
    if (e.controller) crumbs.push(esc(e.controller.name));
    if (e.port) crumbs.push('Port ' + e.port.num);
    let h = `<div class="soft" style="margin-bottom:6px">${crumbs.join(' › ')}</div>`;
    if (e.type === 'distro') h += F.distro(p, R, e.obj);
    else if (e.type === 'psu') {
      const r = R.psus.get(e.obj.id);
      const i = e.distro.psus.indexOf(e.obj);
      h += `<table class="t">${F.psuRow(p, R, e.obj, i)}</table><h4>Feeds</h4><table class="t"><tr><th>Load</th><th>Amps</th></tr>`;
      r.loads.slice().sort((a, b) => b.amps - a.amps).forEach(l => { h += `<tr data-act="select" data-id="${l.ref}" style="cursor:pointer"><td>${esc(l.label)}</td><td>${K.fmtA(l.amps)}</td></tr>`; });
      h += `<tr><td><b>Total</b></td><td><b>${K.fmtA(r.amps)}</b> of ${r.spec.a} A</td></tr></table>`;
    } else if (e.type === 'controller' || e.type === 'relay' || e.type === 'input') h += `<div class="card" style="padding:4px 8px">${F.controller(p, R, e.distro, e.controller)}</div>`;
    else if (e.type === 'port' || e.type === 'item') {
      U.open.add('pt-' + e.port.id);
      h += `<div class="card" style="padding:4px 8px">${F.port(p, R, e.controller, e.port, true)}</div>`;
    }
    return h;
  };

  // Highlight the selected element and open/scroll to it.
  F.markSelection = (scroll = false) => {
    const id = PP.store.selection;
    U.$$('#formPane .sel').forEach(el => el.classList.remove('sel'));
    if (!id) return;
    const el = document.getElementById('f-' + id);
    if (!el || !U.$('#formPane').contains(el)) return;
    el.classList.add('sel');
    if (scroll) {
      let d = el.parentElement;
      while (d && d.id !== 'formPane') { if (d.tagName === 'DETAILS' && !d.open) { d.open = true; } d = d.parentElement; }
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  };
})();

</script>
<script>
// Visual view: an SVG wiring diagram of every distro, its PSUs, boards and the pixel runs on each port.
// It draws straight from the project + calc result, so it always matches the Form view.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc, S = PP.store;
  const esc = U.esc;
  const V = PP.visual = {};
  const W = 300;             // distro box width
  const ROW = 30;            // port row height
  const GAUGE_W = { awg22: 1, awg20: 1.3, awg18: 1.7, awg16: 2.2, awg14: 2.8, awg12: 3.4, awg10: 4.2, awg8: 5 };
  let drag = null, pan = null;
  V.psuPos = new Map();      // psuId -> absolute anchor for feed lines

  const t = (x, y, cls, s, extra = '') => `<text x="${x}" y="${y}" class="${cls}" ${extra}>${esc(s)}</text>`;
  const title = s => `<title>${esc(s)}</title>`;
  const psuColour = (p, psuId) => {
    for (const d of p.distros) { const i = d.psus.findIndex(s => s.id === psuId); if (i >= 0) return 'c' + (i % 6); }
    return 'c4';
  };

  // ---------- palette ----------
  V.renderPalette = (p) => {
    const pal = (data, sw, label, tip = '') => `<div class="pal" draggable="true" data-drag='${esc(JSON.stringify(data))}' title="${esc(tip || 'Drag onto the diagram')}"><span class="sw ${sw}"></span>${esc(label)}</div>`;
    let h = '<h5>Strings and floods</h5>';
    p.library.presets.forEach(x => {
      const ty = M.pixelType(p, x.typeId);
      h += pal({ t: 'preset', id: x.id }, ty && ty.cat === 'flood' ? 'flood' : '', x.name, 'Drag onto a port or after a string');
    });
    h += '<h5>Wiring</h5>';
    [[2, 'awg18'], [5, 'awg18'], [10, 'awg18'], [10, 'awg16']].forEach(([l, g]) => { h += pal({ t: 'cable', length: l, gauge: g }, 'cable', `Cable ${l} m ${C.wireById(g).label}`); });
    h += pal({ t: 'inject' }, 'inject', 'Power injection', 'Drop after a string to inject power there');
    h += '<h5>Hardware</h5>';
    ['LRS-350-12', 'LRS-200-12', 'HLG-320H-12'].filter(id => C.psuById(id)).forEach(id => { h += pal({ t: 'psu', model: id }, 'cable', id, 'Drop onto a distro'); });
    Object.entries(C.boards).forEach(([k, b]) => { h += pal({ t: 'board', board: k }, '', b.name, 'Drop onto a distro'); });
    h += pal({ t: 'distro' }, 'cable', 'New distro', 'Drop anywhere');
    U.$('#palette').innerHTML = h;
  };

  // ---------- layout ----------
  function layoutDistro(p, R, d) {
    const L = { psus: [], ctls: [], h: 0 };
    const cols = 2, pw = 132, ph = 58;
    d.psus.forEach((s, i) => L.psus.push({ s, i, x: 12 + (i % cols) * (pw + 12), y: 44 + Math.floor(i / cols) * (ph + 10), w: pw, h: ph }));
    let y = 44 + Math.ceil(d.psus.length / cols) * (ph + 10) + (d.psus.length ? 24 : 12);
    d.controllers.forEach(c => {
      const b = C.boards[c.board];
      const rows = [];
      let ry = y + 34;
      c.ports.forEach(pt => { rows.push({ kind: 'port', pt, y: ry }); ry += ROW; });
      c.relays.forEach(r => { rows.push({ kind: 'relay', r, y: ry }); ry += 24; });
      c.inputs.forEach(r => { rows.push({ kind: 'input', r, y: ry }); ry += 22; });
      if (b.dmx) { rows.push({ kind: 'dmx', y: ry }); ry += 22; }
      const h = Math.max(ry - y + 4, 34 + b.banks.length * 26);
      L.ctls.push({ c, b, x: 120, y, w: W - 120, h, rows });
      y += h + 14;
    });
    L.h = Math.max(y, 90);
    return L;
  }

  // ---------- render ----------
  V.render = (p, R) => {
    const svg = U.$('#svg');
    V.psuPos.clear();
    const sel = S.selection;
    let body = '', feeds = '';
    const layouts = new Map();
    p.distros.forEach(d => layouts.set(d.id, layoutDistro(p, R, d)));
    p.distros.forEach(d => {
      const L = layouts.get(d.id);
      L.psus.forEach(q => V.psuPos.set(q.s.id, { x: d.x + q.x + q.w, y: d.y + q.y + q.h / 2, cls: 'c' + (q.i % 6) }));
    });
    p.distros.forEach(d => {
      const L = layouts.get(d.id);
      const out = drawDistro(p, R, d, L, sel);
      body += out.g; feeds += out.feeds;
    });
    const k = U.cam.k;
    svg.innerHTML = `<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="s-grid"/></pattern></defs>
      <g id="cam" transform="translate(${U.cam.x},${U.cam.y}) scale(${k})">
        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#dots)" class="bg"/>
        ${body}<g id="feeds">${feeds}</g>
      </g>
      ${p.distros.length ? '' : `<text x="50%" y="45%" text-anchor="middle" class="s-muted" style="font-size:14px">Drag “New distro” from the palette, or press + Distro</text>`}`;
  };

  function drawDistro(p, R, d, L, sel) {
    const D = R.distros.get(d.id);
    let g = `<g class="distro" data-distro="${d.id}" transform="translate(${d.x},${d.y})">`;
    g += `<rect class="s-distro" x="0" y="0" width="${W}" height="${L.h}" rx="10" data-drop="distro" data-id="${d.id}"/>`;
    g += `<rect class="s-distro-head" x="1" y="1" width="${W - 2}" height="32" rx="10" data-drag-distro="${d.id}" data-id="${d.id}"/>`;
    g += t(12, 20, 's-title', d.name, `data-drag-distro="${d.id}" data-id="${d.id}" style="cursor:move"`);
    g += t(W - 10, 20, 's-muted', `${K.fmtW(D.dcW)} · ${U.num(D.mainsA, 1)} A mains`, 'text-anchor="end" pointer-events="none"');
    g += t(12, 40, 's-tiny', `${(C.distroSizes.find(s => s.id === d.size) || {}).name || ''}`, 'pointer-events="none"');
    if (sel === d.id) g += `<rect class="s-sel" x="-3" y="-3" width="${W + 6}" height="${L.h + 6}" rx="12"/>`;
    // PSUs
    L.psus.forEach(q => {
      const r = R.psus.get(q.s.id), cls = 'c' + (q.i % 6);
      const pct = r.pct || 0, bc = U.pctClass(pct, p.settings.psuTargetPct);
      g += `<g data-id="${q.s.id}" style="cursor:pointer">${title(`${q.s.name}: ${q.s.model}, set ${q.s.vout} V\n${K.fmtA(r.amps)} of ${r.spec.a} A (${U.num(pct, 0)}%)\n${r.loads.map(l => '• ' + l.label + ': ' + K.fmtA(l.amps)).join('\n')}`)}
        <rect class="s-psu" x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" rx="6"/>
        <rect class="${cls}" x="${q.x}" y="${q.y}" width="5" height="${q.h}" rx="2"/>
        ${t(q.x + 11, q.y + 15, 's-text', q.s.name)}${t(q.x + q.w - 6, q.y + 15, 's-tiny', q.s.vout + ' V', 'text-anchor="end"')}
        ${t(q.x + 11, q.y + 28, 's-tiny', q.s.model === 'custom' ? `Custom ${q.s.customV} V ${q.s.customA} A` : q.s.model)}
        <rect class="s-barbg" x="${q.x + 11}" y="${q.y + 35}" width="${q.w - 20}" height="7" rx="3"/>
        <rect class="s-${bc}" x="${q.x + 11}" y="${q.y + 35}" width="${Math.min(1, pct / 100) * (q.w - 20)}" height="7" rx="3"/>
        ${t(q.x + 11, q.y + 53, 's-tiny', `${K.fmtA(r.amps)} / ${r.spec.a} A · ${U.num(pct, 0)}%`)}
        ${sel === q.s.id ? `<rect class="s-sel" x="${q.x - 2}" y="${q.y - 2}" width="${q.w + 4}" height="${q.h + 4}" rx="7"/>` : ''}</g>`;
    });
    if (!d.psus.length) g += t(12, 58, 's-muted', 'No PSU — drop one here');
    // Controllers
    let chains = '', feeds = '';
    L.ctls.forEach(cl => {
      const { c, b } = cl;
      g += `<g data-id="${c.id}" style="cursor:pointer">${title(`${c.name} (${b.name})${c.ip ? '\nIP ' + c.ip : ''}\n${b.note}`)}
        <rect class="s-board" x="${cl.x}" y="${cl.y}" width="${cl.w}" height="${cl.h}" rx="6"/>
        ${t(cl.x + 8, cl.y + 15, 's-text', c.name)}${t(cl.x + 8, cl.y + 27, 's-tiny', `${b.name}${c.ip ? ' · ' + c.ip : ''}`)}</g>`;
      if (sel === c.id) g += `<rect class="s-sel" x="${cl.x - 3}" y="${cl.y - 3}" width="${cl.w + 6}" height="${cl.h + 6}" rx="8"/>`;
      // Banks: power pads on the left edge, wired from their PSU.
      b.banks.forEach((bk, bi) => {
        const portRows = cl.rows.filter(r => r.kind === 'port' && bk.ports.includes(r.pt.num));
        const py = portRows.length ? (portRows[0].y + portRows[portRows.length - 1].y) / 2 : cl.y + 40 + bi * 26;
        const psuId = c.banks[bk.id];
        const q = L.psus.find(x => x.s.id === psuId);
        const cls = psuId ? psuColour(p, psuId) : '';
        const br = R.banks.get(c.id + ':' + bk.id);
        g += `<g data-id="${c.id}" style="cursor:pointer">${title(`${bk.label}${bk.ports.length ? ' (ports ' + bk.ports.join(', ') + ')' : ''}\n${psuId ? 'from ' + (R.psus.get(psuId) || {}).psu.name : 'NO PSU'}${br ? '\n' + K.fmtA(br.amps) : ''}\nFeed: ${c.feed.length} m ${C.wireById(c.feed.gauge).label}`)}
          <rect class="${psuId ? cls : 's-pad'}" x="${cl.x - 6}" y="${py - 6}" width="12" height="12" rx="2"/>
          ${portRows.length ? '' : t(cl.x + 10, py + 4, 's-tiny', bk.label)}</g>`;
        if (portRows.length > 1) g += `<path d="M${cl.x + 4} ${portRows[0].y} V${portRows[portRows.length - 1].y}" class="s-strwire" style="opacity:.4"/>`;
        if (q) {
          const sx = q.x + q.w / 2 + (bi % 2 ? 8 : -8), sy = q.y + q.h;
          g += `<path class="s-bankwire ${cls}" d="M${sx} ${sy} C${sx} ${py} ${cl.x - 50} ${py} ${cl.x - 6} ${py}"/>`;
        } else if (psuId) {
          const a = V.psuPos.get(psuId);
          if (a) feeds += `<path class="s-bankwire ${cls}" style="stroke-dasharray:6 3" d="M${a.x} ${a.y} C${a.x + 80} ${a.y} ${d.x + cl.x - 80} ${d.y + py} ${d.x + cl.x - 6} ${d.y + py}"/>`;
        } else {
          g += `<path class="s-cable over" style="stroke-width:1.5;stroke-dasharray:3 3" d="M${cl.x - 40} ${py} H${cl.x - 6}"/>${t(cl.x - 42, py + 3, 's-tiny', 'no PSU', 'text-anchor="end" class="err"')}`;
        }
      });
      cl.rows.forEach(row => {
        if (row.kind === 'port') {
          const pt = row.pt, r = R.ports.get(pt.id), used = pt.chain.length > 0;
          const st = !used ? '' : (r.firstErr >= 0 || (b.fuseA && r.portA > b.fuseA)) ? 'err' : (r.firstFail >= 0 || (b.fuseA && r.portA > b.fuseA * .8)) ? 'warn' : 'ok';
          g += `<g data-id="${pt.id}" data-drop="port" data-port="${pt.id}" style="cursor:pointer">${title(`Port ${pt.num}${pt.label ? ' · ' + pt.label : ''}${used ? `\n${r.pixels} px, ${r.channels} ch\n${K.fmtA(r.portA)} from port${b.fuseA ? ' (' + b.fuseA + ' A fuse)' : ''}\nmin ${K.fmtV(r.minV)}` : '\nempty — drop a preset here'}`)}
            <rect class="s-hit" x="${cl.x + 14}" y="${row.y - ROW / 2 + 2}" width="${cl.w - 14}" height="${ROW - 4}" rx="4"/>
            ${t(cl.x + 18, row.y + 4, 's-text', `P${pt.num}`)}
            ${t(cl.x + 40, row.y + 4, used ? 's-text' : 's-tiny', (pt.label || (used ? '' : 'free')).slice(0, 14))}
            ${used ? t(cl.x + cl.w - 18, row.y + 4, 's-tiny', K.fmtA(r.portA), `text-anchor="end" class="${b.fuseA && r.portA > b.fuseA ? 'err' : ''}"`) : ''}
            ${st ? `<circle cx="${cl.x + cl.w - 60}" cy="${row.y}" r="3.5" class="s-${st}"/>` : ''}
            <rect class="${used ? 's-pad used' : 's-pad'}" x="${W - 7}" y="${row.y - 7}" width="14" height="14" rx="3"/></g>`;
          if (sel === pt.id) g += `<rect class="s-sel" x="${cl.x + 12}" y="${row.y - ROW / 2 + 1}" width="${cl.w - 8}" height="${ROW - 2}" rx="5"/>`;
          const ch = drawChain(p, R, d, pt, r, W + 7, row.y, sel);
          chains += ch.g; feeds += ch.feeds;
        } else if (row.kind === 'relay') {
          const rl = row.r, on = !!(rl.name || rl.amps), over = rl.amps > b.relayMaxA || rl.volts > b.relayMaxV;
          g += `<g data-id="${rl.id}" style="cursor:pointer">${title(`Relay ${rl.num}${rl.name ? ': ' + rl.name : ''}\n${rl.amps || 0} A at ${rl.volts} V (max ${b.relayMaxA} A)`)}
            <rect class="s-relay ${on ? 'on' : ''}" x="${cl.x + 14}" y="${row.y - 9}" width="30" height="18" rx="3"/>
            <path d="M${cl.x + 20} ${row.y + 4} L${cl.x + 36} ${row.y - 4}" class="s-strwire"/>
            ${t(cl.x + 50, row.y + 4, on ? 's-text' : 's-tiny', `R${rl.num} ${rl.name || 'spare'}`.slice(0, 18))}
            ${rl.amps ? t(cl.x + cl.w - 8, row.y + 4, 's-tiny', rl.amps + ' A', `text-anchor="end" class="${over ? 'err' : ''}"`) : ''}</g>`;
          if (on) chains += `<path class="s-cable" style="stroke-width:2" d="M${W} ${row.y} H${W + 40}"/>${t(W + 46, row.y + 4, 's-muted', `${rl.name || 'load'} · ${rl.volts} V`)}`;
          if (sel === rl.id) g += `<rect class="s-sel" x="${cl.x + 10}" y="${row.y - 12}" width="${cl.w - 14}" height="24" rx="4"/>`;
        } else if (row.kind === 'input') {
          const ip = row.r, set = ip.action && ip.action !== 'none';
          const act = C.inputActions.find(x => x.id === ip.action);
          g += `<g data-id="${ip.id}" style="cursor:pointer">${title(`Turniput ${ip.num}${ip.name ? ': ' + ip.name : ''}\n${ip.device}\n${act ? act.name : ''}${ip.param ? ' ' + ip.param : ''}`)}
            <circle cx="${cl.x + 22}" cy="${row.y}" r="7" class="s-btn ${set ? '' : 'unset'}"/>
            ${t(cl.x + 36, row.y + 4, set ? 's-text' : 's-tiny', `T${ip.num} ${ip.name || (set ? act.name : 'input')}`.slice(0, 20))}</g>`;
          if (sel === ip.id) g += `<rect class="s-sel" x="${cl.x + 10}" y="${row.y - 11}" width="${cl.w - 14}" height="22" rx="4"/>`;
        } else if (row.kind === 'dmx') {
          g += t(cl.x + 14, row.y + 4, 's-tiny', 'DMX out: RJ45 · 3-pin · 5-pin XLR');
        }
      });
    });
    g += chains + '</g>';
    return { g, feeds };
  }

  // Draws one port's run from (x0,y) to the right. Coordinates are distro-local; feeds are absolute.
  function drawChain(p, R, d, pt, r, x0, y, sel) {
    let g = '', feeds = '', x = x0;
    const st = p.settings;
    pt.chain.forEach((it, i) => {
      const ir = r.items.get(it.id) || {};
      const isSel = sel === it.id;
      const start = x;
      if (it.kind === 'cable') {
        const w = C.wireById(it.gauge), len = Math.max(20, Math.min(160, it.length * 10));
        const cls = ir.maxA > w.maxA ? 'over' : ir.maxA > w.maxA * 0.8 ? 'hot' : '';
        const drop = ir.vIn != null ? ir.vIn - ir.vOut : 0;
        g += `<g data-id="${it.id}" data-drop="item" data-item="${it.id}" data-port="${pt.id}" style="cursor:pointer">${title(`Cable ${it.length} m ${w.label}${it.label ? ' · ' + it.label : ''}\n${K.fmtA(ir.maxA)} (rated ${w.maxA} A)\nDrop ${U.num(drop, 2)} V`)}
          <rect class="s-hit" x="${x}" y="${y - 12}" width="${len}" height="24"/>
          <path class="s-cable ${cls}" style="stroke-width:${GAUGE_W[it.gauge] || 2}" d="M${x} ${y} H${x + len}"/>
          ${t(x + len / 2, y - 6, 's-tiny', `${it.length} m ${w.label.replace(' AWG', 'AWG')}`, 'text-anchor="middle"')}</g>`;
        x += len;
      } else if (it.kind === 'pixels') {
        const ty = M.pixelType(p, it.typeId) || { cat: 'bullet', name: '?' };
        const n = +it.count || 0;
        const isFlood = ty.cat === 'flood';
        const maxShapes = isFlood ? 12 : 30;
        const shapes = Math.min(n, maxShapes);
        const step = isFlood ? 16 : 7;
        const px = r.pxV.filter(v => v.item === it.id);
        const w = shapes * step + 6;
        g += `<g data-id="${it.id}" data-drop="item" data-item="${it.id}" data-port="${pt.id}" style="cursor:pointer">${title(`${n} × ${ty.name}${it.label ? ' · ' + it.label : ''}\nevery ${it.spacing} m on ${C.wireById(it.gauge).label}\n${ir.unpowered ? 'NO POWER' : `min ${K.fmtV(ir.minV)} (${U.num(ir.minPct, 0)}%)`}\n${K.fmtW(ir.watts)} · ${K.fmtA(ir.maxA)} in string${n > shapes ? `\n(each ${isFlood ? 'square' : 'dot'} ≈ ${U.num(n / shapes, 1)} pixels)` : ''}`)}
          <rect class="s-hit" x="${x}" y="${y - 12}" width="${w}" height="24"/>
          <path class="s-strwire" d="M${x} ${y} H${x + w}"/>`;
        for (let k = 0; k < shapes; k++) {
          const a = Math.floor(k * n / shapes), b = Math.max(a + 1, Math.floor((k + 1) * n / shapes));
          let mn = Infinity; for (let j = a; j < b && j < px.length; j++) mn = Math.min(mn, px[j].pct);
          const cls = ir.unpowered || mn <= 0 ? 'off' : U.vClass(mn);
          const cx = x + 3 + k * step + step / 2;
          g += isFlood ? `<rect x="${cx - 5}" y="${y - 5}" width="10" height="10" rx="2" class="s-${cls}"/>` : `<circle cx="${cx}" cy="${y}" r="2.6" class="s-${cls}"/>`;
        }
        g += t(x + 3, y - 8, 's-tiny', `${n}× ${ty.name}`.slice(0, Math.max(8, Math.floor(w / 5))));
        g += `</g>`;
        x += w;
      } else if (it.kind === 'inject') {
        const a = ir.sourceA || 0, w = C.wireById(it.gauge);
        const cls = it.psuId ? psuColour(p, it.psuId) : 'c5';
        g += `<g data-id="${it.id}" data-drop="item" data-item="${it.id}" data-port="${pt.id}" style="cursor:pointer">${title(`Power injection${it.label ? ' · ' + it.label : ''}\n${it.psuId ? 'from ' + ((R.psus.get(it.psuId) || {}).psu || {}).name : 'NO PSU'} via ${it.length} m ${w.label}\n${K.fmtA(a)} · fuse ${K.recommendFuse(Math.max(a, .1))} A${it.isolate ? '\n+V isolated from the run before' : ''}`)}
          <rect class="s-hit" x="${x}" y="${y - 12}" width="18" height="24"/>
          <rect x="${x + 4}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x + 9} ${y})" class="${cls}"/>
          ${it.isolate ? `<path d="M${x + 16} ${y - 7} V${y + 7}" class="s-cable over" style="stroke-width:2"/>` : ''}
          ${t(x + 9, y + 18, 's-tiny', K.fmtA(a), 'text-anchor="middle"')}</g>`;
        const src = V.psuPos.get(it.psuId);
        if (src) {
          const ax = d.x + x + 9, ay = d.y + y - 6;
          feeds += `<path class="s-feed ${cls}" d="M${src.x} ${src.y} C${src.x + 60} ${src.y} ${ax} ${ay - 60} ${ax} ${ay}"><title>${esc(`Injection feed ${it.length} m ${w.label}: ${K.fmtA(a)}`)}</title></path>`;
        }
        x += 18;
      }
      if (isSel) g += `<rect class="s-sel" x="${start - 2}" y="${y - 14}" width="${x - start + 4}" height="28" rx="4"/>`;
    });
    // End of run: min voltage and a "+" drop target.
    if (pt.chain.length && r.minV != null) g += t(x + 6, y + 16, `s-tiny`, `min ${K.fmtV(r.minV)}`);
    g += `<g data-drop="port" data-port="${pt.id}" data-plus="${pt.id}" style="cursor:pointer">${title('Drop a preset here, or click to edit this port')}
      <circle class="s-plus" cx="${x + 12}" cy="${y}" r="7"/><path d="M${x + 8} ${y} H${x + 16} M${x + 12} ${y - 4} V${y + 4}" class="s-strwire"/></g>`;
    return { g, feeds };
  }

  // ---------- camera ----------
  const applyCam = () => { const g = U.$('#cam'); if (g) g.setAttribute('transform', `translate(${U.cam.x},${U.cam.y}) scale(${U.cam.k})`); };
  V.zoom = (f, cx, cy) => {
    const wrap = U.$('#canvasWrap').getBoundingClientRect();
    if (cx == null) { cx = wrap.width / 2; cy = wrap.height / 2; }
    const k = Math.min(3, Math.max(0.15, U.cam.k * f));
    U.cam.x = cx - (cx - U.cam.x) * k / U.cam.k;
    U.cam.y = cy - (cy - U.cam.y) * k / U.cam.k;
    U.cam.k = k; applyCam();
  };
  V.fit = () => {
    const p = S.project, wrap = U.$('#canvasWrap').getBoundingClientRect();
    const gs = U.$$('#cam > g.distro');
    if (!gs.length || !wrap.width) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    gs.forEach(g => {
      const bb = g.getBBox(), d = p.distros.find(x => x.id === g.dataset.distro);
      if (!d) return;
      x0 = Math.min(x0, d.x + bb.x); y0 = Math.min(y0, d.y + bb.y); x1 = Math.max(x1, d.x + bb.x + bb.width); y1 = Math.max(y1, d.y + bb.y + bb.height);
    });
    const k = Math.min(1.4, Math.max(0.15, Math.min((wrap.width - 40) / (x1 - x0), (wrap.height - 40) / (y1 - y0))));
    U.cam = { k, x: 20 - x0 * k + Math.max(0, (wrap.width - 40 - (x1 - x0) * k) / 2), y: 20 - y0 * k };
    applyCam();
  };
  const toWorld = (ev) => {
    const r = U.$('#svg').getBoundingClientRect();
    return { x: (ev.clientX - r.left - U.cam.x) / U.cam.k, y: (ev.clientY - r.top - U.cam.y) / U.cam.k };
  };

  // ---------- drop handling ----------
  function doDrop(data, target, world) {
    const p = S.project;
    const portId = target && target.dataset.port;
    const itemId = target && target.dataset.item;
    const distroId = target && target.dataset.drop === 'distro' ? target.dataset.id : (target && target.closest('g.distro') ? target.closest('g.distro').dataset.distro : null);
    if (data.t === 'distro') {
      S.commit('addDistro', p => { const d = M.newDistro('Distro ' + (p.distros.length + 1), Math.round(world.x), Math.round(world.y)); p.distros.push(d); S.selection = d.id; });
      return;
    }
    if (data.t === 'psu' || data.t === 'board') {
      if (!distroId) return U.toast('Drop PSUs and boards onto a distro.');
      S.commit('dropHw', p => {
        const d = p.distros.find(x => x.id === distroId);
        if (data.t === 'psu') {
          const s = M.newPsu(data.model, d.psus.length + 1); d.psus.push(s); S.selection = s.id;
          d.controllers.forEach(c => Object.keys(c.banks).forEach(k => { if (!c.banks[k]) c.banks[k] = s.id; }));
        } else {
          const c = M.newController(data.board); const first = d.psus[0];
          if (first) Object.keys(c.banks).forEach(k => { c.banks[k] = first.id; });
          d.controllers.push(c); S.selection = c.id;
        }
      });
      return;
    }
    if (!portId) return U.toast('Drop strings, cables and injections onto a port or a run.');
    S.commit('drop', p => {
      const e = M.find(p, portId); if (!e) return;
      const chain = e.port.chain;
      let at = itemId ? chain.findIndex(x => x.id === itemId) + 1 : chain.length;
      const add = [];
      if (data.t === 'preset') {
        const pr = p.library.presets.find(x => x.id === data.id); if (!pr) return;
        if (!chain.length) add.push(M.newItem.cable(5, 'awg18'));
        add.push(M.newItem.preset(pr, p.library.pixelTypes));
        if (!e.port.label) e.port.label = pr.name;
      } else if (data.t === 'cable') add.push(M.newItem.cable(data.length, data.gauge));
      else if (data.t === 'inject') {
        const c = e.controller, b = C.boards[c.board];
        const bk = b.banks.find(x => x.ports.includes(e.port.num));
        add.push(M.newItem.inject((bk && c.banks[bk.id]) || (e.distro.psus[0] || {}).id || null, p.settings.injectLength, p.settings.injectGauge));
      }
      chain.splice(at, 0, ...add);
      S.selection = add[add.length - 1].id;
    });
  }

  // ---------- events (bound once) ----------
  V.init = () => {
    const svg = U.$('#svg'), wrap = U.$('#canvasWrap');
    U.$('#palette').addEventListener('dragstart', ev => {
      const el = ev.target.closest('[data-drag]'); if (!el) return;
      ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'copy';
    });
    let lastHi = null;
    const hi = el => { if (lastHi === el) return; if (lastHi) lastHi.classList.remove('s-drop-hi'); lastHi = el; if (el) el.classList.add('s-drop-hi'); };
    wrap.addEventListener('dragover', ev => { ev.preventDefault(); wrap.classList.add('dragover'); hi(ev.target.closest && ev.target.closest('[data-drop]')); });
    wrap.addEventListener('dragleave', ev => { if (!wrap.contains(ev.relatedTarget)) { wrap.classList.remove('dragover'); hi(null); } });
    wrap.addEventListener('drop', ev => {
      ev.preventDefault(); wrap.classList.remove('dragover'); hi(null);
      let data; try { data = JSON.parse(ev.dataTransfer.getData('text/plain')); } catch (e) { return; }
      doDrop(data, ev.target.closest && ev.target.closest('[data-drop]'), toWorld(ev));
    });
    svg.addEventListener('wheel', ev => {
      ev.preventDefault();
      const r = svg.getBoundingClientRect();
      V.zoom(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });
    svg.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const dh = ev.target.closest('[data-drag-distro]');
      if (dh) {
        const d = S.project.distros.find(x => x.id === dh.dataset.dragDistro);
        drag = { d, before: JSON.stringify(S.project), sx: ev.clientX, sy: ev.clientY, ox: d.x, oy: d.y, moved: false, g: U.$(`g.distro[data-distro="${d.id}"]`) };
        svg.setPointerCapture(ev.pointerId);
        return;
      }
      if (ev.target.closest('[data-id],[data-plus]')) return;
      pan = { sx: ev.clientX, sy: ev.clientY, ox: U.cam.x, oy: U.cam.y, moved: false };
      svg.setPointerCapture(ev.pointerId); svg.classList.add('panning');
    });
    svg.addEventListener('pointermove', ev => {
