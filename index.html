      h += `<div class="bank"><b>${esc(bk.label)}</b>${bk.ports.length ? `<span class="soft">ports ${bk.ports[0]}${bk.ports.length > 1 ? '-' + bk.ports[bk.ports.length - 1] : ''}</span>` : '<span class="soft">board power</span>'}
        ${sel(c.id, 'banks.' + bk.id, U.psuOptions(p, c.banks[bk.id], '— no PSU —'))}
        ${br && br.max ? `<span class="${br.amps > br.max ? 'err' : 'soft'}">${K.fmtA(br.amps)} of ${br.max} A</span>` : ''}</div>`;
    });
    h += `<div class="bank"><b>Power jack feed</b><span class="soft">PSU → board</span><div class="row">${inp(c.id, 'feed.length', c.feed.length, 'num', 'step="0.1" style="width:56px"')} m ${sel(c.id, 'feed.gauge', U.wireOptions(c.feed.gauge))}</div></div>`;
    h += '</div>';
    if (b.ports) {
      h += `<div>`;
      c.ports.forEach(pt => { h += F.port(p, R, c, pt, opts.openPort === pt.id); });
      h += `</div>`;
    }
    if (b.relays) h += relays(p, R, c, b);
    if (b.inputs) h += inputs(p, R, c, b);
    if (b.dmx) h += `<h4>DMX</h4><div class="muted">One universe out on RJ45, 3-pin and 5-pin XLR. Add fixtures in xLights as a DMX model on this controller.</div>`;
    return h + '</div>';
  };

  function relays(p, R, c, b) {
    let h = `<h4>Relays (max ${b.relayMaxA} A, ${b.relayMaxV} V)</h4><table class="t"><tr><th>#</th><th>Switches</th><th>Amps</th><th>Volts</th><th>Load</th></tr>`;
    c.relays.forEach(r => {
      const over = r.amps > b.relayMaxA || r.volts > b.relayMaxV;
      h += `<tr id="f-${r.id}" data-sel="${r.id}"><td>${r.num}</td><td>${inp(r.id, 'name', r.name, 'str', 'placeholder="e.g. Snow machine"')}</td>
        <td>${inp(r.id, 'amps', r.amps, 'num', 'step="0.1" min="0" style="width:60px"')}</td><td>${inp(r.id, 'volts', r.volts, 'num', 'style="width:60px"')}</td>
        <td class="${over ? 'err' : 'soft'}">${r.amps ? K.fmtW(r.amps * r.volts) : '-'}${over ? ' over rating' : ''}</td></tr>`;
    });
    return h + '</table>';
  }

  F.inputUrl = (p, r) => {
    const base = `http://${p.settings.fppIp}/api/command/`;
    const v = r.param || '';
    switch (r.action) {
      case 'playlist': return base + `Start Playlist/${v}/false/true`;
      case 'playlistNow': return base + `Start Playlist/${v}/false/false`;
      case 'stop': return base + 'Stop Now';
      case 'volume': return base + `Volume Set/${v}`;
      case 'effect': return base + `Effect Start/${v}`;
      case 'custom': return base + v;
      case 'switchy': return 'Baldrick web UI: Turniputs > BaldrickSwitchy (Turnip Network) — relay/seconds ' + v;
      case 'test': return 'Baldrick web UI: Turniputs > Test mode at ' + (v || '50') + '%';
      default: return '';
    }
  };

  function inputs(p, R, c, b) {
    let h = `<h4>Turniputs (inputs)</h4><table class="t"><tr><th>#</th><th>Name</th><th>Device</th><th>Action</th><th>Value</th></tr>`;
    c.inputs.forEach(r => {
      const a = C.inputActions.find(x => x.id === r.action) || C.inputActions[0];
      const url = F.inputUrl(p, r);
      h += `<tr id="f-${r.id}" data-sel="${r.id}"><td>${r.num}</td><td>${inp(r.id, 'name', r.name, 'str', 'placeholder="e.g. Start button"')}</td>
        <td>${sel(r.id, 'device', C.inputDevices.map(x => U.opt(x, x, r.device)).join(''))}</td>
        <td>${sel(r.id, 'action', C.inputActions.map(x => U.opt(x.id, x.name, r.action)).join(''))}</td>
        <td>${a.param ? inp(r.id, 'param', r.param, 'str', `placeholder="${esc(a.param)}"`) : ''}</td></tr>`;
      if (url) h += `<tr><td></td><td colspan="4"><span class="url">${esc(url)}</span> ${url.startsWith('http') ? btn('copy', 'Copy', '', 'small ghost', 'Copy URL', `data-text="${esc(url)}"`) : ''}</td></tr>`;
    });
    return h + '</table>';
  }

  // ---------- port ----------
  F.port = (p, R, c, pt, forceOpen) => {
    const r = R.ports.get(pt.id), b = C.boards[c.board];
    const status = !pt.chain.length ? 'none' : r.minPct == null ? 'none' : (r.firstErr >= 0 || (b.fuseA && r.portA > b.fuseA)) ? 'err' : (r.firstFail >= 0 || (b.fuseA && r.portA > b.fuseA * 0.8)) ? 'warn' : 'ok';
    const summ = `${chev}<span class="dot ${status}" aria-hidden="true"></span><span class="pn">Port ${pt.num}</span><span class="pl">${esc(pt.label) || '<span class="soft">unused</span>'}</span>
      ${pt.chain.length ? `<span class="m">${r.pixels} px · ${r.channels} ch</span><span class="m ${b.fuseA && r.portA > b.fuseA ? 'err' : ''}">${K.fmtA(r.portA)}</span><span class="m ${status === 'err' ? 'err' : status === 'warn' ? 'warn' : ''}">${r.minV != null ? 'min ' + K.fmtV(r.minV) : ''}</span>` : ''}`;
    const key = 'pt-' + pt.id;
    const open = forceOpen || U.open.has(key);
    return `<details class="portrow" id="f-${pt.id}" data-sel="${pt.id}" data-open-id="${key}"${open ? ' open' : ''}><summary>${summ}</summary>${open ? F.portBody(p, R, c, pt) : ''}</details>`;
  };

  F.portBody = (p, R, c, pt) => {
    const r = R.ports.get(pt.id), b = C.boards[c.board];
    const others = [];
    PP.store.project.distros.forEach(d => d.controllers.forEach(cc => cc.ports.forEach(x => { if (x.id !== pt.id) others.push(U.opt(x.id, `${cc.name} port ${x.num}${x.label ? ' · ' + x.label : ''}${x.chain.length ? ' (in use)' : ''}`, '')); })));
    let h = `<div class="portbody">
      <div class="row">
        <label class="fld inline">Label ${inp(pt.id, 'label', pt.label, 'str', 'placeholder="e.g. Roofline" style="width:150px"')}</label>
        <label class="fld inline" title="Baldrick port brightness (on top of global ${p.settings.brightness}%)">Port brightness ${inp(pt.id, 'brightness', pt.brightness, 'num', 'min="1" max="100" style="width:56px"')}%</label>
        <label class="fld inline" title="Untick if this port only carries data and the run is powered by injection">${inp(pt.id, 'portPower', pt.portPower, 'bool')} Power from port${b.fuseA ? ` (${b.fuseA} A fuse)` : ''}</label>
      </div>
      <div class="chain">
        <div class="port-port">▸ ${esc(c.name)} port ${pt.num} · ${r.ctx.psu ? `${esc(r.ctx.psu.name)} via ${esc(r.ctx.bank.label)}` : '<span class="err">no PSU on this bank</span>'}${pt.chain.length ? ` · ${K.fmtA(r.portA)}${b.fuseA ? `, fit ${b.fuseA} A fuse` : ''}` : ''}</div>`;
    pt.chain.forEach((it, i) => { h += F.item(p, R, pt, it, i); });
    if (!pt.chain.length) h += '<div class="muted" style="padding:4px 0">Empty. Add a lead cable, then strings or floods.</div>';
    const presetOpts = p.library.presets.map(x => U.opt(x.id, x.name, '')).join('');
    h += `</div><div class="addbar">
        <select id="preset-${pt.id}" aria-label="Preset">${presetOpts}</select>× <input type="number" id="qty-${pt.id}" value="1" min="1" max="50" style="width:50px" aria-label="How many">
        ${btn('addPreset', 'Add', pt.id, 'small primary')}
        ${btn('addCable', '+ Cable', pt.id, 'small')}${btn('addPixels', '+ Pixels', pt.id, 'small')}${btn('addInject', '+ Injection', pt.id, 'small')}
      </div>
      <div class="addbar">
        ${btn('autoInject', 'Auto-inject', pt.id, 'small', 'Add injection points until every pixel is above the warning voltage')}
        ${btn('clearInject', 'Remove injections', pt.id, 'small')}
        ${btn('clearPort', 'Clear run', pt.id, 'small danger')}
        <span class="grow"></span>
        <select id="moveTo-${pt.id}" aria-label="Move or swap run to port"><option value="">Move / swap run to…</option>${others.join('')}</select>${btn('movePort', 'Go', pt.id, 'small')}
      </div></div>`;
    return h;
  };

  // ---------- chain item ----------
  F.item = (p, R, pt, it, i) => {
    const r = R.ports.get(pt.id), ir = r.items.get(it.id) || {};
    const id = it.id;
    let body = '', res = '';
    if (it.kind === 'cable') {
      const w = C.wireById(it.gauge);
      body = `<span class="kind">Cable</span><label>${inp(id, 'length', it.length, 'num', 'step="0.5" min="0"')} m</label>${sel(id, 'gauge', U.wireOptions(it.gauge))}`;
      const drop = ir.vIn != null ? ir.vIn - ir.vOut : 0;
      res = `<span class="${ir.maxA > w.maxA ? 'err' : ''}">${K.fmtA(ir.maxA)}</span> · drop ${U.num(drop, 2)} V`;
    } else if (it.kind === 'pixels') {
      const t = M.pixelType(p, it.typeId);
      const cls = ir.unpowered ? 'err' : U.vClass(ir.minPct);
      const w = C.wireById(it.gauge);
      body = `<span class="kind">${t ? esc(t.cat === 'flood' ? 'Flood' : t.cat === 'seed' ? 'Seeds' : t.cat === 'bullet' ? 'Bullets' : 'Pixels') : 'Pixels'}</span>
        ${sel(id, 'typeId', U.pixelTypeOptions(p, it.typeId))}
        <label>× ${inp(id, 'count', it.count, 'num', 'min="1" max="2000"')}</label>
        <label title="Distance between pixels (lead length for floods)">every ${inp(id, 'spacing', it.spacing, 'num', 'step="0.01" min="0"')} m</label>
        <label title="Wire inside the string">wire ${sel(id, 'gauge', U.wireOptions(it.gauge))}</label>`;
      res = `<span class="dot ${cls}" aria-hidden="true"></span> ${ir.unpowered ? '<span class="err">no power</span>' : `min ${K.fmtV(ir.minV)} (${U.num(ir.minPct, 0)}%)`} · <span class="${ir.maxA > w.maxA ? 'err' : ''}">${K.fmtA(ir.maxA)}</span> · ${K.fmtW(ir.watts)}${t ? ` · ${it.count * t.ch} ch` : ''}${it.continued ? ` · <span class="soft">rest of string from pixel ${it.tapOffset + 1}</span>` : ''}`;
    } else if (it.kind === 'inject') {
      const w = C.wireById(it.gauge);
      const a = ir.sourceA || 0;
      body = `<span class="kind">Inject</span>${sel(id, 'psuId', U.psuOptions(p, it.psuId, '— pick PSU —'))}
        <label>feed ${inp(id, 'length', it.length, 'num', 'step="0.5" min="0"')} m</label>${sel(id, 'gauge', U.wireOptions(it.gauge))}
        <label title="Cut +V between the run before and after this point, so two PSUs are not joined">${inp(id, 'isolate', it.isolate, 'bool')} isolate +V</label>`;
      res = `<span class="${a > w.maxA ? 'err' : ''}">${K.fmtA(a)}</span> · fuse ${K.recommendFuse(Math.max(a, 0.1))} A`;
    }
    return `<div class="item k-${it.kind}" id="f-${id}" data-sel="${id}">${body}
      <input class="lbl" data-id="${id}" data-f="label" data-t="str" value="${esc(it.label)}" placeholder="note" aria-label="Note">
      <span class="res">${res}</span>
      <span class="row" style="gap:2px">${btn('itemUp', '↑', id, 'small ghost', 'Move up')}${btn('itemDown', '↓', id, 'small ghost', 'Move down')}${btn('itemDup', '⧉', id, 'small ghost', 'Duplicate')}${btn('itemDel', '✕', id, 'small ghost danger', 'Remove')}</span></div>`;
  };

  // ---------- library ----------
  function library(p) {
    let h = `<div class="card" style="padding:8px 12px"><h4>Pixel types <span class="soft" style="text-transform:none;letter-spacing:0">full-white watts per pixel at its voltage; check your supplier's figures</span>${btn('addType', '+ Type', '', 'small')}</h4>
      <table class="t"><tr><th>Name</th><th>Kind</th><th>Volts</th><th>Watts</th><th>Channels</th><th>Spacing m</th><th>String wire</th><th></th></tr>`;
    p.library.pixelTypes.forEach(t => {
      h += `<tr><td>${inp(t.id, 'name', t.name)}</td>
        <td>${sel(t.id, 'cat', ['bullet', 'seed', 'flood', 'strip', 'null', 'other'].map(x => U.opt(x, x, t.cat)).join(''))}</td>
        <td>${inp(t.id, 'v', t.v, 'num', 'style="width:56px"')}</td><td>${inp(t.id, 'w', t.w, 'num', 'step="0.01" style="width:64px"')}</td>
        <td>${sel(t.id, 'ch', U.opt(3, '3 RGB', t.ch) + U.opt(4, '4 RGBW', t.ch) + U.opt(1, '1', t.ch), '', 'num')}</td>
        <td>${inp(t.id, 'spacing', t.spacing, 'num', 'step="0.01" style="width:64px"')}</td><td>${sel(t.id, 'gauge', U.wireOptions(t.gauge))}</td>
        <td>${btn('delType', '✕', t.id, 'small ghost danger')}</td></tr>`;
    });
    h += `</table><h4>String presets ${btn('addPresetDef', '+ Preset', '', 'small')}</h4><table class="t"><tr><th>Name</th><th>Pixel type</th><th>Pixels per string</th><th></th></tr>`;
    p.library.presets.forEach(x => {
      const id = 'preset:' + x.id;
      h += `<tr><td>${inp(id, 'name', x.name)}</td><td>${sel(id, 'typeId', U.pixelTypeOptions(p, x.typeId))}</td><td>${inp(id, 'count', x.count, 'num', 'min="1"')}</td><td>${btn('delPresetDef', '✕', x.id, 'small ghost danger')}</td></tr>`;
    });
    return h + `</table><div class="row" style="margin-top:8px">${btn('resetLibrary', 'Reset library to defaults', '', 'small')}<span class="soft">Library travels with the project file.</span></div></div>`;
  }

  // ---------- channels ----------
  function channels(p, R) {
    let h = `<div class="card" style="padding:8px 12px"><table class="t"><tr><th>Controller</th><th>IP</th><th>Port</th><th>Label</th><th>Pixels</th><th>Channels</th><th>Start ch</th><th>Universes (${p.settings.universeSize} ch)</th></tr>`;
    let any = false;
    p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      const r = R.ports.get(pt.id); if (!r.channels) return; any = true;
      h += `<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.ip)}</td><td>${pt.num}</td><td>${esc(pt.label)}</td><td>${r.pixels}</td><td>${r.channels}</td><td>${r.startCh}</td><td>${r.universes}</td></tr>`;
    })));
    if (!any) h += '<tr><td colspan="8" class="muted">No pixels yet.</td></tr>';
    return h + `</table><div class="row" style="margin-top:8px">${btn('csvChannels', 'Export CSV', '', 'small')}<span class="soft">Start channels run on in controller order, like xLights absolute addressing. With DDP you only need the per-port pixel counts.</span></div></div>`;
  }

  // ---------- inspector (Visual view) ----------
  F.inspector = (p, R, selId) => {
    const e = selId ? R.idx.get(selId) : null;
    if (!e) {
      return `<div class="hint"><b>Nothing selected.</b><br>Click a distro, PSU, board, port, string or injection to edit it here. Drag presets from the left onto a port's output (or onto a string to insert after it). Drag a distro by its title bar. Scroll to zoom, drag the background to pan.</div>
        ${p.distros.length ? '' : btn('addDistro', '+ Add a distro', '', 'primary')}`;
    }
    const crumbs = [];
    if (e.distro) crumbs.push(esc(e.distro.name));
    if (e.controller) crumbs.push(esc(e.controller.name));
    if (e.port) crumbs.push('Port ' + e.port.num);
    let h = `<div class="soft" style="margin-bottom:6px">${crumbs.join(' › ')}</div>`;
    if (e.type === 'distro') h += F.distro(p, R, e.obj);
    else if (e.type === 'psu') {
      const r = R.psus.get(e.obj.id);
      const i = e.distro.psus.indexOf(e.obj);
      h += `<table class="t">${F.psuRow(p, R, e.obj, i)}</table><h4>Feeds</h4><table class="t"><tr><th>Load</th><th>Amps</th></tr>`;
      r.loads.slice().sort((a, b) => b.amps - a.amps).forEach(l => { h += `<tr data-act="select" data-id="${l.ref}" style="cursor:pointer"><td>${esc(l.label)}</td><td>${K.fmtA(l.amps)}</td></tr>`; });
      h += `<tr><td><b>Total</b></td><td><b>${K.fmtA(r.amps)}</b> of ${r.spec.a} A</td></tr></table>`;
    } else if (e.type === 'controller' || e.type === 'relay' || e.type === 'input') h += `<div class="card" style="padding:4px 8px">${F.controller(p, R, e.distro, e.controller)}</div>`;
    else if (e.type === 'port' || e.type === 'item') {
      U.open.add('pt-' + e.port.id);
      h += `<div class="card" style="padding:4px 8px">${F.port(p, R, e.controller, e.port, true)}</div>`;
    }
    return h;
  };

  // Highlight the selected element and open/scroll to it.
  F.markSelection = (scroll = false) => {
    const id = PP.store.selection;
    U.$$('#formPane .sel').forEach(el => el.classList.remove('sel'));
    if (!id) return;
    const el = document.getElementById('f-' + id);
    if (!el || !U.$('#formPane').contains(el)) return;
    el.classList.add('sel');
    if (scroll) {
      let d = el.parentElement;
      while (d && d.id !== 'formPane') { if (d.tagName === 'DETAILS' && !d.open) { d.open = true; } d = d.parentElement; }
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  };
})();

</script>
<script>
// Visual view: an SVG wiring diagram of every distro, its PSUs, boards and the pixel runs on each port.
// It draws straight from the project + calc result, so it always matches the Form view.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc, S = PP.store;
  const esc = U.esc;
  const V = PP.visual = {};
  const W = 300;             // distro box width
  const ROW = 30;            // port row height
  const GAUGE_W = { awg22: 1, awg20: 1.3, awg18: 1.7, awg16: 2.2, awg14: 2.8, awg12: 3.4, awg10: 4.2, awg8: 5 };
  let drag = null, pan = null;
  V.psuPos = new Map();      // psuId -> absolute anchor for feed lines

  const t = (x, y, cls, s, extra = '') => `<text x="${x}" y="${y}" class="${cls}" ${extra}>${esc(s)}</text>`;
  const title = s => `<title>${esc(s)}</title>`;
  const psuColour = (p, psuId) => {
    for (const d of p.distros) { const i = d.psus.findIndex(s => s.id === psuId); if (i >= 0) return 'c' + (i % 6); }
    return 'c4';
  };

  // ---------- palette ----------
  V.renderPalette = (p) => {
    const pal = (data, sw, label, tip = '') => `<div class="pal" draggable="true" data-drag='${esc(JSON.stringify(data))}' title="${esc(tip || 'Drag onto the diagram')}"><span class="sw ${sw}"></span>${esc(label)}</div>`;
    let h = '<h5>Strings and floods</h5>';
    p.library.presets.forEach(x => {
      const ty = M.pixelType(p, x.typeId);
      h += pal({ t: 'preset', id: x.id }, ty && ty.cat === 'flood' ? 'flood' : '', x.name, 'Drag onto a port or after a string');
    });
    h += '<h5>Wiring</h5>';
    [[2, 'awg18'], [5, 'awg18'], [10, 'awg18'], [10, 'awg16']].forEach(([l, g]) => { h += pal({ t: 'cable', length: l, gauge: g }, 'cable', `Cable ${l} m ${C.wireById(g).label}`); });
    h += pal({ t: 'inject' }, 'inject', 'Power injection', 'Drop after a string to inject power there');
    h += '<h5>Hardware</h5>';
    ['LRS-350-12', 'LRS-200-12', 'HLG-320H-12'].filter(id => C.psuById(id)).forEach(id => { h += pal({ t: 'psu', model: id }, 'cable', id, 'Drop onto a distro'); });
    Object.entries(C.boards).forEach(([k, b]) => { h += pal({ t: 'board', board: k }, '', b.name, 'Drop onto a distro'); });
    h += pal({ t: 'distro' }, 'cable', 'New distro', 'Drop anywhere');
    U.$('#palette').innerHTML = h;
  };

  // ---------- layout ----------
  function layoutDistro(p, R, d) {
    const L = { psus: [], ctls: [], h: 0 };
    const cols = 2, pw = 132, ph = 58;
    d.psus.forEach((s, i) => L.psus.push({ s, i, x: 12 + (i % cols) * (pw + 12), y: 44 + Math.floor(i / cols) * (ph + 10), w: pw, h: ph }));
    let y = 44 + Math.ceil(d.psus.length / cols) * (ph + 10) + (d.psus.length ? 24 : 12);
    d.controllers.forEach(c => {
      const b = C.boards[c.board];
      const rows = [];
      let ry = y + 34;
      c.ports.forEach(pt => { rows.push({ kind: 'port', pt, y: ry }); ry += ROW; });
      c.relays.forEach(r => { rows.push({ kind: 'relay', r, y: ry }); ry += 24; });
      c.inputs.forEach(r => { rows.push({ kind: 'input', r, y: ry }); ry += 22; });
      if (b.dmx) { rows.push({ kind: 'dmx', y: ry }); ry += 22; }
      const h = Math.max(ry - y + 4, 34 + b.banks.length * 26);
      L.ctls.push({ c, b, x: 120, y, w: W - 120, h, rows });
      y += h + 14;
    });
    L.h = Math.max(y, 90);
    return L;
  }

  // ---------- render ----------
  V.render = (p, R) => {
    const svg = U.$('#svg');
    V.psuPos.clear();
    const sel = S.selection;
    let body = '', feeds = '';
    const layouts = new Map();
    p.distros.forEach(d => layouts.set(d.id, layoutDistro(p, R, d)));
    p.distros.forEach(d => {
      const L = layouts.get(d.id);
      L.psus.forEach(q => V.psuPos.set(q.s.id, { x: d.x + q.x + q.w, y: d.y + q.y + q.h / 2, cls: 'c' + (q.i % 6) }));
    });
    p.distros.forEach(d => {
      const L = layouts.get(d.id);
      const out = drawDistro(p, R, d, L, sel);
      body += out.g; feeds += out.feeds;
    });
    const k = U.cam.k;
    svg.innerHTML = `<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="s-grid"/></pattern></defs>
      <g id="cam" transform="translate(${U.cam.x},${U.cam.y}) scale(${k})">
        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#dots)" class="bg"/>
        ${body}<g id="feeds">${feeds}</g>
      </g>
      ${p.distros.length ? '' : `<text x="50%" y="45%" text-anchor="middle" class="s-muted" style="font-size:14px">Drag “New distro” from the palette, or press + Distro</text>`}`;
  };

  function drawDistro(p, R, d, L, sel) {
    const D = R.distros.get(d.id);
    let g = `<g class="distro" data-distro="${d.id}" transform="translate(${d.x},${d.y})">`;
    g += `<rect class="s-distro" x="0" y="0" width="${W}" height="${L.h}" rx="10" data-drop="distro" data-id="${d.id}"/>`;
    g += `<rect class="s-distro-head" x="1" y="1" width="${W - 2}" height="32" rx="10" data-drag-distro="${d.id}" data-id="${d.id}"/>`;
    g += t(12, 20, 's-title', d.name, `data-drag-distro="${d.id}" data-id="${d.id}" style="cursor:move"`);
    g += t(W - 10, 20, 's-muted', `${K.fmtW(D.dcW)} · ${U.num(D.mainsA, 1)} A mains`, 'text-anchor="end" pointer-events="none"');
    g += t(12, 40, 's-tiny', `${(C.distroSizes.find(s => s.id === d.size) || {}).name || ''}`, 'pointer-events="none"');
    if (sel === d.id) g += `<rect class="s-sel" x="-3" y="-3" width="${W + 6}" height="${L.h + 6}" rx="12"/>`;
    // PSUs
    L.psus.forEach(q => {
      const r = R.psus.get(q.s.id), cls = 'c' + (q.i % 6);
      const pct = r.pct || 0, bc = U.pctClass(pct, p.settings.psuTargetPct);
      g += `<g data-id="${q.s.id}" style="cursor:pointer">${title(`${q.s.name}: ${q.s.model}, set ${q.s.vout} V\n${K.fmtA(r.amps)} of ${r.spec.a} A (${U.num(pct, 0)}%)\n${r.loads.map(l => '• ' + l.label + ': ' + K.fmtA(l.amps)).join('\n')}`)}
        <rect class="s-psu" x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" rx="6"/>
        <rect class="${cls}" x="${q.x}" y="${q.y}" width="5" height="${q.h}" rx="2"/>
        ${t(q.x + 11, q.y + 15, 's-text', q.s.name)}${t(q.x + q.w - 6, q.y + 15, 's-tiny', q.s.vout + ' V', 'text-anchor="end"')}
        ${t(q.x + 11, q.y + 28, 's-tiny', q.s.model === 'custom' ? `Custom ${q.s.customV} V ${q.s.customA} A` : q.s.model)}
        <rect class="s-barbg" x="${q.x + 11}" y="${q.y + 35}" width="${q.w - 20}" height="7" rx="3"/>
        <rect class="s-${bc}" x="${q.x + 11}" y="${q.y + 35}" width="${Math.min(1, pct / 100) * (q.w - 20)}" height="7" rx="3"/>
        ${t(q.x + 11, q.y + 53, 's-tiny', `${K.fmtA(r.amps)} / ${r.spec.a} A · ${U.num(pct, 0)}%`)}
        ${sel === q.s.id ? `<rect class="s-sel" x="${q.x - 2}" y="${q.y - 2}" width="${q.w + 4}" height="${q.h + 4}" rx="7"/>` : ''}</g>`;
    });
    if (!d.psus.length) g += t(12, 58, 's-muted', 'No PSU — drop one here');
    // Controllers
    let chains = '', feeds = '';
    L.ctls.forEach(cl => {
      const { c, b } = cl;
      g += `<g data-id="${c.id}" style="cursor:pointer">${title(`${c.name} (${b.name})${c.ip ? '\nIP ' + c.ip : ''}\n${b.note}`)}
        <rect class="s-board" x="${cl.x}" y="${cl.y}" width="${cl.w}" height="${cl.h}" rx="6"/>
        ${t(cl.x + 8, cl.y + 15, 's-text', c.name)}${t(cl.x + 8, cl.y + 27, 's-tiny', `${b.name}${c.ip ? ' · ' + c.ip : ''}`)}</g>`;
      if (sel === c.id) g += `<rect class="s-sel" x="${cl.x - 3}" y="${cl.y - 3}" width="${cl.w + 6}" height="${cl.h + 6}" rx="8"/>`;
      // Banks: power pads on the left edge, wired from their PSU.
      b.banks.forEach((bk, bi) => {
        const portRows = cl.rows.filter(r => r.kind === 'port' && bk.ports.includes(r.pt.num));
        const py = portRows.length ? (portRows[0].y + portRows[portRows.length - 1].y) / 2 : cl.y + 40 + bi * 26;
        const psuId = c.banks[bk.id];
        const q = L.psus.find(x => x.s.id === psuId);
        const cls = psuId ? psuColour(p, psuId) : '';
        const br = R.banks.get(c.id + ':' + bk.id);
        g += `<g data-id="${c.id}" style="cursor:pointer">${title(`${bk.label}${bk.ports.length ? ' (ports ' + bk.ports.join(', ') + ')' : ''}\n${psuId ? 'from ' + (R.psus.get(psuId) || {}).psu.name : 'NO PSU'}${br ? '\n' + K.fmtA(br.amps) : ''}\nFeed: ${c.feed.length} m ${C.wireById(c.feed.gauge).label}`)}
          <rect class="${psuId ? cls : 's-pad'}" x="${cl.x - 6}" y="${py - 6}" width="12" height="12" rx="2"/>
          ${portRows.length ? '' : t(cl.x + 10, py + 4, 's-tiny', bk.label)}</g>`;
        if (portRows.length > 1) g += `<path d="M${cl.x + 4} ${portRows[0].y} V${portRows[portRows.length - 1].y}" class="s-strwire" style="opacity:.4"/>`;
        if (q) {
          const sx = q.x + q.w / 2 + (bi % 2 ? 8 : -8), sy = q.y + q.h;
          g += `<path class="s-bankwire ${cls}" d="M${sx} ${sy} C${sx} ${py} ${cl.x - 50} ${py} ${cl.x - 6} ${py}"/>`;
        } else if (psuId) {
          const a = V.psuPos.get(psuId);
          if (a) feeds += `<path class="s-bankwire ${cls}" style="stroke-dasharray:6 3" d="M${a.x} ${a.y} C${a.x + 80} ${a.y} ${d.x + cl.x - 80} ${d.y + py} ${d.x + cl.x - 6} ${d.y + py}"/>`;
        } else {
          g += `<path class="s-cable over" style="stroke-width:1.5;stroke-dasharray:3 3" d="M${cl.x - 40} ${py} H${cl.x - 6}"/>${t(cl.x - 42, py + 3, 's-tiny', 'no PSU', 'text-anchor="end" class="err"')}`;
        }
      });
      cl.rows.forEach(row => {
        if (row.kind === 'port') {
          const pt = row.pt, r = R.ports.get(pt.id), used = pt.chain.length > 0;
          const st = !used ? '' : (r.firstErr >= 0 || (b.fuseA && r.portA > b.fuseA)) ? 'err' : (r.firstFail >= 0 || (b.fuseA && r.portA > b.fuseA * .8)) ? 'warn' : 'ok';
          g += `<g data-id="${pt.id}" data-drop="port" data-port="${pt.id}" style="cursor:pointer">${title(`Port ${pt.num}${pt.label ? ' · ' + pt.label : ''}${used ? `\n${r.pixels} px, ${r.channels} ch\n${K.fmtA(r.portA)} from port${b.fuseA ? ' (' + b.fuseA + ' A fuse)' : ''}\nmin ${K.fmtV(r.minV)}` : '\nempty — drop a preset here'}`)}
            <rect class="s-hit" x="${cl.x + 14}" y="${row.y - ROW / 2 + 2}" width="${cl.w - 14}" height="${ROW - 4}" rx="4"/>
            ${t(cl.x + 18, row.y + 4, 's-text', `P${pt.num}`)}
            ${t(cl.x + 40, row.y + 4, used ? 's-text' : 's-tiny', (pt.label || (used ? '' : 'free')).slice(0, 14))}
            ${used ? t(cl.x + cl.w - 18, row.y + 4, 's-tiny', K.fmtA(r.portA), `text-anchor="end" class="${b.fuseA && r.portA > b.fuseA ? 'err' : ''}"`) : ''}
            ${st ? `<circle cx="${cl.x + cl.w - 60}" cy="${row.y}" r="3.5" class="s-${st}"/>` : ''}
            <rect class="${used ? 's-pad used' : 's-pad'}" x="${W - 7}" y="${row.y - 7}" width="14" height="14" rx="3"/></g>`;
          if (sel === pt.id) g += `<rect class="s-sel" x="${cl.x + 12}" y="${row.y - ROW / 2 + 1}" width="${cl.w - 8}" height="${ROW - 2}" rx="5"/>`;
          const ch = drawChain(p, R, d, pt, r, W + 7, row.y, sel);
          chains += ch.g; feeds += ch.feeds;
        } else if (row.kind === 'relay') {
          const rl = row.r, on = !!(rl.name || rl.amps), over = rl.amps > b.relayMaxA || rl.volts > b.relayMaxV;
          g += `<g data-id="${rl.id}" style="cursor:pointer">${title(`Relay ${rl.num}${rl.name ? ': ' + rl.name : ''}\n${rl.amps || 0} A at ${rl.volts} V (max ${b.relayMaxA} A)`)}
            <rect class="s-relay ${on ? 'on' : ''}" x="${cl.x + 14}" y="${row.y - 9}" width="30" height="18" rx="3"/>
            <path d="M${cl.x + 20} ${row.y + 4} L${cl.x + 36} ${row.y - 4}" class="s-strwire"/>
            ${t(cl.x + 50, row.y + 4, on ? 's-text' : 's-tiny', `R${rl.num} ${rl.name || 'spare'}`.slice(0, 18))}
            ${rl.amps ? t(cl.x + cl.w - 8, row.y + 4, 's-tiny', rl.amps + ' A', `text-anchor="end" class="${over ? 'err' : ''}"`) : ''}</g>`;
          if (on) chains += `<path class="s-cable" style="stroke-width:2" d="M${W} ${row.y} H${W + 40}"/>${t(W + 46, row.y + 4, 's-muted', `${rl.name || 'load'} · ${rl.volts} V`)}`;
          if (sel === rl.id) g += `<rect class="s-sel" x="${cl.x + 10}" y="${row.y - 12}" width="${cl.w - 14}" height="24" rx="4"/>`;
        } else if (row.kind === 'input') {
          const ip = row.r, set = ip.action && ip.action !== 'none';
          const act = C.inputActions.find(x => x.id === ip.action);
          g += `<g data-id="${ip.id}" style="cursor:pointer">${title(`Turniput ${ip.num}${ip.name ? ': ' + ip.name : ''}\n${ip.device}\n${act ? act.name : ''}${ip.param ? ' ' + ip.param : ''}`)}
            <circle cx="${cl.x + 22}" cy="${row.y}" r="7" class="s-btn ${set ? '' : 'unset'}"/>
            ${t(cl.x + 36, row.y + 4, set ? 's-text' : 's-tiny', `T${ip.num} ${ip.name || (set ? act.name : 'input')}`.slice(0, 20))}</g>`;
          if (sel === ip.id) g += `<rect class="s-sel" x="${cl.x + 10}" y="${row.y - 11}" width="${cl.w - 14}" height="22" rx="4"/>`;
        } else if (row.kind === 'dmx') {
          g += t(cl.x + 14, row.y + 4, 's-tiny', 'DMX out: RJ45 · 3-pin · 5-pin XLR');
        }
      });
    });
    g += chains + '</g>';
    return { g, feeds };
  }

  // Draws one port's run from (x0,y) to the right. Coordinates are distro-local; feeds are absolute.
  function drawChain(p, R, d, pt, r, x0, y, sel) {
    let g = '', feeds = '', x = x0;
    const st = p.settings;
    pt.chain.forEach((it, i) => {
      const ir = r.items.get(it.id) || {};
      const isSel = sel === it.id;
      const start = x;
      if (it.kind === 'cable') {
        const w = C.wireById(it.gauge), len = Math.max(20, Math.min(160, it.length * 10));
        const cls = ir.maxA > w.maxA ? 'over' : ir.maxA > w.maxA * 0.8 ? 'hot' : '';
        const drop = ir.vIn != null ? ir.vIn - ir.vOut : 0;
        g += `<g data-id="${it.id}" data-drop="item" data-item="${it.id}" data-port="${pt.id}" style="cursor:pointer">${title(`Cable ${it.length} m ${w.label}${it.label ? ' · ' + it.label : ''}\n${K.fmtA(ir.maxA)} (rated ${w.maxA} A)\nDrop ${U.num(drop, 2)} V`)}
          <rect class="s-hit" x="${x}" y="${y - 12}" width="${len}" height="24"/>
          <path class="s-cable ${cls}" style="stroke-width:${GAUGE_W[it.gauge] || 2}" d="M${x} ${y} H${x + len}"/>
          ${t(x + len / 2, y - 6, 's-tiny', `${it.length} m ${w.label.replace(' AWG', 'AWG')}`, 'text-anchor="middle"')}</g>`;
        x += len;
      } else if (it.kind === 'pixels') {
        const ty = M.pixelType(p, it.typeId) || { cat: 'bullet', name: '?' };
        const n = +it.count || 0;
        const isFlood = ty.cat === 'flood';
        const maxShapes = isFlood ? 12 : 30;
        const shapes = Math.min(n, maxShapes);
        const step = isFlood ? 16 : 7;
        const px = r.pxV.filter(v => v.item === it.id);
        const w = shapes * step + 6;
        g += `<g data-id="${it.id}" data-drop="item" data-item="${it.id}" data-port="${pt.id}" style="cursor:pointer">${title(`${n} × ${ty.name}${it.label ? ' · ' + it.label : ''}\nevery ${it.spacing} m on ${C.wireById(it.gauge).label}\n${ir.unpowered ? 'NO POWER' : `min ${K.fmtV(ir.minV)} (${U.num(ir.minPct, 0)}%)`}\n${K.fmtW(ir.watts)} · ${K.fmtA(ir.maxA)} in string${n > shapes ? `\n(each ${isFlood ? 'square' : 'dot'} ≈ ${U.num(n / shapes, 1)} pixels)` : ''}`)}
          <rect class="s-hit" x="${x}" y="${y - 12}" width="${w}" height="24"/>
          <path class="s-strwire" d="M${x} ${y} H${x + w}"/>`;
        for (let k = 0; k < shapes; k++) {
          const a = Math.floor(k * n / shapes), b = Math.max(a + 1, Math.floor((k + 1) * n / shapes));
          let mn = Infinity; for (let j = a; j < b && j < px.length; j++) mn = Math.min(mn, px[j].pct);
          const cls = ir.unpowered || mn <= 0 ? 'off' : U.vClass(mn);
          const cx = x + 3 + k * step + step / 2;
          g += isFlood ? `<rect x="${cx - 5}" y="${y - 5}" width="10" height="10" rx="2" class="s-${cls}"/>` : `<circle cx="${cx}" cy="${y}" r="2.6" class="s-${cls}"/>`;
        }
        g += t(x + 3, y - 8, 's-tiny', `${n}× ${ty.name}`.slice(0, Math.max(8, Math.floor(w / 5))));
        g += `</g>`;
        x += w;
      } else if (it.kind === 'inject') {
        const a = ir.sourceA || 0, w = C.wireById(it.gauge);
        const cls = it.psuId ? psuColour(p, it.psuId) : 'c5';
        g += `<g data-id="${it.id}" data-drop="item" data-item="${it.id}" data-port="${pt.id}" style="cursor:pointer">${title(`Power injection${it.label ? ' · ' + it.label : ''}\n${it.psuId ? 'from ' + ((R.psus.get(it.psuId) || {}).psu || {}).name : 'NO PSU'} via ${it.length} m ${w.label}\n${K.fmtA(a)} · fuse ${K.recommendFuse(Math.max(a, .1))} A${it.isolate ? '\n+V isolated from the run before' : ''}`)}
          <rect class="s-hit" x="${x}" y="${y - 12}" width="18" height="24"/>
          <rect x="${x + 4}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x + 9} ${y})" class="${cls}"/>
          ${it.isolate ? `<path d="M${x + 16} ${y - 7} V${y + 7}" class="s-cable over" style="stroke-width:2"/>` : ''}
          ${t(x + 9, y + 18, 's-tiny', K.fmtA(a), 'text-anchor="middle"')}</g>`;
        const src = V.psuPos.get(it.psuId);
        if (src) {
          const ax = d.x + x + 9, ay = d.y + y - 6;
          feeds += `<path class="s-feed ${cls}" d="M${src.x} ${src.y} C${src.x + 60} ${src.y} ${ax} ${ay - 60} ${ax} ${ay}"><title>${esc(`Injection feed ${it.length} m ${w.label}: ${K.fmtA(a)}`)}</title></path>`;
        }
        x += 18;
      }
      if (isSel) g += `<rect class="s-sel" x="${start - 2}" y="${y - 14}" width="${x - start + 4}" height="28" rx="4"/>`;
    });
    // End of run: min voltage and a "+" drop target.
    if (pt.chain.length && r.minV != null) g += t(x + 6, y + 16, `s-tiny`, `min ${K.fmtV(r.minV)}`);
    g += `<g data-drop="port" data-port="${pt.id}" data-plus="${pt.id}" style="cursor:pointer">${title('Drop a preset here, or click to edit this port')}
      <circle class="s-plus" cx="${x + 12}" cy="${y}" r="7"/><path d="M${x + 8} ${y} H${x + 16} M${x + 12} ${y - 4} V${y + 4}" class="s-strwire"/></g>`;
    return { g, feeds };
  }

  // ---------- camera ----------
  const applyCam = () => { const g = U.$('#cam'); if (g) g.setAttribute('transform', `translate(${U.cam.x},${U.cam.y}) scale(${U.cam.k})`); };
  V.zoom = (f, cx, cy) => {
    const wrap = U.$('#canvasWrap').getBoundingClientRect();
    if (cx == null) { cx = wrap.width / 2; cy = wrap.height / 2; }
    const k = Math.min(3, Math.max(0.15, U.cam.k * f));
    U.cam.x = cx - (cx - U.cam.x) * k / U.cam.k;
    U.cam.y = cy - (cy - U.cam.y) * k / U.cam.k;
    U.cam.k = k; applyCam();
  };
  V.fit = () => {
    const p = S.project, wrap = U.$('#canvasWrap').getBoundingClientRect();
    const gs = U.$$('#cam > g.distro');
    if (!gs.length || !wrap.width) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    gs.forEach(g => {
      const bb = g.getBBox(), d = p.distros.find(x => x.id === g.dataset.distro);
      if (!d) return;
      x0 = Math.min(x0, d.x + bb.x); y0 = Math.min(y0, d.y + bb.y); x1 = Math.max(x1, d.x + bb.x + bb.width); y1 = Math.max(y1, d.y + bb.y + bb.height);
    });
    const k = Math.min(1.4, Math.max(0.15, Math.min((wrap.width - 40) / (x1 - x0), (wrap.height - 40) / (y1 - y0))));
    U.cam = { k, x: 20 - x0 * k + Math.max(0, (wrap.width - 40 - (x1 - x0) * k) / 2), y: 20 - y0 * k };
    applyCam();
  };
  const toWorld = (ev) => {
    const r = U.$('#svg').getBoundingClientRect();
    return { x: (ev.clientX - r.left - U.cam.x) / U.cam.k, y: (ev.clientY - r.top - U.cam.y) / U.cam.k };
  };

  // ---------- drop handling ----------
  function doDrop(data, target, world) {
    const p = S.project;
    const portId = target && target.dataset.port;
    const itemId = target && target.dataset.item;
    const distroId = target && target.dataset.drop === 'distro' ? target.dataset.id : (target && target.closest('g.distro') ? target.closest('g.distro').dataset.distro : null);
    if (data.t === 'distro') {
      S.commit('addDistro', p => { const d = M.newDistro('Distro ' + (p.distros.length + 1), Math.round(world.x), Math.round(world.y)); p.distros.push(d); S.selection = d.id; });
      return;
    }
    if (data.t === 'psu' || data.t === 'board') {
      if (!distroId) return U.toast('Drop PSUs and boards onto a distro.');
      S.commit('dropHw', p => {
        const d = p.distros.find(x => x.id === distroId);
        if (data.t === 'psu') {
          const s = M.newPsu(data.model, d.psus.length + 1); d.psus.push(s); S.selection = s.id;
          d.controllers.forEach(c => Object.keys(c.banks).forEach(k => { if (!c.banks[k]) c.banks[k] = s.id; }));
        } else {
          const c = M.newController(data.board); const first = d.psus[0];
          if (first) Object.keys(c.banks).forEach(k => { c.banks[k] = first.id; });
          d.controllers.push(c); S.selection = c.id;
        }
      });
      return;
    }
    if (!portId) return U.toast('Drop strings, cables and injections onto a port or a run.');
    S.commit('drop', p => {
      const e = M.find(p, portId); if (!e) return;
      const chain = e.port.chain;
      let at = itemId ? chain.findIndex(x => x.id === itemId) + 1 : chain.length;
      const add = [];
      if (data.t === 'preset') {
        const pr = p.library.presets.find(x => x.id === data.id); if (!pr) return;
        if (!chain.length) add.push(M.newItem.cable(5, 'awg18'));
        add.push(M.newItem.pixels(pr.typeId, pr.count, p.library.pixelTypes));
        if (!e.port.label) e.port.label = pr.name;
      } else if (data.t === 'cable') add.push(M.newItem.cable(data.length, data.gauge));
      else if (data.t === 'inject') {
        const c = e.controller, b = C.boards[c.board];
        const bk = b.banks.find(x => x.ports.includes(e.port.num));
        add.push(M.newItem.inject((bk && c.banks[bk.id]) || (e.distro.psus[0] || {}).id || null, p.settings.injectLength, p.settings.injectGauge));
      }
      chain.splice(at, 0, ...add);
      S.selection = add[add.length - 1].id;
    });
  }

  // ---------- events (bound once) ----------
  V.init = () => {
    const svg = U.$('#svg'), wrap = U.$('#canvasWrap');
    U.$('#palette').addEventListener('dragstart', ev => {
      const el = ev.target.closest('[data-drag]'); if (!el) return;
      ev.dataTransfer.setData('text/plain', el.dataset.drag); ev.dataTransfer.effectAllowed = 'copy';
    });
    let lastHi = null;
    const hi = el => { if (lastHi === el) return; if (lastHi) lastHi.classList.remove('s-drop-hi'); lastHi = el; if (el) el.classList.add('s-drop-hi'); };
    wrap.addEventListener('dragover', ev => { ev.preventDefault(); wrap.classList.add('dragover'); hi(ev.target.closest && ev.target.closest('[data-drop]')); });
    wrap.addEventListener('dragleave', ev => { if (!wrap.contains(ev.relatedTarget)) { wrap.classList.remove('dragover'); hi(null); } });
    wrap.addEventListener('drop', ev => {
      ev.preventDefault(); wrap.classList.remove('dragover'); hi(null);
      let data; try { data = JSON.parse(ev.dataTransfer.getData('text/plain')); } catch (e) { return; }
      doDrop(data, ev.target.closest && ev.target.closest('[data-drop]'), toWorld(ev));
    });
    svg.addEventListener('wheel', ev => {
      ev.preventDefault();
      const r = svg.getBoundingClientRect();
      V.zoom(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });
    svg.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const dh = ev.target.closest('[data-drag-distro]');
      if (dh) {
        const d = S.project.distros.find(x => x.id === dh.dataset.dragDistro);
        drag = { d, before: JSON.stringify(S.project), sx: ev.clientX, sy: ev.clientY, ox: d.x, oy: d.y, moved: false, g: U.$(`g.distro[data-distro="${d.id}"]`) };
        svg.setPointerCapture(ev.pointerId);
        return;
      }
      if (ev.target.closest('[data-id],[data-plus]')) return;
      pan = { sx: ev.clientX, sy: ev.clientY, ox: U.cam.x, oy: U.cam.y, moved: false };
      svg.setPointerCapture(ev.pointerId); svg.classList.add('panning');
    });
    svg.addEventListener('pointermove', ev => {
      if (drag) {
        const dx = (ev.clientX - drag.sx) / U.cam.k, dy = (ev.clientY - drag.sy) / U.cam.k;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        drag.d.x = Math.round((drag.ox + dx) / 10) * 10; drag.d.y = Math.round((drag.oy + dy) / 10) * 10;
        drag.g.setAttribute('transform', `translate(${drag.d.x},${drag.d.y})`);
        U.$('#feeds').style.display = 'none';
      } else if (pan) {
        U.cam.x = pan.ox + ev.clientX - pan.sx; U.cam.y = pan.oy + ev.clientY - pan.sy;
        if (Math.abs(ev.clientX - pan.sx) + Math.abs(ev.clientY - pan.sy) > 3) pan.moved = true;
        applyCam();
      }
    });
    const end = ev => {
      if (drag) {
        const dr = drag; drag = null;
        if (dr.moved) S.commitFrom(dr.before, 'moveDistro'); else S.select(dr.d.id);
        const f = U.$('#feeds'); if (f) f.style.display = '';
      }
      if (pan) { if (!pan.moved) S.select(null); pan = null; svg.classList.remove('panning'); }
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('click', ev => {
      const plus = ev.target.closest('[data-plus]');
      if (plus) { S.select(plus.dataset.plus); return; }
      const el = ev.target.closest('[data-id]'); if (!el || el.closest('[data-drag-distro]')) return;
      S.select(el.dataset.id);
    });
  };
})();

</script>
<script>
// Wiring guide: printable step-by-step build sheet, bill of materials and channel map.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc, S = PP.store;
  const esc = U.esc;
  const G = PP.guide = {};

  const THEME_VARS = ['--cp-bg', '--cp-bg-elevated', '--cp-surface', '--cp-surface-soft', '--cp-border', '--cp-border-strong', '--cp-text', '--cp-text-muted', '--cp-text-soft', '--cp-accent', '--cp-accent-soft', '--cp-success', '--cp-warning', '--cp-danger', '--cp-link', '--cp-highlight'];
  const themeCss = () => {
    const cs = getComputedStyle(document.documentElement);
    return ':root{' + THEME_VARS.map(v => `${v}:${cs.getPropertyValue(v).trim()};`).join('') + '}';
  };

  // ---------- bill of materials ----------
  G.bom = (p, R) => {
    const rows = [];
    const add = (group, item, qty, unit = '', note = '') => {
      const r = rows.find(x => x.group === group && x.item === item && x.note === note);
      if (r) r.qty += qty; else rows.push({ group, item, qty, unit, note });
    };
    p.distros.forEach(d => {
      add('Enclosures', (C.distroSizes.find(s => s.id === d.size) || {}).name || d.size, 1, 'pcs', d.name);
      d.psus.forEach(s => add('Power supplies', s.model === 'custom' ? `Custom ${s.customV} V ${s.customA} A PSU` : `Mean Well ${s.model}`, 1, 'pcs'));
      d.controllers.forEach(c => {
        const b = C.boards[c.board];
        add('Controllers', b.name, 1, 'pcs');
        add('Cable', `${C.wireById(c.feed.gauge).label} power (PSU → board)`, c.feed.length * b.banks.filter(bk => c.banks[bk.id]).length * 2, 'm', 'red + black');
        c.ports.forEach(pt => {
          const r = R.ports.get(pt.id);
          if (!pt.chain.length) return;
          if (b.fuseA) add('Fuses', `${K.recommendFuse(Math.max(r.portA, 0.1))} A mini blade (port)`, 1, 'pcs', `board ships with ${b.fuseA} A`);
          pt.chain.forEach(it => {
            if (it.kind === 'cable') { add('Cable', `${C.wireById(it.gauge).label} 3-core pixel extension`, +it.length || 0, 'm'); add('Connectors', '3-pin pixel pigtail pair', 1, 'pairs'); }
            else if (it.kind === 'pixels') {
              const t = M.pixelType(p, it.typeId);
              add('Pixels', t ? t.name : it.typeId, +it.count || 0, t && t.cat === 'flood' ? 'pcs' : 'px');
              add('Connectors', '3-pin pixel pigtail pair', 1, 'pairs');
            } else if (it.kind === 'inject') {
              const ir = r.items.get(it.id) || {};
              add('Cable', `${C.wireById(it.gauge).label} 2-core power (injection)`, +it.length || 0, 'm');
              add('Fuses', `${K.recommendFuse(Math.max(ir.sourceA || 0, 0.1))} A inline blade (injection)`, 1, 'pcs');
              add('Connectors', 'Injection T / 3-pin splice', 1, 'pcs');
            }
          });
        });
      });
    });
    rows.forEach(r => { if (r.unit === 'm') r.qty = Math.ceil(r.qty * 10) / 10; });
    const order = ['Enclosures', 'Controllers', 'Power supplies', 'Pixels', 'Cable', 'Fuses', 'Connectors'];
    return rows.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group) || a.item.localeCompare(b.item));
  };

  const csv = rows => rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  G.csvBom = (p, R) => csv([['Group', 'Item', 'Qty', 'Unit', 'Note'], ...G.bom(p, R).map(r => [r.group, r.item, U.num(r.qty, 1), r.unit, r.note])]);
  G.csvChannels = (p, R) => {
    const rows = [['Controller', 'IP', 'Port', 'Label', 'Pixels', 'Channels', 'Start channel', 'End channel', 'Universes', 'Brightness %']];
    p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      const r = R.ports.get(pt.id); if (!r.channels) return;
      rows.push([c.name, c.ip, pt.num, pt.label, r.pixels, r.channels, r.startCh, r.startCh + r.channels - 1, r.universes, Math.round(p.settings.brightness * pt.brightness / 100)]);
    })));
    return csv(rows);
  };

  // ---------- per-port steps ----------
  function portSteps(p, R, d, c, pt) {
    const r = R.ports.get(pt.id), b = C.boards[c.board];
    const steps = [];
    let pxCount = 0, dist = 0;
    const bright = Math.round(p.settings.brightness * pt.brightness / 100);
    steps.push(`Set port ${pt.num} to <b>${r.pixels} pixels</b>${bright < 100 ? `, brightness <b>${bright}%</b>` : ''} in the Baldrick web UI (or let xLights/FPP upload it).`);
    if (b.fuseA) steps.push(pt.portPower ? `Port fuse: draws <b>${K.fmtA(r.portA)}</b> → fit a <b>${K.recommendFuse(Math.max(r.portA, 0.1))} A</b> blade (max ${b.fuseA} A on this board).` : `Port power is <b>off</b>: remove the port ${pt.num} fuse so only data and ground leave the board.`);
    pt.chain.forEach(it => {
      const ir = r.items.get(it.id) || {};
      if (it.kind === 'cable') {
        dist += +it.length || 0;
        steps.push(`Run <b>${it.length} m of ${C.wireById(it.gauge).label}</b> 3-core extension${it.label ? ' (' + esc(it.label) + ')' : ''}. Arrives at <b>${K.fmtV(ir.vOut)}</b>, carrying ${K.fmtA(ir.maxA)}.`);
      } else if (it.kind === 'pixels') {
        const t = M.pixelType(p, it.typeId);
        const n = +it.count || 0;
        steps.push(`Connect <b>${n} × ${esc(t ? t.name : it.typeId)}</b>${it.label ? ' (' + esc(it.label) + ')' : ''}${it.continued ? ' — rest of the same string' : ''}: pixels ${pxCount + 1}–${pxCount + n} on this port, ${it.spacing} m apart. ${ir.unpowered ? '<span class="err">No power reaches these pixels.</span>' : `Lowest voltage <b class="${U.vClass(ir.minPct)}">${K.fmtV(ir.minV)}</b> (${U.num(ir.minPct, 0)}%).`}`);
        pxCount += n; dist += n * (+it.spacing || 0);
      } else if (it.kind === 'inject') {
        const ps = it.psuId ? (R.psus.get(it.psuId) || {}).psu : null;
        const a = ir.sourceA || 0;
        const where = it.label || (pxCount ? `after pixel ${pxCount}` : 'here');
        steps.push(`<b>Inject power</b> ${esc(where)} (about ${U.num(dist, 1)} m along the run): run <b>${it.length} m of ${C.wireById(it.gauge).label}</b> red/black from <b>${ps ? esc(ps.name) : '<span class="err">no PSU</span>'}</b>, <b>${K.recommendFuse(Math.max(a, 0.1))} A</b> inline fuse at the PSU end. Carries ${K.fmtA(a)}. Join +V and GND only${it.isolate ? '; <b>cut the +V wire</b> coming from the previous section so the supplies are not joined' : ''}. Data passes straight through.`);
      }
    });
    return steps;
  }

  // ---------- full document ----------
  G.build = (p, R) => {
    const st = p.settings, T = R.totals;
    const date = new Date().toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    let h = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(p.name)} — wiring guide</title><style>${themeCss()}
      body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--cp-surface);color:var(--cp-text);margin:24px;font-size:13px;line-height:1.45}
      h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--cp-border)}h3{font-size:14px;margin:16px 0 4px}
      .muted{color:var(--cp-text-muted)}.soft{color:var(--cp-text-soft)}.ok{color:var(--cp-success)}.warn{color:var(--cp-warning)}.err,.error{color:var(--cp-danger)}
      table{border-collapse:collapse;width:100%;margin:6px 0}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--cp-border);vertical-align:top}th{color:var(--cp-text-muted);font-weight:600;font-size:12px}
      ol{margin:4px 0 8px 18px;padding:0}li{margin:3px 0}.card{border:1px solid var(--cp-border);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--cp-bg-elevated);break-inside:avoid}
      .kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{border:1px solid var(--cp-border);border-radius:10px;padding:6px 12px;min-width:110px}.kpi b{display:block;font-size:17px}.kpi span{font-size:11px;color:var(--cp-text-muted)}
      .mono{font-family:Consolas,"Courier New",monospace;font-size:12px;word-break:break-all;color:var(--cp-link)}.tick{display:inline-block;width:12px;height:12px;border:1.5px solid var(--cp-border-strong);border-radius:3px;margin-right:6px;vertical-align:-2px}
      @media print{body{margin:10mm}h2{break-after:avoid}.card{break-inside:avoid}}
    </style></head><body>`;
    h += `<h1>${esc(p.name)} — wiring guide</h1><div class="muted">${esc(PP.APP_NAME)} ${esc(PP.APP_VERSION)} · ${esc(date)} · global brightness ${st.brightness}%</div>`;
    if (p.notes) h += `<p>${esc(p.notes).replace(/\n/g, '<br>')}</p>`;
    h += `<div class="kpis" style="margin-top:12px">
      <div class="kpi"><b>${T.pixels}</b><span>pixels</span></div><div class="kpi"><b>${T.channels}</b><span>channels · ${T.universes} universes</span></div>
      <div class="kpi"><b>${K.fmtW(T.dcW)}</b><span>DC at full white</span></div><div class="kpi"><b>${U.num(T.mainsA, 1)} A</b><span>mains at ${st.mainsV} V</span></div>
      <div class="kpi"><b>${K.fmtA(T.psuA)} / ${U.num(T.psuCapA, 0)} A</b><span>PSU load</span></div><div class="kpi"><b>${esc(st.currency)}${U.num(T.cost, 2)}</b><span>season cost (${st.typicalPct}% typical)</span></div></div>`;
    const errs = R.warnings.filter(w => w.level !== 'info');
    if (errs.length) h += `<h2>Check before you build (${errs.length})</h2><ul>${errs.map(w => `<li class="${w.level}">${esc(w.msg)}</li>`).join('')}</ul>`;

    // Network
    h += `<h2>Network</h2><table><tr><th>Controller</th><th>Board</th><th>Distro</th><th>IP</th><th>Pixels</th><th>Channels</th></tr>`;
    p.distros.forEach(d => d.controllers.forEach(c => { const CR = R.controllers.get(c.id); h += `<tr><td>${esc(c.name)}</td><td>${esc(C.boards[c.board].name)}</td><td>${esc(d.name)}</td><td class="mono">${esc(c.ip || '—')}</td><td>${CR.pixels}</td><td>${CR.channels}</td></tr>`; }));
    h += `</table><p class="muted">FPP on the Pi (${esc(st.fppIp)}) sends E1.31/DDP over ethernet to each Baldrick. Give every board a fixed IP, set the same IPs in xLights controller setup (vendor ILightThat), and upload the output config from xLights. GS8208 pixels need FPP “Always Transmit Channel Data”.</p>`;

    // Per distro
    p.distros.forEach(d => {
      const D = R.distros.get(d.id);
      h += `<h2>${esc(d.name)}</h2><div class="muted">${esc((C.distroSizes.find(s => s.id === d.size) || {}).name || '')} · ${K.fmtW(D.dcW)} DC · ${U.num(D.mainsA, 2)} A mains${D.relayW ? ` (incl. ${K.fmtW(D.relayW)} switched by relays)` : ''}</div>`;
      if (d.notes) h += `<p>${esc(d.notes).replace(/\n/g, '<br>')}</p>`;
      h += `<h3>Power supplies</h3><table><tr><th>PSU</th><th>Model</th><th>Set output to</th><th>Load</th><th>Feeds</th></tr>`;
      d.psus.forEach(s => {
        const r = R.psus.get(s.id);
        h += `<tr><td><span class="tick"></span>${esc(s.name)}</td><td>${esc(s.model === 'custom' ? `Custom ${s.customV} V ${s.customA} A` : s.model)}<div class="soft">${esc(r.spec.ip)}</div></td><td><b>${s.vout} V</b> (trim pot)</td>
          <td class="${U.pctClass(r.pct, st.psuTargetPct)}">${K.fmtA(r.amps)} of ${r.spec.a} A (${U.num(r.pct, 0)}%)</td><td>${r.loads.map(l => esc(l.label) + ': ' + K.fmtA(l.amps)).join('<br>')}</td></tr>`;
      });
      h += `</table><p class="muted">Mains in: L, N and earth to every PSU; earth the enclosure and PSU cases. Set each PSU's voltage with a meter before connecting any pixels.</p>`;
      d.controllers.forEach(c => {
        const b = C.boards[c.board];
        h += `<div class="card"><h3 style="margin-top:0">${esc(c.name)} — ${esc(b.name)}${c.ip ? ` <span class="mono">${esc(c.ip)}</span>` : ''}</h3><div class="soft">${esc(b.note)}</div>`;
        h += `<h3>Power in</h3><ol>`;
        b.banks.forEach(bk => {
          const ps = c.banks[bk.id] ? (R.psus.get(c.banks[bk.id]) || {}).psu : null;
          const br = R.banks.get(c.id + ':' + bk.id);
          h += `<li><span class="tick"></span>${esc(bk.label)}${bk.ports.length ? ` (ports ${bk.ports.join(', ')})` : ''}: ${ps ? `<b>${esc(ps.name)}</b> V+ and V− with ${c.feed.length} m of <b>${C.wireById(c.feed.gauge).label}</b>` : '<span class="err">no PSU</span>'}${br && br.amps ? ` — ${K.fmtA(br.amps)}` : ''}</li>`;
        });
        h += `</ol>`;
        c.ports.filter(pt => pt.chain.length).forEach(pt => {
          const r = R.ports.get(pt.id);
          h += `<h3>Port ${pt.num}${pt.label ? ' — ' + esc(pt.label) : ''} <span class="soft" style="font-weight:400">${r.pixels} px · ch ${r.startCh}–${r.startCh + r.channels - 1} · min ${K.fmtV(r.minV)}</span></h3><ol>${portSteps(p, R, d, c, pt).map(s => `<li><span class="tick"></span>${s}</li>`).join('')}</ol>`;
        });
        if (c.relays.some(r => r.name || r.amps)) {
          h += `<h3>Relays</h3><table><tr><th>Relay</th><th>Switches</th><th>Load</th></tr>${c.relays.filter(r => r.name || r.amps).map(r => `<tr><td>${r.num}</td><td>${esc(r.name)}</td><td class="${r.amps > b.relayMaxA ? 'err' : ''}">${r.amps} A at ${r.volts} V</td></tr>`).join('')}</table><p class="muted">Relay contacts are rated ${b.relayMaxA} A / ${b.relayMaxV} V. Mains wiring must be done by a competent person, in a suitable enclosure, on an RCD-protected circuit.</p>`;
        }
        const ins = c.inputs.filter(r => r.action && r.action !== 'none');
        if (ins.length) {
          h += `<h3>Inputs (Turniputs)</h3><table><tr><th>Input</th><th>Device</th><th>Does</th><th>URL / setting</th></tr>${ins.map(r => `<tr><td>${r.num} ${esc(r.name)}</td><td>${esc(r.device)}</td><td>${esc((C.inputActions.find(a => a.id === r.action) || {}).name || '')}${r.param ? ': ' + esc(r.param) : ''}</td><td class="mono">${esc(PP.form.inputUrl(p, r))}</td></tr>`).join('')}</table>`;
        }
        h += `</div>`;
      });
    });

    // BOM
    h += `<h2>Bill of materials</h2><table><tr><th>Group</th><th>Item</th><th>Qty</th><th>Note</th></tr>`;
    G.bom(p, R).forEach(r => { h += `<tr><td>${esc(r.group)}</td><td>${esc(r.item)}</td><td>${U.num(r.qty, 1)} ${esc(r.unit)}</td><td class="soft">${esc(r.note)}</td></tr>`; });
    h += `</table><p class="muted">Add 10–15% to cable lengths for routing and drip loops. Pixel string wire is included in the strings.</p>`;

    // Channel map
    h += `<h2>Channel map</h2><table><tr><th>Controller</th><th>Port</th><th>Label</th><th>Pixels</th><th>Start</th><th>End</th><th>Universes</th></tr>`;
    p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
      const r = R.ports.get(pt.id); if (!r.channels) return;
      h += `<tr><td>${esc(c.name)}</td><td>${pt.num}</td><td>${esc(pt.label)}</td><td>${r.pixels}</td><td>${r.startCh}</td><td>${r.startCh + r.channels - 1}</td><td>${r.universes}</td></tr>`;
    })));
    h += `</table><p class="soft">Voltages are estimates from wire resistance and pixel full-white draw at ${st.brightness}% brightness. Always check with a meter at full white before the show.</p></body></html>`;
    return h;
  };

  G.open = () => {
    const p = S.project, R = U.lastR || K.run(p);
    const html = G.build(p, R);
    const d = U.$('#guideDlg');
    d.innerHTML = `<div class="dlg-head"><b>Wiring guide</b><span class="grow"></span>
      <button data-g="print" class="primary">Print / PDF</button><button data-g="html">Download HTML</button><button data-g="bom">BOM CSV</button><button data-g="ch">Channel map CSV</button><button data-g="close" aria-label="Close">✕</button></div>
      <div class="dlg-body"><iframe id="guideFrame" title="Wiring guide"></iframe></div>`;
    const f = U.$('#guideFrame', d);
    f.srcdoc = html;
    d.onclick = ev => {
      const b = ev.target.closest('[data-g]'); if (!b) return;
      const base = U.slug(p.name);
      if (b.dataset.g === 'print') f.contentWindow.print();
      else if (b.dataset.g === 'html') U.download(base + '-wiring-guide.html', html, 'text/html');
      else if (b.dataset.g === 'bom') U.download(base + '-bom.csv', G.csvBom(p, R), 'text/csv');
      else if (b.dataset.g === 'ch') U.download(base + '-channels.csv', G.csvChannels(p, R), 'text/csv');
      else if (b.dataset.g === 'close') d.close();
    };
    d.showModal();
  };
})();

</script>
<script>
// Help dialog: How to use, How it calculates, What's new, About.
(function () {
  const U = PP.ui, esc = U.esc;
  const H = PP.help = {};

  const pages = {
    use: () => `
      <h3>The idea</h3>
      <p>Build your show as <b>distros</b> (weatherproof boxes). Each distro holds Mean Well <b>PSUs</b> and Baldrick <b>boards</b>. Each board port drives a <b>run</b>: a chain of cables, pixel strings or floods and power injection points, in the order they are wired, for example <i>port → 5 m 18 AWG → 100 seeds → 100 seeds → injection → 4 × 10 W floods</i>.</p>
      <p>Every change is recalculated straight away. Pixel colours show the voltage each pixel gets at your brightness: <span class="ok">green</span> fine, <span class="warn">amber</span> low (colour shift), <span class="err">red</span> too low, grey no power.</p>
      <h3>Views</h3>
      <ul>
        <li><b>Form</b>: every setting as fields. Ports fold open to show their run.</li>
        <li><b>Visual</b>: a wiring diagram. Drag presets, cables and injections from the left onto a port (the pad on the right of a board), onto a string to insert after it, or onto the <b>+</b> at the end of a run. Drop PSUs and boards onto a distro. Drag a distro by its title bar. Scroll to zoom, drag the background to pan. The panel on the right edits whatever you click.</li>
        <li><b>Split</b>: both at once. Clicking in one highlights the same thing in the other.</li>
      </ul>
      <h3>Typical workflow</h3>
      <ol>
        <li>Set global brightness and your limits in <b>Project settings</b>.</li>
        <li>Add a distro, pick its size, add PSUs, add a board, and pick which PSU feeds each power input (bank).</li>
        <li>Build each port's run with presets. Edit the <b>Library</b> to match your pixels' real wattage and spacing, or to add presets like “100 seed string”.</li>
        <li>Press <b>Auto-inject</b> on a port (or <b>Auto-inject all</b>) to add injection points until every pixel is in the green, then <b>Balance PSUs</b> to spread the load.</li>
        <li>Clear the checks in the status bar (click one to jump to it).</li>
        <li>Open the <b>Wiring guide</b> to print a build sheet with PSU trim voltages, fuses, injection feeds, Turniput URLs, bill of materials and channel map.</li>
      </ol>
      <h3>Files</h3>
      <p>Your work autosaves in this browser. Use <b>Save</b> to keep a <span class="kbd">.pixelplan.json</span> file you can back up or send to someone with this app. Shortcuts: <span class="kbd">Ctrl+S</span> save, <span class="kbd">Ctrl+O</span> open, <span class="kbd">Ctrl+Z</span> undo, <span class="kbd">Ctrl+Y</span> redo, <span class="kbd">Delete</span> removes the selected run item.</p>`,
    calc: () => `
      <h3>Voltage drop</h3>
      <p>Each port is modelled as a ladder of wire resistances. Every pixel is a load that draws its full-white watts × brightness ÷ voltage. The +V and GND wires both count (round-trip resistance). The solver finds the voltage at every single pixel, including current shared between the port and any injection points, and the current in every wire.</p>
      <p>Wire resistance uses copper at 20 °C: 22 AWG 52.9, 20 AWG 33.3, 18 AWG 21, 16 AWG 13.2, 14 AWG 8.3, 12 AWG 5.2, 10 AWG 3.3 mΩ per metre per conductor. Wire current limits are deliberately conservative for bundled outdoor cable.</p>
      <h3>Power injection</h3>
      <p>An injection point is a feed from a PSU with its own length and gauge. If <b>isolate +V</b> is ticked the +V between the previous section and this one is cut (needed when the feed comes from a different PSU); ground is always shared. <b>Auto-inject</b> places the fewest points it can, furthest along the run first, choosing a gauge from your default upwards, and sizes each feed to the thinnest wire that is rated for its current.</p>
      <h3>Checks</h3>
      <p>PSU load against your target (default 80% continuous), PSU trim range, Baldrick fuse per port (7.5 A), power bank limits, board input voltage, wire ampacity, channel limit per port (2,250 ch = 750 RGB pixels at 40 fps), data gaps over ${esc(PP.store.project ? PP.store.project.settings.dataWarnM : 5)} m, relay ratings, enclosure slots and mains current per distro against your circuit.</p>
      <h3>Mains and cost</h3>
      <p>Mains amps = DC watts ÷ PSU efficiency ÷ mains voltage, plus relay loads. Running cost uses the “typical show load” percentage, hours per night and nights per season.</p>
      <p class="soft">These are planning estimates. Pixel wattage varies a lot between suppliers; measure a string at full white and put the real figure in the Library. Always check voltages with a meter before the show.</p>`,
    news: () => PP.CHANGELOG.map(c => `<div class="cl-ver">${esc(c.version)} <span class="soft" style="font-weight:400">${esc(c.date)}</span></div><ul>${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join(''),
    about: () => `
      <p><b>${esc(PP.APP_NAME)}</b> version ${esc(PP.APP_VERSION)}${PP.BUILT ? ` <span class="soft">· last updated ${esc(PP.BUILT)}</span>` : ''}</p>
      <p>A planner for pixel shows on <a href="https://www.baldrickboard.com/" target="_blank" rel="noopener">Baldrick</a> controllers driven by FPP, with Mean Well power supplies.</p>
      <p>It is one self-contained HTML file: it runs offline in any modern browser, needs no install and sends nothing anywhere. Give someone the file (or the zip) and they can open it straight away. The latest version is also online at <a href="https://j-turansky.github.io/pixel-planner/" target="_blank" rel="noopener">j-turansky.github.io/pixel-planner</a>; projects are stored only in your browser and in files you save.</p>
      <p class="soft">Board figures come from baldrickboard.com; check the latest board documentation before building. Not affiliated with Baldrick or Mean Well.</p>`
  };
  const tabs = [['use', 'How to use'], ['calc', 'How it calculates'], ['news', "What's new"], ['about', 'About']];

  H.open = (tab = 'use') => {
    const d = U.$('#helpDlg');
    d.innerHTML = `<div class="dlg-head"><b>${esc(PP.APP_NAME)} <span class="soft" style="font-weight:400">v${esc(PP.APP_VERSION)}</span></b><span class="grow"></span>
      <div class="seg" role="tablist">${tabs.map(([k, l]) => `<button data-tab="${k}" role="tab" class="${k === tab ? 'on' : ''}" aria-selected="${k === tab}">${l}</button>`).join('')}</div>
      <button data-close aria-label="Close">✕</button></div><div class="dlg-body" id="helpBody">${pages[tab]()}</div>`;
    d.onclick = ev => {
      const t = ev.target.closest('[data-tab]');
      if (t) { H.open(t.dataset.tab); return; }
      if (ev.target.closest('[data-close]')) d.close();
    };
    if (!d.open) d.showModal();
  };
  H.badge = () => {
    const b = U.$('#verBadge');
    b.textContent = 'v' + PP.APP_VERSION;
    b.title = "What's new" + (PP.BUILT ? ' · last updated ' + PP.BUILT : '');
  };
})();

</script>
<script>
// Bootstrap, rendering loop, actions, files and shortcuts.
(function () {
  const U = PP.ui, C = PP.catalog, M = PP.model, K = PP.calc, S = PP.store, F = PP.form, V = PP.visual;
  const esc = U.esc;
  let drawerOpen = false, fitted = false;

  // ---------- render ----------
  function render() {
    const p = S.project;
    const t0 = performance.now();
    const R = K.run(p);
    U.lastR = R;
    U.$('#projName').value = p.name;
    document.title = `${p.name} — ${PP.APP_NAME}`;
    summary(p, R);
    if (U.view !== 'visual') F.render(p, R);
    if (U.view !== 'form') { V.renderPalette(p); V.render(p, R); }
    if (U.view === 'visual') inspector(p, R);
    status(p, R);
    U._renderMs = performance.now() - t0;
  }

  function onSelect() {
    const p = S.project, R = U.lastR;
    if (U.view !== 'visual') F.markSelection(true);
    if (U.view !== 'form') V.render(p, R);
    if (U.view === 'visual') inspector(p, R);
  }

  function inspector(p, R) {
    const el = U.$('#inspector');
    const act = document.activeElement;
    const key = act && el.contains(act) && act.dataset && act.dataset.id ? act.dataset.id + '|' + act.dataset.f : null;
    const sc = el.scrollTop;
    el.innerHTML = F.inspector(p, R, S.selection);
    el.scrollTop = sc;
    if (key) { const [id, f] = key.split('|'); const x = U.$$('[data-id]', el).find(e => e.dataset.id === id && e.dataset.f === f); if (x) x.focus({ preventScroll: true }); }
    const s = S.selection && document.getElementById('f-' + S.selection);
    if (s && el.contains(s)) s.classList.add('sel');
  }

  function summary(p, R) {
    const T = R.totals, st = p.settings;
    const psuPct = T.psuCapA ? T.psuA / T.psuCapA * 100 : 0;
    const mainsMax = Math.max(0, ...Array.from(R.distros.values()).map(d => d.mainsA));
    const card = (k, v, s = '', cls = '', extra = '') => `<div class="card stat ${cls}" ${extra}><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
    const errs = R.counts.error, warns = R.counts.warn;
    U.$('#summary').innerHTML =
      card('Status', errs ? `<span class="err">${errs} error${errs > 1 ? 's' : ''}</span>` : warns ? `<span class="warn">${warns} warning${warns > 1 ? 's' : ''}</span>` : '<span class="ok">All good</span>', errs && warns ? `${warns} warning${warns > 1 ? 's' : ''} too` : `${R.counts.info} note${R.counts.info === 1 ? '' : 's'}`, 'status', 'data-act="warnings" title="Show checks"') +
      `<div class="card stat bright"><div class="k">Global brightness</div><div class="v"><span id="brightVal">${st.brightness}</span>%</div><input type="range" min="5" max="100" step="5" value="${st.brightness}" data-id="settings" data-f="brightness" data-t="num" aria-label="Global brightness"></div>` +
      card('Pixels', T.pixels.toLocaleString(), `${R.ports.size ? Array.from(R.ports.values()).filter(r => r.pixels).length : 0} ports in use`) +
      card('Channels', T.channels.toLocaleString(), `${T.universes} universes of ${st.universeSize}`) +
      card('DC power', K.fmtW(T.dcW), `full white at ${st.brightness}%`) +
      card('PSU load', `<span class="${U.pctClass(psuPct, st.psuTargetPct)}">${U.num(psuPct, 0)}%</span>`, `${K.fmtA(T.psuA)} of ${U.num(T.psuCapA, 0)} A`) +
      card('Mains', `${U.num(T.mainsA, 1)} A`, `busiest distro ${U.num(mainsMax, 1)} A of ${st.mainsCircuitA}`, '', `title="At full white, ${st.mainsV} V, ${st.psuEfficiency}% PSU efficiency"`) +
      card('Season cost', `${esc(st.currency)}${U.num(T.cost, 2)}`, `${U.num(T.kWh, 0)} kWh at ${st.typicalPct}% typical`);
  }

  function status(p, R) {
    const c = R.counts;
    const b = U.$('#warnBtn');
    b.innerHTML = `${c.error ? `<span class="err">● ${c.error} error${c.error > 1 ? 's' : ''}</span> ` : ''}${c.warn ? `<span class="warn">● ${c.warn} warning${c.warn > 1 ? 's' : ''}</span> ` : ''}${!c.error && !c.warn ? '<span class="ok">● No problems</span> ' : ''}<span class="soft">${c.info} note${c.info === 1 ? '' : 's'}</span>`;
    U.$('#fileInfo').innerHTML = `${esc(S.fileName || 'Not saved to a file yet')}${S.dirty && S.fileName ? ' <span class="warn">· unsaved changes</span>' : ''} <span class="soft">· autosaved in this browser</span>`;
    U.$('[data-act="undo"]').disabled = !S.undo.length;
    U.$('[data-act="redo"]').disabled = !S.redo.length;
    const list = U.$('#warnList');
    list.innerHTML = R.warnings.length ? R.warnings.map(w => `<div class="wi ${w.level}" data-act="jump" data-id="${esc(w.ref || '')}"><span class="lvl">${w.level === 'error' ? 'Error' : w.level === 'warn' ? 'Warn' : 'Note'}</span><span>${esc(w.msg)}</span></div>`).join('') : '<div class="muted" style="padding:8px">Nothing to report.</div>';
    U.$('#warnDrawer').hidden = !drawerOpen;
  }

  // ---------- view ----------
  function setView(v) {
    U.view = v;
    U.$('#main').className = 'mode-' + v;
    U.$$('.seg [data-view]').forEach(b => { b.classList.toggle('on', b.dataset.view === v); b.setAttribute('aria-selected', b.dataset.view === v); });
    try { localStorage.setItem('pixelplanner.view', v); } catch (e) { }
    render();
    if (v !== 'form' && !fitted) requestAnimationFrame(() => { V.fit(); fitted = true; });
  }

  // ---------- field binding ----------
  function entity(p, id) {
    if (id === 'project') return p;
    if (id === 'settings') return p.settings;
    if (id.startsWith('preset:')) return p.library.presets.find(x => 'preset:' + x.id === id);
    const e = M.find(p, id); return e ? e.obj : null;
  }
  function setPath(o, path, v) { const k = path.split('.'); while (k.length > 1) { const x = k.shift(); o[x] = o[x] || {}; o = o[x]; } o[k[0]] = v; }
  function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }

  function onField(el) {
    const id = el.dataset.id, f = el.dataset.f, t = el.dataset.t || 'str';
    let v = t === 'bool' ? el.checked : el.value;
    S.commit('field:' + f, p => {
      const o = entity(p, id); if (!o) return;
      if (t === 'num') {
        const n = parseFloat(v);
        if (!isFinite(n)) return;
        v = n;
        if (f === 'brightness') v = Math.min(100, Math.max(1, v));
        if (['count', 'length', 'spacing', 'amps', 'psuSlots', 'boardSlots', 'customA', 'customV'].includes(f) || f.endsWith('.length')) v = Math.max(0, v);
        if (f === 'count') v = Math.max(1, Math.round(v));
      }
      if (f.startsWith('banks.')) v = v || null;
      if (f === 'psuId') v = v || null;
      if (f === 'board') { M.changeBoard(o, v); return; }
      setPath(o, f, v);
      if (f === 'size') { const s = C.distroSizes.find(x => x.id === v); if (s && v !== 'custom') { o.psuSlots = s.psuSlots; o.boardSlots = s.boardSlots; } }
      if (f === 'model') { const sp = M.psuSpec(o); o.vout = sp.v; }
      if (f === 'customV' && o.model === 'custom') o.vout = v;
      if (f === 'typeId' && o.kind === 'pixels') { const ty = M.pixelType(p, v); if (ty) { o.spacing = ty.spacing; o.gauge = ty.gauge; } }
    });
  }

  // ---------- helpers for actions ----------
  const portCtx = (p, id) => M.find(p, id);
  const bankPsu = (e) => {
    const b = C.boards[e.controller.board];
    const bk = b.banks.find(x => x.ports.includes(e.port.num));
    return (bk && e.controller.banks[bk.id]) || (e.distro.psus[0] || {}).id || null;
  };
  function mergeSplits(chain) {
    const out = [];
    chain.forEach(it => {
      const prev = out[out.length - 1];
      if (it.kind === 'pixels' && it.continued && prev && prev.kind === 'pixels' && prev.typeId === it.typeId) { prev.count += it.count; return; }
      out.push(it);
    });
    out.forEach(it => { if (it.kind === 'pixels') { delete it.continued; delete it.tapOffset; } });
    return out;
  }
  const uniq = a => Array.from(new Set(a));

  // ---------- actions ----------
  const A = {
    async new() {
      if (S.dirty && !(await U.ask({ title: 'Start a new project?', body: 'Changes not saved to a file will be lost (the current project stays in this browser only until you start the new one).', ok: 'Start new' }))) return;
      S.load(M.newProject()); fitted = false; U.cam = { x: 20, y: 20, k: 1 };
    },
    async demo() {
      if (S.dirty && !(await U.ask({ title: 'Load the demo show?', body: 'This replaces the current project. Save it first if you want to keep it.', ok: 'Load demo' }))) return;
      S.load(M.demoProject()); fitted = false; if (U.view !== 'form') requestAnimationFrame(() => { V.fit(); fitted = true; });
    },
    open: () => openFile(),
    save: () => saveFile(false),
    saveAs: () => saveFile(true),
    undo: () => S.doUndo(),
    redo: () => S.doRedo(),
    guide: () => PP.guide.open(),
    help: () => PP.help.open('use'),
    whatsnew: () => PP.help.open('news'),
    warnings: () => { drawerOpen = !drawerOpen; U.$('#warnDrawer').hidden = !drawerOpen; },
    jump: (id) => { if (!id) return; if (S.selection === id) onSelect(); else S.select(id); },
    select: (id) => S.select(id),
    fit: () => V.fit(),
    zoomIn: () => V.zoom(1.2),
    zoomOut: () => V.zoom(1 / 1.2),
    addDistro: () => S.commit('addDistro', p => {
      const maxY = p.distros.reduce((m, d) => Math.max(m, d.y + 400), 40);
      const d = M.newDistro('Distro ' + (p.distros.length + 1), 40, p.distros.length ? maxY : 40, 'medium');
      const s = M.newPsu('LRS-350-12', 1); d.psus.push(s);
      const c = M.newController('baldrick8'); Object.keys(c.banks).forEach(k => { c.banks[k] = s.id; }); d.controllers.push(c);
      p.distros.push(d); S.selection = d.id;
    }),
    async delDistro(id) {
      const d = S.project.distros.find(x => x.id === id);
      if (!(await U.ask({ title: `Delete ${d.name}?`, body: 'Its PSUs, boards and all their runs are removed. You can undo this.', ok: 'Delete', danger: true }))) return;
      S.commit('delDistro', p => {
        const dd = p.distros.find(x => x.id === id);
        const gone = new Set(dd.psus.map(s => s.id));
        p.distros = p.distros.filter(x => x.id !== id);
        p.distros.forEach(x => x.controllers.forEach(c => c.ports.forEach(pt => pt.chain.forEach(it => { if (it.kind === 'inject' && gone.has(it.psuId)) it.psuId = null; }))));
        S.selection = null;
      });
    },
    balance: (id) => balance([id]),
    balanceAll: () => balance(null),
    autoInjectAll: () => {
      let added = 0, ports = 0;
      S.commit('autoInjectAll', p => {
        p.distros.forEach(d => d.controllers.forEach(c => c.ports.forEach(pt => {
          if (!pt.chain.some(it => it.kind === 'pixels')) return;
          const r = K.autoInject(p, pt.id); if (r.added) { added += r.added; ports++; }
        })));
      });
      U.toast(added ? `Added ${added} injection point${added > 1 ? 's' : ''} on ${ports} port${ports > 1 ? 's' : ''}.` : 'Every run is already within limits.');
    },
    addPsu: (id) => S.commit('addPsu', p => {
      const d = p.distros.find(x => x.id === id);
      const last = d.psus[d.psus.length - 1];
      const s = M.newPsu(last ? last.model : 'LRS-350-12', d.psus.length + 1);
      if (last && last.model === 'custom') { s.customV = last.customV; s.customA = last.customA; s.vout = last.vout; }
      d.psus.push(s); S.selection = s.id;
      d.controllers.forEach(c => Object.keys(c.banks).forEach(k => { if (!c.banks[k]) c.banks[k] = s.id; }));
    }),
    selectPsu: (id) => { S.select(id); if (U.view === 'form') U.toast('Switch to Visual or Split to see what this PSU feeds, or hover its load bar.'); },
    async delPsu(id) {
      const e = M.find(S.project, id);
      if (!(await U.ask({ title: `Delete ${e.obj.name}?`, body: 'Anything it powers will show as having no PSU.', ok: 'Delete', danger: true }))) return;
      S.commit('delPsu', p => {
        const x = M.find(p, id);
        x.distro.psus = x.distro.psus.filter(s => s.id !== id);
        p.distros.forEach(d => d.controllers.forEach(c => {
          Object.keys(c.banks).forEach(k => { if (c.banks[k] === id) c.banks[k] = null; });
          c.ports.forEach(pt => pt.chain.forEach(it => { if (it.kind === 'inject' && it.psuId === id) it.psuId = null; }));
        }));
      });
    },
    addController: (id) => {
      const board = (U.$('#addBoard-' + id) || {}).value || 'baldrick8';
      S.commit('addController', p => {
        const d = p.distros.find(x => x.id === id);
        const c = M.newController(board);
        const n = d.controllers.filter(x => x.board === board).length;
        if (n) c.name += ' ' + (n + 1);
        if (d.psus[0]) Object.keys(c.banks).forEach(k => { c.banks[k] = d.psus[0].id; });
        d.controllers.push(c); S.selection = c.id;
      });
    },
    async delController(id) {
      const e = M.find(S.project, id);
      if (!(await U.ask({ title: `Delete ${e.obj.name}?`, body: 'All of its port runs are removed too. You can undo this.', ok: 'Delete', danger: true }))) return;
      S.commit('delController', p => { const x = M.find(p, id); x.distro.controllers = x.distro.controllers.filter(c => c.id !== id); S.selection = null; });
    },
    copy: (id, el) => {
      const txt = el.dataset.text;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => U.toast('Copied.'), () => U.ask({ title: 'Copy this URL', input: txt, cancel: null }));
    },
    addPreset: (id) => {
      const pid = U.$('#preset-' + id).value, qty = Math.max(1, Math.min(50, parseInt(U.$('#qty-' + id).value, 10) || 1));
      S.commit('addPreset', p => {
        const e = portCtx(p, id), pr = p.library.presets.find(x => x.id === pid); if (!pr) return;
        if (!e.port.chain.length) e.port.chain.push(M.newItem.cable(5, 'awg18'));
        for (let i = 0; i < qty; i++) e.port.chain.push(M.newItem.pixels(pr.typeId, pr.count, p.library.pixelTypes));
        if (!e.port.label) e.port.label = pr.name;
      });
    },
    addCable: (id) => S.commit('addCable', p => { portCtx(p, id).port.chain.push(M.newItem.cable(5, 'awg18')); }),
    addPixels: (id) => S.commit('addPixels', p => {
      const ch = portCtx(p, id).port.chain;
      const last = ch.slice().reverse().find(x => x.kind === 'pixels');
      ch.push(M.newItem.pixels(last ? last.typeId : 'bullet12', last ? last.count : 50, p.library.pixelTypes));
    }),
    addInject: (id) => S.commit('addInject', p => { const e = portCtx(p, id); e.port.chain.push(M.newItem.inject(bankPsu(e), p.settings.injectLength, p.settings.injectGauge)); }),
    autoInject: (id) => {
      let r = { added: 0 };
      S.commit('autoInject', p => { r = K.autoInject(p, id); });
      const pr = U.lastR.ports.get(id);
      U.toast(r.added ? `Added ${r.added} injection point${r.added > 1 ? 's' : ''}.${pr && pr.firstFail >= 0 ? ' Some pixels are still low: try a thicker feed or fewer pixels per port.' : ''}` : (pr && pr.firstFail >= 0 ? 'Could not fix this run with injection. Check the PSU and wire.' : 'This run is already within limits.'));
    },
    clearInject: (id) => S.commit('clearInject', p => { const pt = portCtx(p, id).port; pt.chain = mergeSplits(pt.chain.filter(x => x.kind !== 'inject')); }),
    async clearPort(id) {
      if (!(await U.ask({ title: 'Clear this run?', body: 'Removes every cable, string and injection on this port. You can undo this.', ok: 'Clear', danger: true }))) return;
      S.commit('clearPort', p => { const pt = portCtx(p, id).port; pt.chain = []; pt.label = ''; });
    },
    movePort: (id) => {
      const to = U.$('#moveTo-' + id).value; if (!to) return U.toast('Pick a port to move this run to.');
      S.commit('movePort', p => {
        const a = portCtx(p, id).port, b = portCtx(p, to).port;
        ['chain', 'label', 'brightness', 'portPower'].forEach(k => { const t = a[k]; a[k] = b[k]; b[k] = t; });
